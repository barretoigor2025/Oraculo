<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Oraculo 2 Preview</title><style>:root{--bg:#08080b;--panel:#15141b;--panel2:#201d28;--gold:#d8aa3a;--muted:#a6a0b8;--line:#34303f;--danger:#d45b5b;--ok:#5bd48d;--warn:#d4b45b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at top,#1b1724,var(--bg));color:#f2edf8}header{padding:22px 18px;border-bottom:1px solid var(--line);background:rgba(8,8,11,.86);position:sticky;top:0;z-index:2}h1{margin:0;color:var(--gold);font-size:1.45rem}header p{margin:.35rem 0 0;color:var(--muted);font-size:.92rem}main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 82px)}nav{border-right:1px solid var(--line);background:rgba(12,12,18,.72);padding:16px}.campaign{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#111018);border-radius:14px;padding:14px;margin-bottom:16px}.campaign strong{display:block;color:#fff;margin-bottom:4px}.status{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#2c2415;color:var(--warn);font-size:.78rem}.tabs button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:#eee;cursor:pointer}.tabs button.active{border-color:var(--gold);color:var(--gold);background:#211b10}section{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}.placeholder{height:150px;display:flex;align-items:center;justify-content:center;color:#7e768e;background:repeating-linear-gradient(45deg,#121119,#121119 10px,#181621 10px,#181621 20px);border-bottom:1px solid var(--line)}.card-body{padding:14px}.card h3{margin:0 0 6px;color:#fff}.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.35}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.asset{min-height:62px;border:1px dashed #4a4458;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8f879d;font-size:.75rem;padding:6px}.check{display:grid;gap:10px;max-width:760px}.row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px}.ok{color:var(--ok)}.bad{color:var(--danger)}.warn{color:var(--warn)}.arena{min-height:460px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at center,#272130,#101016);position:relative;overflow:hidden}.hex{position:absolute;width:52px;height:45px;border:1px solid rgba(216,170,58,.22);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.piece{position:absolute;width:54px;height:72px;display:flex;align-items:flex-end;justify-content:center}.piece:before{content:"";position:absolute;bottom:2px;width:46px;height:14px;border-radius:50%;background:#5b4630;border:2px solid var(--gold)}.piece:after{content:attr(data-label);position:absolute;bottom:18px;width:38px;height:38px;border-radius:50% 50% 45% 45%;background:#7d6b93;border:2px solid #d7c9ff;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff}.note{color:var(--muted);margin:0 0 16px}@media(max-width:780px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}}</style></head><body><header><h1>Oraculo 2 - Preview Modular</h1><p>Prototipo visual: campanha, catalogo, checklist e arena separados.</p></header><main><nav><div class="campaign"><strong>Campanha Template</strong><small>catalogo/_template</small><br><span class="status">rascunho - nao jogavel</span></div><div class="tabs"><button class="active" data-view="catalogo">Catalogo</button><button data-view="checklist">Checklist</button><button data-view="arena">Arena</button></div></nav><section id="app"></section></main><script>const entities=[{cat:'Classe',name:'Classe Exemplo',desc:'Modelo de classe jogavel. Aqui entram descricao, status base e assets.'},{cat:'Heroi',name:'Heroi Exemplo',desc:'Modelo de personagem jogavel ligado a uma classe.'},{cat:'NPC',name:'NPC Exemplo',desc:'Modelo de NPC com retrato, sprites e peca de tabuleiro.'},{cat:'Inimigo',name:'Inimigo Exemplo',desc:'Modelo de inimigo pronto para a arena e checklist.'},{cat:'Cenario',name:'Cenario Batalha Hex',desc:'Modelo de mapa de batalha com grid e pontos de spawn.'}];const app=document.querySelector('#app');function renderCatalogo(){app.innerHTML='<p class="note">Tudo aqui e placeholder. A ideia e mostrar o formato que vai receber as imagens reais depois.</p><div class="grid">'+entities.map(e=>'<article class="card"><div class="placeholder">'+e.cat+'</div><div class="card-body"><h3>'+e.name+'</h3><p>'+e.desc+'</p><div class="assets"><div class="asset">retrato</div><div class="asset">frente / costas</div><div class="asset">peca tabuleiro</div></div></div></article>').join('')+'</div>'}function renderChecklist(){const rows=[['Estrutura de campanha','ok'],['Catalogo autocontido','ok'],['Templates de entidades','ok'],['Assets reais','bad'],['Cenarios reais','bad'],['Arena integrada ao catalogo','warn']];app.innerHTML='<p class="note">O checklist vira o fiscal da campanha: ele mostra o que ja existe e o que falta para ficar jogavel.</p><div class="check">'+rows.map(([t,s])=>'<div class="row"><span>'+t+'</span><strong class="'+s+'">'+(s==='ok'?'OK':s==='bad'?'Falta':'Parcial')+'</strong></div>').join('')+'</div>'}function renderArena(){let hexes='';for(let y=0;y<7;y++)for(let x=0;x<9;x++)hexes+='<div class="hex" style="left:'+(38+x*55+(y%2)*28)+'px;top:'+(34+y*47)+'px"></div>';app.innerHTML='<p class="note">Arena placeholder: futuramente carregara cenario, entidades, pecas, iniciativa, turno, movimento e combate pelo catalogo.</p><div class="arena">'+hexes+'<div class="piece" data-label="HER" style="left:110px;top:210px"></div><div class="piece" data-label="NPC" style="left:250px;top:116px"></div><div class="piece" data-label="INI" style="left:405px;top:210px"></div></div>'}document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');({catalogo:renderCatalogo,checklist:renderChecklist,arena:renderArena})[btn.dataset.view]()}));renderCatalogo();</script></body></html>
