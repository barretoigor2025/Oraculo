<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mago ataque 4 direções</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#080705;color:#ead8a8;font-family:Georgia,serif}body{display:flex;flex-direction:column}header{height:54px;background:#0d0c09;border-bottom:1px solid #5f4822;display:flex;align-items:center;padding:8px 10px}h1{font-size:15px;color:#d8ad4d;flex:1}.stage{position:relative;flex:1;overflow:hidden;background:#000}.map{position:absolute;left:50%;top:50%;width:960px;height:1280px;transform:translate(-50%,-50%) scale(var(--s));transform-origin:center;background:#2b261d;background-image:radial-gradient(circle at 35% 25%,rgba(160,120,70,.25),transparent 34%),radial-gradient(circle at 75% 65%,rgba(90,70,40,.25),transparent 35%),linear-gradient(135deg,rgba(255,255,255,.06) 25%,transparent 25%),linear-gradient(315deg,rgba(0,0,0,.12) 25%,#3b3529 25%);background-size:960px 1280px,960px 1280px,40px 40px,40px 40px;overflow:hidden}.grid{position:absolute;inset:0;z-index:5}.hex{position:absolute;width:72px;height:62px;transform:translate(-50%,-50%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:rgba(255,255,255,.42);font:900 10px system-ui;text-shadow:0 1px 4px #000}.move{background:rgba(90,160,255,.14);border-color:#75c7ff}.dest{background:rgba(250,205,70,.23);border-color:#f7cd5b}.aoe{background:rgba(255,100,20,.21);border-color:#ff7a1a}.unit{position:absolute;width:150px;height:190px;transform:translate(-50%,-100%);z-index:22;pointer-events:none;filter:drop-shadow(0 9px 9px #000)}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.unit.run img{animation:run .55s ease-in-out infinite}.unit.cast img{animation:cast .72s ease-out}@keyframes run{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px) rotate(-.35deg)}50%{transform:translateY(0) rotate(.35deg)}75%{transform:translateY(-2px)}}@keyframes cast{0%{filter:drop-shadow(0 0 0 #b56cff);transform:scale(1)}45%{filter:drop-shadow(0 0 24px #b56cff);transform:scale(1.045)}100%{filter:drop-shadow(0 0 0 #b56cff);transform:scale(1)}}.ring{position:absolute;left:50%;bottom:4px;width:86px;height:28px;border-radius:50%;transform:translateX(-50%);border:4px solid #b56cff;box-shadow:0 0 16px #b56cff;z-index:-1}.enemy .ring{border-color:#ff5446;box-shadow:0 0 16px #ff5446}.name{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font:bold 11px system-ui;color:white;text-shadow:0 1px 4px #000}.pump{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:48px}.fireball{position:absolute;width:96px;height:34px;border-radius:999px;z-index:45;pointer-events:none;background:radial-gradient(circle at 78% 50%,#fff 0 8%,#ffd36a 12%,#ff7a1a 25%,rgba(255,80,0,.62) 36%,rgba(255,90,0,0) 48%),linear-gradient(90deg,rgba(255,90,0,0),rgba(255,120,0,.18),rgba(255,150,35,.65),rgba(255,230,120,.95));box-shadow:0 0 20px #ff8a1d,0 0 38px #ff531d;animation:pulse .18s alternate infinite}.trail{position:absolute;width:28px;height:14px;border-radius:999px;background:linear-gradient(90deg,rgba(255,80,0,0),rgba(255,150,30,.45));box-shadow:0 0 14px #ff8a1d;z-index:44;pointer-events:none;animation:fade .55s ease-out forwards}.impact{position:absolute;width:190px;height:138px;border-radius:50%;z-index:46;pointer-events:none;background:radial-gradient(circle,#fff 0 4%,#ffd36a 10%,#ff7a1a 27%,rgba(180,40,0,.45) 45%,rgba(255,0,0,0) 70%);box-shadow:0 0 34px #ff7a1a;transform:translate(-50%,-50%);animation:impact .75s ease-out forwards}.aoeRing{position:absolute;width:240px;height:170px;border:4px solid rgba(255,116,26,.75);border-radius:50%;z-index:43;pointer-events:none;box-shadow:0 0 24px rgba(255,116,26,.85),inset 0 0 35px rgba(255,116,26,.35);animation:aoeFx .9s ease-out forwards}.ember{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffb13d;box-shadow:0 0 12px #ff5a1a;z-index:47;animation:ember .75s ease-out forwards}@keyframes pulse{to{filter:brightness(1.55)}}@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}@keyframes impact{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}@keyframes aoeFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}@keyframes ember{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.25)}}.bank{position:absolute;left:8px;top:8px;z-index:55;width:250px;background:rgba(8,7,5,.86);border:1px solid #7b5b27;border-radius:10px;padding:7px;font:10px system-ui;color:#d8c28a}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.slot{height:48px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:rgba(255,255,255,.04);display:grid;place-items:center;overflow:hidden}.slot.on{border-color:#75c7ff;box-shadow:0 0 8px #75c7ff}.slot img{max-width:100%;max-height:100%;object-fit:contain}.panel{background:#100e0b;border-top:1px solid #5f4822;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}.info{font:12px system-ui;color:#b7a783;margin-bottom:8px}.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{font:800 12px system-ui;border:1px solid #6d5728;background:#171309;color:#dfc98f;border-radius:8px;padding:8px}.act{height:50px}.blue{border-color:#315d86;background:#112032;color:#8fc7ff}.red{border-color:#7d352d;background:#2a1411;color:#ff9a8f}.green{border-color:#3e713e;background:#10220f;color:#98e28f}.coord{color:#8fc7ff}</style></head><body><header><h1>Mago — sprites reais recortados + bola de fogo</h1><button onclick="toggleBank()">Sprites</button></header><main class="stage"><div class="map" id="map"><div class="bank" id="bankBox"><b id="dirTxt">Direção: NE</b><div class="slots" id="slots"></div></div><div class="grid" id="grid"></div><div class="unit enemy" id="enemy"><div class="ring"></div><div class="pump">🎃</div><div class="name">Espantalho</div></div><div class="unit" id="mage"><div class="ring"></div><img id="mageImg"><div class="name">Mago</div></div></div></main><section class="panel"><div class="info" id="info">Sprites corrigidos por URL raw. Clique num hex para mover ou use Bola de fogo.</div><div class="acts"><button class="act green" onclick="clearPlan()">Selecionar</button><button class="act blue" onclick="runMove()">Correr</button><button class="act red" onclick="attack()">🔥 Bola de fogo</button></div></section><script>const RAW='https://raw.githubusercontent.com/barretoigor2025/Oraculo/main/public/sprites/';const SPR={NE:{src:RAW+'attack_ne-1.png',label:'NE ataque'},NW:{src:RAW+'attack_nw.png',label:'NW ataque'},SE:{src:RAW+'attack_se.png',label:'SE ataque'},SW:{src:RAW+'attack_sw.png',label:'SW ataque'}};const CL='ABCDEFGHI',COLS=9,ROWS=11,GX=170,GY=130,DX=78,DY=72,ODD=36;const map=document.getElementById('map'),grid=document.getElementById('grid'),mage=document.getElementById('mage'),enemyEl=document.getElementById('enemy'),img=document.getElementById('mageImg'),info=document.getElementById('info'),slots=document.getElementById('slots'),dirTxt=document.getElementById('dirTxt'),bankBox=document.getElementById('bankBox');let magePos={c:6,r:8},enemy={c:4,r:2},planned=null,moving=false,currentDir='NE';function lbl(h){return CL[h.c]+String(h.r+1).padStart(2,'0')}function center(h){return{x:GX+h.c*DX,y:GY+h.r*DY+(h.c%2?ODD:0)}}function dist(a,b){let q=a.c-b.c,r=a.r-b.r;return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))}function dir4(a,b){let dx=b.c-a.c,dy=b.r-a.r;if(dy<0)return dx<0?'NW':'NE';return dx<0?'SW':'SE'}function setDir(d){currentDir=d;let s=SPR[d];img.src=s.src;dirTxt.textContent='Direção: '+s.label;renderBank()}function renderBank(){slots.innerHTML='';['NW','NE','SW','SE'].forEach(d=>{let s=SPR[d],el=document.createElement('div');el.className='slot '+(d===currentDir?'on':'');el.innerHTML='<img src="'+s.src+'">';slots.appendChild(el)})}function makeGrid(){grid.innerHTML='';for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){let h={c,r},p=center(h),e=document.createElement('div');e.className='hex';e.dataset.c=c;e.dataset.r=r;e.style.left=p.x+'px';e.style.top=p.y+'px';e.textContent=lbl(h);e.onclick=()=>tap(h);grid.appendChild(e)}}function place(){let p=center(magePos);mage.style.left=p.x+'px';mage.style.top=p.y+46+'px';let ep=center(enemy);enemyEl.style.left=ep.x+'px';enemyEl.style.top=ep.y+46+'px'}function mark(){document.querySelectorAll('.hex').forEach(e=>{let h={c:+e.dataset.c,r:+e.dataset.r};e.className='hex';if(dist(magePos,h)<=4)e.classList.add('move');if(planned&&h.c===planned.c&&h.r===planned.r)e.classList.add('dest');if(dist(enemy,h)<=1)e.classList.add('aoe')})}function tap(h){if(moving)return;planned=h;setDir(dir4(magePos,h));mark();info.innerHTML='Destino <span class="coord">'+lbl(h)+'</span> · direção '+SPR[currentDir].label}function path(a,b){let n=Math.max(1,dist(a,b)),arr=[];for(let i=1;i<=n;i++){let t=i/n;arr.push({c:Math.round(a.c+(b.c-a.c)*t),r:Math.round(a.r+(b.r-a.r)*t)})}return arr.filter((h,i,s)=>i===0||h.c!==s[i-1].c||h.r!==s[i-1].r)}async function runMove(){if(!planned||moving)return;moving=true;mage.classList.add('run');for(let step of path(magePos,planned)){setDir(dir4(magePos,step));await anim(magePos,step,560);magePos=step;place()}mage.classList.remove('run');moving=false;planned=null;mark();info.innerHTML='Mago chegou em <span class="coord">'+lbl(magePos)+'</span> · '+SPR[currentDir].label}function anim(a,b,dur){return new Promise(ok=>{let A=center(a),B=center(b),st=performance.now();function f(t){let x=Math.min(1,(t-st)/dur),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;mage.style.left=A.x+(B.x-A.x)*e+'px';mage.style.top=A.y+(B.y-A.y)*e+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}async function attack(){if(moving)return;moving=true;let d=dir4(magePos,enemy);setDir(d);mage.classList.add('cast');let a=center(magePos),b=center(enemy),vx=b.x-a.x,vy=b.y-a.y,len=Math.hypot(vx,vy)||1,lunge={x:a.x+vx/len*30,y:a.y+vy/len*30};await lungeTo(a,lunge,190);shootFireball(lunge,b);setTimeout(()=>{mage.classList.remove('cast');lungeBack(a,lunge,230).then(()=>{moving=false})},950);info.innerHTML='Bola de fogo com sprite real, rastro de cometa e dano em área · '+SPR[d].label}function lungeTo(a,b,dur){return new Promise(ok=>{let st=performance.now();function f(t){let x=Math.min(1,(t-st)/dur);mage.style.left=a.x+(b.x-a.x)*x+'px';mage.style.top=a.y+(b.y-a.y)*x+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function lungeBack(a,b,dur){return new Promise(ok=>{let st=performance.now();function f(t){let x=Math.min(1,(t-st)/dur);mage.style.left=b.x+(a.x-b.x)*x+'px';mage.style.top=b.y+(a.y-b.y)*x+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function shootFireball(a,b){let f=document.createElement('div'),dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx)*180/Math.PI;f.className='fireball';map.appendChild(f);let st=performance.now(),dur=920;function step(t){let x=Math.min(1,(t-st)/dur),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,px=a.x+(b.x-a.x)*e,py=a.y+(b.y-a.y)*e+10;f.style.left=px+'px';f.style.top=py+'px';f.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';if(Math.random()<.8){let tr=document.createElement('div');tr.className='trail';tr.style.left=(px-dx/Math.hypot(dx,dy)*26)+'px';tr.style.top=(py-dy/Math.hypot(dx,dy)*26)+'px';tr.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';map.appendChild(tr);setTimeout(()=>tr.remove(),560)}if(x<1)requestAnimationFrame(step);else{f.remove();impact(b)}}requestAnimationFrame(step)}function impact(p){let r=document.createElement('div');r.className='aoeRing';r.style.left=p.x+'px';r.style.top=p.y+8+'px';map.appendChild(r);let d=document.createElement('div');d.className='impact';d.style.left=p.x+'px';d.style.top=p.y+8+'px';map.appendChild(d);for(let i=0;i<20;i++){let e=document.createElement('div'),ang=Math.random()*Math.PI*2,rad=45+Math.random()*95;e.className='ember';e.style.left=p.x+'px';e.style.top=p.y+8+'px';e.style.setProperty('--x',Math.cos(ang)*rad+'px');e.style.setProperty('--y',Math.sin(ang)*rad*.65+'px');map.appendChild(e);setTimeout(()=>e.remove(),780)}setTimeout(()=>{r.remove();d.remove()},950)}function clearPlan(){planned=null;mark();info.textContent='Seleção limpa'}function toggleBank(){bankBox.style.display=bankBox.style.display==='none'?'block':'none'}function resize(){let st=document.querySelector('.stage');map.style.setProperty('--s',Math.min(st.clientWidth/960,st.clientHeight/1280))}window.onresize=resize;makeGrid();resize();place();setDir('NE');mark();</script></body></html>
