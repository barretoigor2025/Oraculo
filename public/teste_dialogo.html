<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Diálogo de Cena</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050302;font-family:Georgia,serif;color:#e8d5a8;user-select:none;-webkit-user-select:none}

/* ── Largura padrão dos personagens — usada por AMBOS o char e o balão ── */
:root{ --char-w: clamp(105px, 23vw, 170px); }

/* ── CENA ── */
#cena-bg{
  position:fixed;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
#cena-bg::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 62%, transparent 28%, rgba(0,0,0,0.52) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.66) 92%);
}

/* ── PERSONAGENS — só imagens, sem balões ── */
#personagens{
  position:fixed;
  bottom:94px; left:0; right:0;
  height:clamp(210px,38vh,325px);
  pointer-events:none;
  overflow:hidden;
  z-index:5;
}

/* NPC — lado esquerdo, apenas a imagem */
.par-npc{
  position:absolute;
  bottom:0; left:0;
  width:var(--char-w);
  height:100%;
  transform:translateX(-115%);
  transition:
    transform 0.52s cubic-bezier(0.32,0.72,0,1),
    opacity   0.32s ease,
    filter    0.32s ease;
}
.par-npc.dentro{ transform:translateX(0); }
.par-npc.inativo{ opacity:0.28; filter:brightness(0.45) saturate(0.35); }

/* NPCs empilhados em profundidade — offset aplicado via JS */

/* Player — lado direito, apenas a imagem */
#par-player{
  position:absolute;
  bottom:0; right:0;
  width:var(--char-w);
  height:100%;
  transform:translateX(115%);
  transition:transform 0.52s cubic-bezier(0.32,0.72,0,1);
  z-index:10;
}
#par-player.dentro{ transform:translateX(0); }

/* Imagens de personagem compartilham o mesmo estilo */
.char-img{
  display:block;
  width:100%; height:100%;
  object-fit:cover; object-position:top center;
  -webkit-mask-image:
    linear-gradient(to bottom, black 52%, transparent 100%),
    linear-gradient(to right,  transparent 0%, black 9%, black 91%, transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to bottom, black 52%, transparent 100%),
    linear-gradient(to right,  transparent 0%, black 9%, black 91%, transparent 100%);
  mask-composite:intersect;
  filter:drop-shadow(0 10px 28px rgba(0,0,0,0.95));
}
/* canvas (standee) não usa object-fit — dimensões já definidas pelo JS */
canvas.char-img{
  width:auto; height:100%;
  object-fit:unset; object-position:unset;
}
.char-fallback{
  width:100%; height:100%;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:16px; font-size:clamp(36px,8vw,54px);
  -webkit-mask-image:linear-gradient(to bottom,black 50%,transparent 100%);
  mask-image:linear-gradient(to bottom,black 50%,transparent 100%);
}

/* ══════════════════════════════════════════════════════
   BALÃO — completamente independente da imagem
   Âncora: left/right calculado a partir de --char-w
   ══════════════════════════════════════════════════════ */
#balao-ativo{
  position:fixed;
  /* NPC fala: começa logo após o personagem esquerdo */
  left: calc(var(--char-w) + 10px);
  right: 10px;
  bottom: calc(94px + 16px);

  background:rgba(7,3,1,0.90);
  border:1px solid rgba(190,140,35,0.44);
  border-radius:16px;
  padding:13px 16px 14px;
  backdrop-filter:blur(14px);
  box-shadow:0 4px 32px rgba(0,0,0,0.78);

  opacity:0;
  transform:translateY(8px) scale(0.98);
  transition:opacity 0.28s ease, transform 0.28s ease, left 0.28s ease, right 0.28s ease;
  pointer-events:none;
  z-index:100;
}
#balao-ativo.visivel{
  opacity:1; transform:translateY(0) scale(1);
  pointer-events:all;
}
/* Player falando: espelha posição */
#balao-ativo.player-fala{
  left: 10px;
  right: calc(var(--char-w) + 10px);
}

/* Seta — aponta para o personagem que está falando */
#balao-ativo::before,#balao-ativo::after{
  content:''; position:absolute; top:18px;
  border:9px solid transparent;
}
/* padrão: seta à esquerda (aponta para NPC) */
#balao-ativo::before{ left:-9px; border-right-color:rgba(190,140,35,0.44); }
#balao-ativo::after { left:-8px; border-right-color:rgba(7,3,1,0.90); border-width:8px; }
/* player: seta à direita */
#balao-ativo.player-fala::before{ left:auto; right:-9px; border-right-color:transparent; border-left-color:rgba(190,140,35,0.44); }
#balao-ativo.player-fala::after { left:auto; right:-8px; border-right-color:transparent; border-left-color:rgba(7,3,1,0.90); border-width:8px; }

#balao-nome{
  font-size:9px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase;
  color:rgba(190,140,35,0.80); margin-bottom:6px;
}
#balao-acao{
  font-size:11px; color:rgba(185,160,85,0.58);
  font-style:italic; line-height:1.40; margin-bottom:5px; display:none;
}
#balao-texto{
  font-size:clamp(13px,3.6vw,15.5px);
  color:rgba(240,218,162,0.96); line-height:1.66; font-style:italic;
}
#btn-continuar{
  display:none; margin-top:11px; margin-left:auto; width:fit-content;
  background:rgba(190,140,35,0.18); border:1px solid rgba(190,140,35,0.48);
  border-radius:22px; padding:5px 18px;
  color:#f5d878; font-family:Georgia,serif; font-size:11px; font-weight:700;
  cursor:pointer; letter-spacing:.3px; pointer-events:all;
  animation:pulse-btn 1.8s ease-in-out infinite;
}
@keyframes pulse-btn{
  0%,100%{box-shadow:0 0 0 0 rgba(190,140,35,0.35);}
  50%     {box-shadow:0 0 0 7px rgba(190,140,35,0);}
}

/* ── IA PENSANDO ── */
#ia-pensando{
  position:fixed;
  bottom:calc(94px + clamp(210px,38vh,325px) + 10px);
  left:50%; transform:translateX(-50%);
  background:rgba(60,28,100,0.92); border:1px solid rgba(150,80,240,0.5);
  border-radius:20px; padding:7px 18px; color:rgba(200,140,255,0.92);
  font-size:12px; letter-spacing:.4px; z-index:300; display:none; white-space:nowrap;
}

/* ── CHIPS ── */
#npc-chips{
  position:fixed; bottom:58px; left:0; right:0; height:36px;
  padding:0 12px; background:rgba(4,2,1,0.90);
  border-top:1px solid rgba(190,140,35,0.12);
  display:flex; align-items:center; gap:8px;
  z-index:200; overflow-x:auto; scrollbar-width:none;
}
#npc-chips::-webkit-scrollbar{display:none;}
.chip-label{ font-size:9px; letter-spacing:.6px; text-transform:uppercase; color:rgba(190,140,35,0.28); margin-right:4px; flex-shrink:0; }
.chip-npc{
  flex-shrink:0; padding:4px 14px;
  border:1px solid rgba(190,140,35,0.24); border-radius:20px;
  background:rgba(25,16,5,0.7); color:rgba(200,175,100,0.52);
  font-size:11px; font-family:Georgia,serif; cursor:pointer; white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s;
}
.chip-npc.ativo{ background:rgba(190,140,35,0.20); border-color:rgba(190,140,35,0.58); color:#f5d878; }

/* ── INPUT BAR ── */
#input-bar{
  position:fixed; bottom:0; left:0; right:0; height:58px;
  padding:9px 12px max(9px,env(safe-area-inset-bottom));
  background:rgba(4,2,1,0.95); border-top:1px solid rgba(190,140,35,0.18);
  display:flex; align-items:center; gap:9px; z-index:200;
}
#msg-input{
  flex:1; background:rgba(25,16,5,0.95);
  border:1px solid rgba(190,140,35,0.28); border-radius:10px;
  padding:10px 14px; color:#e8d5a8; font-family:Georgia,serif; font-size:14px; outline:none;
}
#msg-input::placeholder{ color:rgba(190,165,90,0.32); }
#msg-input:focus{ border-color:rgba(190,140,35,0.52); }
#msg-input:disabled{ opacity:0.45; }
#btn-enviar{
  flex-shrink:0; background:rgba(190,140,35,0.16);
  border:1px solid rgba(190,140,35,0.42); border-radius:10px;
  padding:10px 18px; color:#f5d878; font-family:Georgia,serif;
  font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
}
#btn-enviar:disabled{ opacity:0.38; cursor:default; }

/* ── CONFIG ── */
#cfg-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:500; }
#cfg-overlay.oculto{ display:none; }
#cfg-box{ background:#1a1208; border:1px solid rgba(190,140,35,0.38); border-radius:18px; padding:28px 24px; max-width:340px; width:90%; display:flex; flex-direction:column; gap:14px; }
#cfg-titulo{ font-size:16px; font-weight:700; color:#f5d878; }
#cfg-descr{ font-size:12px; color:rgba(200,175,100,0.65); line-height:1.55; }
#cfg-input{ background:rgba(0,0,0,0.5); border:1px solid rgba(190,140,35,0.28); border-radius:8px; padding:10px 14px; color:#e8d5a8; font-family:monospace; font-size:13px; outline:none; width:100%; }
#cfg-salvar{ background:rgba(190,140,35,0.22); border:1px solid rgba(190,140,35,0.48); border-radius:9px; padding:11px; color:#f5d878; font-family:Georgia,serif; font-weight:700; cursor:pointer; width:100%; font-size:14px; }
</style>
</head>
<body>

<div id="cena-bg"></div>

<!-- Personagens: SÓ imagens, sem balões -->
<div id="personagens">
  <div id="par-player">
    <div id="player-fallback" class="char-fallback">🧙</div>
  </div>
</div>

<!-- Balão ÚNICO, fixo, independente -->
<div id="balao-ativo">
  <div id="balao-nome">—</div>
  <div id="balao-acao"></div>
  <div id="balao-texto">…</div>
  <button id="btn-continuar" onclick="_handleContinuar()">▶ Continuar</button>
</div>

<div id="ia-pensando">✨ Pensando…</div>

<div id="npc-chips">
  <span class="chip-label">Falar com:</span>
</div>

<div id="input-bar">
  <input id="msg-input" type="text" placeholder="O que você diz…" autocomplete="off" spellcheck="false">
  <button id="btn-enviar">Enviar →</button>
</div>

<div id="cfg-overlay" class="oculto">
  <div id="cfg-box">
    <div id="cfg-titulo">Chave da API Groq</div>
    <div id="cfg-descr">Necessária para o NPC responder com IA. Guardada apenas neste dispositivo (localStorage).</div>
    <input id="cfg-input" type="password" placeholder="gsk_..." autocomplete="off">
    <button id="cfg-salvar">Salvar e iniciar →</button>
  </div>
</div>

<script type="module">

// ══════════════════════════════════════════════════════════
//  CONFIG DA CENA
// ══════════════════════════════════════════════════════════
const CENA_BG = 'catalogo/mhoried/cenarios/conversacao/feira_phanourios/imagem/market_ext.png';

const NPCS = [
  {
    id:'gregoras', nome:'Grégoras Pellos', avatar:'⚔️',
    img:'catalogo/mhoried/npcs/npc_gregoras_pellos/retrato/npc_gregoras_pellos_retrato.png',
    tipo:'retrato',
    personalidade:'Mercenário veterano de meia-idade, ex-soldado do exército de Mhoried. Cicatrizes e postura comunicam mais do que palavras. Leal até a morte com quem confia, perigoso com quem trai. Fala pouco e pesa cada palavra. Respeita força e honestidade acima de tudo. Humor seco difícil de perceber.',
    conhecimentos:'Sabe que algo está errado em Gloamreach — pessoas desaparecem e voltam "diferentes". Conhece Finn Willowheel desde a infância. Desconfia do Rei Chutter mas não sabe por quê ainda. Está procurando alguém na feira e não quer revelar quem.',
    formaDeFalar:'Frases curtas e diretas. Nunca desperdiça palavras. Quando suspeita de alguém, fica completamente quieto por um momento antes de responder. Usa termos militares ocasionalmente. Nunca elogia diretamente — demonstra aprovação com ação.',
    reatividade: 0.10,
    abertura:'(Você acaba de aparecer após os aventureiros vencerem uma batalha na feira. Diga sua frase de abertura — brevíssimo, impactante, máximo 2 frases.)',
    aberturaFallback:'[ACAO: Um homem de cicatrizes cruza os braços e observa o grupo em silêncio.] Sobreviveram. Interessante.',
    zBase:6, offsetPx:0,
  },
  {
    id:'finn', nome:'Finn Willowheel', avatar:'🌿',
    img:'catalogo/mhoried/npcs/npc_finn_willowheel/retrato/npc_finn_willowheel_retrato.png',
    tipo:'retrato',
    personalidade:'Meio-halfling comerciante jovem, animado e curioso. Vende ervas, temperos e itens curiosos. Observador nato — nota detalhes que outros ignoram. Parece inocente mas guarda segredos comerciais com astúcia. Amigo de longa data de Grégoras.',
    conhecimentos:'Conhece quase todos os comerciantes da feira. Sabe que uma caixa misteriosa passou pela feira há dois dias — alguém pagou muito bem para que ninguém soubesse. Conhece atalhos por Phanourios e sabe onde ficam os Kobolds pacíficos.',
    formaDeFalar:'Fala rápido e com entusiasmo. Usa muitas analogias com ervas e plantas. Ri fácil. Quando está com medo ou nervoso, começa a falar de tópicos aleatórios. Chama todo mundo de "amigo".',
    reatividade: 0.42,
    abertura:'(Os aventureiros acabaram de vencer uma batalha na feira. Você estava observando de perto. Faça uma observação animada e curiosa — brevíssimo, 1-2 frases.)',
    aberturaFallback:'[ACAO: Finn ri e estende a mão para cumprimentar o grupo.] Que espetáculo, amigos! Nunca vi coisa assim desde que o velho Harmon dançou com três goblins de uma vez!',
    zBase:5, offsetPx:18,
  },
  {
    id:'mutter', nome:'Mutter Grimmhaar', avatar:'🧙‍♀️',
    img:'catalogo/mhoried/npcs/npc_mutter_grimmhaar/retrato/npc_mutter_grimmhaar_retrato.png',
    tipo:'retrato',
    personalidade:'Velha feiticeira dos pântanos. Sobreviveu a quatro guerras, dois surtos de praga e um dragão. Tem a paciência de quem já viu tudo dar errado. Sua rudeza é economizadora de tempo, não crueldade. Chama todos de "criança" independente da idade. Quando encontra alguém novo, cheira-o lentamente como se saboreando informação.',
    conhecimentos:'Sabe de praticamente tudo que acontece nos Blackwoods. Tem Gillshade e Greybane que o druida Mac Rónán precisa. Conhece o Gloamreach dos Thools. Sabe sobre os experimentos de Choir. Filho Wulfram lhe conta tudo. Tem um grimório que a Igreja destruiria. Veio à Feira de Phanourios vender poções e ingredientes raros.',
    formaDeFalar:'Direta ao ponto, sem eufemismos. Às vezes fala em rimas imperfeitas. Usa metáforas macabras sobre ossos, podridão e sabor. Trata morte e veneno como tópicos domésticos. Ri de coisas que não são engraçadas. Usa "minha criança" ao se referir a qualquer adulto.',
    reatividade: 0.20,
    abertura:'(Você está vendendo poções numa banca na Feira. Os aventureiros acabaram de vencer uma batalha perto. Você os cheira de longe e faz sua observação inicial — brevíssima, macabra, máximo 2 frases.)',
    aberturaFallback:'[ACAO: Mutter fecha os olhos e fareja o ar na direção dos aventureiros com prazer deliberado.] Hmm. Sangue novo e medo velho — cheiram como javali depois da chuva, minha criança.',
    zBase:4, offsetPx:36,
  },
];

const CLASS_AVATAR = {mago:'🔮',guerreiro:'⚔️',ladino:'🗡️',clerigo:'✝️',arqueiro:'🏹',druida:'🌿'};

// ══════════════════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════════════════
const classId     = localStorage.getItem('oraculo.classId')    || 'mago';
const playerName  = localStorage.getItem('oraculo.playerName') || 'Aventureiro';
const playerAvatar= CLASS_AVATAR[classId] || '🧙';

let npcAtivo = 0;
const historicos = NPCS.map(() => []);
let animando = false;
let _continuarResolve = null;

// ── LOG COMPARTILHADO DA CENA ──
const logCena = [];
const MAX_LOG_CENA = 22;

function registrarEvento(quem, texto, tipo='fala'){
  if(!texto||texto.trim()==='---') return;
  logCena.push({quem, texto:texto.trim(), tipo});
  if(logCena.length>MAX_LOG_CENA) logCena.shift();
}

function _gerarContextoCena(npcIdx){
  const nomesPresentes = NPCS.map(n=>n.nome).join(', ');
  const linhas = logCena.length
    ? logCena.map(e=>e.tipo==='acao'
        ? `[${e.quem} ${e.texto}]`
        : `${e.quem}: "${e.texto}"`
      ).join('\n')
    : '(a cena acaba de começar)';
  return `QUEM ESTÁ PRESENTE NA CENA: ${nomesPresentes} e ${playerName} (o aventureiro).\nVocês estão no mesmo espaço e ouvem tudo que acontece ao redor.\n\nDIÁLOGOS E AÇÕES DA CENA (ordem cronológica):\n${linhas}`;
}

// ══════════════════════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════════════════════
const cenaBg      = document.getElementById('cena-bg');
const personagens = document.getElementById('personagens');
const parPlayer   = document.getElementById('par-player');
const playerFallbk= document.getElementById('player-fallback');
const balaoAtivo  = document.getElementById('balao-ativo');
const balaoNome   = document.getElementById('balao-nome');
const balaoAcao   = document.getElementById('balao-acao');
const balaoTexto  = document.getElementById('balao-texto');
const btnContinuar= document.getElementById('btn-continuar');
const npcChipsEl  = document.getElementById('npc-chips');
const msgInput    = document.getElementById('msg-input');
const btnEnviar   = document.getElementById('btn-enviar');
const iaPensando  = document.getElementById('ia-pensando');
const cfgOverlay  = document.getElementById('cfg-overlay');

const npcEls = []; // {par}

// ══════════════════════════════════════════════════════════
//  SETUP
// ══════════════════════════════════════════════════════════
cenaBg.style.backgroundImage = `url(${CENA_BG})`;
msgInput.placeholder = `O que você diz para ${NPCS[0].nome.split(' ')[0]}…`;

// ══════════════════════════════════════════════════════════
//  PLAYER STANDEE
// ══════════════════════════════════════════════════════════
(function(){
  const canvas = document.createElement('canvas');
  canvas.className = 'char-img';
  _loadCanvas(
    `catalogo/mhoried/classes/${classId}/peca_tabuleiro/${classId}_peca.png`,
    canvas,
    () => { parPlayer.insertBefore(canvas, playerFallbk); playerFallbk.style.display='none'; },
    () => { playerFallbk.style.display='flex'; }
  );
})();

// ══════════════════════════════════════════════════════════
//  GERAR NPCs
// ══════════════════════════════════════════════════════════
NPCS.forEach((npc, i) => {
  const par = document.createElement('div');
  par.className = 'par-npc' + (i > 0 ? ' inativo' : '');
  par.id = `par-npc-${i}`;
  par.style.zIndex = String(npc.zBase);
  par.style.left   = `${npc.offsetPx}px`;

  if (npc.tipo === 'standee') {
    const canvas = document.createElement('canvas');
    canvas.className = 'char-img';
    _loadCanvas(npc.img, canvas);
    par.appendChild(canvas);
  } else {
    const img = document.createElement('img');
    img.className = 'char-img';
    img.alt = npc.nome;
    const fb = document.createElement('div');
    fb.className = 'char-fallback'; fb.textContent = npc.avatar; fb.style.display='none';
    img.onerror = () => { img.style.display='none'; fb.style.display='flex'; };
    img.src = npc.img;
    par.append(img, fb);
  }

  personagens.insertBefore(par, parPlayer);

  // chip
  const chip = document.createElement('button');
  chip.className = 'chip-npc' + (i===0?' ativo':'');
  chip.textContent = npc.nome.split(' ')[0];
  chip.addEventListener('click', () => { if(!animando) selecionarNpc(i); });
  npcChipsEl.appendChild(chip);

  npcEls.push({ par });
});

// ══════════════════════════════════════════════════════════
//  CANVAS + CHROMAKEY
// ══════════════════════════════════════════════════════════
function _loadCanvas(src, canvas, onOk, onErr) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const H=900, W=Math.round(H*img.naturalWidth/img.naturalHeight);
      canvas.width=W; canvas.height=H;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,W,H);
      _cromachave(ctx,W,H);
      if(onOk) onOk(canvas);
    } catch(_){ if(onErr) onErr(); }
  };
  img.onerror = () => { if(onErr) onErr(); };
  img.src = src;
}
function _cromachave(ctx,w,h){
  const id=ctx.getImageData(0,0,w,h),d=id.data;
  for(let i=3;i<d.length;i+=4){ if(d[i]<230) return; }
  const pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
  let kr=0,kg=0,kb=0;
  for(const[x,y]of pts){const b=(y*w+x)*4;kr+=d[b];kg+=d[b+1];kb+=d[b+2];}
  kr=Math.round(kr/4);kg=Math.round(kg/4);kb=Math.round(kb/4);
  for(let i=0;i<d.length;i+=4){
    if(Math.abs(d[i]-kr)+Math.abs(d[i+1]-kg)+Math.abs(d[i+2]-kb)<80) d[i+3]=0;
  }
  ctx.putImageData(id,0,0);
}

// ══════════════════════════════════════════════════════════
//  SELECIONAR NPC
// ══════════════════════════════════════════════════════════
function selecionarNpc(idx){
  if(idx===npcAtivo) return;
  npcAtivo=idx;
  document.querySelectorAll('.chip-npc').forEach((c,i)=>c.classList.toggle('ativo',i===idx));
  npcEls.forEach((el,i)=>{
    const a=i===idx;
    el.par.classList.toggle('inativo',!a);
    el.par.style.zIndex=a?String(NPCS[i].zBase+2):String(NPCS[i].zBase);
  });
  msgInput.placeholder=`O que você diz para ${NPCS[idx].nome.split(' ')[0]}…`;
}

// ══════════════════════════════════════════════════════════
//  BALÃO — único elemento, posição muda por quem fala
// ══════════════════════════════════════════════════════════
function _mostrarBalao({ nome, acao, texto, isPlayer=false, comContinuar=false }){
  balaoNome.textContent = nome.toUpperCase();
  if(acao){ balaoAcao.textContent=acao; balaoAcao.style.display='block'; }
  else     { balaoAcao.style.display='none'; }
  balaoTexto.textContent = texto;
  btnContinuar.style.display = comContinuar ? 'block' : 'none';

  // reposicionar conforme quem fala
  balaoAtivo.classList.toggle('player-fala', isPlayer);
  balaoAtivo.classList.add('visivel');
}

function _ocultarBalao(){
  balaoAtivo.classList.remove('visivel');
}

// ══════════════════════════════════════════════════════════
//  CONTINUAR
// ══════════════════════════════════════════════════════════
window._handleContinuar = function(){
  btnContinuar.style.display='none';
  if(_continuarResolve){ _continuarResolve(); _continuarResolve=null; }
};
function esperarContinuar(){
  return new Promise(r=>{ _continuarResolve=r; });
}

// ══════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function parsearFala(raw){
  const m=raw.match(/\[ACAO:\s*([^\]]+)\]/i);
  return { acao:m?.[1]?.trim()||null, fala:raw.replace(/\[ACAO:[^\]]+\]\s*/gi,'').trim() };
}

// ══════════════════════════════════════════════════════════
//  ANIMAÇÕES
// ══════════════════════════════════════════════════════════
async function mostrarNPC(npcIdx, raw, { pedirContinuar=false }={}){
  const {acao,fala}=parsearFala(raw);
  const npc=NPCS[npcIdx];

  // Registrar no log compartilhado (antes de animar, para que contexto já exista)
  if(acao) registrarEvento(npc.nome, acao, 'acao');
  if(fala) registrarEvento(npc.nome, fala, 'fala');

  // player sai
  if(parPlayer.classList.contains('dentro')){
    _ocultarBalao(); await delay(180);
    parPlayer.classList.remove('dentro'); await delay(480);
  }

  _ocultarBalao(); await delay(90);

  // atualizar foco
  npcAtivo=npcIdx;
  document.querySelectorAll('.chip-npc').forEach((c,i)=>c.classList.toggle('ativo',i===npcIdx));
  npcEls.forEach((el,i)=>{
    const a=i===npcIdx;
    el.par.classList.toggle('inativo',!a);
    el.par.style.zIndex=a?String(NPCS[i].zBase+2):String(NPCS[i].zBase);
  });

  // entrar NPCs que ainda não entraram
  let entrou=false;
  for(const el of npcEls){
    if(!el.par.classList.contains('dentro')){ el.par.classList.add('dentro'); entrou=true; }
  }
  if(entrou) await delay(500);

  _mostrarBalao({ nome:npc.nome, acao, texto:fala, isPlayer:false, comContinuar:pedirContinuar });
  if(pedirContinuar) await esperarContinuar();
}

async function mostrarPlayer(texto){
  registrarEvento(playerName, texto, 'fala');
  _ocultarBalao(); await delay(150);

  if(!parPlayer.classList.contains('dentro')){
    parPlayer.classList.add('dentro'); await delay(440);
  }
  _mostrarBalao({ nome:playerName, acao:null, texto, isPlayer:true, comContinuar:false });
}

// ══════════════════════════════════════════════════════════
//  IA (Groq)
// ══════════════════════════════════════════════════════════
async function chamarIA(npcIdx, mensagem){
  const key=localStorage.getItem('oraculo.groqKey');
  if(!key) throw new Error('sem-chave');
  const npc=NPCS[npcIdx],hist=historicos[npcIdx];
  const contextoCena = _gerarContextoCena(npcIdx);
  const messages=[
    { role:'system', content:
`Você é ${npc.nome} — personagem vivo de uma campanha de RPG de fantasia medieval. NUNCA quebre o personagem.

QUEM VOCÊ É: ${npc.personalidade}
O QUE VOCÊ SABE (revele gradualmente): ${npc.conhecimentos}
SUA FORMA DE FALAR: ${npc.formaDeFalar}

${contextoCena}

REGRAS: Português brasileiro, 1ª pessoa. Máximo 2-3 frases. [ACAO: desc] antes da fala para ações físicas visíveis. Se um objeto foi dado ou recebido na cena, você sabe e pode referenciá-lo. Reaja ao contexto da cena, não apenas à última fala.` },
    ...hist,
    { role:'user',content:mensagem },
  ];
  const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':`Bearer ${key}`,'content-type':'application/json'},
    body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:200,messages}),
  });
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices?.[0]?.message?.content?.trim()||'…';
}

// ══════════════════════════════════════════════════════════
//  REAÇÃO ESPONTÂNEA DE NPC (30% de chance após cada troca)
// ══════════════════════════════════════════════════════════
async function _verificarReacao(npcQueRespondeuIdx){
  const outrosIdx = NPCS.map((_,i)=>i).filter(i=>i!==npcQueRespondeuIdx);
  if(!outrosIdx.length) return;
  // Escolher um NPC candidato aleatório entre os outros
  const reatorIdx = outrosIdx[Math.floor(Math.random()*outrosIdx.length)];
  const reator = NPCS[reatorIdx];
  // Chance de reação é determinada pela personalidade do NPC, não por um parâmetro externo
  if(Math.random() > (reator.reatividade ?? 0.20)) return;

  const ultimosEventos = logCena.slice(-4)
    .map(e=>e.tipo==='acao'?`[${e.quem} ${e.texto}]`:`${e.quem}: "${e.texto}"`).join('\n');
  const prompt = `Você observou o que acabou de acontecer:\n${ultimosEventos}\n\nDado exatamente quem você é e seu jeito de ser, você diria algo agora? Se sim, reaja em 1 frase brevíssima e no seu estilo. Se não (porque você naturalmente ficaria em silêncio neste momento), responda exatamente "---".`;

  try {
    const reacao = await chamarIA(reatorIdx, prompt);
    if(!reacao||reacao.trim().startsWith('---')) return;
    historicos[reatorIdx].push({role:'user',content:prompt});
    historicos[reatorIdx].push({role:'assistant',content:reacao});
    await delay(650);
    await mostrarNPC(reatorIdx, reacao, {pedirContinuar:false});
  } catch(_){ /* silencioso — reação é opcional */ }
}

// ══════════════════════════════════════════════════════════
//  LOOP DE CONVERSA
// ══════════════════════════════════════════════════════════
async function enviar(){
  const txt=msgInput.value.trim();
  if(!txt||animando) return;
  animando=true; msgInput.disabled=true; btnEnviar.disabled=true; msgInput.value='';

  const target=npcAtivo;
  await mostrarPlayer(txt);
  historicos[target].push({role:'user',content:txt});
  await delay(900);

  iaPensando.style.display='block';
  try{
    const resp=await chamarIA(target,txt);
    historicos[target].push({role:'assistant',content:resp});
    iaPensando.style.display='none';
    await mostrarNPC(target,resp);
    // Verificar se outro NPC quer reagir espontaneamente
    await _verificarReacao(target);
    // Restaurar foco no NPC que o jogador estava conversando
    npcAtivo=target;
    document.querySelectorAll('.chip-npc').forEach((c,i)=>c.classList.toggle('ativo',i===target));
    msgInput.placeholder=`O que você diz para ${NPCS[target].nome.split(' ')[0]}…`;
  }catch(e){
    iaPensando.style.display='none';
    if(e.message==='sem-chave') cfgOverlay.classList.remove('oculto');
    else await mostrarNPC(target,'[ACAO: Algo parece interferir.] Tente novamente.');
  }
  animando=false; msgInput.disabled=false; btnEnviar.disabled=false; msgInput.focus();
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
async function iniciarCena(){
  if(!localStorage.getItem('oraculo.groqKey')){ cfgOverlay.classList.remove('oculto'); return; }
  msgInput.disabled=true; btnEnviar.disabled=true;
  await delay(700);

  for(let i=0;i<NPCS.length;i++){
    iaPensando.style.display='block';
    let ab; try{ ab=await chamarIA(i,NPCS[i].abertura); }catch(_){ ab=NPCS[i].aberturaFallback; }
    iaPensando.style.display='none';
    await mostrarNPC(i,ab,{pedirContinuar:true});
  }

  selecionarNpc(0);
  msgInput.disabled=false; btnEnviar.disabled=false; msgInput.focus();
}

// ── CFG ──
document.getElementById('cfg-salvar').addEventListener('click',()=>{
  const v=document.getElementById('cfg-input').value.trim();
  if(!v) return;
  localStorage.setItem('oraculo.groqKey',v);
  cfgOverlay.classList.add('oculto');
  iniciarCena();
});
btnEnviar.addEventListener('click',enviar);
msgInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();} });

iniciarCena();
</script>
