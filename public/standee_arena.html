<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standees no Arena — Mhoried</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060504;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 10px;
    font-family: 'Georgia', serif;
  }
  h1 { color: #c8a040; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .sub { color: rgba(190,165,90,0.38); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  /* scrollável em qualquer direção — sem compressão */
  #scroll {
    width: 100%; max-width: 100%;
    overflow: auto;
    border: 1px solid rgba(200,160,64,0.2);
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    -webkit-overflow-scrolling: touch;
  }
  #wrap { position: relative; }
  canvas { position: absolute; top: 0; left: 0; display: block; }
  #cv-top { position: relative; display: block; } /* define o tamanho do wrap */
  a.back {
    display: inline-block; margin-top: 12px;
    font-size: 9px; color: rgba(190,165,90,0.5);
    text-decoration: none; letter-spacing: 1px;
    border: 1px solid rgba(200,160,64,0.18); border-radius: 20px; padding: 3px 12px;
  }
  a.back:hover { color: #c8a040; }
</style>
</head>
<body>
<h1>Standees no Arena — Tamanho Real</h1>
<div class="sub">Sem compressão · pixels exatos do Size Tab · scroll para ver todos</div>
<div id="scroll">
  <div id="wrap">
    <canvas id="cv-ter"></canvas>
    <canvas id="cv-hex"></canvas>
    <canvas id="cv-uni"></canvas>
    <canvas id="cv-top"></canvas>
  </div>
</div>
<a class="back" href="catalog.html">← Catálogo</a>

<script>
// ── Constantes IDÊNTICAS ao arena.html (sem nenhum rescale) ────────────────
const HR   = 55;
const CS   = 82;
const RS   = 95;
const OOFF = 48;
const GX0  = 47;
const GY0  = 80;
const COLS = 13;
const LETRAS = 'ABCDEFGHIJKLM';

// ── Dados ──────────────────────────────────────────────────────────────────
const STANDEES = [
  {id:'barbaro',  g:'m', col:0},
  {id:'barbaro',  g:'f', col:1},
  {id:'guerreiro',g:'m', col:2},
  {id:'guerreiro',g:'f', col:3},
  {id:'arqueiro', g:'m', col:4},
  {id:'arqueiro', g:'f', col:5},
  {id:'mago',     g:'m', col:6},
  {id:'mago',     g:'f', col:7},
  {id:'ladino',   g:'m', col:8},
  {id:'ladino',   g:'f', col:9},
  {id:'clerigo',  g:'m', col:10},
  {id:'clerigo',  g:'f', col:11},
];

const NOMES = {barbaro:'Bárbaro',guerreiro:'Guerreiro',arqueiro:'Arqueiro',mago:'Mago',ladino:'Ladino',clerigo:'Clérigo'};

const DEF_H = {
  barbaro:  {m:400,f:362}, guerreiro:{m:338,f:300},
  arqueiro: {m:290,f:284}, mago:     {m:290,f:290},
  ladino:   {m:314,f:330}, clerigo:  {m:306,f:298},
};
const REV = {
  mago_f:'_r',arqueiro_f:'_r',guerreiro_m:'_r',
  clerigo_m:'_r',clerigo_f:'_r2',ladino_m:'_r3',ladino_f:'_r3',
};

function standeeUrl(id,g){
  const r = REV[id+'_'+g]||'';
  return `catalogo/mhoried/classes/${id}/peca_tabuleiro/${id}_${g}${r}_peca.png`;
}

// ── Layout do canvas (tamanho real, sem escala) ────────────────────────────
const MAX_STORED_H = 400; // bárbaro_m — o mais alto
const TOP_PAD      = 20;
const BOT_HEX_ROWS = 5;  // linhas de hex abaixo do chão
const LABEL_H      = 30;

const CANVAS_W = GX0 + (COLS + 1) * CS + HR;
// Linha de chão: posicionada para que o bárbaro caiba com TOP_PAD acima
const GROUND_Y = TOP_PAD + MAX_STORED_H;
const CANVAS_H = GROUND_Y + BOT_HEX_ROWS * RS + OOFF + LABEL_H;

// ── Setup das canvas ───────────────────────────────────────────────────────
['cv-ter','cv-hex','cv-uni','cv-top'].forEach(id=>{
  const cv = document.getElementById(id);
  cv.width  = CANVAS_W;
  cv.height = CANVAS_H;
  if(id === 'cv-top'){
    cv.style.width  = CANVAS_W + 'px';
    cv.style.height = CANVAS_H + 'px';
  }
});
document.getElementById('wrap').style.width  = CANVAS_W + 'px';
document.getElementById('wrap').style.height = CANVAS_H + 'px';

const ctxTer = document.getElementById('cv-ter').getContext('2d');
const ctxH   = document.getElementById('cv-hex').getContext('2d');
const ctxU   = document.getElementById('cv-uni').getContext('2d');
const ctxLbl = document.getElementById('cv-top').getContext('2d');

// ── Funções hex (idênticas ao arena.html) ─────────────────────────────────
function hexCentroX(col){ return GX0 + col * CS; } // só x — y ignorado no test

function hexPath(ctx, x, y){
  ctx.beginPath();
  for(let i=0; i<6; i++){
    const a = Math.PI/3*i;
    i===0 ? ctx.moveTo(x+HR*Math.cos(a),y+HR*Math.sin(a))
           : ctx.lineTo(x+HR*Math.cos(a),y+HR*Math.sin(a));
  }
  ctx.closePath();
}

// ── Terreno ────────────────────────────────────────────────────────────────
ctxTer.fillStyle = '#1a1510';
ctxTer.fillRect(0, 0, CANVAS_W, CANVAS_H);

// Hexes de decoração
for(let c=0; c<COLS+1; c++){
  for(let r=0; r<Math.ceil(CANVAS_H/RS)+1; r++){
    const x = GX0 + c*CS;
    const y = GROUND_Y + (r - Math.floor(MAX_STORED_H/RS) - 1) * RS + (c%2===1?OOFF:0);
    hexPath(ctxTer, x, y);
    ctxTer.fillStyle = (c+r)%2===0 ? 'rgba(180,150,80,0.055)' : 'rgba(100,80,40,0.035)';
    ctxTer.fill();
  }
}

// ── Grid hex ───────────────────────────────────────────────────────────────
for(let c=0; c<COLS+1; c++){
  for(let r=0; r<Math.ceil(CANVAS_H/RS)+1; r++){
    const x = GX0 + c*CS;
    const y = GROUND_Y + (r - Math.floor(MAX_STORED_H/RS) - 1) * RS + (c%2===1?OOFF:0);
    hexPath(ctxH, x, y);
    ctxH.strokeStyle = 'rgba(255,255,255,0.18)';
    ctxH.lineWidth = 1.2;
    ctxH.stroke();
  }
}

// Linha de chão dourada
ctxH.beginPath();
ctxH.moveTo(0, GROUND_Y); ctxH.lineTo(CANVAS_W, GROUND_Y);
ctxH.strokeStyle = 'rgba(200,160,64,0.7)';
ctxH.lineWidth = 2;
ctxH.stroke();

// ── Carrega imagens e renderiza standees ──────────────────────────────────
let loaded = 0;
const imgs = {};

STANDEES.forEach(s=>{
  const key = s.id+'_'+s.g;
  const img = new Image();
  img.onload = img.onerror = ()=>{
    imgs[key] = img;
    if(++loaded >= STANDEES.length) draw();
  };
  img.src = standeeUrl(s.id, s.g);
});

function draw(){
  ctxU.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctxLbl.clearRect(0, 0, CANVAS_W, CANVAS_H);

  STANDEES.forEach(s=>{
    const key = s.id+'_'+s.g;
    const img = imgs[key];
    // X centrado no centro do hex, Y da coluna ignorado — todos no mesmo chão
    const x = hexCentroX(s.col);

    if(img && img.naturalWidth > 0){
      // Tamanho REAL do PNG — sem nenhuma compressão ou rescale
      const dW = img.naturalWidth;
      const dH = img.naturalHeight; // = storedH calibrado
      ctxU.save();
      ctxU.filter = 'drop-shadow(0 6px 16px rgba(0,0,0,0.99))';
      ctxU.drawImage(img, x - dW/2, GROUND_Y - dH, dW, dH);
      ctxU.restore();
    }

    // Label
    ctxLbl.font      = 'bold 9px Georgia';
    ctxLbl.textAlign = 'center';
    ctxLbl.fillStyle = 'rgba(230,205,120,0.95)';
    ctxLbl.fillText(NOMES[s.id]+' '+(s.g==='m'?'♂':'♀'), x, GROUND_Y + 16);
    ctxLbl.font      = '7px Georgia';
    ctxLbl.fillStyle = 'rgba(180,155,80,0.6)';
    ctxLbl.fillText(DEF_H[s.id][s.g]+'px', x, GROUND_Y + 26);
  });
}
</script>
</body>
</html>
