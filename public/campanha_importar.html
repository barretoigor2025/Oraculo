<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Instalador de Campanha</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#050302;font-family:Georgia,serif;color:#e8d5a8;}
body{padding-bottom:60px;}

#header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid rgba(190,140,35,0.15);}
#header h1{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:rgba(245,216,120,0.30);}
#header h2{font-size:20px;font-weight:700;color:#f5d878;margin-top:4px;}
#header p{font-size:11px;color:rgba(200,175,100,0.42);margin-top:5px;font-style:italic;}

/* ── Input ── */
#input-section{max-width:720px;margin:24px auto;padding:0 16px;}
.card{background:rgba(7,4,1,0.90);border:1px solid rgba(190,140,35,0.18);border-radius:14px;padding:18px;margin-bottom:14px;}
.card-tit{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(190,140,35,0.38);margin-bottom:11px;}
.lbl{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.36);margin-bottom:4px;}
input,textarea,select{width:100%;background:rgba(20,12,4,0.90);border:1px solid rgba(190,140,35,0.22);border-radius:8px;padding:9px 12px;color:#e8d5a8;font-family:Georgia,serif;font-size:13px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
textarea{resize:vertical;line-height:1.6;}
input:focus,textarea:focus{border-color:rgba(190,140,35,0.52);}
.campo{margin-bottom:11px;}

/* ── Botão ── */
.btn-gerar{width:100%;margin-top:6px;padding:14px;background:rgba(190,140,35,0.16);border:1px solid rgba(220,170,50,0.42);border-radius:10px;color:#f5d878;font-family:Georgia,serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn-gerar:hover{background:rgba(190,140,35,0.28);border-color:rgba(245,216,120,0.60);}
.btn-gerar:disabled{opacity:0.35;cursor:default;}

/* ── Loading ── */
#loading{display:none;text-align:center;padding:40px;color:rgba(200,175,100,0.55);}
.ld-icon{font-size:36px;animation:spin 1.8s linear infinite;display:inline-block;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{font-size:11px;letter-spacing:3px;text-transform:uppercase;}
.ld-sub{font-size:10px;margin-top:6px;color:rgba(190,140,35,0.35);font-style:italic;}

/* ── Erro ── */
#erro{display:none;background:rgba(80,10,10,0.40);border:1px solid rgba(160,30,30,0.40);border-radius:10px;padding:14px 16px;color:#c87070;font-size:12px;margin:16px auto;max-width:720px;}

/* ── Output ── */
#output{display:none;max-width:720px;margin:0 auto;padding:0 16px;}
#camp-header{text-align:center;padding:20px 0 14px;border-bottom:1px solid rgba(190,140,35,0.12);margin-bottom:16px;}
#camp-icon{font-size:36px;}
#camp-nome{font-size:18px;font-weight:700;color:#f5d878;margin-top:4px;}
#camp-sub{font-size:10px;color:rgba(200,175,100,0.42);margin-top:3px;letter-spacing:1px;}
#camp-gancho{font-size:12px;color:rgba(200,175,100,0.62);margin-top:10px;font-style:italic;line-height:1.65;}

#tab-nav{display:flex;border-bottom:1px solid rgba(190,140,35,0.13);background:rgba(0,0,0,0.45);position:sticky;top:0;z-index:100;overflow-x:auto;margin:0 -16px;padding:0 16px;}
.tab-btn{flex:0 0 auto;padding:10px 12px;background:none;border:none;font-family:Georgia,serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.34);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;}
.tab-btn.ativo{color:#f5d878;border-bottom-color:#f5d878;}
.tab-section{display:none;padding:18px 0;}
.tab-section.ativo{display:block;}

/* ── Roteiro ── */
.rot-premissa{font-size:13px;color:rgba(220,195,120,0.85);line-height:1.75;padding:14px;background:rgba(190,140,35,0.06);border-left:3px solid rgba(190,140,35,0.30);border-radius:0 8px 8px 0;margin-bottom:16px;}
.rot-section{margin-bottom:20px;}
.rot-tit{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(190,140,35,0.38);margin-bottom:10px;}
.ato{background:rgba(0,0,0,0.30);border:1px solid rgba(190,140,35,0.12);border-radius:9px;padding:12px;margin-bottom:8px;}
.ato-num{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.35);margin-bottom:3px;}
.ato-titulo{font-size:13px;font-weight:700;color:#f5d878;margin-bottom:5px;}
.ato-desc{font-size:12px;color:rgba(200,175,100,0.65);line-height:1.6;}
.gancho{border-left:2px solid rgba(190,140,35,0.25);padding:8px 12px;margin-bottom:8px;}
.gancho-tit{font-size:12px;font-weight:700;color:rgba(220,195,120,0.80);}
.gancho-desc{font-size:11px;color:rgba(200,175,100,0.60);margin-top:3px;line-height:1.55;}
.gancho-gate{font-size:10px;color:rgba(190,140,35,0.35);margin-top:3px;font-style:italic;}
.encontro{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(190,140,35,0.06);}
.enc-tipo{flex-shrink:0;font-size:16px;}
.enc-desc{font-size:12px;color:rgba(200,175,100,0.65);line-height:1.5;}
.enc-meta{font-size:10px;color:rgba(190,140,35,0.34);margin-top:2px;}
.rev{background:rgba(80,10,10,0.18);border:1px solid rgba(160,30,30,0.18);border-radius:8px;padding:10px;margin-bottom:7px;}
.rev-quando{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(190,100,100,0.50);margin-bottom:3px;}
.rev-desc{font-size:12px;color:rgba(210,160,160,0.70);line-height:1.5;}

/* ── Cards de personagem/classe/inimigo ── */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.pers-card{background:rgba(0,0,0,0.35);border:1px solid rgba(190,140,35,0.15);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .2s;}
.pers-card:hover{border-color:rgba(190,140,35,0.40);}
.pc-icon{font-size:24px;margin-bottom:6px;}
.pc-nome{font-size:12px;font-weight:700;color:#f5d878;}
.pc-papel{font-size:10px;color:rgba(200,175,100,0.45);margin-top:2px;line-height:1.4;}
.pc-stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.pc-stat{font-size:9px;background:rgba(190,140,35,0.10);border:1px solid rgba(190,140,35,0.18);border-radius:4px;padding:2px 5px;color:rgba(200,175,100,0.60);}

/* ── Modal de detalhe ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;align-items:flex-end;justify-content:center;}
#modal-overlay.vis{display:flex;}
#modal{background:#0a0602;border:1px solid rgba(190,140,35,0.22);border-radius:18px 18px 0 0;padding:22px 20px 32px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-fechar{float:right;background:none;border:none;color:rgba(190,140,35,0.40);font-size:18px;cursor:pointer;line-height:1;}
.modal-icon{font-size:30px;margin-bottom:6px;}
.modal-nome{font-size:17px;font-weight:700;color:#f5d878;}
.modal-papel{font-size:10px;color:rgba(200,175,100,0.42);margin-bottom:12px;}
.modal-sec{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.36);margin:12px 0 5px;}
.modal-texto{font-size:12px;color:rgba(200,175,100,0.68);line-height:1.65;}
.modal-fala{font-size:12px;color:rgba(220,195,120,0.78);font-style:italic;line-height:1.65;background:rgba(190,140,35,0.06);border-left:2px solid rgba(190,140,35,0.22);padding:8px 12px;border-radius:0 6px 6px 0;}
.hab-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(190,140,35,0.06);}
.hab-ic{font-size:16px;flex-shrink:0;}
.hab-nome{font-size:12px;color:#f5d878;}
.hab-desc{font-size:11px;color:rgba(200,175,100,0.55);margin-top:1px;}
.hab-meta{font-size:10px;color:rgba(190,140,35,0.40);margin-top:2px;}

/* ── Código / Arte ── */
.ob{background:rgba(0,0,0,0.55);border:1px solid rgba(190,140,35,0.13);border-radius:9px;margin-bottom:13px;overflow:hidden;}
.ob-head{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;background:rgba(190,140,35,0.05);border-bottom:1px solid rgba(190,140,35,0.08);}
.ob-tit{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#f5d878;}
.ob-body{padding:12px;font-family:monospace;font-size:11px;color:rgba(200,185,130,0.76);line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;}
.ob-body.exp{max-height:none;}
.btn-sm{padding:4px 9px;background:rgba(190,140,35,0.12);border:1px solid rgba(190,140,35,0.28);border-radius:5px;color:#f5d878;font-family:Georgia,serif;font-size:9px;cursor:pointer;transition:background .15s;}
.btn-sm:hover{background:rgba(190,140,35,0.24);}

/* ── Checklist ── */
.chk-cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.32);padding:12px 0 3px;}
.chk-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid rgba(190,140,35,0.05);}
.chk-box{flex-shrink:0;width:17px;height:17px;background:rgba(20,12,4,0.80);border:1px solid rgba(190,140,35,0.26);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;transition:background .15s;}
.chk-box.ok{background:rgba(40,90,40,0.38);border-color:rgba(80,160,80,0.45);}
.chk-txt{flex:1;font-size:12px;color:rgba(200,175,100,0.66);line-height:1.5;}
.chk-txt.ok{color:rgba(100,140,80,0.50);text-decoration:line-through;}
.badge-auto{font-size:9px;background:rgba(30,80,30,0.35);border:1px solid rgba(80,160,80,0.28);border-radius:10px;padding:1px 6px;color:#80c880;margin-left:6px;white-space:nowrap;}
.badge-manual{font-size:9px;background:rgba(100,60,10,0.35);border:1px solid rgba(190,120,30,0.28);border-radius:10px;padding:1px 6px;color:#d4a060;margin-left:6px;white-space:nowrap;}
</style>
</head>
<body>

<div id="header">
  <h1>🔮 Oráculo RPG</h1>
  <h2>Instalador de Campanha</h2>
  <p>Cole o conteúdo da campanha → o sistema gera tudo no formato Oráculo</p>
</div>

<div id="input-section">
  <div class="card">
    <div class="card-tit">Campanha a Instalar</div>
    <div class="campo">
      <label class="lbl">Descreva ou cole o conteúdo da campanha</label>
      <textarea id="camp-input" rows="10" placeholder="Cole aqui o resumo da campanha, sinopse do PDF, descrição do universo, personagens, lugares, história...

Exemplo: &quot;Naruto Shippuden — A guerra ninja está chegando. As cinco nações estão se unindo contra Madara Uchiha e a Aliança Ninja Shinobi está sendo formada. Os jogadores são ninjas recém-promovidos a chunin da Vila da Folha encarregados de missões de reconhecimento enquanto a guerra se aproxima. NPCs principais: Kakashi Hatake (sensei), Tsunade (Quinta Hokage), Guy Maito (sensei rival). Inimigos: agentes da Akatsuki, Zetsus Brancos, soldados de Madara. Cenários: Vila da Folha, campo de batalha das planícies, floresta da morte...&quot;"></textarea>
    </div>
    <div class="campo">
      <label class="lbl">Chave Groq (gsk_…)</label>
      <input id="groq-key" type="password" placeholder="gsk_..." autocomplete="off">
      <div style="font-size:10px;color:rgba(190,140,35,0.30);margin-top:3px">Guardada localmente. Necessária para a IA gerar o conteúdo estruturado.</div>
    </div>
    <button class="btn-gerar" id="btn-gerar" onclick="instalar()">⚡ ANALISAR E INSTALAR CAMPANHA →</button>
  </div>
</div>

<div id="loading" style="max-width:720px;margin:0 auto;padding:0 16px;">
  <div class="ld-icon">⚙️</div>
  <div class="ld-txt">Analisando campanha</div>
  <div class="ld-sub" id="ld-sub">Lendo universo e personagens…</div>
</div>

<div id="erro" style="padding:0 16px;"></div>

<div id="output">
  <div id="camp-header">
    <div id="camp-icon">🎮</div>
    <div id="camp-nome">—</div>
    <div id="camp-sub">—</div>
    <div id="camp-gancho">—</div>
  </div>

  <div id="tab-nav">
    <button class="tab-btn ativo" onclick="tab('roteiro',this)">📜 Roteiro</button>
    <button class="tab-btn" onclick="tab('npcs',this)">🧑 NPCs</button>
    <button class="tab-btn" onclick="tab('classes',this)">⚔️ Classes</button>
    <button class="tab-btn" onclick="tab('inimigos',this)">💀 Inimigos</button>
    <button class="tab-btn" onclick="tab('cenarios',this)">🗺️ Cenários</button>
    <button class="tab-btn" onclick="tab('codigo',this)">💻 Código</button>
    <button class="tab-btn" onclick="tab('arte',this)">🎨 Arte</button>
    <button class="tab-btn" onclick="tab('checklist',this)">✅ Checklist</button>
  </div>

  <div id="tab-roteiro"  class="tab-section ativo"></div>
  <div id="tab-npcs"     class="tab-section"></div>
  <div id="tab-classes"  class="tab-section"></div>
  <div id="tab-inimigos" class="tab-section"></div>
  <div id="tab-cenarios" class="tab-section"></div>
  <div id="tab-codigo"   class="tab-section"></div>
  <div id="tab-arte"     class="tab-section"></div>
  <div id="tab-checklist"class="tab-section"></div>
</div>

<!-- Modal detalhe -->
<div id="modal-overlay" onclick="fecharModal(event)">
  <div id="modal"></div>
</div>

<script>
// ── Prompt do sistema ──
const SYSTEM_PROMPT = `Você é um adaptador de campanhas para o sistema de RPG "Oráculo".

SISTEMA ORÁCULO — REGRAS FIXAS (NÃO ALTERE ESTAS ESTRUTURAS):

CLASSES JOGÁVEIS:
- maxHp: 6 (conjurador frágil) a 14 (tanque)
- sp (energia para habilidades): 60 a 130
- mov (movimento em hexes por turno): 3 a 7
- atk (bônus de ataque): 2 a 6
- attrs: STR, DEX, CON, INT, WIS, CHA — primário 15-18, secundário 10-13, fraco 8-9
- habs: 2 a 4 habilidades, cada uma com dano "XdY+Z", tipo melee/projétil/magia/buff, custo sp (0 = gratuito)
- Adapte as classes ao universo mas mantenha os tipos de stat do Oráculo

INIMIGOS:
- hp: 10 a 50 | ac: 10 a 18 | atk: 2 a 8 | mov: 2 a 6
- dano: "XdY+Z" | 1 habilidade especial em texto livre

NPCs (Personagens Não-Jogáveis — serão interpretados por IA):
- personalidade: descrição longa e rica de como a IA deve se comportar como este personagem
- conhecimentos: o que o NPC sabe que pode revelar durante a conversa (segredos, história, objetivos)
- formaDeFalar: estilo de comunicação específico (tom, vocabulário, maneirismos, frases típicas)
- aberturaFallback: texto EXATO que o NPC diz ao primeiro encontro com o jogador, incluindo [ACAO: descrição de ação física antes do texto] se houver ação

ROTEIRO:
- Deve ter 3 atos mínimo com narrativa progressiva
- Ganchos são eventos que disparam histórias secundárias
- Encontros definem quando aparecem diálogos com NPCs e batalhas com inimigos
- Revelações são plot twists ou informações que mudam o jogo

Retorne APENAS JSON válido, sem nenhum texto fora do JSON, com esta estrutura exata:
{
  "meta": {
    "id": "slug-unico-minusculas-hifens",
    "nome": "Nome Curto",
    "nomeLongo": "Nome Longo: Subtítulo",
    "sub": "Local · Descrição curta do contexto",
    "icon": "emoji único representativo",
    "cor": "#hexcolor que representa o tema",
    "estiloArte": "descrição detalhada do estilo visual para geração de imagem",
    "gancho": "Premissa da campanha em 2-3 frases cativantes",
    "schemaV": 5
  },
  "roteiro": {
    "premissa": "Descrição completa da história e contexto da campanha",
    "atos": [
      {"num": 1, "titulo": "Título do Ato", "descricao": "O que acontece neste ato", "cenario": "id-do-cenario-principal"}
    ],
    "ganchos": [
      {"titulo": "Nome do Gancho", "descricao": "O que acontece", "gatilho": "Quando/o que dispara este evento"}
    ],
    "encontros": [
      {"tipo": "dialogo", "personagem": "id-do-npc", "cenario": "id-do-cenario", "descricao": "Contexto do encontro"},
      {"tipo": "batalha", "personagem": "id-do-inimigo", "cenario": "id-do-cenario", "descricao": "Contexto da batalha"}
    ],
    "revelacoes": [
      {"quando": "Ato 2, após encontro com X", "descricao": "A revelação"}
    ]
  },
  "classes": [
    {
      "id": "id-unico",
      "nome": "Nome da Classe",
      "icon": "emoji",
      "gender": "ambos",
      "maxHp": 10,
      "sp": 80,
      "mov": 5,
      "atk": 3,
      "cor": "#hexcolor",
      "feat": "Característica única desta classe em 1-2 frases.",
      "aparenciaM": "Descrição visual detalhada da versão masculina para geração de imagem",
      "aparenciaF": "Descrição visual detalhada da versão feminina para geração de imagem",
      "attrs": {"STR": 12, "DEX": 14, "CON": 12, "INT": 10, "WIS": 11, "CHA": 10},
      "habs": [
        {"icon": "emoji", "nome": "Nome", "desc": "Descrição do efeito", "dano": "1d6+2", "tipo": "melee", "sp": 0}
      ]
    }
  ],
  "npcs": [
    {
      "id": "id-unico",
      "nome": "Nome Completo",
      "papel": "Papel na história",
      "personalidade": "Descrição rica e detalhada para a IA interpretar este personagem...",
      "conhecimentos": "O que este NPC sabe, seus segredos, suas motivações ocultas...",
      "formaDeFalar": "Estilo de fala específico, tom, maneirismos, vocabulário característico...",
      "aberturaFallback": "[ACAO: Descrição da ação física ao ver o jogador.] Texto exato da primeira fala.",
      "aparencia": "Descrição visual detalhada para geração de imagem",
      "cenas": ["id-cenario-onde-aparece"]
    }
  ],
  "inimigos": [
    {
      "id": "id-unico",
      "nome": "Nome do Inimigo",
      "hp": 20,
      "ac": 13,
      "atk": 4,
      "mov": 4,
      "dano": "1d8+2",
      "especial": "Nome da habilidade — descrição do efeito especial",
      "aparencia": "Descrição visual detalhada para geração de imagem com fundo verde"
    }
  ],
  "cenarios": [
    {
      "id": "id-unico",
      "nome": "Nome do Cenário",
      "descricao": "Descrição detalhada do ambiente e sua atmosfera",
      "tipo": "ambas",
      "atmosfera": "Descrição de iluminação, clima emocional, elementos visuais marcantes"
    }
  ]
}`;

// ── Tabs ──
function tab(id, btn){
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('ativo'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('ativo'));
  document.getElementById('tab-'+id).classList.add('ativo');
  btn.classList.add('ativo');
}

// ── Instalar ──
let campanha = null;

async function instalar(){
  const txt = document.getElementById('camp-input').value.trim();
  if(!txt){ alert('Cole o conteúdo da campanha antes.'); return; }

  const key = document.getElementById('groq-key').value.trim();
  if(!key){ alert('Insira sua chave Groq (gsk_...).'); return; }
  localStorage.setItem('oraculo.groqKey', key);

  document.getElementById('input-section').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('erro').style.display='none';
  document.getElementById('output').style.display='none';

  const msgs = [
    'Lendo universo e personagens…',
    'Construindo classes jogáveis…',
    'Definindo NPCs e personalidades…',
    'Gerando roteiro com ganchos…',
    'Configurando inimigos e batalhas…',
    'Montando cenários…',
    'Formatando para o sistema Oráculo…',
  ];
  let mi=0;
  const int=setInterval(()=>{ document.getElementById('ld-sub').textContent=msgs[mi=(mi+1)%msgs.length]; },2200);

  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':`Bearer ${key}`,'content-type':'application/json'},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:4096,
        temperature:0.7,
        messages:[
          {role:'system', content:SYSTEM_PROMPT},
          {role:'user',   content:`Analise e adapte para o sistema Oráculo:\n\n${txt}`},
        ]
      })
    });
    clearInterval(int);
    if(!resp.ok) throw new Error(`Groq ${resp.status}: ${await resp.text()}`);
    const data = await resp.json();
    const raw = data.choices?.[0]?.message?.content || '';
    // Extrai JSON mesmo se vier com texto ao redor
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('Resposta não contém JSON válido.\n\nResposta recebida:\n'+raw.slice(0,400));
    campanha = JSON.parse(jsonMatch[0]);
    renderOutput(campanha);
  } catch(e){
    clearInterval(int);
    document.getElementById('loading').style.display='none';
    document.getElementById('input-section').style.display='block';
    const erEl=document.getElementById('erro');
    erEl.style.display='block';
    erEl.textContent='Erro: '+e.message;
  }
}

function renderOutput(c){

function renderCodigo(c){

  // CLASSES_DATA
  let clsCode=`const ${KEY}_CLASSES_DATA = {\n`;
  (c.classes||[]).forEach(cl=>{
    const g=cl.gender==='ambos'?'m':cl.gender||'m';
    clsCode+=`  ${cl.id}: {\n    nome:'${cl.nome}', icon:'${cl.icon}', gender:'${g}',\n    maxHp:${cl.maxHp}, sp:${cl.sp}, mov:${cl.mov}, atk:${cl.atk},\n    cor:'${cl.cor||'#444'}',\n    feat:'${esc(cl.feat||'')}',\n    attrs:${JSON.stringify(cl.attrs||{})},\n    habs:[\n${(cl.habs||[]).map(h=>`      {icon:'${h.icon}',nome:'${h.nome}',desc:'${esc(h.desc)}',dano:'${h.dano}',tipo:'${h.tipo}',sp:${h.sp}}`).join(',\n')},\n    ],\n  },\n`;
  });
  clsCode+=`};\n\nfunction retrato${KEY}(id,gender){\n  return \`catalogo/${id}/classes/\${id}/retrato/\${id}_\${gender}_retrato.png\`;\n}`;

  // NPCS
  const cena0=(c.cenarios||[])[0]?.id||'cena-principal';
  let npcCode=`// SCHEMA_V: ${c.meta?.schemaV||5} — use valor único por campanha!\nconst NPCS = [\n`;
  (c.npcs||[]).forEach((n,i)=>{
    npcCode+=`  {\n    nome:'${n.nome}',\n    img:'catalogo/${id}/npcs/${n.id}/peca_tabuleiro/${n.id}_peca.png',\n    cenas:${JSON.stringify(n.cenas||[cena0])},\n    zBase:${i+1},\n    personalidade:'${esc(n.personalidade||'')}',\n    conhecimentos:'${esc(n.conhecimentos||'')}',\n    formaDeFalar:'${esc(n.formaDeFalar||'')}',\n    abertura:'${n.nome} reage ao jogador que acabou de entrar na cena.',\n    aberturaFallback:'${esc(n.aberturaFallback||'[ACAO: Olha para você.] Bem-vindo.')}',\n  },\n`;
  });
  npcCode+=`];\n\nconst CONFIG_CENA = {\n  id:'${id}', schemaV:${c.meta?.schemaV||5},\n  bgImg:'catalogo/${id}/cenarios/${cena0}/${cena0}_ext.png',\n  titulo:'${esc(c.meta?.sub||c.meta?.nome||'')}',\n  corTema:'${c.meta?.cor||'#444'}',\n};`;

  // INIMIGOS
  let iniCode=`const INIMIGOS_${KEY} = [\n`;
  (c.inimigos||[]).forEach(n=>{
    iniCode+=`  {\n    id:'${n.id}', nome:'${n.nome}',\n    maxHp:${n.hp}, hp:${n.hp}, ac:${n.ac}, atk:${n.atk}, mov:${n.mov},\n    dano:'${n.dano}', especial:'${esc(n.especial||'')}',\n    img:'catalogo/${id}/inimigos/${n.id}/peca_tabuleiro/${n.id}_peca.png',\n  },\n`;
  });
  iniCode+=`];\n`;

  // Catalog
  let catCode=`// Em catalog.html — card da campanha:\n<div class="campaign-card" style="border-color:${c.meta?.cor||'#888'}88"\n     onclick="openCampaignModal('${id}')">\n  <div class="cc-icon">${c.meta?.icon||'🎮'}</div>\n  <div class="cc-name">${c.meta?.nomeLongo||c.meta?.nome}</div>\n  <div class="cc-sub">${c.meta?.sub||''}</div>\n</div>\n\n// Dados:\n'${id}':{\n  id:'${id}', nome:'${c.meta?.nomeLongo||c.meta?.nome}',\n  icon:'${c.meta?.icon}', cor:'${c.meta?.cor}',\n  sub:'${c.meta?.sub}',\n  classes:${JSON.stringify((c.classes||[]).map(cl=>cl.id))},\n  npcs:${JSON.stringify((c.npcs||[]).map(n=>n.id))},\n  inimigos:${JSON.stringify((c.inimigos||[]).map(n=>n.id))},\n  cenarios:${JSON.stringify((c.cenarios||[]).map(n=>n.id))},\n}`;

  document.getElementById('tab-codigo').innerHTML=[
    bloco('⚙️ CLASSES_DATA (catalog.html + entrada)',clsCode,'cls'),
    bloco('💬 NPCS + CONFIG_CENA (simulacao_dialogo_'+id+'.html)',npcCode,'npc'),
    bloco('⚔️ INIMIGOS (arena.html)',iniCode,'ini'),

function renderArte(c){
  const id=c.meta?.id||'campanha';
  const estilo=c.meta?.estiloArte||'estilo RPG detalhado';
  let pr='';

  (c.classes||[]).forEach(cl=>{
    if(cl.gender!=='f'){ pr+=`=== RETRATO · ${cl.nome.toUpperCase()} (MASCULINO) ===\n${cl.aparenciaM||cl.nome}, ${estilo}. Retrato de corpo inteiro ou busto. Fundo neutro escuro. Iluminação dramática. Proporção 2:3 (portrait). Alta qualidade.\n\n`; }
    if(cl.gender!=='m'){ pr+=`=== RETRATO · ${cl.nome.toUpperCase()} (FEMININO) ===\n${cl.aparenciaF||cl.aparenciaM||cl.nome} — versão feminina, ${estilo}. Retrato de corpo inteiro ou busto. Fundo neutro escuro. Proporção 2:3.\n\n`; }
    if(cl.gender!=='f'){ pr+=`=== PEÇA TABULEIRO · ${cl.nome.toUpperCase()} (MASCULINO) ===\n${cl.aparenciaM||cl.nome}, ${estilo}. Corpo INTEIRO em pé, pose heroica. FUNDO VERDE PURO #00ff00 (chromakey). Sem sombras no chão. Proporção 1:2.\n\n`; }
    if(cl.gender!=='m'){ pr+=`=== PEÇA TABULEIRO · ${cl.nome.toUpperCase()} (FEMININO) ===\n${cl.aparenciaF||cl.aparenciaM||cl.nome} — versão feminina, ${estilo}. Corpo INTEIRO em pé. FUNDO VERDE PURO #00ff00. Proporção 1:2.\n\n`; }
  });
  (c.npcs||[]).forEach(n=>{
    pr+=`=== RETRATO · NPC ${n.nome.toUpperCase()} ===\n${n.aparencia||n.nome}, ${estilo}. Retrato expressivo, busto ou 3/4. Iluminação dramática. Alta qualidade.\n\n`;
    pr+=`=== PEÇA TABULEIRO · NPC ${n.nome.toUpperCase()} ===\n${n.aparencia||n.nome}, ${estilo}. Corpo INTEIRO em pé, pose característica. FUNDO VERDE PURO #00ff00. Sem sombras.\n\n`;
  });
  (c.inimigos||[]).forEach(n=>{
    pr+=`=== PEÇA TABULEIRO · INIMIGO ${n.nome.toUpperCase()} ===\n${n.aparencia||n.nome}, ${estilo}. Corpo inteiro, pose ameaçadora. FUNDO VERDE PURO #00ff00. Sem sombras. Proporção 1:2.\n\n`;
  });
  (c.cenarios||[]).forEach(n=>{
    if(n.tipo!=='ext') pr+=`=== CENÁRIO INTERIOR (BATALHA) · ${n.nome.toUpperCase()} ===\n${n.descricao}. ${n.atmosfera}. Vista diagonal levemente aérea. ${estilo}. Espaço para peças de personagem. 1920×1080. Sem HUD.\n\n`;
    if(n.tipo!=='int') pr+=`=== CENÁRIO EXTERIOR (DIÁLOGO) · ${n.nome.toUpperCase()} ===\n${n.descricao}. ${n.atmosfera}. Vista panorâmica, establishing shot. ${estilo}. 1920×1080. Sem personagens em primeiro plano.\n\n`;
  });

  const total = (c.classes||[]).reduce((s,cl)=>s+(cl.gender==='ambos'?4:2),0)
              + (c.npcs||[]).length*2
              + (c.inimigos||[]).length
              + (c.cenarios||[]).reduce((s,n)=>s+(n.tipo==='ambas'?2:1),0);

  document.getElementById('tab-arte').innerHTML=`
    <div style="font-size:11px;color:rgba(190,140,35,0.40);margin-bottom:14px">Total: <b style="color:#f5d878">${total} imagens</b> a gerar. Copie cada bloco e envie para a IA de imagem de sua preferência (Midjourney, DALL-E, Stable Diffusion, etc.)</div>
    ${bloco(`🎨 Todos os Prompts (${total} imagens)`, pr, 'arte-all')}
  `;
}

}
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }
function bloco(tit,body,k){
  return `<div class="ob"><div class="ob-head"><span class="ob-tit">${tit}</span><div style="display:flex;gap:5px"><button class="btn-sm" onclick="document.getElementById('ob-${k}').classList.toggle('exp')">⤢</button><button class="btn-sm" onclick="cop(this,'ob-${k}')">Copiar</button></div></div><div class="ob-body" id="ob-${k}">${escHtml(body)}</div></div>`;
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cop(btn,id){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    const o=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=o,1600);
  });
}
function tgl(k,box){
  const ok=localStorage.getItem(k)!=='1';
  localStorage.setItem(k,ok?'1':'0');
  box.classList.toggle('ok',ok); box.textContent=ok?'✓':'';
  box.nextElementSibling.classList.toggle('ok',ok);
}

// Pre-fill groq key
const saved=localStorage.getItem('oraculo.groqKey');
if(saved) document.getElementById('groq-key').value=saved;
</script>
