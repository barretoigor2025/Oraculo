<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo — Catálogo de Personagens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0c0a;
      --bg2:       #181410;
      --bg3:       #221e18;
      --gold:      #c8a040;
      --gold2:     #e8c060;
      --gold-dim:  rgba(200,160,64,0.18);
      --text:      #e0d0a8;
      --text-dim:  rgba(200,180,128,0.55);
      --border:    rgba(200,160,64,0.18);
      --aliado:    #2a6a3a;
      --aliado-t:  #60cc80;
      --neutro:    #5a5020;
      --neutro-t:  #ccaa40;
      --hostil:    #6a2020;
      --hostil-t:  #ee6060;
      --vilao:     #4a1a6a;
      --vilao-t:   #cc66ff;
      --radius:    10px;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #0a0806 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 0;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
    }
    .header-top h1 {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }
    .header-top span { font-size: 10px; color: var(--text-dim); margin-left: auto; }

    .tabs { display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 14px 10px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: inherit; font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn.active { color: var(--gold2); border-bottom-color: var(--gold); }
    .tab-btn:hover { color: var(--text); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(200,160,64,0.2);
      background: rgba(200,160,64,0.06);
      color: var(--text-dim); font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active { background: var(--gold-dim); color: var(--gold2); border-color: var(--gold); }
    .filter-btn:hover { color: var(--text); }

    /* ── MAIN GRID ── */
    main { padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Classes grid: wider minimum so portraits look good */
    #classes-tab .card-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(200,160,64,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    /* ── PORTRAIT CARD IMAGE (classes) ── */
    .card-portrait {
      position: relative;
      height: 240px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }
    .card-portrait img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 12%;
      display: block;
      transition: opacity .2s;
    }
    .card-portrait .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    }
    /* gradient overlay at bottom */
    .card-portrait::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      pointer-events: none;
    }
    /* M/F toggle buttons inside portrait */
    .portrait-toggle {
      position: absolute; bottom: 6px; right: 6px; z-index: 2;
      display: flex; gap: 3px;
    }
    .pt-btn {
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(200,160,64,0.3);
      color: var(--text-dim); font-size: 9px; letter-spacing: .5px;
      cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .pt-btn.active { background: rgba(200,160,64,0.25); color: var(--gold2); border-color: var(--gold); }
    .pt-btn:hover { color: var(--text); }

    /* ── SPRITE CARD IMAGE (NPCs / inimigos) ── */
    .card-sprite {
      background: rgba(0,0,0,0.3);
      display: flex; align-items: flex-end; justify-content: center;
      height: 160px; padding: 0;
      position: relative;
    }
    .card-sprite img {
      max-height: 100%; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .card-sprite .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px;
    }

    .cat-badge {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 8px; letter-spacing: .8px; text-transform: uppercase;
      font-weight: 700;
    }
    .cat-aliado    { background: var(--aliado);    color: var(--aliado-t); }
    .cat-neutro    { background: var(--neutro);    color: var(--neutro-t); }
    .cat-neutro_hostil { background: #5a3810; color: #ffaa50; }
    .cat-hostil    { background: var(--hostil);    color: var(--hostil-t); }
    .cat-vilao     { background: var(--vilao);     color: var(--vilao-t); }
    .cat-classe    { background: #1a2a4a;          color: #88aaee; }
    .cat-inimigo   { background: #3a1a0a;          color: #ee7744; }

    .card-body { padding: 8px 10px 10px; }
    .card-name {
      font-size: 12px; font-weight: 700;
      color: var(--gold2); line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 10px; color: var(--text-dim);
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── CLASS STAT CHIPS ── */
    .stat-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
      padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      background: rgba(200,160,64,0.1);
      color: rgba(200,160,64,0.7);
      border: 1px solid rgba(200,160,64,0.15);
    }

    /* ── ENEMY TYPE ── */
    .type-badge {
      font-size: 9px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 3px;
    }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    #modal {
      background: var(--bg2);
      border: 1px solid rgba(200,160,64,0.3);
      border-radius: 14px;
      max-width: 640px; width: 100%;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }

    /* ── CLASS MODAL PORTRAIT STRIP ── */
    .portrait-strip {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .portrait-col {
      flex: 1;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .portrait-col:last-child { border-right: none; }
    .portrait-img-wrap {
      height: 320px;
      overflow: hidden;
      position: relative;
    }
    .portrait-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 8%;
      display: block;
    }
    .portrait-img-wrap::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(transparent, rgba(14,12,10,0.9));
      pointer-events: none;
    }
    .portrait-label {
      text-align: center; font-size: 9px; color: var(--text-dim);
      padding: 6px 4px; letter-spacing: 1px; text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ── CLASS MODAL STATS (below strip) ── */
    .modal-class-info {
      padding: 16px 20px 8px;
      border-bottom: 1px solid var(--border);
    }
    .modal-name {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2); font-weight: 400;
      line-height: 1.2; margin-bottom: 6px;
    }
    .modal-cat { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .modal-feat {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
    }
    .stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 10px;
    }
    .stat-box {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.15);
      border-radius: 6px; padding: 4px 8px;
      text-align: center; min-width: 48px;
    }
    .stat-box .sv { font-size: 16px; font-weight: 700; color: var(--gold2); }
    .stat-box .sk { font-size: 8px; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }
    .attrs-grid {
      display: grid; grid-template-columns: repeat(6,1fr); gap: 4px;
      margin-top: 10px;
    }
    .attr-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 5px; padding: 4px 0; text-align: center;
    }
    .attr-box .av { font-size: 13px; font-weight: 700; color: var(--text); }
    .attr-box .am { font-size: 10px; color: var(--gold); }
    .attr-box .ak { font-size: 8px; color: var(--text-dim); letter-spacing: .5px; }

    /* ── NPC MODAL HEADER ── */
    .modal-header {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      min-height: 200px;
    }
    .modal-sprites {
      display: flex; flex-direction: column; gap: 0;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      min-width: 120px; max-width: 200px;
    }
    .modal-sprite-wrap {
      display: flex; align-items: flex-end; justify-content: center;
      flex: 1; padding: 8px;
    }
    .modal-sprite-wrap img {
      max-height: 180px; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .sprite-label {
      text-align: center; font-size: 8px; color: var(--text-dim);
      padding: 4px; letter-spacing: .8px; text-transform: uppercase;
      border-top: 1px solid var(--border);
    }
    .modal-title-area {
      flex: 1; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .modal-feat-npc {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
      margin-top: 4px;
    }

    /* abilities list */
    .habs-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .hab-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 6px; padding: 6px 10px;
    }
    .hab-icon { font-size: 16px; }
    .hab-info { flex: 1; }
    .hab-nome { font-size: 11px; font-weight: 700; color: var(--text); }
    .hab-desc { font-size: 10px; color: var(--text-dim); }
    .hab-tags { display: flex; gap: 4px; margin-top: 3px; }
    .htag {
      font-size: 8px; padding: 1px 5px; border-radius: 3px;
      font-weight: 700; letter-spacing: .3px;
    }
    .htag.dano  { background: rgba(255,80,30,.2);  color: #ff9966; border: 1px solid rgba(255,80,30,.3); }
    .htag.sp    { background: rgba(40,140,255,.15); color: #88ccff; border: 1px solid rgba(40,140,255,.25); }
    .htag.type  { background: rgba(200,160,64,.1);  color: var(--gold); border: 1px solid rgba(200,160,64,.2); }

    /* modal body sections */
    .modal-body { padding: 16px 20px 20px; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 6px;
      padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .section-text {
      font-size: 12px; color: var(--text);
      line-height: 1.65;
    }
    .section-text span.em { color: var(--gold); font-style: italic; }

    /* ── CLASS SPRITE SECTION ── */
    .class-sprites-section {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
    }
    .css-title {
      font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }
    .class-sprites-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items: end;
    }
    .cs-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cs-item img {
      width: 100%; height: auto; max-height: 220px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0,0,0,0.25);
      padding: 4px;
    }
    .cs-label {
      font-size: 8px; color: var(--text-dim); letter-spacing: 1px;
      text-transform: uppercase; text-align: center;
    }

    #modal-close {
      display: block; width: calc(100% - 40px); margin: 0 20px 20px;
      padding: 10px; border-radius: 8px;
      background: rgba(200,160,64,0.1);
      border: 1px solid rgba(200,160,64,0.25);
      color: var(--gold); font-family: inherit; font-size: 12px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: background .15s;
    }
    #modal-close:hover { background: rgba(200,160,64,0.2); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold);
    }
    .count-badge { font-size: 10px; color: var(--text-dim); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(200,160,64,0.3); border-radius: 2px; }

    /* ── GURPS STAT BLOCK (enemy modal) ── */
    .gurps-block {
      padding: 10px 20px 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
    }
    .gurps-attrs {
      display: grid; grid-template-columns: repeat(8,1fr); gap: 4px;
      margin-bottom: 8px;
    }
    @media(max-width:420px){ .gurps-attrs { grid-template-columns: repeat(4,1fr); } }
    .ga-pair {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.12);
      border-radius: 5px; padding: 3px 0; text-align: center;
    }
    .ga-pair.hp { border-color: rgba(255,80,60,0.35); background: rgba(255,80,60,0.07); }
    .ga-k { display:block; font-size:7px; color:var(--text-dim); letter-spacing:.5px; text-transform:uppercase; }
    .ga-v { display:block; font-size:14px; font-weight:700; color:var(--gold2); line-height:1.2; }
    .ga-pair.hp .ga-v { color:#ff8888; }
    .gurps-secondary { display:flex; gap:6px; flex-wrap:wrap; }
    .gs-chip {
      font-size:9px; padding:2px 8px; border-radius:10px;
      background:rgba(200,160,64,0.08); color:var(--gold);
      border:1px solid rgba(200,160,64,0.2);
    }
    .en-list { list-style:none; padding:0; margin:4px 0 0; display:flex; flex-direction:column; gap:3px; }
    .en-list li {
      font-size:11px; color:var(--text); padding:3px 8px;
      border-left:2px solid rgba(200,160,64,0.3); line-height:1.4;
    }

    /* ── CAMPAIGN PICKER ── */
    #campaign-picker{
      position:fixed;inset:0;z-index:9999;
      background:radial-gradient(ellipse at 50% 40%,#1a1208 0%,#0c0a06 100%);
      display:flex;align-items:center;justify-content:center;
    }
    #cp-inner{text-align:center;padding:24px;}
    #cp-title{font-size:28px;font-weight:700;color:#c8a040;letter-spacing:2px;margin-bottom:6px;}
    #cp-subtitle{font-size:12px;color:rgba(190,165,90,.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
    #cp-cards{display:flex;flex-direction:column;gap:12px;max-width:340px;}
    .cp-card{
      padding:16px 20px;background:rgba(190,140,35,.08);
      border:1px solid rgba(190,140,35,.3);border-radius:12px;
      cursor:pointer;text-align:left;transition:all .2s;
    }
    .cp-card:hover{background:rgba(190,140,35,.18);border-color:rgba(190,140,35,.7);}
    .cp-card-nome{font-size:15px;font-weight:700;color:#d4a84b;margin-bottom:4px;}
    .cp-card-desc{font-size:11px;color:rgba(190,165,90,.55);}

    /* ── CENÁRIOS TAB ── */
    .cenario-card{
      background:rgba(20,16,8,.6);border:1px solid rgba(190,140,35,.2);
      border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s;
    }
    .cenario-card:hover{border-color:rgba(190,140,35,.6);}
    .cenario-img{width:100%;height:120px;object-fit:cover;display:block;background:#0c0a06;}
    .cenario-body{padding:10px 12px;}
    .cenario-nome{font-size:13px;font-weight:700;color:#d4a84b;margin-bottom:2px;}
    .cenario-sub{font-size:10px;color:rgba(190,165,90,.5);margin-bottom:6px;}
    .cenario-tags{display:flex;gap:5px;flex-wrap:wrap;}
    .cenario-tag{font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid;font-weight:600;letter-spacing:.3px;}
    .cenario-tag.batalha{color:rgba(220,120,80,.9);border-color:rgba(220,120,80,.3);background:rgba(220,120,80,.1);}
    .cenario-tag.npc{color:rgba(140,200,140,.8);border-color:rgba(140,200,140,.25);background:rgba(140,200,140,.08);}
    .cenario-tag.ato{color:rgba(140,160,220,.8);border-color:rgba(140,160,220,.25);background:rgba(140,160,220,.08);}

    /* ── ROTEIRO TAB ── */
    .rot-ato{margin-bottom:28px;}
    .rot-ato-titulo{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:rgba(190,140,35,.5);padding:8px 0;border-bottom:1px solid rgba(190,140,35,.15);margin-bottom:12px;}
    .rot-cena{background:rgba(20,16,8,.5);border:1px solid rgba(190,140,35,.15);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
    .rot-cena-num{font-size:9px;color:rgba(190,140,35,.4);letter-spacing:.5px;margin-bottom:3px;}
    .rot-cena-titulo{font-size:13px;font-weight:700;color:#d4a84b;margin-bottom:5px;}
    .rot-cena-texto{font-size:11px;color:rgba(190,165,100,.7);line-height:1.5;}
    .rot-cena-badges{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
    .rot-badge{font-size:9px;padding:2px 8px;border-radius:20px;border:1px solid rgba(190,140,35,.25);color:rgba(190,165,90,.65);}
    .rot-badge.batalha{border-color:rgba(220,100,80,.3);color:rgba(220,120,80,.8);}
    .rot-badge.npc{border-color:rgba(100,200,100,.25);color:rgba(140,210,140,.75);}

    /* ── CHECKLIST TAB ── */
    .ck-section{margin-bottom:20px;}
    .ck-section-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(190,140,35,.5);padding:6px 0;border-bottom:1px solid rgba(190,140,35,.12);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
    .ck-section-score{font-size:11px;font-weight:700;}
    .ck-score-ok{color:#4caf50;}
    .ck-score-miss{color:#f44336;}
    .ck-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);}
    .ck-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center;}
    .ck-nome{font-size:11px;color:rgba(220,195,140,.85);flex:1;}
    .ck-path{font-size:9px;color:rgba(190,165,90,.35);margin-top:1px;}
    .ck-missing .ck-nome{color:rgba(220,120,80,.8);}
    .ck-missing .ck-path{color:rgba(220,120,80,.3);}

// ── HELPERS ──────────────────────────────────────────────────────────

function mod(v){ const m=Math.floor((v-10)/2); return m>=0?`+${m}`:String(m); }

function catLabel(c){
  const map={aliado:'Aliado',neutro:'Neutro',neutro_hostil:'Neutro-Hostil',hostil:'Hostil',vilao:'Vilão',classe:'Classe',inimigo:'Inimigo'};
  return map[c]||c;
}

function portraitUrl(id, gender){

function npcPortraitUrl(id){

function npcSpriteUrl(path){
  if(!path) return '';

}

function enemyPortraitUrl(id){
  return `../campaigns/mhoried/portraits/enemy_${id}.png`;
}

function inimSpriteUrl(id, costas){

// ── BUILD CHECKLIST TAB ───────────────────────────────────────────────

function buildChecklistTab(){
  const tab = document.getElementById('checklist-tab');
  const prefix = '../campaigns/mhoried/';

  const sections = [
    {
      titulo: '🖼️ Retratos NPC',
      dica: 'portraits/{id}.png — retrato de rosto (400×500)',
      items: Object.keys(NPCS).map(id=>({
        nome: NPCS[id].nome || id,
        sub:  id,
        path: `${prefix}portraits/${id}.png`,
      })),
    },
    {
      titulo: '👾 Retratos Inimigos',
      dica: 'portraits/enemy_{id}.png — retrato de rosto (400×500)',
      items: INIMIGOS_DATA.map(e=>({
        nome: e.nome || e.id,
        sub:  `enemy_${e.id}`,
        path: `${prefix}portraits/enemy_${e.id}.png`,
      })),
    },
    {
      titulo: '🧙 Sprites de Classe — Masculino',
      dica: 'sprites/{classe}_m_costas.png — sprite sheet 4 frames (362×H)',
      items: Object.keys(CLASSES_DATA).map(id=>({
        nome: CLASSES_DATA[id].nome,
        sub:  `${id}_m_costas.png`,
        path: `${prefix}sprites/${id}_m_costas.png`,
      })),
    },
    {
      titulo: '🧙 Sprites de Classe — Feminino',
      dica: 'sprites/{classe}_f_costas.png — sprite sheet 4 frames (362×H)',
      items: Object.keys(CLASSES_DATA).map(id=>({
        nome: CLASSES_DATA[id].nome,
        sub:  `${id}_f_costas.png`,
        path: `${prefix}sprites/${id}_f_costas.png`,
      })),
    },
    {
      titulo: '🗺️ Imagens de Cenário',
      dica: 'locations/{id}.png — arte de localização (16:9 recomendado)',
      items: Object.values(CENAS)
        .sort((a,b)=>(a.ato||0)-(b.ato||0)||(a.ordemNarrativa||99)-(b.ordemNarrativa||99))
        .map(c=>({
          nome: c.titulo || c.id,
          sub:  `Ato ${c.ato||1}${c.batalha?' · ⚔️':''}`,
          path: `${prefix}locations/${c.id}.png`,
        })),
    },
    {
      titulo: '🗺️ Mapas de Batalha',
      dica: 'maps/{id}.png — mapa hexagonal de batalha',
      items: Object.values(CENAS)
        .filter(c=>c.batalha && c.mapaId)
        .map(c=>({
          nome: c.titulo || c.id,
          sub:  c.mapaId,
          path: `${prefix}maps/${c.mapaId}.png`,
        })),
    },
  ].filter(s=>s.items.length>0);

  function probeImg(path){
    return new Promise(resolve=>{
      const img = new Image();
      img.onload  = ()=>resolve(true);
      img.onerror = ()=>resolve(false);
      img.src = path;
    });
  }

  tab.innerHTML = `
    <div class="section-header"><h2>✓ Checklist de Assets</h2><span class="count-badge" id="ck-pct">verificando…</span></div>
    <div id="ck-body">
      <div style="padding:40px;text-align:center;color:rgba(190,165,90,.4);font-size:13px">⏳ Verificando arquivos…</div>
    </div>`;

  async function build(){
    let totalOk=0, totalMiss=0;
    let html = '';

    for(const sec of sections){
      const results = await Promise.all(sec.items.map(item=>probeImg(item.path)));
      const ok   = results.filter(Boolean).length;
      const miss = results.length - ok;
      totalOk   += ok;
      totalMiss += miss;
      const allOk = miss === 0;

      html += `<div class="ck-section">
        <div class="ck-section-title">
          ${sec.titulo}
          <span class="ck-section-score ${allOk?'ck-score-ok':'ck-score-miss'}">${ok}/${results.length}</span>
        </div>
        <div style="font-size:9px;color:rgba(190,165,90,.35);margin-bottom:8px;font-style:italic">${sec.dica}</div>`;

      sec.items.forEach((item,i)=>{
        const found = results[i];
        if(!found){
          html += `<div class="ck-item ck-missing">
            <span class="ck-icon">❌</span>
            <div>
              <div class="ck-nome">${item.nome}</div>
              <div class="ck-path">${item.sub}</div>
            </div>
          </div>`;
        } else {
          html += `<div class="ck-item">
            <span class="ck-icon">✅</span>
            <div><div class="ck-nome">${item.nome}</div></div>
          </div>`;
        }
      });
      html += '</div>';
    }

    const pct = totalOk+totalMiss > 0 ? Math.round(totalOk/(totalOk+totalMiss)*100) : 100;
    const cor = totalMiss===0 ? '#4caf50' : pct>=70 ? '#c8a040' : '#f44336';

    document.getElementById('ck-pct').textContent = `${pct}% completo`;
    document.getElementById('ck-pct').style.color = cor;

    const missingBlock = totalMiss > 0
      ? `<div class="ck-summary" style="color:${cor};margin-bottom:16px">
           ❌ ${totalMiss} arquivo${totalMiss>1?'s':''} faltando — ${totalOk} presentes
         </div>`
      : `<div class="ck-summary" style="color:#4caf50;margin-bottom:16px">✅ Todos os assets presentes!</div>`;

    document.getElementById('ck-body').innerHTML = missingBlock + html;
  }

  build();
}

window.switchPortrait = function(id, gender){
  const img = document.getElementById(`card-img-${id}`);

    img.src = portraitUrl(id, gender);
    img.style.display = '';
  }
  ['m','f'].forEach(g=>{
    const btn = document.getElementById(`ptbtn-${id}-${g}`);
    if(btn) btn.classList.toggle('active', g===gender);

};

    const portraitSrc = npcPortraitUrl(npc.id);
    const fallbackSrc = npcSpriteUrl(npc.sprite);
    const snippet = (npc.descFisica||'').slice(0,80).replace(/`/g,'') + '…';
    cards += `
      <div class="card" data-cat="${npc.categoria}" onclick="openNpcModal('${npc.id}')">
        <div class="card-portrait" style="background:rgba(0,0,0,0.35)">
          <span class="cat-badge cat-${npc.categoria}" style="top:6px;left:6px;right:auto">${catLabel(npc.categoria)}</span>
          <img src="${portraitSrc}" alt="${npc.nome}"
            onerror="this.src='${fallbackSrc}';this.style.objectFit='contain';this.style.objectPosition='bottom'">
        </div>
        <div class="card-body">
          <div class="card-name">${npc.nome}</div>
          <div class="card-sub">${snippet}</div>
        </div>
      </div>`;
  }
  cards += '</div>';
  tab.innerHTML = header + cards;
}

// ── BUILD ENEMIES TAB ─────────────────────────────────────────────────

function buildInimigosTab(){
  const tab = document.getElementById('inimigos-tab');
  const header = `<div class="section-header"><h2>Inimigos &amp; Criaturas</h2><span class="count-badge">${INIMIGOS_DATA.length} tipos</span></div>`;

  let cards = '<div class="card-grid">';
  for(const en of INIMIGOS_DATA){
    const portrait = en.id === 'rei_chutter' ? '../campaigns/mhoried/portraits/npc_rei_chutter.png' : enemyPortraitUrl(en.id);
    const spr = inimSpriteUrl(en.id, false);
    cards += `
      <div class="card" onclick="openEnemyModal('${en.id}')">
        <div class="card-portrait" style="background:rgba(60,10,0,.25)">
          <span class="cat-badge cat-inimigo" style="top:6px;left:6px;right:auto">${en.tipo}</span>
          <img id="en-card-${en.id}" src="${portrait}" alt="${en.nome}"
            onerror="this.src='${spr}';this.style.objectFit='contain';this.style.objectPosition='bottom'">
          <span class="no-img" style="display:none">💀</span>
        </div>
        <div class="card-body">
          <div class="card-name">${en.nome}</div>
          <div class="card-sub">${en.desc}</div>
        </div>
      </div>`;
  }
  cards += '</div>';
  tab.innerHTML = header + cards;
}

// ── MODALS ────────────────────────────────────────────────────────────

  const habsHtml = cls.habs.map(h=>`

        </div>
        <div class="portrait-label">♀ Feminino</div>
      </div>
    </div>
    <div class="modal-class-info">
      <div class="modal-name">${cls.icon} ${cls.nome}</div>

      <div class="modal-feat">${cls.feat}</div>
      <div class="stats-row">
        <div class="stat-box"><div class="sv">❤️ ${cls.maxHp}</div><div class="sk">PV Máx</div></div>
        <div class="stat-box"><div class="sv">💠 ${cls.sp}</div><div class="sk">SP Máx</div></div>
        <div class="stat-box"><div class="sv">👢 ${cls.mov}</div><div class="sk">Mov/Turno</div></div>
        <div class="stat-box"><div class="sv">🎲 d${cls.atk+4}</div><div class="sk">Dado Atk</div></div>

      <div class="css-title">Sprite de Mapa</div>
      <div class="class-sprites-grid">
        <div class="cs-item">
          <img src="./assets/sprites/${id}_m_frente.png" alt="♂ Frente"
            onerror="this.closest('.cs-item').style.display='none'">
          <div class="cs-label">♂ Frente</div>
        </div>
        <div class="cs-item">
          <img src="./assets/sprites/${id}_m_costas.png" alt="♂ Costas"
            onerror="this.closest('.cs-item').style.display='none'">
          <div class="cs-label">♂ Costas</div>
        </div>
        <div class="cs-item">
          <img src="./assets/sprites/${id}_f_frente.png" alt="♀ Frente"
            onerror="this.closest('.cs-item').style.display='none'">
          <div class="cs-label">♀ Frente</div>
        </div>
        <div class="cs-item">
          <img src="./assets/sprites/${id}_f_costas.png" alt="♀ Costas"
            onerror="this.closest('.cs-item').style.display='none'">
          <div class="cs-label">♀ Costas</div>
        </div>
      </div>

    <div class="class-sprites-section">
      <div class="css-title">Sprite Inconsciente</div>

          <img src="./assets/sprites/${id}_m_inconsciente.png" alt="♂ Inconsciente"
            onerror="this.closest('.cs-item').style.display='none'">
          <div class="cs-label">♂ Inconsciente</div>
        </div>
        <div class="cs-item">
          <img src="./assets/sprites/${id}_f_inconsciente.png" alt="♀ Inconsciente"
            onerror="this.closest('.cs-item').style.display='none'">

window.openNpcModal = function(id){
  const npc = NPCS[id];
  if(!npc) return;

  const portraitSrc = npcPortraitUrl(npc.id);
  const sprFrente   = `../campaigns/mhoried/sprites/${npc.id}_frente.png`;
  const sprCostas   = `../campaigns/mhoried/sprites/${npc.id}_costas.png`;
  const fallbackSrc = npcSpriteUrl(npc.sprite);

  const sections = [
    npc.descFisica     && ['Aparência Física',  npc.descFisica],
    npc.personalidade  && ['Personalidade',     npc.personalidade],
    npc.conhecimentos  && ['O que Sabe',        npc.conhecimentos],
    npc.formaDeFalar   && ['Forma de Falar',    npc.formaDeFalar],
  ].filter(Boolean).map(([t,c])=>`
    <div class="section">
      <div class="section-title">${t}</div>
      <div class="section-text">${c}</div>
    </div>`).join('');

  document.getElementById('modal-inner').innerHTML = `
    <div class="portrait-strip">
      <div class="portrait-col">
        <div class="portrait-img-wrap">
          <img src="${sprFrente}" alt="Frente"
            style="object-fit:contain;background:rgba(0,0,0,0.2)"
            onerror="this.closest('.portrait-strip').outerHTML=singlePortrait('${id}')">
        </div>
        <div class="portrait-label">▶ Frente</div>
      </div>
      <div class="portrait-col">
        <div class="portrait-img-wrap">
          <img src="${sprCostas}" alt="Costas"
            style="object-fit:contain;background:rgba(0,0,0,0.2)"
            onerror="this.src='${fallbackSrc}';this.style.objectFit='contain'">
        </div>
        <div class="portrait-label">◀ Costas</div>
      </div>
    </div>
    <div class="modal-class-info">
      <div class="modal-name">${npc.nome}</div>
      <div class="modal-cat"><span class="cat-badge cat-${npc.categoria}" style="position:static">${catLabel(npc.categoria)}</span></div>
      <div class="modal-feat">${npc.personalidade ? npc.personalidade.slice(0,200)+'…' : ''}</div>
    </div>
    <div class="modal-body">${sections}</div>`;
  openModal();
};

/* fallback for NPCs without sprite sheets */
window.singlePortrait = function(id){
  const npc = NPCS[id];
  if(!npc) return '';
  const portraitSrc = npcPortraitUrl(npc.id);
  const fallbackSrc = npcSpriteUrl(npc.sprite);
  return `<div style="display:flex;border-bottom:1px solid var(--border)">
    <div style="flex:0 0 auto;width:160px;background:rgba(0,0,0,0.4);overflow:hidden;flex-shrink:0">
      <div style="height:320px;overflow:hidden;position:relative">
        <img src="${portraitSrc}" alt="${npc.nome}"
          style="width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block"
          onerror="this.src='${fallbackSrc}';this.style.objectFit='contain';this.style.objectPosition='bottom'">
        <div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(14,12,10,.9))"></div>
      </div>
      <div class="sprite-label">${catLabel(npc.categoria)}</div>
    </div>
    <div class="modal-title-area">
      <div class="modal-name">${npc.nome}</div>
      <div class="modal-cat"><span class="cat-badge cat-${npc.categoria}">${catLabel(npc.categoria)}</span></div>
      <div class="modal-feat-npc">${npc.personalidade ? npc.personalidade.slice(0,180)+'…' : ''}</div>
    </div>
  </div>`;
};

window.openEnemyModal = function(id){
  const en = INIMIGOS_DATA.find(e=>e.id===id);
  if(!en) return;

  const isRei      = id === 'rei_chutter';
  const sheetFront = isRei ? '../campaigns/mhoried/portraits/npc_rei_chutter.png' : `../campaigns/mhoried/portraits/enemy_${id}_frente.png`;
  const sheetBack  = isRei ? '../campaigns/mhoried/portraits/npc_rei_chutter.png' : `../campaigns/mhoried/portraits/enemy_${id}_costas.png`;
  const sprFront   = inimSpriteUrl(id, false);
  const sprBack    = inimSpriteUrl(id, true);

  const g = en.gurps || {};

  const statsHtml = g.st !== undefined ? `
    <div class="gurps-block">
      <div class="gurps-attrs">
        <div class="ga-pair"><span class="ga-k">FOR</span><span class="ga-v">${g.st}</span></div>
        <div class="ga-pair"><span class="ga-k">DES</span><span class="ga-v">${g.dx}</span></div>
        <div class="ga-pair"><span class="ga-k">INT</span><span class="ga-v">${g.iq}</span></div>
        <div class="ga-pair"><span class="ga-k">SAÚ</span><span class="ga-v">${g.ht}</span></div>
        <div class="ga-pair hp"><span class="ga-k">PV</span><span class="ga-v">${g.hp}</span></div>
        <div class="ga-pair"><span class="ga-k">VON</span><span class="ga-v">${g.will}</span></div>
        <div class="ga-pair"><span class="ga-k">PER</span><span class="ga-v">${g.per}</span></div>
        <div class="ga-pair"><span class="ga-k">FP</span><span class="ga-v">${g.fp}</span></div>
      </div>
      <div class="gurps-secondary">
        <span class="gs-chip">🏃 Move ${g.move}</span>
        <span class="gs-chip">🛡️ Esquiva ${g.dodge}</span>
        <span class="gs-chip">🔰 DR ${g.dr}</span>
        <span class="gs-chip">⚡ Vel ${g.speed}</span>
        ${g.sm !== 0 ? `<span class="gs-chip">📏 SM ${g.sm > 0 ? '+'+g.sm : g.sm}</span>` : ''}
      </div>
    </div>` : '';

  const sec = (title, content, icon='') =>
    content ? `<div class="section"><div class="section-title">${icon} ${title}</div><div class="section-text">${content}</div></div>` : '';

  const lst = (title, arr, icon='') =>
    arr && arr.length > 0 ? `<div class="section"><div class="section-title">${icon} ${title}</div><ul class="en-list">${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>` : '';

  document.getElementById('modal-inner').innerHTML = `
    <div class="portrait-strip">
      <div class="portrait-col">
        <div class="portrait-img-wrap">
          <img src="${sheetFront}" alt="Frente"
            style="object-fit:contain;background:rgba(0,0,0,0.2)"
            onerror="this.src='${sprFront}';this.style.objectFit='contain'">
        </div>
        <div class="portrait-label">▶ Frente</div>
      </div>
      <div class="portrait-col">
        <div class="portrait-img-wrap">
          <img src="${sheetBack}" alt="Costas"
            style="object-fit:contain;background:rgba(0,0,0,0.2)"
            onerror="this.src='${sprBack}';this.style.objectFit='contain'">
        </div>
        <div class="portrait-label">◀ Costas</div>
      </div>
    </div>
    <div class="modal-class-info">
      <div class="modal-name">💀 ${en.nome}</div>
      <div class="modal-cat"><span class="cat-badge cat-inimigo" style="position:static">${en.tipo}</span></div>
      <div class="modal-feat">${en.desc}</div>
    </div>
    ${statsHtml}
    <div class="modal-body">
      ${sec('Ataque Principal', en.ataque, '⚔️')}
      ${lst('Traços', en.tracos, '🔖')}
      ${lst('Habilidades', en.habs, '🎯')}
      ${lst('Magias', en.magias, '🪄')}
      ${sec('Objetivo', en.objetivo, '🎯')}
      ${sec('Emoções & Psicologia', en.emocoes, '🧠')}
      ${sec('Gatilhos de Raiva', en.raiva, '💢')}
      ${sec('Convicções', en.convicoes, '📜')}
      ${sec('Na Batalha', en.fala_batalha, '💬')}
      ${sec('Comportamento', en.comportamento, '👁️')}
    </div>`;
  openModal();
};

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
window.closeModal = function(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
};

document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

// ── TABS ──────────────────────────────────────────────────────────────

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`${tab}-tab`).classList.add('active');
    document.getElementById('filter-bar').style.display = tab==='npcs' ? 'flex' : 'none';
    updateCount(tab);
  });
});

// ── NPC FILTER ────────────────────────────────────────────────────────

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('#npc-grid .card').forEach(card=>{
      const cat = card.dataset.cat;
      card.style.display = (f==='todos' || cat===f) ? '' : 'none';
    });
  });
});

// ── COUNT LABEL ──────────────────────────────────────────────────────

function updateCount(tab){
  const labels = {
    classes:  `${Object.keys(CLASSES_DATA).length} classes`,
    npcs:     `${Object.keys(NPCS).length} personagens`,
    inimigos: `${INIMIGOS_DATA.length} criaturas`,
    cenarios: `${Object.keys(CENAS).length} cenários`,
    roteiro:  `${Object.keys(CENAS).length} cenas`,
    checklist:'assets',
  };
  document.getElementById('count-label').textContent = labels[tab]||'';
}

// ── INIT ──────────────────────────────────────────────────────────────

initCampanhaPicker();
buildClassesTab();
buildNpcsTab();
buildInimigosTab();
buildCenariosTab();
buildRoteiroTab();
buildChecklistTab();
updateCount('classes');
</script>
