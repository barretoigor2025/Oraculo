<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo — Catálogo de Personagens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0c0a;
      --bg2:       #181410;
      --bg3:       #221e18;
      --gold:      #c8a040;
      --gold2:     #e8c060;
      --gold-dim:  rgba(200,160,64,0.18);
      --text:      #e0d0a8;
      --text-dim:  rgba(200,180,128,0.55);
      --border:    rgba(200,160,64,0.18);
      --aliado:    #2a6a3a;
      --aliado-t:  #60cc80;
      --neutro:    #5a5020;
      --neutro-t:  #ccaa40;
      --hostil:    #6a2020;
      --hostil-t:  #ee6060;
      --vilao:     #4a1a6a;
      --vilao-t:   #cc66ff;
      --radius:    10px;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #0a0806 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 0;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
    }
    .header-top h1 {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }
    .header-top span { font-size: 10px; color: var(--text-dim); margin-left: auto; }

    .tabs { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 20px 10px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: inherit; font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn.active { color: var(--gold2); border-bottom-color: var(--gold); }
    .tab-btn:hover { color: var(--text); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(200,160,64,0.2);
      background: rgba(200,160,64,0.06);
      color: var(--text-dim); font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active { background: var(--gold-dim); color: var(--gold2); border-color: var(--gold); }
    .filter-btn:hover { color: var(--text); }

    /* ── MAIN GRID ── */
    main { padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Classes grid: wider minimum so portraits look good */
    #classes-tab .card-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(200,160,64,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    /* ── PORTRAIT CARD IMAGE (classes) ── */
    .card-portrait {
      position: relative;
      height: 240px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }
    .card-portrait img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 12%;
      display: block;
      transition: opacity .2s;
    }
    .card-portrait .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    }
    /* gradient overlay at bottom */
    .card-portrait::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      pointer-events: none;
    }
    /* M/F toggle buttons inside portrait */
    .portrait-toggle {
      position: absolute; bottom: 6px; right: 6px; z-index: 2;
      display: flex; gap: 3px;
    }
    .pt-btn {
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(200,160,64,0.3);
      color: var(--text-dim); font-size: 9px; letter-spacing: .5px;
      cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .pt-btn.active { background: rgba(200,160,64,0.25); color: var(--gold2); border-color: var(--gold); }
    .pt-btn:hover { color: var(--text); }

    /* ── SPRITE CARD IMAGE (NPCs / inimigos) ── */
    .card-sprite {
      background: rgba(0,0,0,0.3);
      display: flex; align-items: flex-end; justify-content: center;
      height: 160px; padding: 0;
      position: relative;
    }
    .card-sprite img {
      max-height: 100%; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .card-sprite .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px;
    }

    .cat-badge {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 8px; letter-spacing: .8px; text-transform: uppercase;
      font-weight: 700;
    }
    .cat-aliado    { background: var(--aliado);    color: var(--aliado-t); }
    .cat-neutro    { background: var(--neutro);    color: var(--neutro-t); }
    .cat-neutro_hostil { background: #5a3810; color: #ffaa50; }
    .cat-hostil    { background: var(--hostil);    color: var(--hostil-t); }
    .cat-vilao     { background: var(--vilao);     color: var(--vilao-t); }
    .cat-classe    { background: #1a2a4a;          color: #88aaee; }
    .cat-inimigo   { background: #3a1a0a;          color: #ee7744; }

    .card-body { padding: 8px 10px 10px; }
    .card-name {
      font-size: 12px; font-weight: 700;
      color: var(--gold2); line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 10px; color: var(--text-dim);
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── CLASS STAT CHIPS ── */
    .stat-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
      padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      background: rgba(200,160,64,0.1);
      color: rgba(200,160,64,0.7);
      border: 1px solid rgba(200,160,64,0.15);
    }

    /* ── ENEMY TYPE ── */
    .type-badge {
      font-size: 9px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 3px;
    }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    #modal {
      background: var(--bg2);
      border: 1px solid rgba(200,160,64,0.3);
      border-radius: 14px;
      max-width: 640px; width: 100%;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }

    /* ── CLASS MODAL PORTRAIT STRIP ── */
    .portrait-strip {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .portrait-col {
      flex: 1;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .portrait-col:last-child { border-right: none; }
    .portrait-img-wrap {
      height: 320px;
      overflow: hidden;
      position: relative;
    }
    .portrait-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 8%;
      display: block;
    }
    .portrait-img-wrap::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(transparent, rgba(14,12,10,0.9));
      pointer-events: none;
    }
    .portrait-label {
      text-align: center; font-size: 9px; color: var(--text-dim);
      padding: 6px 4px; letter-spacing: 1px; text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ── CLASS MODAL STATS (below strip) ── */
    .modal-class-info {
      padding: 16px 20px 8px;
      border-bottom: 1px solid var(--border);
    }
    .modal-name {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2); font-weight: 400;
      line-height: 1.2; margin-bottom: 6px;
    }
    .modal-cat { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .modal-feat {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
    }
    .stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 10px;
    }
    .stat-box {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.15);
      border-radius: 6px; padding: 4px 8px;
      text-align: center; min-width: 48px;
    }
    .stat-box .sv { font-size: 16px; font-weight: 700; color: var(--gold2); }
    .stat-box .sk { font-size: 8px; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }
    .attrs-grid {
      display: grid; grid-template-columns: repeat(6,1fr); gap: 4px;
      margin-top: 10px;
    }
    .attr-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 5px; padding: 4px 0; text-align: center;
    }
    .attr-box .av { font-size: 13px; font-weight: 700; color: var(--text); }
    .attr-box .am { font-size: 10px; color: var(--gold); }
    .attr-box .ak { font-size: 8px; color: var(--text-dim); letter-spacing: .5px; }

    /* ── NPC MODAL HEADER ── */
    .modal-header {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      min-height: 200px;
    }
    .modal-sprites {
      display: flex; flex-direction: column; gap: 0;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      min-width: 120px; max-width: 200px;
    }
    .modal-sprite-wrap {
      display: flex; align-items: flex-end; justify-content: center;
      flex: 1; padding: 8px;
    }
    .modal-sprite-wrap img {
      max-height: 180px; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .sprite-label {
      text-align: center; font-size: 8px; color: var(--text-dim);
      padding: 4px; letter-spacing: .8px; text-transform: uppercase;
      border-top: 1px solid var(--border);
    }
    .modal-title-area {
      flex: 1; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .modal-feat-npc {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
      margin-top: 4px;
    }

    /* abilities list */
    .habs-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .hab-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 6px; padding: 6px 10px;
    }
    .hab-icon { font-size: 16px; }
    .hab-info { flex: 1; }
    .hab-nome { font-size: 11px; font-weight: 700; color: var(--text); }
    .hab-desc { font-size: 10px; color: var(--text-dim); }
    .hab-tags { display: flex; gap: 4px; margin-top: 3px; }
    .htag {
      font-size: 8px; padding: 1px 5px; border-radius: 3px;
      font-weight: 700; letter-spacing: .3px;
    }
    .htag.dano  { background: rgba(255,80,30,.2);  color: #ff9966; border: 1px solid rgba(255,80,30,.3); }
    .htag.sp    { background: rgba(40,140,255,.15); color: #88ccff; border: 1px solid rgba(40,140,255,.25); }
    .htag.type  { background: rgba(200,160,64,.1);  color: var(--gold); border: 1px solid rgba(200,160,64,.2); }

    /* modal body sections */
    .modal-body { padding: 16px 20px 20px; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 6px;
      padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .section-text {
      font-size: 12px; color: var(--text);
      line-height: 1.65;
    }
    .section-text span.em { color: var(--gold); font-style: italic; }

    /* ── CLASS SPRITE SECTION ── */
    .class-sprites-section {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
    }
    .css-title {
      font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }
    .class-sprites-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items: end;
    }
    .cs-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cs-item img {
      width: 100%; height: auto; max-height: 220px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0,0,0,0.25);
      padding: 4px;
    }
    .cs-label {
      font-size: 8px; color: var(--text-dim); letter-spacing: 1px;
      text-transform: uppercase; text-align: center;
    }

    #modal-close {
      display: block; width: calc(100% - 40px); margin: 0 20px 20px;
      padding: 10px; border-radius: 8px;
      background: rgba(200,160,64,0.1);
      border: 1px solid rgba(200,160,64,0.25);
      color: var(--gold); font-family: inherit; font-size: 12px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: background .15s;
    }
    #modal-close:hover { background: rgba(200,160,64,0.2); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold);
    }
    .count-badge { font-size: 10px; color: var(--text-dim); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(200,160,64,0.3); border-radius: 2px; }

    /* ── GURPS STAT BLOCK (enemy modal) ── */
    .gurps-block {
      padding: 10px 20px 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
    }
    .gurps-attrs {
      display: grid; grid-template-columns: repeat(8,1fr); gap: 4px;
      margin-bottom: 8px;
    }
    @media(max-width:420px){ .gurps-attrs { grid-template-columns: repeat(4,1fr); } }
    .ga-pair {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.12);
      border-radius: 5px; padding: 3px 0; text-align: center;
    }
    .ga-pair.hp { border-color: rgba(255,80,60,0.35); background: rgba(255,80,60,0.07); }
    .ga-k { display:block; font-size:7px; color:var(--text-dim); letter-spacing:.5px; text-transform:uppercase; }
    .ga-v { display:block; font-size:14px; font-weight:700; color:var(--gold2); line-height:1.2; }
    .ga-pair.hp .ga-v { color:#ff8888; }
    .gurps-secondary { display:flex; gap:6px; flex-wrap:wrap; }
    .gs-chip {
      font-size:9px; padding:2px 8px; border-radius:10px;
      background:rgba(200,160,64,0.08); color:var(--gold);
      border:1px solid rgba(200,160,64,0.2);
    }
    .en-list { list-style:none; padding:0; margin:4px 0 0; display:flex; flex-direction:column; gap:3px; }
    .en-list li {
      font-size:11px; color:var(--text); padding:3px 8px;
      border-left:2px solid rgba(200,160,64,0.3); line-height:1.4;
    }

    /* ── MAGIAS TAB ── */
    .magias-layout {
      display:flex; gap:16px; align-items:flex-start;
    }
    @media(max-width:600px){ .magias-layout { flex-direction:column; } }

    .magias-sidebar {
      flex:0 0 180px; display:flex; flex-direction:column; gap:12px;
      max-height:calc(100vh - 140px); overflow-y:auto;
    }
    .mg-group-title {
      font-size:8px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--text-dim); padding:4px 8px 2px;
      border-bottom:1px solid var(--border);
    }
    .spell-btn {
      display:flex; align-items:center; gap:7px;
      padding:6px 10px; border-radius:7px; width:100%;
      background:rgba(0,0,0,0.2); border:1px solid var(--border);
      color:var(--text-dim); font-family:inherit; font-size:11px;
      text-align:left; cursor:pointer; transition:all .15s;
    }
    .spell-btn:hover { background:rgba(200,160,64,0.08); color:var(--text); }
    .spell-btn.active {
      background:rgba(200,160,64,0.12); color:var(--gold2);
      border-color:rgba(200,160,64,0.4);
    }
    .spell-btn .sb-icon { font-size:14px; flex-shrink:0; }

    .magias-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }

    #spell-canvas {
      width:100%; border-radius:10px;
      border:1px solid rgba(200,160,64,0.15);
      background:#080606; display:block;
    }

    .spell-info-box {
      background:var(--bg3); border:1px solid var(--border);
      border-radius:10px; padding:14px 16px;
    }
    .si-nome { font-size:16px; color:var(--gold2); margin-bottom:4px; }
    .si-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .si-tag {
      font-size:8px; padding:2px 8px; border-radius:10px;
      background:rgba(200,160,64,0.1); color:var(--gold);
      border:1px solid rgba(200,160,64,0.2);
      letter-spacing:.8px; text-transform:uppercase;
    }
    .si-desc { font-size:12px; color:var(--text); line-height:1.6; }

    .spell-tweaks {
      background:var(--bg3); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px;
      display:grid; grid-template-columns:1fr 1fr; gap:10px;
    }
    .twk-label {
      font-size:9px; letter-spacing:1px; text-transform:uppercase;
      color:var(--text-dim); margin-bottom:4px;
    }
    .twk-row { display:flex; flex-direction:column; }
    input[type=range].twk-range {
      width:100%; accent-color:var(--gold);
    }
    input[type=color].twk-color {
      width:100%; height:28px; border-radius:5px;
      border:1px solid var(--border); cursor:pointer;
      background:none;
    }
    .twk-section-title {
      grid-column:1/-1; font-size:8px; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--text-dim);
      padding-bottom:4px; border-bottom:1px solid var(--border);
    }

    /* ── MOVIMENTAÇÕES TAB ── */
    .mv-wrap {
      max-width:800px; margin:0 auto; padding:20px;
      display:flex; flex-direction:column; gap:32px;
    }
    .mv-sec-title {
      font-size:9px; letter-spacing:2px; text-transform:uppercase;
      color:rgba(200,160,64,0.45);
      border-bottom:1px solid rgba(200,160,64,0.12); padding-bottom:8px; margin-bottom:12px;
    }
    .mv-frames-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .mv-frame-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .mv-frame-label { font-size:9px; color:rgba(200,160,64,0.35); letter-spacing:1px; }
    .mv-spr {
      --fw:362px; --fh:450px; --sc:0.28;
      --dw:calc(var(--fw)*var(--sc)); --dh:calc(var(--fh)*var(--sc));
      width:var(--dw); height:var(--dh);
      background-size:calc(var(--fw)*4*var(--sc)) var(--dh);
      background-repeat:no-repeat;
    }
    /* char selector */
    .mv-selector { display:flex; flex-direction:column; gap:10px; }
    .mv-sel-row  { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .mv-sel-label{ font-size:9px; letter-spacing:1px; color:rgba(200,160,64,0.45); text-transform:uppercase; width:52px; flex-shrink:0; }
    .mv-sel-btn  { padding:4px 10px; font-size:10px; border:1px solid rgba(200,160,64,0.25); border-radius:6px;
                   background:rgba(0,0,0,0.3); color:rgba(200,160,64,0.6); cursor:pointer; transition:all .15s; }

// ── SPELL CANVAS ANIMATION ────────────────────────────────────────────

let _spellRaf = null;
let _spellT   = 0;
let _spellObj = null;

function _animSpell(){
  const canvas = document.getElementById('spell-canvas');
  if(!canvas || !_spellObj) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const A = _spellObj.anim;

  _spellT = (_spellT + 0.007 * A.vel) % 1;
  const t = _spellT;

  // ── Background ─────────────────────────────────────
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#060404';
  ctx.fillRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = 'rgba(80,60,30,0.12)';
  ctx.lineWidth = 1;
  for(let x = 0; x < W; x += 24){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y = 0; y < H; y += 24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cx = 68, cy = H/2 - 2; // caster center
  const tx2 = W - 68, ty2 = H/2 - 2; // target center

  // ── Draw spell effect ──────────────────────────────
  _drawSpellFx(ctx, A, t, cx, cy, tx2, ty2, W, H);

  // ── Caster glyph ──────────────────────────────────
  ctx.font = '34px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🧙', cx, cy);

  // ── Target glyph ──────────────────────────────────
  const targetIcon = (['cura','auto'].includes(A.tipo)) ? '🧙' : '💀';
  ctx.fillText(targetIcon, tx2, ty2);

  // ── Labels ────────────────────────────────────────
  ctx.font = '9px sans-serif';
  ctx.fillStyle = 'rgba(160,130,60,0.5)';
  ctx.textAlign = 'center';
  ctx.fillText('CONJURADOR', cx, H - 8);
  ctx.fillText((['cura','auto'].includes(A.tipo)) ? 'ALIADO' : 'ALVO', tx2, H - 8);

  _spellRaf = requestAnimationFrame(_animSpell);
}

function _drawSpellFx(ctx, A, t, cx, cy, tx, ty, W, H){
  const c1 = A.cor, c2 = A.cor2 || A.cor, r = A.raio;

  // helper: radial gradient fill
  const radFill = (x,y,ri,ro,colorIn,colorOut,alpha=1)=>{
    const g = ctx.createRadialGradient(x,y,ri,x,y,ro);
    g.addColorStop(0, colorIn);
    g.addColorStop(1, colorOut);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,ro,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  };

  // helper: hex color to rgba string
  const hex2rgba = (hex,a)=>{
    const n = parseInt(hex.replace('#',''),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  };

  if(A.tipo === 'projetil'){
    // 0–0.22 casting glow, 0.22–0.65 travel, 0.65–0.88 impact, 0.88–1 fade
    if(t < 0.22){
      const p = t/0.22;
      radFill(cx,cy, 0, r*0.45*p, hex2rgba(c1,0.9), hex2rgba(c1,0), p*0.8);
      // charging sparks
      for(let i=0;i<5;i++){
        const a = (i/5)*Math.PI*2 + t*20;
        const sr = 20*p; const sx=cx+Math.cos(a)*sr, sy=cy+Math.sin(a)*sr;
        radFill(sx,sy,0,4,hex2rgba(c2,0.9),hex2rgba(c2,0),p);
      }
    } else if(t < 0.65){
      const p = (t-0.22)/0.43;
      const px = cx + (tx-cx)*p, py = cy + (ty-cy)*p;
      // trail
      for(let i=5;i>0;i--){
        const tp = Math.max(0, p - i*0.06);
        const trx = cx+(tx-cx)*tp, try2 = cy+(ty-cy)*tp;
        radFill(trx,try2, 0, r*0.18*(i/5), hex2rgba(c1,0.7), hex2rgba(c1,0), (i/5)*0.5);
      }
      // head
      radFill(px,py, 0, r*0.22, '#ffffff', hex2rgba(c1,0.9), 1);
      radFill(px,py, r*0.22, r*0.36, hex2rgba(c1,0.8), hex2rgba(c1,0), 1);
    } else if(t < 0.88){
      const p = (t-0.65)/0.23;
      radFill(tx,ty, 0, r*p,     '#ffffff',       hex2rgba(c1,0), (1-p)*0.9+0.1);
      radFill(tx,ty, 0, r*p*0.6, hex2rgba(c2,0.8),hex2rgba(c2,0),(1-p*0.7));
      ctx.strokeStyle = c1; ctx.lineWidth = 2;
      ctx.globalAlpha = (1-p)*0.6;
      ctx.beginPath(); ctx.arc(tx,ty,r*p*1.3,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

  } else if(A.tipo === 'area'){
    // 0–0.3 cast, 0.3–0.75 expand, 0.75–1 fade
    const cx2 = (cx+tx)/2, cy2 = (cy+ty)/2; // area centered between
    if(t < 0.3){
      const p = t/0.3;
      radFill(cx,cy, 0, 28*p, hex2rgba(c1,0.7), hex2rgba(c1,0), p);
    } else if(t < 0.75){
      const p = (t-0.3)/0.45;
      const er = r*p;
      radFill(cx2,cy2, 0, er, hex2rgba(c1,0.18), hex2rgba(c1,0), 1);
      ctx.strokeStyle = c1; ctx.lineWidth = 2;
      ctx.globalAlpha = 1-p*0.7;
      ctx.beginPath(); ctx.arc(cx2,cy2,er,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
      if(p>0.3){
        ctx.strokeStyle = c2; ctx.lineWidth = 1;
        ctx.globalAlpha = (p-0.3)*0.7;
        ctx.beginPath(); ctx.arc(cx2,cy2,er*0.6,0,Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else {
      const p = (t-0.75)/0.25;
      radFill(cx2,cy2, 0, r*(1+p*0.3), hex2rgba(c1,0.1*(1-p)), hex2rgba(c1,0), 1-p);
    }

  } else if(A.tipo === 'auto'){
    // pulsing shield around caster
    const pulse = 0.5+0.5*Math.sin(t*Math.PI*6);
    const sr = r*0.55 + pulse*6;
    radFill(cx,cy, sr-4, sr+16, hex2rgba(c1,0.6), hex2rgba(c1,0), 1);
    ctx.strokeStyle = c1; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.5+pulse*0.4;
    ctx.beginPath(); ctx.arc(cx,cy,sr,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    // expansion ring
    const rr = r*0.55 + (t%0.5)*r*1.6;
    ctx.strokeStyle = c2; ctx.lineWidth = 1.5;
    ctx.globalAlpha = Math.max(0, 0.6 - (t%0.5)*2);
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;

  } else if(A.tipo === 'drain'){
    // 0–0.2 target glows, 0.2–0.8 particles flow target→caster, 0.8–1 absorb
    if(t < 0.2){
      const p = t/0.2;
      radFill(tx,ty, 0, 30*p, hex2rgba(c1,0.8), hex2rgba(c1,0), p);
    } else if(t < 0.8){
      const prog = (t-0.2)/0.6;
      for(let i=0;i<7;i++){
        const phase = ((i/7) + prog) % 1;
        const px2 = tx + (cx-tx)*phase;
        const py2 = ty + (cy-ty)*phase + Math.sin(phase*Math.PI*5)*(10*(1-phase));
        const a2 = Math.sin(phase*Math.PI)*0.9;
        radFill(px2,py2, 0, 6, hex2rgba(c1,a2), hex2rgba(c1,0), a2);
      }
      radFill(cx,cy, 0, 22*prog, hex2rgba(c2,0.6), hex2rgba(c2,0), prog*0.8);
    } else {
      const p = (t-0.8)/0.2;
      radFill(cx,cy, 0, r*0.4*(1-p), hex2rgba(c1,0.8), hex2rgba(c1,0), 1-p);
    }

  } else if(A.tipo === 'onda'){
    // cast + concentric rings moving caster→target
    if(t < 0.25){
      radFill(cx,cy, 0, 24*(t/0.25), hex2rgba(c1,0.7), hex2rgba(c1,0), t/0.25);
    } else {
      const prog = (t-0.25)/0.75;
      for(let i=0;i<4;i++){
        const rp = (prog + i*0.22) % 1;
        const rx2 = cx + (tx-cx)*rp, ry2 = cy + (ty-cy)*rp;
        const ringR = 16*(1-rp*0.5);
        ctx.strokeStyle = c1; ctx.lineWidth = 2;
        ctx.globalAlpha = (1-rp)*0.85;
        ctx.save();
        ctx.translate(rx2,ry2); ctx.scale(0.28,1);
        ctx.beginPath(); ctx.arc(0,0,ringR,0,Math.PI*2); ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

  } else if(A.tipo === 'raio'){
    // instant beam flashing caster→target
    const flash = Math.abs(Math.sin(t*Math.PI*3));
    ctx.strokeStyle = c1; ctx.lineWidth = r*0.18;
    ctx.globalAlpha = flash * 0.85;
    ctx.shadowBlur = 16; ctx.shadowColor = c2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.globalAlpha = flash * 0.4;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.globalAlpha = 1;

  } else if(A.tipo === 'cura'){
    // green light expands from caster toward target
    if(t < 0.25){
      const p = t/0.25;
      radFill(cx,cy, 0, 30*p, hex2rgba(c1,0.8), hex2rgba(c1,0), p);
    } else if(t < 0.7){
      const p = (t-0.25)/0.45;
      // rising crosses (particles)
      for(let i=0;i<6;i++){
        const phase = ((i/6)+p) % 1;
        const px2 = cx + (tx-cx)*phase + Math.sin(phase*15+i)*8;
        const py2 = cy + (ty-cy)*phase - phase*20;
        ctx.fillStyle = hex2rgba(c2, Math.sin(phase*Math.PI)*0.9);
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+', px2, py2);
      }
      radFill(tx,ty, 0, 28*p, hex2rgba(c1,0.5), hex2rgba(c1,0), p*0.8);
    } else {
      const p = (t-0.7)/0.3;
      radFill(tx,ty, 0, r*0.5*(1-p), hex2rgba(c2,0.9), hex2rgba(c2,0), 1-p);
    }

  } else if(A.tipo === 'pulso'){
    // expanding pulse rings from caster outward
    for(let i=0;i<3;i++){
      const pt = (t + i/3) % 1;
      const er = r*1.2*pt;
      ctx.strokeStyle = c1; ctx.lineWidth = 2;
      ctx.globalAlpha = (1-pt)*0.7;
      ctx.beginPath(); ctx.arc(cx,cy,er,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    radFill(cx,cy, 0, 28, hex2rgba(c1,0.5), hex2rgba(c1,0), 0.4+0.3*Math.sin(t*Math.PI*4));

  } else if(A.tipo === 'ilusao'){
    // shimmer: flickering copies offset from caster to target
    const ghost = Math.abs(Math.sin(t*Math.PI*4));
    for(let i=0;i<3;i++){
      const off = (i-1)*12*(1-ghost);
      ctx.globalAlpha = ghost * 0.4;
      ctx.font = '34px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🧙', tx+off, ty);
    }
    ctx.globalAlpha = 1;
    const sr2 = 36 + Math.sin(t*Math.PI*5)*6;
    ctx.strokeStyle = c1; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.globalAlpha = 0.5+ghost*0.4;
    ctx.beginPath(); ctx.arc(tx,ty,sr2,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

  } else if(A.tipo === 'invocacao'){
    // summon circle beneath target that pulses up
    const ring = 30 + Math.sin(t*Math.PI*3)*6;
    ctx.strokeStyle = c1; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(tx,ty+10,ring,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<6;i++){
      const a = (i/6)*Math.PI*2 + t*Math.PI;
      const lx = tx+Math.cos(a)*ring, ly = ty+10+Math.sin(a)*ring;
      ctx.strokeStyle = c2; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tx,ty+10); ctx.lineTo(lx,ly); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    radFill(tx,ty+10, 0, ring*0.5, hex2rgba(c1,0.3), hex2rgba(c1,0), Math.abs(Math.sin(t*Math.PI*2)));

  } else if(A.tipo === 'glifo'){
    // rune draws then explodes
    if(t < 0.5){
      const p = t/0.5;
      // draw triangle rune progressively
      const gr = 35;
      const pts = [[tx,ty-gr],[tx+gr*0.87,ty+gr*0.5],[tx-gr*0.87,ty+gr*0.5]];
      ctx.strokeStyle = c1; ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.8;
      const totalLen = 3;
      const drawn = p * totalLen;
      for(let seg=0;seg<3;seg++){
        if(drawn < seg) break;
        const segP = Math.min(1,(drawn-seg));
        const p1 = pts[seg], p2 = pts[(seg+1)%3];
        ctx.beginPath(); ctx.moveTo(p1[0],p1[1]);
        ctx.lineTo(p1[0]+(p2[0]-p1[0])*segP, p1[1]+(p2[1]-p1[1])*segP);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      const p = (t-0.5)/0.5;
      radFill(tx,ty, 0, r*p, '#ffffff', hex2rgba(c1,0), (1-p)*0.95);
      ctx.strokeStyle = c2; ctx.lineWidth = 2;
      ctx.globalAlpha = (1-p)*0.6;
      ctx.beginPath(); ctx.arc(tx,ty,r*p*1.4,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function _startSpellAnim(spell){
  if(_spellRaf) cancelAnimationFrame(_spellRaf);
  _spellT = 0;
  _spellObj = spell;

}

window.selectSpell = function(id){
  const sp = MAGIAS_DATA.find(m=>m.id===id);
  if(!sp) return;
  _spellObj = JSON.parse(JSON.stringify(sp)); // working copy

  // Update sidebar highlight
  document.querySelectorAll('.spell-btn').forEach(b=>b.classList.toggle('active', b.dataset.sid===id));

  // Update info box
  const info = document.getElementById('spell-info');
  info.innerHTML = `
    <div class="si-nome">${sp.icon} ${sp.nome}</div>
    <div class="si-tags">
      <span class="si-tag">${sp.escola}</span>
      <span class="si-tag">${sp.fonte}</span>
      <span class="si-tag">${sp.anim.tipo}</span>
    </div>
    <div class="si-desc">${sp.desc}</div>`;

  // Update tweaks
  const tweaks = document.getElementById('spell-tweaks');
  tweaks.style.display = '';
  document.getElementById('twk-vel').value  = sp.anim.vel;
  document.getElementById('twk-raio').value = sp.anim.raio;
  document.getElementById('twk-cor1').value = sp.anim.cor;
  document.getElementById('twk-cor2').value = sp.anim.cor2 || sp.anim.cor;

  _startSpellAnim(_spellObj);
};

window._twkUpdate = function(){
  if(!_spellObj) return;
  _spellObj.anim.vel  = parseFloat(document.getElementById('twk-vel').value);
  _spellObj.anim.raio = parseFloat(document.getElementById('twk-raio').value);
  _spellObj.anim.cor  = document.getElementById('twk-cor1').value;
  _spellObj.anim.cor2 = document.getElementById('twk-cor2').value;
};

    img.src = portraitUrl(id, gender);
    img.style.display = '';

  ['m','f'].forEach(g=>{

    if(btn) btn.classList.toggle('active', g===gender);
  });
};

      <img src="../maps/feira-limpa.png" id="mv-map-img" style="display:block;width:100%;height:auto;user-select:none" draggable="false" alt="Mapa">

  const allMvSprites = tab.querySelectorAll('.mv-spr');
  const mvRunner = document.getElementById('mv-runner');
  const mvScene  = document.getElementById('mv-scene');
  let mvFps=8, mvEscala=28, mvTravSec=4;
  let mvTravDir=1, mvTravX=-160, mvLastSceneTime=null;

  // ── character selector ──────────────────────────────────────────────
  let mvCurCls='mago', mvCurGen='m';
  const FRAME_W_MAP = MV_SPRITES; // alias used later for map calc

  function mvSetSprite(key){
    const d = MV_SPRITES[key];
    if(!d) return;
    const url = `./assets/sprites/${key}_run.png`;
    const sc = mvEscala/100;
    allMvSprites.forEach(el=>{
      el.style.backgroundImage = `url('${url}')`;
      el.style.setProperty('--fw', d.fw+'px');
      el.style.setProperty('--fh', d.fh+'px');
      el.style.backgroundSize = (d.fw*4*sc)+'px '+(d.fh*sc)+'px';
      el.style.width  = (d.fw*sc)+'px';
      el.style.height = (d.fh*sc)+'px';
    });
    // update static frame previews (f0–f3)
    const classMap = {f0:0,f1:1,f2:2,f3:3};
    allMvSprites.forEach(el=>{
      for(const [cls,n] of Object.entries(classMap)){
        if(el.classList.contains(cls)){
          el.style.backgroundPositionX = -(d.fw*sc*n)+'px';
          break;
        }
      }
    });
    const mapRunner = document.getElementById('mv-map-runner');
    if(mapRunner) mapRunner.style.backgroundImage = `url('${url}')`;
    mvCurFW = d.fw; mvCurFH = d.fh;
    mvSceneFrIdx = 0;
    mvTravX = -160;
  }
  let mvCurFW = MV_SPRITES['mago_m'].fw;
  let mvCurFH = MV_SPRITES['mago_m'].fh;
  let mvSceneFrIdx=0, mvSceneLastFrTime=0;

  tab.querySelectorAll('.mv-cls-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      tab.querySelectorAll('.mv-cls-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mvCurCls = btn.dataset.cls;
      mvSetSprite(mvCurCls+'_'+mvCurGen);
    });
  });
  tab.querySelectorAll('.mv-gen-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      tab.querySelectorAll('.mv-gen-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mvCurGen = btn.dataset.gen;
      mvSetSprite(mvCurCls+'_'+mvCurGen);
    });
  });
  // set initial active buttons + sprite
  if(tab.querySelector){
    tab.querySelector('.mv-cls-btn[data-cls="mago"]').classList.add('active');
    tab.querySelector('.mv-gen-btn[data-gen="m"]').classList.add('active');
  }
  mvSetSprite('mago_m');

  // all .mv-spr.anim elements (live preview + scene runner)
  const mvAnimEls = Array.from(tab.querySelectorAll('.mv-spr.anim'));

  function applyMvAll(){
    const sc=mvEscala/100;
    allMvSprites.forEach(el=>el.style.setProperty('--sc',sc));
    // update static frame previews background-size/position via --sc
    document.getElementById('mv-fps-val').textContent    = mvFps+' fps';
    document.getElementById('mv-escala-val').textContent = mvEscala+'%';
    document.getElementById('mv-trav-val').textContent   = mvTravSec+' s';
  }

  function animMvScene(ts){
    if(!mvLastSceneTime) mvLastSceneTime=ts;
    const dt=(ts-mvLastSceneTime)/1000; mvLastSceneTime=ts;
    const sc = mvEscala/100;
    const sprW = mvCurFW * sc;
    const sceneW = mvScene.clientWidth||400;
    const speed = (sceneW+sprW*2)/mvTravSec;
    mvTravX += speed*mvTravDir*dt;
    if(mvTravDir===1  && mvTravX> sceneW+sprW){ mvTravDir=-1; mvTravX=sceneW+sprW; }
    if(mvTravDir===-1 && mvTravX<-sprW)       { mvTravDir=1;  mvTravX=-sprW; }
    mvRunner.style.left      = mvTravX+'px';
    mvRunner.style.transform = mvTravDir===-1 ? 'scaleX(-1)' : 'none';
    // JS frame cycling — works in all browsers
    if(ts - mvSceneLastFrTime >= 1000/mvFps){
      mvSceneLastFrTime = ts;
      mvSceneFrIdx = (mvSceneFrIdx+1) % 4;
      const bpx = -(mvCurFW * sc * mvSceneFrIdx) + 'px';
      mvAnimEls.forEach(el => el.style.backgroundPositionX = bpx);
    }
    _mvSceneRaf=requestAnimationFrame(animMvScene);
  }

  document.getElementById('mv-fps').addEventListener('input',e=>{mvFps=parseInt(e.target.value);applyMvAll();});
  document.getElementById('mv-escala').addEventListener('input',e=>{mvEscala=parseInt(e.target.value);applyMvAll();});
  document.getElementById('mv-trav').addEventListener('input',e=>{mvTravSec=parseFloat(e.target.value);applyMvAll();});
  applyMvAll();

  // ── Mapa hex ─────────────────────────────────────────────────────────
  const HR=55,CS=82,RS=95,OOFF=48,GX0=47,GY0=80,COLS=13,ROWS=13;
  const MAP_W=1086,FRAMES=4;
  const mvMapWrap   = document.getElementById('mv-map-wrap');
  const mvMapCanvas = document.getElementById('mv-hex-canvas');
  const mvMapRunner = document.getElementById('mv-map-runner');
  const mvStepInp   = document.getElementById('mv-map-step');
  const mvStepVal   = document.getElementById('mv-map-step-val');
  const mvScInp     = document.getElementById('mv-map-sc');
  const mvScVal     = document.getElementById('mv-map-sc-val');
  let mvStepDur=0.8, mvSprSc=0.16, mvCurCol=6, mvCurRow=6, mvFrIdx=0, mvLastFrTime=0;

  function mvMS(){ return mvMapWrap.getBoundingClientRect().width/MAP_W; }
  function mvCtr(c,r){ const s=mvMS(); return{x:(GX0+c*CS)*s,y:(GY0+r*RS+(c%2===1?OOFF:0))*s}; }
  function mvViz(c,r){
    const o=c%2===1;
    return(o?[[c+1,r+1],[c-1,r],[c,r+1],[c,r-1],[c+1,r],[c-1,r+1]]:
             [[c+1,r],[c-1,r-1],[c,r+1],[c,r-1],[c+1,r-1],[c-1,r]])
      .filter(([a,b])=>a>=0&&a<COLS&&b>=0&&b<ROWS);
  }
  function mvDrawGrid(){
    const rect=mvMapWrap.getBoundingClientRect(); const s=rect.width/MAP_W; const hr=HR*s;
    mvMapCanvas.width=Math.round(rect.width); mvMapCanvas.height=Math.round(rect.height);
    const ctx=mvMapCanvas.getContext('2d');
    ctx.clearRect(0,0,mvMapCanvas.width,mvMapCanvas.height);
    ctx.strokeStyle='rgba(200,160,64,0.20)'; ctx.lineWidth=0.8;
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
      const{x,y}=mvCtr(c,r); ctx.beginPath();
      for(let i=0;i<6;i++){const a=Math.PI/3*i;i===0?ctx.moveTo(x+hr*Math.cos(a),y+hr*Math.sin(a)):ctx.lineTo(x+hr*Math.cos(a),y+hr*Math.sin(a));}
      ctx.closePath(); ctx.stroke();
    }
  }
  function mvPlace(c,r,fl,instant){
    const{x,y}=mvCtr(c,r); const fw=mvCurFW*mvSprSc,fh=mvCurFH*mvSprSc;
    mvMapRunner.style.width=fw+'px'; mvMapRunner.style.height=fh+'px';
    mvMapRunner.style.backgroundSize=(fw*FRAMES)+'px '+fh+'px';
    mvMapRunner.style.transition=instant?'none':'left '+(mvStepDur*0.92)+'s linear,top '+(mvStepDur*0.92)+'s linear';
    mvMapRunner.style.left=(x-fw/2)+'px'; mvMapRunner.style.top=(y-fh*0.88)+'px';
    mvMapRunner.style.transform=fl?'scaleX(-1)':'none';
  }
  function mvAnimFr(ts){
    if(ts-mvLastFrTime>=1000/mvFps){ mvLastFrTime=ts; mvFrIdx=(mvFrIdx+1)%FRAMES; mvMapRunner.style.backgroundPositionX=(-(mvCurFW*mvSprSc)*mvFrIdx)+'px'; }
    _mvMapRaf=requestAnimationFrame(mvAnimFr);
  }
  function mvNext(){
    const opts=mvViz(mvCurCol,mvCurRow); const[nc,nr]=opts[Math.floor(Math.random()*opts.length)];
    mvPlace(nc,nr,nc<mvCurCol,false); mvCurCol=nc; mvCurRow=nr;
    _mvMapTimer=setTimeout(mvNext,mvStepDur*1000);
  }
  function mvApply(){
    mvStepDur=parseFloat(mvStepInp.value); mvSprSc=parseFloat(mvScInp.value)/100;
    mvStepVal.textContent=mvStepDur.toFixed(1)+' s'; mvScVal.textContent=Math.round(mvSprSc*100)+'%';
    mvDrawGrid(); mvPlace(mvCurCol,mvCurRow,false,true);
  }
  mvStepInp.addEventListener('input',mvApply);
  mvScInp.addEventListener('input',mvApply);
  if(window.addEventListener) window.addEventListener('resize',()=>{
    if(document.getElementById('movimentacoes-tab').classList.contains('active')){ mvDrawGrid(); mvPlace(mvCurCol,mvCurRow,false,true); }
  });

  let _mvMapInited=false;

  _mvOnActivate=function(){
    mvLastSceneTime=null;
    if(!_mvSceneRaf) _mvSceneRaf=requestAnimationFrame(animMvScene);
    if(!_mvMapInited){
      _mvMapInited=true;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        mvApply(); mvPlace(mvCurCol,mvCurRow,false,true);
        _mvMapTimer=setTimeout(mvNext,mvStepDur*1000);
        _mvMapRaf=requestAnimationFrame(mvAnimFr);
      }));
    } else {
      if(!_mvMapRaf)   _mvMapRaf=requestAnimationFrame(mvAnimFr);
      if(!_mvMapTimer) _mvMapTimer=setTimeout(mvNext,mvStepDur*1000);
    }
  };
  _mvOnDeactivate=function(){
    if(_mvSceneRaf){cancelAnimationFrame(_mvSceneRaf);_mvSceneRaf=null;}
    if(_mvMapRaf){cancelAnimationFrame(_mvMapRaf);_mvMapRaf=null;}
    if(_mvMapTimer){clearTimeout(_mvMapTimer);_mvMapTimer=null;}
  };
}

// ── TABS ──────────────────────────────────────────────────────────────

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`${tab}-tab`).classList.add('active');
    document.getElementById('filter-bar').style.display = tab==='npcs' ? 'flex' : 'none';
    // stop spell animation when leaving magias tab
    if(tab !== 'magias' && _spellRaf){ cancelAnimationFrame(_spellRaf); _spellRaf=null; }
    if(tab === 'magias' && _spellObj){ _startSpellAnim(_spellObj); }
    // pause/resume movimentacoes animations
    if(tab !== 'movimentacoes' && _mvOnDeactivate) _mvOnDeactivate();
    if(tab === 'movimentacoes' && _mvOnActivate)   _mvOnActivate();
    updateCount(tab);
  });
});

// ── NPC FILTER ────────────────────────────────────────────────────────

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('#npc-grid .card').forEach(card=>{
      const cat = card.dataset.cat;
      card.style.display = (f==='todos' || cat===f) ? '' : 'none';
    });
  });
});

// ── COUNT LABEL ──────────────────────────────────────────────────────

function updateCount(tab){
  const labels = {
    classes: `${Object.keys(CLASSES_DATA).length} classes`,
    npcs:    `${Object.keys(NPCS).length} personagens`,
    inimigos:`${INIMIGOS_DATA.length} criaturas`,
    magias:        `${MAGIAS_DATA.length} magias`,
    movimentacoes: '12 sprites',
  };
  document.getElementById('count-label').textContent = labels[tab]||'';
}

// ── INIT ──────────────────────────────────────────────────────────────

buildClassesTab();
buildNpcsTab();
buildInimigosTab();
buildMagiasTab();
buildMovimentacoesTab();
updateCount('classes');
</script>
