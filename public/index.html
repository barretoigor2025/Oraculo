<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Salas</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#050302;font-family:Georgia,serif;color:#e8d5a8;}
body{
  min-height:100vh;
  background:
    linear-gradient(to bottom, rgba(3,1,0,0.30) 0%, rgba(3,1,0,0.62) 55%, rgba(3,1,0,0.90) 100%),
    url('catalogo/mhoried/cenarios/conversacao/castelo_mhoried/imagem/castelo_ext.png') center/cover no-repeat fixed;
  display:flex; flex-direction:column; align-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  gap:22px;
}
#header{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px;text-align:center;}
#header-icon{font-size:42px;}
#titulo{font-size:clamp(32px,10vw,52px);font-weight:700;letter-spacing:10px;text-transform:uppercase;color:#f5d878;text-shadow:0 0 40px rgba(245,216,120,0.35),0 2px 12px rgba(0,0,0,0.9);}
#subtitulo{font-size:clamp(11px,3vw,14px);letter-spacing:2px;color:rgba(200,175,100,0.60);font-style:italic;}

.card{
  width:100%;max-width:420px;
  background:rgba(7,4,1,0.82);border:1px solid rgba(190,140,35,0.30);
  border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;
  backdrop-filter:blur(12px);
}
.card-tit{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(190,140,35,0.55);}
.lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(190,140,35,0.40);}

input{
  background:rgba(20,12,4,0.90);border:1px solid rgba(190,140,35,0.28);border-radius:10px;
  padding:11px 14px;color:#e8d5a8;font-family:Georgia,serif;font-size:15px;outline:none;width:100%;
  transition:border-color .2s;
}
input::placeholder{color:rgba(190,165,90,0.32);}
input:focus{border-color:rgba(190,140,35,0.58);}
#codigo-input{text-transform:uppercase;letter-spacing:3px;font-weight:700;text-align:center;}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.btn-classe,.btn-camp{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;
  background:rgba(20,12,4,0.80);border:1px solid rgba(190,140,35,0.18);border-radius:12px;
  color:rgba(200,175,100,0.48);font-family:Georgia,serif;font-size:11px;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;
}
.btn-classe .cl-emoji,.btn-camp .cl-emoji{font-size:20px;}
.btn-classe:hover,.btn-camp:hover{background:rgba(50,30,5,0.80);border-color:rgba(190,140,35,0.38);}
.btn-classe.selecionado,.btn-camp.selecionado{background:rgba(190,140,35,0.16);border-color:rgba(190,140,35,0.70);color:#f5d878;box-shadow:0 0 12px rgba(190,140,35,0.18);}
.btn-camp.disabled{opacity:.35;pointer-events:none;}
.btn-camp .cl-emoji{font-size:18px;}
.camp-soon{font-size:8px;color:rgba(190,140,35,0.5);letter-spacing:1px;}

.btn-acao{
  width:100%;padding:14px;border:none;border-radius:12px;font-family:Georgia,serif;
  font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:filter .15s;
}
.btn-acao:active{filter:brightness(1.15);}
.btn-ouro{background:rgba(190,140,35,0.22);border:1px solid rgba(220,170,50,0.55);color:#f5d878;}
.btn-entrar{background:rgba(30,60,40,0.4);border:1px solid rgba(90,160,110,0.45);color:#9fe0b8;}
.linha-codigo{display:flex;gap:8px;}
.linha-codigo input{flex:1;}
.linha-codigo .btn-acao{width:auto;padding:14px 18px;}

#erro{font-size:12px;color:#e88; text-align:center; min-height:14px; letter-spacing:.3px;}
.ou{display:flex;align-items:center;gap:10px;color:rgba(190,140,35,0.4);font-size:9px;letter-spacing:2px;text-transform:uppercase;}
.ou::before,.ou::after{content:'';flex:1;height:1px;background:rgba(190,140,35,0.18);}

#footer{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(190,140,35,0.22);padding-bottom:4px;}

/* overlay entrando */
#entrando-overlay{position:fixed;inset:0;z-index:1000;background:#050302;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .35s ease;}
#entrando-overlay.visivel{opacity:1;pointer-events:all;}
.ent-castle{font-size:56px;}
.ent-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(190,140,35,0.50);}
.ent-cod{font-size:clamp(22px,7vw,30px);font-weight:700;color:#f5d878;letter-spacing:4px;}
.ent-char{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px;}
.ent-emoji{font-size:34px;}
.ent-nome{font-size:clamp(16px,5vw,20px);font-weight:700;color:#f5d878;}
.ent-classe{font-size:10px;color:rgba(200,175,100,0.50);letter-spacing:2px;text-transform:uppercase;}
.ent-dots{display:flex;gap:8px;margin-top:10px;}
.ent-dot{width:7px;height:7px;border-radius:50%;background:rgba(190,140,35,0.35);animation:edot 1.2s ease-in-out infinite;}
.ent-dot:nth-child(2){animation-delay:.22s;}.ent-dot:nth-child(3){animation-delay:.44s;}
@keyframes edot{0%,100%{opacity:0.25;transform:scale(0.72);}50%{opacity:1;transform:scale(1.18);}}
</style>
</head>
<body>

<div id="header">
  <div id="header-icon">🔮</div>
  <div id="titulo">ORÁCULO</div>
  <div id="subtitulo">Crie ou entre numa sala para jogar</div>
</div>

<div class="card">
  <div class="card-tit">Campanha</div>
  <div class="grid3" id="camp-grid">
    <button class="btn-camp" data-id="mhoried"><span class="cl-emoji">⚔️</span>Mhoried</button>
    <button class="btn-camp disabled" data-id="death-note"><span class="cl-emoji">📓</span>Death Note<span class="camp-soon">em breve</span></button>
    <button class="btn-camp disabled" data-id="fantasma"><span class="cl-emoji">👻</span>Fantasma<span class="camp-soon">em breve</span></button>
  </div>

  <div class="card-tit" style="margin-top:4px">Seu Aventureiro</div>
  <input id="nome-input" type="text" placeholder="Nome do aventureiro…" autocomplete="off" spellcheck="false">
  <div class="lbl">Escolha sua classe</div>
  <div class="grid3" id="classes-grid">
    <button class="btn-classe" data-id="guerreiro"><span class="cl-emoji">⚔️</span>Guerreiro</button>
    <button class="btn-classe" data-id="mago"><span class="cl-emoji">🔮</span>Mago</button>
    <button class="btn-classe" data-id="clerigo"><span class="cl-emoji">✝️</span>Clérigo</button>
    <button class="btn-classe" data-id="ladino"><span class="cl-emoji">🗡️</span>Ladino</button>
    <button class="btn-classe" data-id="arqueiro"><span class="cl-emoji">🏹</span>Arqueiro</button>
    <button class="btn-classe" data-id="druida"><span class="cl-emoji">🌿</span>Druida</button>
  </div>
</div>

<div class="card">
  <div class="card-tit">Sala</div>
  <button class="btn-acao btn-ouro" id="btn-criar">🎲 Criar Sala Nova</button>
  <div class="ou">ou entre com um código</div>
  <div class="linha-codigo">
    <input id="codigo-input" type="text" placeholder="MHO-XXXX" maxlength="8" autocomplete="off" spellcheck="false">
    <button class="btn-acao btn-entrar" id="btn-entrar">Entrar</button>
  </div>
  <div id="erro"></div>
</div>

<div id="footer">Oráculo — Multiplayer por sala</div>

<div id="entrando-overlay">
  <div class="ent-castle">🏰</div>
  <div class="ent-label" id="ent-label">Entrando na sala</div>
  <div class="ent-cod" id="ent-cod">—</div>
  <div class="ent-char">
    <div class="ent-emoji" id="ent-emoji">⚔️</div>
    <div class="ent-nome" id="ent-nome">—</div>
    <div class="ent-classe" id="ent-classe">—</div>
  </div>
  <div class="ent-dots"><div class="ent-dot"></div><div class="ent-dot"></div><div class="ent-dot"></div></div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// Config Firebase (mesmo projeto do lobby antigo)
const FB_CONFIG = {
  apiKey: 'AIzaSyDaMymxJBFo9zaPuflFwhh14fslaaeh324',
  authDomain: 'oraculo-rpg-dadfe.firebaseapp.com',
  projectId: 'oraculo-rpg-dadfe',
  storageBucket: 'oraculo-rpg-dadfe.firebasestorage.app',
  messagingSenderId: '287997672755',
  appId: '1:287997672755:web:9094e22e975696dcdc9246',
};
const app = getApps().length ? getApp() : initializeApp(FB_CONFIG);
const db = getFirestore(app);

// Campanhas: prefixo do código + 1ª cena. (narration.html hoje joga 'mhoried'.)
const CAMPANHAS = {
  mhoried:      { prefixo:'MHO', primeiraCena:'mhoried_market' },
  'death-note': { prefixo:'DN',  primeiraCena:'mhoried_market' },
  fantasma:     { prefixo:'FAN', primeiraCena:'mhoried_market' },
};
const CLASS_EMOJI  = {guerreiro:'⚔️',mago:'🔮',clerigo:'✝️',ladino:'🗡️',arqueiro:'🏹',druida:'🌿'};
const CLASS_LABELS = {guerreiro:'Guerreiro',mago:'Mago',clerigo:'Clérigo',ladino:'Ladino',arqueiro:'Arqueiro',druida:'Druida'};

let campSel = 'mhoried';
let classeSel = '';

const nomeInput = document.getElementById('nome-input');
const codInput  = document.getElementById('codigo-input');
const erroEl    = document.getElementById('erro');

// pré-preencher
nomeInput.value = localStorage.getItem('oraculo.playerName') || '';
classeSel = localStorage.getItem('oraculo.classId') || '';
document.querySelectorAll('.btn-classe').forEach(b => b.classList.toggle('selecionado', b.dataset.id === classeSel));

document.getElementById('camp-grid').querySelectorAll('.btn-camp:not(.disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    campSel = btn.dataset.id;
    document.querySelectorAll('.btn-camp').forEach(b => b.classList.toggle('selecionado', b === btn));
  });
});
// marca mhoried como selecionada por padrão
document.querySelector('.btn-camp[data-id="mhoried"]').classList.add('selecionado');

document.querySelectorAll('.btn-classe').forEach(btn => {
  btn.addEventListener('click', () => {
    classeSel = btn.dataset.id;
    document.querySelectorAll('.btn-classe').forEach(b => b.classList.toggle('selecionado', b === btn));
  });
});

function pid() {
  let p = localStorage.getItem('oraculo.playerId');
  if (!p) { p = 'p_' + Math.random().toString(36).slice(2,10); localStorage.setItem('oraculo.playerId', p); }
  return p;
}
function gerarCodigo(camp) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem I,O,0,1
  let s = ''; for (let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return (CAMPANHAS[camp]?.prefixo || 'ORA') + '-' + s;
}
function salvarIdentidade(camp, code, host) {
  localStorage.setItem('oraculo.fbConfig', JSON.stringify(FB_CONFIG));
  localStorage.setItem('oraculo.roomId', code);
  localStorage.setItem('oraculo.isHost', host ? '1' : '0');
  localStorage.setItem('oraculo.campaign', camp);
  localStorage.setItem('oraculo.playerName', nomeInput.value.trim() || 'Aventureiro');
  localStorage.setItem('oraculo.classId', classeSel || 'guerreiro');
}
function irParaJogo(code) {
  document.getElementById('ent-emoji').textContent = CLASS_EMOJI[classeSel||'guerreiro'] || '⚔️';
  document.getElementById('ent-nome').textContent  = nomeInput.value.trim() || 'Aventureiro';
  document.getElementById('ent-classe').textContent = CLASS_LABELS[classeSel||'guerreiro'] || '';
  document.getElementById('ent-cod').textContent = code;
  document.getElementById('entrando-overlay').classList.add('visivel');
  setTimeout(() => { window.location.href = 'narration.html?v=8'; }, 1500);
}
function erro(msg) { erroEl.textContent = msg; }

function jogadorObj() {
  return { id: pid(), nome: nomeInput.value.trim() || 'Aventureiro', classId: classeSel || 'guerreiro' };
}

// ── Criar sala ──
document.getElementById('btn-criar').addEventListener('click', async () => {
  erro('');
  if (!classeSel) { erro('Escolha uma classe primeiro.'); return; }
  const camp = campSel;
  const cena = CAMPANHAS[camp]?.primeiraCena || 'prologo';
  const me = jogadorObj();
  let code, tentativas = 0;
  try {
    // gera um código livre
    do {
      code = gerarCodigo(camp);
      const ex = await getDoc(doc(db, 'rooms', code));
      if (!ex.exists()) break;
    } while (++tentativas < 6);
    document.getElementById('ent-label').textContent = 'Criando a sala';
    await setDoc(doc(db, 'rooms', code), {
      campaign: camp,
      status: 'narration',
      host: me.id,
      players: { [me.id]: me },
      narration: { cenaId: cena, dialogo: [], modoImagem: 'exterior', introConfirmados: {}, introIdx: 0 },
      cenasVisitadas: [],
      criadaEm: Date.now(),
    });
    salvarIdentidade(camp, code, true);
    irParaJogo(code);
  } catch (e) {
    console.error(e);
    erro('Não foi possível criar a sala (Firebase). Tente de novo.');
  }
});

// ── Entrar com código ──
document.getElementById('btn-entrar').addEventListener('click', async () => {
  erro('');
  if (!classeSel) { erro('Escolha uma classe primeiro.'); return; }
  const code = (codInput.value || '').trim().toUpperCase();
  if (!code) { erro('Digite o código da sala.'); return; }
  const me = jogadorObj();
  try {
    const snap = await getDoc(doc(db, 'rooms', code));
    if (!snap.exists()) { erro('Sala não encontrada. Confira o código.'); return; }
    const data = snap.data();
    const camp = data.campaign || 'mhoried';
    await updateDoc(doc(db, 'rooms', code), { [`players.${me.id}`]: me });
    salvarIdentidade(camp, code, false);
    document.getElementById('ent-label').textContent = 'Entrando na sala';
    irParaJogo(code);
  } catch (e) {
    console.error(e);
    erro('Não foi possível entrar (Firebase). Confira o código.');
  }
});
</script>
<div style="position:fixed;bottom:2px;left:4px;z-index:99999;font:9px monospace;color:rgba(200,160,80,.4);pointer-events:none">v8</div>
</body>
</html>
