<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview Standees — Mhoried</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0806; overflow-x: hidden; overflow-y: auto;
    width: 100%; min-height: 100vh;
  }
  #world {
    position: relative;
    width: 1086px; height: 1448px;
    transform-origin: top left;
    /* transform definido via JS */
  }
  #world canvas { position: absolute; top: 0; left: 0; display: block; }
  #chars { position: absolute; top: 0; left: 0; width: 1086px; height: 1448px; pointer-events: none; }
  .standee {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    transform: translateX(-50%);
  }
  .standee img {
    display: block; width: auto;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
  }
  .standee-label {
    font-family: Georgia, serif;
    font-size: 10px; color: rgba(230,205,140,0.9);
    letter-spacing: .6px; text-transform: uppercase;
    white-space: nowrap; margin-top: 2px;
    text-shadow: 0 1px 4px #000, 0 0 8px #000;
    background: rgba(0,0,0,0.55); padding: 1px 5px; border-radius: 3px;
  }
  #info-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,8,6,0.92);
    border-top: 1px solid rgba(200,160,64,0.18);
    padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
    font-family: Georgia, serif;
    z-index: 10;
  }
  #info-bar a {
    font-size: 10px; color: rgba(190,165,90,0.6);
    text-decoration: none; letter-spacing: 1px;
    border: 1px solid rgba(200,160,64,0.18); border-radius: 20px; padding: 4px 12px;
  }
  #info-bar span {
    font-size: 9px; color: rgba(190,165,90,0.35); letter-spacing: .8px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="world">
  <canvas id="cv" width="1086" height="1448"></canvas>
  <div id="chars"></div>
</div>
<div id="info-bar">
  <a href="catalog.html">← Catálogo</a>
  <span>Standees · escala real de jogo (HR=55px)</span>
</div>

<script>
// ── Geometria IDÊNTICA ao arena.html ─────────────────────────────────────
const MAP_W = 1086, MAP_H = 1448;
const HR = 55, CS = 82, RS = 95, OOFF = 48;
const GX0 = 47, GY0 = 80;
const COLS = 13, ROWS = 13;

function hexCx(col)       { return GX0 + col * CS; }
function hexCy(col, row)  { return GY0 + row * RS + (col % 2 === 1 ? OOFF : 0); }
function footX(col)       { return hexCx(col); }
function footY(col, row)  { return hexCy(col, row) + Math.round(HR * 0.35); }

// ── Classes e alturas ─────────────────────────────────────────────────────
// Alturas armazenadas [234–400px] → display [200–255px]
// Ratio ~1.275 — hierarquia visível sem exagero
const DH_MIN = 200, DH_MAX = 255, SH_MIN = 234, SH_MAX = 400;
function dispH(sh) {
  return Math.round(DH_MIN + (sh - SH_MIN) / (SH_MAX - SH_MIN) * (DH_MAX - DH_MIN));
}

const CLASSES = [
  { id:'barbaro',   nome:'Bárbaro',   hm:400, hf:375 },
  { id:'guerreiro', nome:'Guerreiro', hm:355, hf:330 },
  { id:'arqueiro',  nome:'Arqueiro',  hm:315, hf:292 },
  { id:'ladino',    nome:'Ladino',    hm:286, hf:266 },
  { id:'mago',      nome:'Mago',      hm:270, hf:252 },
  { id:'clerigo',   nome:'Clérigo',   hm:252, hf:234 },
];

// ── Posições no mapa (linha M = row 3, linha F = row 7) ──────────────────
// Cols 1–6 centradas no mapa (col 0 = A, col 6 = G)
const CHAR_ROW_M = 3;
const CHAR_ROW_F = 7;
const CHAR_COL_START = 1;  // col A=0, usamos B–G (1–6)

// ── Scale para caber na tela (igual ao arena.html initScale) ─────────────
function initScale() {
  const s = Math.min(window.innerWidth / MAP_W, (window.innerHeight - 40) / MAP_H);
  const world = document.getElementById('world');
  world.style.transform = `scale(${s})`;
  // body height = mapa escalado + info-bar
  document.body.style.minHeight = Math.round(MAP_H * s) + 44 + 'px';
}
initScale();
window.addEventListener('resize', () => initScale());

// ── Canvas ────────────────────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

const bg = new Image();
bg.src = 'catalogo/mhoried/cenarios/batalha_hex/feira_phanourios/imagem/feira-limpa.png';
bg.onload  = drawAll;
bg.onerror = drawAll;

// ── Funções de desenho ────────────────────────────────────────────────────
function hexPath(x, y) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i;
    i === 0
      ? ctx.moveTo(x + HR * Math.cos(a), y + HR * Math.sin(a))
      : ctx.lineTo(x + HR * Math.cos(a), y + HR * Math.sin(a));
  }
  ctx.closePath();
}

function drawMarbleBase(x, y) {
  const rx = HR * 0.62, ry = HR * 0.18;
  // sombra
  ctx.beginPath();
  ctx.ellipse(x, y + ry, rx * 1.06, ry * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();
  // corpo
  const g = ctx.createRadialGradient(x - rx * .3, y - ry * .3, 0, x, y, rx);
  g.addColorStop(0, '#4a4a4a');
  g.addColorStop(.3, '#262626');
  g.addColorStop(.7, '#101010');
  g.addColorStop(1, '#040404');
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  // veias
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.clip();
  const s = (x * 17 + y * 11) | 0;
  for (let v = 0; v < 8; v++) {
    const r0 = ((s * 1103515245 + v * 12345)  >>> 0) / 4294967296;
    const r1 = ((s * 214013    + v * 2531011)  >>> 0) / 4294967296;
    const r2 = ((s * 69621     + v * 1234567)  >>> 0) / 4294967296;
    ctx.beginPath();
    ctx.moveTo(x + (r0-.5)*rx*2, y + (r1-.5)*ry*2);
    ctx.lineTo(x + (r2-.5)*rx*2, y + ((r1+.5)%1-.5)*ry*2);
    ctx.strokeStyle = `rgba(220,220,220,${.028 + v*.015})`;
    ctx.lineWidth = .35 + r0 * .7;
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(130,130,130,0.18)';
  ctx.lineWidth = .8;
  ctx.stroke();
}

function drawAll() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  // Fundo (imagem do mercado no tamanho real do mapa)
  if (bg.complete && bg.naturalWidth > 0) {
    ctx.drawImage(bg, 0, 0, MAP_W, MAP_H);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, MAP_W, MAP_H);
  } else {
    ctx.fillStyle = '#1a1208';
    ctx.fillRect(0, 0, MAP_W, MAP_H);
  }

  // Malha hexagonal completa (13×13, exata do arena)
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cx = hexCx(col);
      const cy = hexCy(col, row);
      const isM = row === CHAR_ROW_M && col >= CHAR_COL_START && col < CHAR_COL_START + 6;
      const isF = row === CHAR_ROW_F && col >= CHAR_COL_START && col < CHAR_COL_START + 6;
      const isChar = isM || isF;

      hexPath(cx, cy);
      ctx.fillStyle = isChar
        ? (isM ? 'rgba(80,130,220,0.08)' : 'rgba(220,80,130,0.08)')
        : 'rgba(0,0,0,0)';
      ctx.fill();

      hexPath(cx, cy);
      ctx.strokeStyle = isChar
        ? 'rgba(200,160,64,0.55)'
        : 'rgba(200,160,64,0.20)';
      ctx.lineWidth = isChar ? 1.5 : 1;
      ctx.stroke();
    }
  }

  // Bases de mármore
  for (const charRow of [CHAR_ROW_M, CHAR_ROW_F]) {
    for (let i = 0; i < 6; i++) {
      const col = CHAR_COL_START + i;
      drawMarbleBase(footX(col), footY(col, charRow));
    }
  }

  // Labels de seção no mapa
  ctx.font = 'bold 11px Georgia';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(200,165,80,0.55)';
  const lxM = hexCx(CHAR_COL_START) - HR;
  const lxF = hexCx(CHAR_COL_START) - HR;
  ctx.fillText('♂ Masculino', lxM, hexCy(CHAR_COL_START, CHAR_ROW_M) - HR - 6);
  ctx.fillText('♀ Feminino',  lxF, hexCy(CHAR_COL_START, CHAR_ROW_F) - HR - 6);

  placeStandees();
}

// ── Sprites HTML ──────────────────────────────────────────────────────────
function placeStandees() {
  const container = document.getElementById('chars');
  container.innerHTML = '';

  const rows = [
    { g:'m', charRow: CHAR_ROW_M },
    { g:'f', charRow: CHAR_ROW_F },
  ];

  rows.forEach(({ g, charRow }) => {
    CLASSES.forEach((cls, i) => {
      const col = CHAR_COL_START + i;
      const dh  = dispH(g === 'm' ? cls.hm : cls.hf);
      const cx  = footX(col);
      const fy  = footY(col, charRow);

      const div = document.createElement('div');
      div.className  = 'standee';
      div.style.left = cx + 'px';
      div.style.top  = (fy - dh - 2) + 'px';

      const img = document.createElement('img');
      img.src          = `catalogo/mhoried/classes/${cls.id}/peca_tabuleiro/${cls.id}_${g}_peca.png`;
      img.alt          = cls.nome;
      img.style.height = dh + 'px';
      img.onerror      = () => { img.style.opacity = '0.05'; };

      const lbl = document.createElement('div');
      lbl.className   = 'standee-label';
      lbl.textContent = cls.nome;

      div.append(img, lbl);
      container.appendChild(div);
    });
  });
}
</script>
</body>
</html>
