<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proporção de Standees — Mhoried</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0806;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 14px;
    font-family: 'Georgia', serif;
  }
  h1 {
    color: #c8a040; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 400;
    margin-bottom: 4px; text-align: center;
  }
  .subtitle {
    color: rgba(190,165,90,0.38); font-size: 8px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 14px; text-align: center;
  }
  #chart-wrap {
    position: relative;
    border: 1px solid rgba(200,160,64,0.18);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  canvas#chart { display: block; }
  #sprites {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
  }
  .standee {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    transform: translateX(-50%);
  }
  .standee img {
    display: block; width: auto;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9));
  }
  .standee-lbl {
    font-size: 7px; color: rgba(220,195,130,0.85);
    letter-spacing: .5px; text-transform: uppercase;
    white-space: nowrap; margin-top: 2px;
    background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 2px;
  }
  a.back {
    display: inline-block; margin-top: 12px;
    font-size: 9px; color: rgba(190,165,90,0.5);
    text-decoration: none; letter-spacing: 1px;
    border: 1px solid rgba(200,160,64,0.18); border-radius: 20px; padding: 3px 12px;
  }
  a.back:hover { color: #c8a040; }
</style>
</head>
<body>
<h1>Proporção de Standees</h1>
<div class="subtitle">Hierarquia de altura por classe · linhas = altura de 1 hexágono (HR=55)</div>
<div id="chart-wrap">
  <canvas id="chart"></canvas>
  <div id="sprites"></div>
</div>
<a class="back" href="catalog.html">← Catálogo</a>

<script>
// ── Dados ─────────────────────────────────────────────────────────────────
const CLASSES = [
  { id:'barbaro',   nome:'Bárbaro'  },
  { id:'guerreiro', nome:'Guerreiro'},
  { id:'arqueiro',  nome:'Arqueiro' },
  { id:'mago',      nome:'Mago'     },
  { id:'ladino',    nome:'Ladino'   },
  { id:'clerigo',   nome:'Clérigo'  },
];

// Alturas em pixels no arquivo (= hierarquia de porte)
const STORED = {
  barbaro:   { m:200, f:181 },
  guerreiro: { m:169, f:150 },
  arqueiro:  { m:145, f:142 },
  mago:      { m:145, f:145 },
  ladino:    { m:157, f:165 },
  clerigo:   { m:153, f:149 },
};

// ── Escala do chart ───────────────────────────────────────────────────────
// 1 hexágono do jogo (HR=55) tem altura √3×55 ≈ 95px no canvas do arena.
// No chart queremos que 1 hex-height = HEX_DISP pixels visualmente.
const GAME_HEX_H = 95;   // altura real de 1 hex no arena (RS)
const HEX_DISP   = 56;   // px por hex-height no chart

// Altura de display de cada standee no chart
function chartH(storedH) { return Math.round(storedH / GAME_HEX_H * HEX_DISP); }

const MAX_STORED = 200;
const MAX_DISP   = chartH(MAX_STORED);

// ── Layout ────────────────────────────────────────────────────────────────
const RULER_W  = 46;   // largura da régua esquerda
const CELL_W   = 80;   // largura de cada célula (par M+F)
const COL_GAP  = 10;   // espaço entre colunas
const NCOLS    = CLASSES.length;
const BASELINE_PAD = 28;  // espaço abaixo da baseline (labels de classe)
const TOP_PAD  = 16;   // espaço acima do char mais alto
const SECTION_GAP = 18; // gap entre label "M" / "F" e a grade

const CHART_H_EACH = MAX_DISP + TOP_PAD + BASELINE_PAD; // altura de cada seção
const CANVAS_W = RULER_W + NCOLS * (CELL_W + COL_GAP) + 10;
const CANVAS_H = CHART_H_EACH * 2 + SECTION_GAP * 2 + 30;

// baseline y de cada seção (M no topo, F abaixo)
const BASE_M = TOP_PAD + MAX_DISP;
const BASE_F = BASE_M + BASELINE_PAD + SECTION_GAP + TOP_PAD + MAX_DISP;

// cx de cada coluna
function colCx(i) { return RULER_W + i * (CELL_W + COL_GAP) + CELL_W / 2; }

// ── Canvas ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('chart');
const wrap   = document.getElementById('chart-wrap');
canvas.width  = CANVAS_W;
canvas.height = CANVAS_H;
wrap.style.width  = CANVAS_W + 'px';
wrap.style.height = CANVAS_H + 'px';
const ctx = canvas.getContext('2d');

function drawChart() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Fundo
  ctx.fillStyle = '#0d0b08';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // ── Grade horizontal (linhas de hex-height) ──────────────────────────
  const maxHexLines = Math.ceil(MAX_DISP / HEX_DISP) + 1;

  for (const [baseY, sectionLabel] of [[BASE_M, '♂ Masculino'], [BASE_F, '♀ Feminino']]) {
    // Label de seção
    ctx.font = '9px Georgia';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(200,165,80,0.35)';
    ctx.fillText(sectionLabel, RULER_W, baseY - MAX_DISP - TOP_PAD + 10);

    // Área da grade (coluna de conteúdo)
    const gridX = RULER_W;
    const gridW = CANVAS_W - RULER_W - 4;

    // Fundo da área de grid
    ctx.fillStyle = 'rgba(20,16,8,0.6)';
    ctx.fillRect(gridX, baseY - MAX_DISP - TOP_PAD, gridW, MAX_DISP + TOP_PAD);

    // Linhas horizontais de hex-height + régua
    for (let n = 0; n <= maxHexLines; n++) {
      const lineY = baseY - n * HEX_DISP;
      if (lineY < baseY - MAX_DISP - TOP_PAD) break;

      // Linha de grade
      ctx.beginPath();
      ctx.moveTo(gridX, lineY);
      ctx.lineTo(CANVAS_W - 4, lineY);
      const isMajor = n % 1 === 0;
      ctx.strokeStyle = n === 0
        ? 'rgba(200,160,64,0.55)'      // baseline
        : 'rgba(200,160,64,0.14)';
      ctx.lineWidth = n === 0 ? 1.5 : 1;
      ctx.stroke();

      // Régua: label de hex-height
      if (n > 0) {
        ctx.font = n % 2 === 0 ? 'bold 8px Georgia' : '7px Georgia';
        ctx.textAlign = 'right';
        ctx.fillStyle = n % 2 === 0
          ? 'rgba(200,165,80,0.65)'
          : 'rgba(200,165,80,0.38)';
        const label = n === 1 ? '1 hex' : `${n}×`;
        ctx.fillText(label, RULER_W - 5, lineY + 3);

        // Tracinho da régua
        ctx.beginPath();
        ctx.moveTo(RULER_W - 4, lineY);
        ctx.lineTo(RULER_W, lineY);
        ctx.strokeStyle = 'rgba(200,165,80,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Baseline label
    ctx.font = '7px Georgia';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(200,165,80,0.4)';
    ctx.fillText('base', RULER_W - 5, baseY + 3);
    ctx.beginPath();
    ctx.moveTo(RULER_W - 4, baseY);
    ctx.lineTo(RULER_W, baseY);
    ctx.strokeStyle = 'rgba(200,165,80,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Separadores de coluna
    for (let i = 0; i < NCOLS; i++) {
      const cx = colCx(i);
      ctx.beginPath();
      ctx.moveTo(cx - CELL_W/2, baseY - MAX_DISP - TOP_PAD);
      ctx.lineTo(cx - CELL_W/2, baseY + BASELINE_PAD);
      ctx.strokeStyle = 'rgba(200,160,64,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Régua vertical (linha esquerda)
  ctx.beginPath();
  ctx.moveTo(RULER_W, 0);
  ctx.lineTo(RULER_W, CANVAS_H);
  ctx.strokeStyle = 'rgba(200,160,64,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Labels de classe (abaixo de cada coluna, entre as duas seções)
  for (let i = 0; i < NCOLS; i++) {
    const cx = colCx(i);
    ctx.font = '8px Georgia';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,175,100,0.55)';
    ctx.fillText(CLASSES[i].nome, cx, BASE_M + BASELINE_PAD - 8);
  }

  // Coloca as imagens HTML
  placeSprites();
}

function spritePath(id, g) {
  const REV = {mago_f:'_r',arqueiro_f:'_r',guerreiro_m:'_r',clerigo_m:'_r',clerigo_f:'_r2',ladino_m:'_r3',ladino_f:'_r3'};
  return `catalogo/mhoried/classes/${id}/peca_tabuleiro/${id}_${g}${REV[id+'_'+g]||''}_peca.png`;
}

function placeSprites() {
  const container = document.getElementById('sprites');
  container.innerHTML = '';
  container.style.width  = CANVAS_W + 'px';
  container.style.height = CANVAS_H + 'px';

  const rows = [
    { g:'m', baseY: BASE_M },
    { g:'f', baseY: BASE_F },
  ];

  rows.forEach(({ g, baseY }) => {
    CLASSES.forEach((cls, i) => {
      const storedH = STORED[cls.id][g];
      const dh      = chartH(storedH);
      const cx      = colCx(i);

      const div = document.createElement('div');
      div.className  = 'standee';
      div.style.left = cx + 'px';
      div.style.top  = (baseY - dh - 2) + 'px';

      const img = document.createElement('img');
      img.src          = spritePath(cls.id, g);
      img.alt          = cls.nome;
      img.style.height = dh + 'px';
      img.onerror      = () => { img.style.opacity = '0.06'; };

      const lbl = document.createElement('div');
      lbl.className   = 'standee-lbl';
      lbl.textContent = `${dh}px · ${(storedH/GAME_HEX_H).toFixed(1)}h`;

      div.append(img, lbl);
      container.appendChild(div);
    });
  });
}

drawChart();
</script>
</body>
</html>
