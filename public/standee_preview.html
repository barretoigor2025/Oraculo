<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview Standees — Mhoried</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0806;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
    font-family: 'Georgia', serif;
  }
  h1 {
    color: #c8a040; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 400;
    margin-bottom: 4px; text-align: center;
  }
  .subtitle {
    color: rgba(190,165,90,0.38); font-size: 8px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 12px; text-align: center;
  }
  #wrap {
    position: relative; overflow: hidden;
    border: 1px solid rgba(200,160,64,0.18);
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  canvas#cv { display: block; }
  #chars { position: absolute; top: 0; left: 0; pointer-events: none; }
  .standee {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    transform: translateX(-50%);
  }
  .standee img {
    display: block; width: auto;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.95));
  }
  .standee-label {
    font-size: 7px; color: rgba(220,195,130,0.9);
    letter-spacing: .6px; text-transform: uppercase;
    white-space: nowrap; margin-top: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,1);
    background: rgba(0,0,0,0.55); padding: 1px 4px; border-radius: 2px;
  }
  a.back {
    display: inline-block; margin-top: 10px;
    font-size: 9px; color: rgba(190,165,90,0.5);
    text-decoration: none; letter-spacing: 1px;
    border: 1px solid rgba(200,160,64,0.18); border-radius: 20px; padding: 3px 12px;
  }
  a.back:hover { color: #c8a040; }
</style>
</head>
<body>
<h1>Standees — Mhoried</h1>
<div class="subtitle">Escala real de jogo (HR=55px · mesmo do arena.html)</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="chars"></div>
</div>
<a class="back" href="catalog.html">← Catálogo</a>

<script>
// ── Geometria IDÊNTICA ao arena.html (escala 1:1) ────────────────────────
const HR   = 55;
const CS   = 82;
const RS   = 95;
const OOFF = 48;

// Grid: 8 colunas × 4 linhas (chars nas linhas 0 = M, 2 = F)
const GRID_COLS = 8;
const GRID_ROWS = 4;
const CHAR_COLS = 6;
const ROW_M = 0;
const ROW_F = 2;

// Altura máxima de display: mesma que o arena usa para sprites
// (SW = HR*3.2 = 176px de largura → personagens altos ~200-250px)
const DH_MAX = 240;  // Bárbaro M
const DH_MIN = 192;  // Clérigo F  — ratio ~1.25, visível mas não absurdo
const SH_MAX = 400;
const SH_MIN = 234;
function dispH(sh) {
  return Math.round(DH_MIN + (sh - SH_MIN) / (SH_MAX - SH_MIN) * (DH_MAX - DH_MIN));
}

// Origem do grid
const GX0 = HR + 18;          // 73
const GY0 = DH_MAX + 25;      // 265  (espaço para o char mais alto acima da linha 0)

const hexCx  = col       => GX0 + col * CS;
const hexCy  = (col,row) => GY0 + row * RS + (col % 2 === 1 ? OOFF : 0);
const footX  = col       => hexCx(col);
const footY  = (col,row) => hexCy(col, row) + Math.round(HR * 0.35);

// ── Dimensões do canvas ───────────────────────────────────────────────────
const CANVAS_W = GX0 + (GRID_COLS - 1) * CS + HR + 22;
const CANVAS_H = Math.max(
  GY0 + (GRID_ROWS - 1) * RS + OOFF + HR + 20,  // fundo do último hex (ímpar)
  footY(1, ROW_F) + 28                            // labels linha F (col ímpar)
);

// ── Canvas ────────────────────────────────────────────────────────────────
const cv   = document.getElementById('cv');
const wrap = document.getElementById('wrap');
cv.width   = CANVAS_W;
cv.height  = CANVAS_H;
wrap.style.width  = CANVAS_W + 'px';
wrap.style.height = CANVAS_H + 'px';
const ctx = cv.getContext('2d');

const bg = new Image();
bg.src = 'catalogo/mhoried/cenarios/batalha_hex/feira_phanourios/imagem/feira-limpa.png';
bg.onload  = drawAll;
bg.onerror = drawAll;

// ── Desenho ───────────────────────────────────────────────────────────────
function hexPath(x, y) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i;
    i === 0
      ? ctx.moveTo(x + HR * Math.cos(a), y + HR * Math.sin(a))
      : ctx.lineTo(x + HR * Math.cos(a), y + HR * Math.sin(a));
  }
  ctx.closePath();
}

function drawMarbleBase(x, y) {
  const rx = HR * 0.62, ry = HR * 0.18;
  // sombra
  ctx.beginPath();
  ctx.ellipse(x, y + ry * 0.9, rx * 1.05, ry * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.48)';
  ctx.fill();
  // corpo
  const g = ctx.createRadialGradient(x - rx * .28, y - ry * .3, 0, x, y, rx);
  g.addColorStop(0, '#4c4c4c');
  g.addColorStop(.3, '#282828');
  g.addColorStop(.7, '#111');
  g.addColorStop(1, '#040404');
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  // veias
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.clip();
  const s = (x * 17 + y * 11) | 0;
  for (let v = 0; v < 8; v++) {
    const r0 = ((s * 1103515245 + v * 12345)  >>> 0) / 4294967296;
    const r1 = ((s * 214013    + v * 2531011)  >>> 0) / 4294967296;
    const r2 = ((s * 69621     + v * 1234567)  >>> 0) / 4294967296;
    ctx.beginPath();
    ctx.moveTo(x + (r0-.5)*rx*2, y + (r1-.5)*ry*2);
    ctx.lineTo(x + (r2-.5)*rx*2, y + ((r1+.5)%1-.5)*ry*2);
    ctx.strokeStyle = `rgba(222,222,222,${.03 + v*.016})`;
    ctx.lineWidth = .4 + r0 * .7;
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(140,140,140,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function isCharHex(col, row) {
  return col < CHAR_COLS && (row === ROW_M || row === ROW_F);
}

function drawAll() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Fundo
  if (bg.complete && bg.naturalWidth > 0) {
    const bsr = bg.naturalWidth / bg.naturalHeight;
    const csr = CANVAS_W / CANVAS_H;
    let bw, bh, bx, by;
    if (bsr > csr) { bh = CANVAS_H; bw = bh*bsr; bx = (CANVAS_W-bw)/2; by = 0; }
    else           { bw = CANVAS_W; bh = bw/bsr;  bx = 0; by = (CANVAS_H-bh)/2; }
    ctx.drawImage(bg, bx, by, bw, bh);
    ctx.fillStyle = 'rgba(8,6,4,0.55)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  } else {
    ctx.fillStyle = '#0e0b07';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  }

  // Malha hexagonal completa
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const cx = hexCx(col);
      const cy = hexCy(col, row);
      const ch = isCharHex(col, row);

      hexPath(cx, cy);
      ctx.fillStyle = ch
        ? (row === ROW_M ? 'rgba(80,120,200,0.07)' : 'rgba(200,80,120,0.07)')
        : 'rgba(255,210,80,0.03)';
      ctx.fill();

      hexPath(cx, cy);
      ctx.strokeStyle = ch ? 'rgba(200,160,64,0.50)' : 'rgba(200,160,64,0.15)';
      ctx.lineWidth   = ch ? 1.5 : 1;
      ctx.stroke();
    }
  }

  // Bases de mármore
  for (const row of [ROW_M, ROW_F]) {
    for (let col = 0; col < CHAR_COLS; col++) {
      drawMarbleBase(footX(col), footY(col, row));
    }
  }

  // Labels de linha
  ctx.font = '8px Georgia';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(200,165,80,0.35)';
  ctx.fillText('♂ M', GX0 - HR - 5, hexCy(0, ROW_M) + 4);
  ctx.fillText('♀ F', GX0 - HR - 5, hexCy(0, ROW_F) + 4);

  placeStandees();
}

// ── Overlay HTML ──────────────────────────────────────────────────────────
const CLASSES = [
  { id:'barbaro',   nome:'Bárbaro',   hm:400, hf:375 },
  { id:'guerreiro', nome:'Guerreiro', hm:355, hf:330 },
  { id:'arqueiro',  nome:'Arqueiro',  hm:315, hf:292 },
  { id:'ladino',    nome:'Ladino',    hm:286, hf:266 },
  { id:'mago',      nome:'Mago',      hm:270, hf:252 },
  { id:'clerigo',   nome:'Clérigo',   hm:252, hf:234 },
];

function placeStandees() {
  const c = document.getElementById('chars');
  c.innerHTML = '';

  for (const { g, row } of [{ g:'m', row:ROW_M }, { g:'f', row:ROW_F }]) {
    CLASSES.forEach((cls, col) => {
      const dh  = dispH(g === 'm' ? cls.hm : cls.hf);
      const cx  = footX(col);
      const fy  = footY(col, row);

      const div = document.createElement('div');
      div.className  = 'standee';
      div.style.left = cx + 'px';
      div.style.top  = (fy - dh - 2) + 'px';

      const img = document.createElement('img');
      img.src          = `catalogo/mhoried/classes/${cls.id}/peca_tabuleiro/${cls.id}_${g}_peca.png`;
      img.alt          = cls.nome;
      img.style.height = dh + 'px';
      img.onerror      = () => { img.style.opacity = '0.06'; };

      const lbl = document.createElement('div');
      lbl.className   = 'standee-label';
      lbl.textContent = cls.nome;

      div.append(img, lbl);
      c.appendChild(div);
    });
  }
}
</script>
</body>
</html>
