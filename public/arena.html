<title>Arena v2</title>
<script>(function(){try{var c=localStorage.getItem('oraculo.fbConfig'),r=localStorage.getItem('oraculo.roomId');if(!c||!r){location.replace('index.html?v=8');}}catch(e){location.replace("index.html?v=8");}})();</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script type="module">
import { INIMIGOS_DATA, NPCS as _NPCS_DATA } from './catalogo/mhoried/loader.js';
import { CENAS as _CENAS_DATA } from './catalogo/mhoried/campanha/roteiro/campaign.js';
import { rosterDaKey, mapaDaKey, MAPA_FALLBACK } from './catalogo/mhoried/encontros.js';
window.INIMIGOS_DATA = INIMIGOS_DATA;
window._campanhaNPCs = _NPCS_DATA;
window._CENAS_DATA = _CENAS_DATA;
window._rosterDaKey = rosterDaKey;
window._mapaDaKey = mapaDaKey;
window._MAPA_FALLBACK = MAPA_FALLBACK;
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getFirestore,doc,onSnapshot,updateDoc,increment}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const _cfg=JSON.parse(localStorage.getItem('oraculo.fbConfig')||'null');
const _rid=localStorage.getItem('oraculo.roomId');
const _pid=localStorage.getItem('oraculo.playerId');
if(_cfg&&_rid&&_pid){
  try{
    const app=getApps().find(a=>a.name==='arena')||initializeApp(_cfg,'arena');
    const db=getFirestore(app);
    const rd=doc(db,'rooms',_rid);
    window._fbUpdatePos=async(col,row)=>{
      try{await updateDoc(rd,{[`players.${_pid}.x`]:col,[`players.${_pid}.y`]:row});}catch{}
    };
    window._fbSetIntent=async(data)=>{
      try{await updateDoc(rd,{[`intents.${_pid}`]:data});}catch{}
    };
    window._fbBroadcastDice=async(rolls)=>{
      try{await updateDoc(rd,{diceRoll:{rolls,ts:Date.now(),pid:_pid}});}catch{}
    };
    window._fbSetEnemies=async(enemies)=>{
      try{
        const data=enemies.map(u=>({id:u.id||u.nome,nome:u.nome,x:u.col,y:u.row,hp:u.hp,maxHp:u.maxHp}));
        await updateDoc(rd,{enemies:data});
      }catch{}
    };
    window._fbSetTurn=async(nextId)=>{
      try{await updateDoc(rd,{currentTurnPlayerId:nextId});}catch{}
    };
    window._fbSetEnemyIntent=async(intent)=>{
      try{await updateDoc(rd,{enemyIntent:intent??null});}catch{}
    };
    window._fbListenRoom=cb=>onSnapshot(rd,s=>cb(s.exists()?s.data():null));
    window._fbSetStatus=async(status,extra={})=>{
      try{
        const data={status,updatedAt:Date.now()};
        for(const[k,v]of Object.entries(extra)) data[k]=v;
        await updateDoc(rd,data);
      }catch{}
    };
    window._fbAddPostBattleConfirm=async()=>{
      try{await updateDoc(rd,{[`postBattleConfirmados.${_pid}`]:true});}catch{}
    };
    window._fbBroadcastAcaoLivre=async(data)=>{
      try{await updateDoc(rd,{acaoLivre:{...data,pid:_pid,ts:Date.now()}});}catch{}
    };
  }catch(e){console.warn('Arena Firebase init:',e);}
}
window._fbReady=true;
window.dispatchEvent(new Event('fbReady'));
</script>

  opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s cubic-bezier(.15,.9,.25,1.2)
}
#dado-resultado-atual.visivel{opacity:1;transform:scale(1)}
.dado-label-mapa{font-size:9px;color:rgba(255,220,130,.8);letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.dado-detalhe-mapa{font-size:12px;color:rgba(255,215,170,.9);font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.dado-veredicto-jogo{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:2px 12px;border-radius:4px;min-height:20px;opacity:0;transform:scale(.7);transition:opacity .28s ease .05s,transform .28s cubic-bezier(.15,.9,.25,1.2) .05s}
.dado-veredicto-jogo.visivel{opacity:1;transform:scale(1)}
.dado-veredicto-jogo.sucesso{color:#7adc7a;text-shadow:0 0 10px rgba(100,220,100,.8)}
.dado-veredicto-jogo.falha{color:#e06060;text-shadow:0 0 10px rgba(220,80,80,.8)}
.dado-veredicto-jogo.critico{color:#ffd700;text-shadow:0 0 14px rgba(255,215,0,.9)}
.dado-veredicto-jogo.catastrofe{color:#ff4444;text-shadow:0 0 14px rgba(255,50,50,.9)}
.dado-historico{
  width:min(240px,78vw);display:flex;flex-direction:column;gap:2px;
  max-height:90px;overflow-y:auto;
}
.dado-hist-linha{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:4px;font-size:10px;animation:dado-hist-in .22s ease both}
@keyframes dado-hist-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dado-hist-icone{flex-shrink:0;font-size:12px}
.dado-hist-label{flex:1;color:rgba(255,230,180,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.dado-hist-roll{color:rgba(255,220,160,.8);font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.dado-hist-vered{font-weight:700;white-space:nowrap;font-size:9px;letter-spacing:.5px}
.dado-hist-vered.s{color:#7adc7a}.dado-hist-vered.f{color:#e06060}.dado-hist-vered.c{color:#ffd700}.dado-hist-vered.ct{color:#ff4444}.dado-hist-vered.d{color:#ffa040}

<script>
'use strict';

// ── Bestiary helper ──────────────────────────────────────────────────────────
function criarInimigo(bestiaryId, col, row, overrides){
  const en = (window.INIMIGOS_DATA||[]).find(e=>e.id===bestiaryId);
  if(!en){ console.warn('criarInimigo: id não encontrado →', bestiaryId); return null; }
  const g = en.gurps || {};
  return Object.assign({
    id:          `${bestiaryId}_${col}_${row}`,
    nome:        en.nome,
    col, row,
    emoji:       en.emoji || '💀',
    cor:         en.cor   || '#4a0000',
    imgSrc:      en._retrato  || `catalogo/mhoried/inimigos/${bestiaryId}/retrato/${bestiaryId}_retrato.png`,
    imgSrcAtaque:en._retrato  || `catalogo/mhoried/inimigos/${bestiaryId}/retrato/${bestiaryId}_retrato.png`,
    img:         null,
    tipo:        'inimigo',
    mov:         g.move  ?? 4,
    hp:          g.hp    ?? 10,
    maxHp:       g.hp    ?? 10,
    sp:          (typeof g.fp === 'number' ? g.fp : 0),
    maxSp:       (typeof g.fp === 'number' ? g.fp : 0),
    portrait:    en._retrato  || `catalogo/mhoried/inimigos/${bestiaryId}/retrato/${bestiaryId}_retrato.png`,
    ac:          g.dodge ?? 8,
    dr:          g.dr    ?? 0,
    bestiaryId,
    habs:        en.habs        || [],
    magias:      en.magias      || [],
    comportamento: en.comportamento || '',
  }, overrides||{});
}

// ── Dice helpers ──
function parseNotacao(str){
  const m=str.match(/(\d+)d(\d+)([+-]\d+)?/);
  if(!m) return null;
  return {dice:parseInt(m[1]),sides:parseInt(m[2]),bonus:m[3]?parseInt(m[3]):0};
}
function rollNotacao(str){
  const p=parseNotacao(str); if(!p) return {total:0,notation:str,sides:6};
  let t=p.bonus; for(let i=0;i<p.dice;i++) t+=Math.floor(Math.random()*p.sides)+1;
  return {total:Math.max(1,t),notation:str,sides:p.sides};
}
function getPortraitAtaque(name){
  const u=unidades.find(u=>u.nome===name);
  if(u) return {src:u.portrait||null,cor:u.tipo==='heroi'?'#4488cc':'#cc4444',icon:u.emoji||'⚔️'};
  return {src:null,cor:'#888',icon:'⚔️'};
}

let _mapScale=1, _mapOffsetX=0, _zoom=1;
const _fbIsHost = localStorage.getItem('oraculo.isHost') !== '0'; // true in solo/host, false for guest

// ── DiceOverlay (Three.js) — dado vermelho sólido sobre o mapa ──
const DiceOverlay=(function(){
  'use strict';
  let _rend=null,_scene=null,_cam=null;
  let _mesh=null,_raf=null,_t0=null,_lastTS=null;
  let _svx=0,_svy=0,_svz=0,_resultShown=false,_onStop=null;
  let _SZ=140; // canvas size stored once in _buildDOM, never read from cv.width
  const FE=1.05, SF=1.78, SS=2.28;

  function _geoD10(){
    const v=[0,95,0,0,-95,0];
    for(let i=0;i<5;i++){const a=Math.PI*2*i/5-Math.PI/2;v.push(74*Math.cos(a),0,74*Math.sin(a));}
    const idx=[];
    for(let i=0;i<5;i++){idx.push(0,2+i,2+(i+1)%5);idx.push(1,2+(i+1)%5,2+i);}
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
    g.setIndex(idx); g.computeVertexNormals(); return g;
  }

  function _makeMesh(lados){
    let g;
    if(lados===4)       g=new THREE.TetrahedronGeometry(72);
    else if(lados===6)  g=new THREE.BoxGeometry(105,105,105);
    else if(lados===8)  g=new THREE.OctahedronGeometry(72);
    else if(lados===10) g=_geoD10();
    else if(lados===12) g=new THREE.DodecahedronGeometry(68);
    else                g=new THREE.IcosahedronGeometry(72,0);
    const mat=new THREE.MeshStandardMaterial({color:0xbf1a0c,roughness:0.28,metalness:0.08,side:THREE.DoubleSide});
    const m=new THREE.Mesh(g,mat);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,lados<=6?20:30),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.45})));
    return m;
  }

  function _buildDOM(){
    const ov=document.getElementById('teste-overlay');
    if(!ov||ov.querySelector('#dado-canvas-jogo')) return ov;
    _SZ=Math.min(Math.round(window.innerWidth*.36),140)|0;
    ov.innerHTML=`
      <div class="dado-canvas-wrap" style="width:${_SZ}px;height:${_SZ}px">
        <canvas id="dado-canvas-jogo" width="${_SZ}" height="${_SZ}" style="width:${_SZ}px;height:${_SZ}px"></canvas>
        <div id="dado-num-jogo" class="dado-num-jogo"></div>
      </div>
      <div id="dado-resultado-atual">
        <div id="dado-label-atual" class="dado-label-mapa"></div>
        <div id="dado-detalhe-jogo" class="dado-detalhe-mapa"></div>
        <div id="dado-veredicto-jogo" class="dado-veredicto-jogo"></div>
      </div>
      <div id="dado-historico" class="dado-historico"></div>`;
    return ov;
  }

  function _initThree(){
    const cv=document.getElementById('dado-canvas-jogo');
    if(!cv) return false;
    if(typeof THREE==='undefined') return false;
    if(_rend){_rend.setSize(_SZ,_SZ);return true;} // CRÍTICO: sempre chamar setSize; usar _SZ não cv.width
    _rend=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
    _rend.setPixelRatio(Math.min(devicePixelRatio,2));
    _rend.setSize(_SZ,_SZ);
    _rend.setClearColor(0x000000,0);
    _scene=new THREE.Scene();
    _cam=new THREE.PerspectiveCamera(38,1,1,2000);
    _cam.position.set(0,0,350);
    _scene.add(new THREE.AmbientLight(0xffffff,.5));
    const key=new THREE.DirectionalLight(0xffe8cc,1.15); key.position.set(100,180,120); _scene.add(key);
    const fill=new THREE.DirectionalLight(0xaad0ff,.38); fill.position.set(-80,40,60); _scene.add(fill);
    const rim=new THREE.PointLight(0xff3311,.55,900); rim.position.set(-150,80,-220); _scene.add(rim);
    return true;
  }

  function _bounce(t){
    if(t<1/2.75) return 7.5625*t*t;
    if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+.75;}
    if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+.9375;}
    t-=2.625/2.75;return 7.5625*t*t+.984375;
  }

  function _loop(ts){
    if(!_t0)_t0=ts;
    const dt=_lastTS?(ts-_lastTS)/1000:0;_lastTS=ts;
    const t=(ts-_t0)/1000;
    if(_mesh){
      const fp=Math.min(t/FE,1);
      // Cai de cima do frame e para no centro do canvas
      _mesh.position.y=150-150*_bounce(fp);
      // tremor de câmera no impacto
      if(fp>.70&&fp<.90){const sh=(0.90-fp)/0.20;_cam.position.x=(Math.random()-.5)*7*sh;_cam.position.y=(Math.random()-.5)*5*sh;}
      else{_cam.position.x*=0.85;_cam.position.y*=0.85;}
      let sm;
      if(t<SF)sm=1;
      else if(t<SS)sm=Math.pow(1-(t-SF)/(SS-SF),2.5);
      else{sm=0;if(!_resultShown){_resultShown=true;_rend.render(_scene,_cam);if(_onStop)_onStop();}return;}
      _mesh.rotation.x+=_svx*sm*dt;_mesh.rotation.y+=_svy*sm*dt;_mesh.rotation.z+=_svz*sm*dt;
    }
    _rend.render(_scene,_cam);_raf=requestAnimationFrame(_loop);
  }

  function _launch(lados,onStop){
    if(!_initThree()){onStop();return;}
    _cam.position.set(0,0,350); // reset câmera antes de cada rolagem
    if(_mesh){_scene.remove(_mesh);_mesh=null;}
    if(_raf){cancelAnimationFrame(_raf);_raf=null;}
    _mesh=_makeMesh(lados);_mesh.position.set(0,150,0);_scene.add(_mesh);
    const b=18;
    _svx=(Math.random()-.5)*b+(Math.random()>.5?8:-8);
    _svy=(Math.random()-.5)*b+(Math.random()>.5?8:-8);
    _svz=(Math.random()-.5)*(b*.7);
    _t0=null;_lastTS=null;_resultShown=false;_onStop=onStop;_raf=requestAnimationFrame(_loop);
  }

  function _clean(){
    if(_raf){cancelAnimationFrame(_raf);_raf=null;}
    if(_mesh&&_scene){_scene.remove(_mesh);_mesh=null;}
    if(_rend&&_cam&&_scene){_cam.position.set(0,0,350);_rend.render(_scene,_cam);}
  }

  function mostrar(rolls,afterCb){
    const ov=_buildDOM();
    if(!ov){afterCb(rolls);return;}
    const cv=document.getElementById('dado-canvas-jogo');
    if(cv&&(!_rend||_rend.domElement!==cv))_rend=null;
    const mapH=Math.round(MAP_H*_mapScale);
    ov.style.height=mapH+'px';
    ov.style.display='flex';
    const label=document.getElementById('dado-label-atual');
    const resDiv=document.getElementById('dado-resultado-atual');
    const numEl=document.getElementById('dado-num-jogo');
    const detEl=document.getElementById('dado-detalhe-jogo');
    const vered=document.getElementById('dado-veredicto-jogo');
    const hist=document.getElementById('dado-historico');
    hist.innerHTML='';
    function addHist(r){
      let ic,vc,vt,rs;
      if(r.tipo==='testar'){
        if(r.catastrofe){ic='💀';vc='ct';vt='CATÁSTROFE';}
        else if(r.critico){ic='⭐';vc='c';vt='CRÍTICO';}
        else if(r.sucesso){ic='✓';vc='s';vt='ACERTO';}
        else{ic='✕';vc='f';vt='FALHA';}
        rs=`${r.d20}${r.modStr}=${r.total} CD${r.dc}`;
      } else {ic='🎲';vc='d';vt=String(r.resultado);rs=r.notacao;}
      const ln=document.createElement('div');ln.className='dado-hist-linha';
      ln.innerHTML=`<span class="dado-hist-icone">${ic}</span><span class="dado-hist-label">${r.label}</span><span class="dado-hist-roll">${rs}</span><span class="dado-hist-vered ${vc}">${vt}</span>`;
      hist.appendChild(ln);hist.scrollTop=hist.scrollHeight;
    }
    function next(idx){
      if(idx>=rolls.length){setTimeout(()=>{ov.style.display='none';_clean();afterCb(rolls);},1200);return;}
      const r=rolls[idx];
      if(r.condicionalDe!==undefined&&rolls[r.condicionalDe]&&!rolls[r.condicionalDe].sucesso){
        const sk=document.createElement('div');sk.className='dado-hist-linha';
        sk.innerHTML=`<span class="dado-hist-icone">—</span><span class="dado-hist-label">${r.label}</span><span class="dado-hist-roll" style="opacity:.35">ataque errou</span><span class="dado-hist-vered f">CANCELADO</span>`;
        hist.appendChild(sk);setTimeout(()=>next(idx+1),700);return;
      }
      numEl.classList.remove('visivel');resDiv.classList.remove('visivel');
      numEl.textContent='';detEl.textContent='';vered.textContent='';vered.className='dado-veredicto-jogo';
      label.textContent=r.label;
      const lados=r.tipo==='testar'?20:(r.dados||20);
      _launch(lados,()=>{
        if(r.tipo==='testar'){
          numEl.textContent=String(r.total);
          const glow=r.critico?'rgba(255,215,0,.9)':r.catastrofe?'rgba(255,40,40,.9)':r.sucesso?'rgba(100,230,100,.9)':'rgba(230,80,80,.9)';
          numEl.style.textShadow=`0 2px 10px rgba(0,0,0,.95),0 0 24px ${glow}`;
          detEl.textContent=`${r.d20}${r.modStr} = ${r.total} · CD ${r.dc}`;
        } else {
          numEl.textContent=String(r.resultado);
          numEl.style.textShadow='0 2px 10px rgba(0,0,0,.95),0 0 24px rgba(255,160,40,.85)';
          detEl.textContent=r.notacao;
        }
        numEl.classList.add('visivel');resDiv.classList.add('visivel');
        setTimeout(()=>{
          if(r.tipo==='testar'){
            if(r.catastrofe){vered.textContent='💀 CATÁSTROFE!';vered.className='dado-veredicto-jogo catastrofe visivel';}
            else if(r.critico){vered.textContent='⭐ CRÍTICO!';vered.className='dado-veredicto-jogo critico visivel';}
            else if(r.sucesso){vered.textContent='✦ ACERTO ✦';vered.className='dado-veredicto-jogo sucesso visivel';}
            else{vered.textContent='✕ FALHA ✕';vered.className='dado-veredicto-jogo falha visivel';}
          } else {vered.textContent=`🎲 ${r.resultado}`;vered.className='dado-veredicto-jogo critico visivel';}
          setTimeout(()=>{addHist(r);setTimeout(()=>next(idx+1),900);},1000);
        },500);
      });
    }
    next(0);
  }
  return {mostrar};
})();

// ══════════════════════════════════════════
//  HEX MATH
// ══════════════════════════════════════════
function hexCentro(col,row){
  return { x:GX0+col*CS, y:GY0+row*RS+(col%2===1?OOFF:0) };
}
function hexLabel(col,row){ return LETRAS[col]+String(row+1).padStart(2,'0'); }
function hexDist(c1,r1,c2,r2){
  const x1=c1,z1=r1-(c1-(c1&1))/2,y1=-x1-z1;
  const x2=c2,z2=r2-(c2-(c2&1))/2,y2=-x2-z2;
  return Math.max(Math.abs(x1-x2),Math.abs(y1-y2),Math.abs(z1-z2));
}

function hexVizinhos(col,row){
  const odd=col%2===1;
  return (odd?[
    [col+1,row+1],[col-1,row  ],[col,row+1],[col,row-1],[col+1,row  ],[col-1,row+1],
  ]:[
    [col+1,row  ],[col-1,row-1],[col,row+1],[col,row-1],[col+1,row-1],[col-1,row  ],
  ]).filter(([c,r])=>c>=0&&c<COLS&&r>=0&&r<ROWS);
}

function bfsPath(c0,r0,c1,r1,mover){
  if(c0===c1&&r0===r1) return [];
  const mv=mover??selUnit;
  const key=(c,r)=>`${c},${r}`;
  const bloq=new Set(unidades.filter(u=>u!==mv).map(u=>key(u.col,u.row)));
  const INTRANSP=new Set(['bloqueado','abismo']);
  const visited=new Set([key(c0,r0)]);
  const queue=[{col:c0,row:r0,path:[]}];
  while(queue.length){
    const{col,row,path}=queue.shift();
    for(const[nc,nr]of hexVizinhos(col,row)){
      const k=key(nc,nr);
      if(visited.has(k)) continue;
      if(INTRANSP.has(terrenoData[k])) continue;
      if(bloq.has(k)) continue;  // bloqueado: não pode passar nem pousar
      visited.add(k);
      const p=[...path,{col:nc,row:nr}];
      if(nc===c1&&nr===r1) return p;
      queue.push({col:nc,row:nr,path:p});
    }
  }
  return null;
}

function hexesInRange(col,row,range,mover){
  const mv=mover??selUnit;
  const bloq=new Set(unidades.filter(u=>u!==mv).map(u=>`${u.col},${u.row}`));
  const INTRANSP=new Set(['bloqueado','abismo']);
  const visited=new Map([[`${col},${row}`,0]]);
  const queue=[{col,row,steps:0}];
  const result=[];
  while(queue.length){
    const{col:c,row:r,steps}=queue.shift();
    if(steps>=range) continue;
    for(const[nc,nr] of hexVizinhos(c,r)){
      const k=`${nc},${nr}`;
      if(visited.has(k)) continue;
      if(INTRANSP.has(terrenoData[k])) continue;
      if(bloq.has(k)) continue; // bloqueado: não pode passar nem pousar
      visited.set(k,steps+1);
      result.push({col:nc,row:nr});
      queue.push({col:nc,row:nr,steps:steps+1});
    }
  }
  return result;
}

function screenToHex(sx,sy){
  const s=_mapScale*_zoom;
  const scrollX=_zoom>1?window.scrollX:0, scrollY=_zoom>1?window.scrollY:0;
  const offsetX=_zoom>1?0:_mapOffsetX;
  const mx=(sx-offsetX+scrollX)/s, my=(sy+scrollY)/s;
  let best=null,bestD2=Infinity;
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    const{x,y}=hexCentro(c,r);
    const d2=(mx-x)**2+(my-y)**2;
    if(d2<bestD2){bestD2=d2;best={col:c,row:r};}
  }
  return Math.sqrt(bestD2)<HR?best:null;
}

// ══════════════════════════════════════════
//  ANIMAÇÃO DE MOVIMENTO
// ══════════════════════════════════════════
function easeInOut(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }
function unitPos(u){ return u._ax!=null?{x:u._ax,y:u._ay}:hexCentro(u.col,u.row); }

function animarMovimento(unit,path,onDone){
  if(!path||!path.length){ onDone(); return; }
  let stepIdx=0,stepStart=null;
  let fromPos=hexCentro(unit.col,unit.row);
  function frame(ts){
    if(!stepStart) stepStart=ts;
    const t=easeInOut(Math.min((ts-stepStart)/MS_POR_HEX,1));
    const to=hexCentro(path[stepIdx].col,path[stepIdx].row);
    unit._ax=fromPos.x+(to.x-fromPos.x)*t;
    unit._ay=fromPos.y+(to.y-fromPos.y)*t;
    renderUnits();
    if(t>=1){
      unit.col=path[stepIdx].col; unit.row=path[stepIdx].row;
      unit._ax=null; unit._ay=null;
      stepIdx++;
      if(stepIdx>=path.length){ animating=false; onDone(); return; }
      fromPos=to; stepStart=null;
    }
    requestAnimationFrame(frame);
  }
  animating=true;
  requestAnimationFrame(frame);
}

// ══════════════════════════════════════════
//  SISTEMA DE FX (partículas + projétil)
// ══════════════════════════════════════════
let _fxParticles = [];
let _fxProj      = null;
let _fxRaf       = null;
let _fxLastTs    = null;

function _fxStart(){
  if(_fxRaf) return;
  _fxLastTs=null;
  _fxRaf=requestAnimationFrame(_fxLoop);
}
function _fxStop(){
  if(_fxRaf){ cancelAnimationFrame(_fxRaf); _fxRaf=null; }
  ctxFx.clearRect(0,0,MAP_W,MAP_H);
}

function _fxLoop(ts){
  const dt=_fxLastTs?Math.min(ts-_fxLastTs,50):16;
  _fxLastTs=ts;
  ctxFx.clearRect(0,0,MAP_W,MAP_H);

  // move e desenha projétil
  if(_fxProj){
    const p=_fxProj;
    p.elapsed+=dt;
    const frac=Math.min(p.elapsed/p.duration,1);
    p.x=p.x0+(p.x1-p.x0)*frac;
    p.y=p.y0+(p.y1-p.y0)*frac;
    _drawProj(p);
    if(frac>=1){
      _fxProj=null;
      p.onImpact(p.x1,p.y1);
    }
  }

  // trail de fogo para fireball — nasce a cada frame
  if(_fxProj&&_fxProj.kind==='fireball'&&_fxProj.elapsed>60){
    const fp=_fxProj;
    for(let i=0;i<4;i++){
      _fxParticles.push({type:'dot',
        x:fp.x+(Math.random()-.5)*16,y:fp.y+(Math.random()-.5)*16,
        vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
        gravity:.008,r:3+Math.random()*4,
        color:Math.random()<.5?'rgba(255,110,0,0.85)':'rgba(255,210,40,0.75)',
        life:80+Math.random()*130,maxLife:210});
    }
  }

  // atualiza e desenha partículas
  _fxParticles=_fxParticles.filter(p=>{
    p.life-=dt;
    if(p.life<=0) return false;
    if(p.type==='orbit'){
      p.angle=(p.angle||0)+p.angSpeed*dt;
      p.x=p.ox+Math.cos(p.angle)*p.orbitR;
      p.y=p.oy+Math.sin(p.angle)*p.orbitR;
    } else {
      p.x+=p.vx*dt*.06;
      p.y+=p.vy*dt*.06;
      p.vy+=p.gravity*dt*.06;
    }
    const alpha=p.life/p.maxLife;
    ctxFx.save();
    ctxFx.globalAlpha=alpha;
    if(p.type==='spark'){
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=6;
      ctxFx.strokeStyle=p.color;ctxFx.lineWidth=p.r*1.5;ctxFx.lineCap='round';
      ctxFx.beginPath();ctxFx.moveTo(p.x,p.y);
      ctxFx.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);ctxFx.stroke();
    } else if(p.type==='ring'){
      const r=p.r*(1-alpha)*.7+p.r*.3;
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=8;
      ctxFx.beginPath();ctxFx.arc(p.x,p.y,r,0,Math.PI*2);
      ctxFx.strokeStyle=p.color;ctxFx.lineWidth=3*alpha;ctxFx.stroke();
    } else if(p.type==='pulse'){
      const t=1-alpha;
      const r=p.r+p.dr*t;
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=30;
      ctxFx.beginPath();ctxFx.arc(p.x,p.y,r,0,Math.PI*2);
      ctxFx.strokeStyle=p.color;ctxFx.lineWidth=(10+14*(1-t))*alpha;ctxFx.stroke();
    } else if(p.type==='flash'){
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=45;
      ctxFx.beginPath();ctxFx.arc(p.x,p.y,p.r*(alpha*.7+.3),0,Math.PI*2);
      ctxFx.fillStyle=p.color;ctxFx.fill();
    } else if(p.type==='orbit'){
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=20;
      ctxFx.beginPath();ctxFx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctxFx.fillStyle=p.color;ctxFx.fill();
    } else { // dot
      ctxFx.shadowColor=p.color;ctxFx.shadowBlur=10;
      ctxFx.beginPath();ctxFx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);
      ctxFx.fillStyle=p.color;ctxFx.fill();
    }
    ctxFx.restore();
    return true;
  });

  if(_fxProj||_fxParticles.length){
    _fxRaf=requestAnimationFrame(_fxLoop);
  } else {
    _fxRaf=null;
    ctxFx.clearRect(0,0,MAP_W,MAP_H);
  }
}

function _drawProj(p){
  const ang=Math.atan2(p.y1-p.y0,p.x1-p.x0);
  const co=Math.cos(ang), si=Math.sin(ang);
  const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2);

  if(p.kind==='arrow'){
    const barLen=68;
    const tipX=p.x+co*barLen*.5, tipY=p.y+si*barLen*.5;
    const tailX=p.x-co*barLen*.5, tailY=p.y-si*barLen*.5;
    const precise=p.subkind==='tiro_preciso';

    ctxFx.save();

    if(precise){
      // rastro de energia azul-branca para Tiro Preciso
      const eg=ctxFx.createLinearGradient(tailX-co*65,tailY-si*65,tailX,tailY);
      eg.addColorStop(0,'rgba(120,180,255,0)');
      eg.addColorStop(0.55,'rgba(160,210,255,0.35)');
      eg.addColorStop(1,'rgba(220,240,255,0.60)');
      ctxFx.strokeStyle=eg; ctxFx.lineWidth=20; ctxFx.lineCap='round';
      ctxFx.beginPath(); ctxFx.moveTo(tailX-co*65,tailY-si*65);
      ctxFx.lineTo(tailX,tailY); ctxFx.stroke();
      ctxFx.shadowColor='#88bbff'; ctxFx.shadowBlur=18;
    } else {
      ctxFx.shadowColor='#445566'; ctxFx.shadowBlur=6;
    }

    // barra metálica cinza escura — gradiente lateral para efeito 3D
    const bg=ctxFx.createLinearGradient(
      p.x+px*4,p.y+py*4, p.x-px*4,p.y-py*4);
    bg.addColorStop(0,'#8899bb');
    bg.addColorStop(0.3,'#334455');
    bg.addColorStop(0.65,'#222233');
    bg.addColorStop(1,'#445566');
    ctxFx.strokeStyle=bg; ctxFx.lineWidth=precise?7.5:6.5;
    ctxFx.lineCap='round';
    ctxFx.beginPath(); ctxFx.moveTo(tailX,tailY);
    ctxFx.lineTo(tipX,tipY); ctxFx.stroke();

    // destaque brilhante na aresta superior (realce metálico)
    ctxFx.shadowBlur=0;
    ctxFx.strokeStyle=precise?'rgba(180,220,255,0.75)':'rgba(160,200,220,0.55)';
    ctxFx.lineWidth=1.5;
    ctxFx.beginPath();
    ctxFx.moveTo(tailX+px*2,tailY+py*2);
    ctxFx.lineTo(tipX+px*2,tipY+py*2);
    ctxFx.stroke();

    ctxFx.restore();

  } else if(p.kind==='fireball'){
    const tailLen=Math.min(95+p.elapsed*.045,160);
    const r=19+Math.sin(p.elapsed*.022)*4;
    ctxFx.save();

    // cauda longa em gradiente — efeito cometa
    const tg=ctxFx.createLinearGradient(p.x-co*tailLen,p.y-si*tailLen,p.x,p.y);
    tg.addColorStop(0,'rgba(200,30,0,0)');
    tg.addColorStop(0.35,'rgba(255,80,0,0.28)');
    tg.addColorStop(0.70,'rgba(255,170,0,0.62)');
    tg.addColorStop(1,'rgba(255,240,80,0.85)');
    ctxFx.shadowColor='#ff5500'; ctxFx.shadowBlur=35;
    ctxFx.strokeStyle=tg; ctxFx.lineWidth=26; ctxFx.lineCap='round';
    ctxFx.beginPath();
    ctxFx.moveTo(p.x-co*tailLen,p.y-si*tailLen);
    ctxFx.lineTo(p.x,p.y); ctxFx.stroke();

    // linha brilhante interna
    const tg2=ctxFx.createLinearGradient(p.x-co*tailLen*.6,p.y-si*tailLen*.6,p.x,p.y);
    tg2.addColorStop(0,'rgba(255,220,0,0)');
    tg2.addColorStop(1,'rgba(255,255,200,1)');
    ctxFx.strokeStyle=tg2; ctxFx.lineWidth=7;
    ctxFx.beginPath();
    ctxFx.moveTo(p.x-co*tailLen*.6,p.y-si*tailLen*.6);
    ctxFx.lineTo(p.x,p.y); ctxFx.stroke();

    // núcleo brilhante
    const cg=ctxFx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.8);
    cg.addColorStop(0,'rgba(255,255,230,1)');
    cg.addColorStop(0.22,'rgba(255,200,40,0.95)');
    cg.addColorStop(0.55,'rgba(255,60,0,0.75)');
    cg.addColorStop(1,'rgba(180,0,0,0)');
    ctxFx.shadowColor='#ff3300'; ctxFx.shadowBlur=55;
    ctxFx.beginPath(); ctxFx.arc(p.x,p.y,r*2.8,0,Math.PI*2);
    ctxFx.fillStyle=cg; ctxFx.fill();

    ctxFx.restore();

  } else if(p.kind==='magic'){
    ctxFx.save();
    ctxFx.shadowColor='#cc44ff'; ctxFx.shadowBlur=32;

    // aura central
    const cg=ctxFx.createRadialGradient(p.x,p.y,0,p.x,p.y,22);
    cg.addColorStop(0,'rgba(255,210,255,0.95)');
    cg.addColorStop(0.45,'rgba(180,60,255,0.82)');
    cg.addColorStop(1,'rgba(70,0,140,0)');
    ctxFx.beginPath(); ctxFx.arc(p.x,p.y,22,0,Math.PI*2);
    ctxFx.fillStyle=cg; ctxFx.fill();

    // cauda roxa mais fina
    const tg=ctxFx.createLinearGradient(p.x-co*55,p.y-si*55,p.x,p.y);
    tg.addColorStop(0,'rgba(140,0,220,0)');
    tg.addColorStop(1,'rgba(200,80,255,0.5)');
    ctxFx.strokeStyle=tg; ctxFx.lineWidth=10; ctxFx.lineCap='round';
    ctxFx.beginPath(); ctxFx.moveTo(p.x-co*55,p.y-si*55);
    ctxFx.lineTo(p.x,p.y); ctxFx.stroke();

    // orbs orbitando
    const t=p.elapsed*.0045;
    for(let i=0;i<3;i++){
      const a=t+i*Math.PI*2/3;
      ctxFx.shadowBlur=14;
      ctxFx.beginPath(); ctxFx.arc(p.x+Math.cos(a)*14,p.y+Math.sin(a)*14,4,0,Math.PI*2);
      ctxFx.fillStyle='rgba(230,160,255,0.95)'; ctxFx.fill();
    }
    ctxFx.restore();
  }
}

// ── Spawna partículas de impacto ──

    _fxParticles.push({type:'flash',x,y,vx:0,vy:0,gravity:0,r:70,color:'rgba(255,140,20,0.88)',life:260,maxLife:260});
    // 4 anéis de pulso expansivos
    const _fb=[
      {dr: 95,color:'rgba(255,255,190,0.92)',life:320},
      {dr:148,color:'rgba(255,110,0,0.82)',  life:490},
      {dr:192,color:'rgba(255,40,0,0.65)',   life:640},
      {dr:238,color:'rgba(180,10,0,0.38)',   life:800},

    // sparks rápidos

    // brasas grossas

      const a=Math.random()*Math.PI*2,sp=2.5+Math.random()*5.5;

  } else if(kind==='magic'){
    _fxParticles.push({type:'flash',x,y,vx:0,vy:0,gravity:0,r:90,color:'rgba(220,140,255,0.92)',life:165,maxLife:165});
    _fxParticles.push({type:'flash',x,y,vx:0,vy:0,gravity:0,r:58,color:'rgba(255,220,255,0.88)',life:130,maxLife:130});
    const _mg=[
      {dr: 90,color:'rgba(255,220,255,0.90)',life:310},
      {dr:138,color:'rgba(200,80,255,0.78)', life:470},
      {dr:180,color:'rgba(130,0,210,0.55)',  life:600},
    ];
    for(const pd of _mg) _fxParticles.push({type:'pulse',x,y,vx:0,vy:0,gravity:0,r:4,dr:pd.dr,color:pd.color,life:pd.life,maxLife:pd.life});
    for(let i=0;i<34;i++){
      const a=Math.random()*Math.PI*2,sp=4+Math.random()*9;
      _fxParticles.push({type:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,gravity:.02,r:2+Math.random()*2.5,color:Math.random()<.5?'#cc66ff':'#ffaaff',life:300+Math.random()*400,maxLife:700});
    }
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*4;
      _fxParticles.push({type:'dot',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,gravity:-.005,r:3+Math.random()*3,color:Math.random()<.5?'rgba(180,80,255,0.85)':'rgba(255,200,255,0.80)',life:500+Math.random()*600,maxLife:1100});

    _fxParticles.push({type:'flash',x,y,vx:0,vy:0,gravity:0,r:28,color:'rgba(255,220,100,0.7)',life:140,maxLife:140});

      const sp=2+Math.random()*4;
      _fxParticles.push({type:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,gravity:.05,r:1.5+Math.random()*2,color:Math.random()<.5?'#ffdd88':'#ffffff',life:200+Math.random()*250,maxLife:450});

  _fxStart();

// ── Aura de buff sobre o personagem (dura ~2.2s) ──
function spawnAura(cx,cy,kind){
  const C={
    shield:{ flash:'rgba(60,140,255,0.80)', ring:'rgba(80,160,255,0.85)', orb:'#88ccff', rise:'rgba(100,180,255,0.75)' },
    fury:  { flash:'rgba(255,70,0,0.85)',   ring:'rgba(255,110,0,0.88)', orb:'#ffaa22', rise:'rgba(255,200,0,0.80)'  },
    cure:  { flash:'rgba(0,210,80,0.80)',   ring:'rgba(50,230,110,0.85)',orb:'#88ffaa', rise:'rgba(140,255,180,0.75)' },
  }[kind];

  // flash central grande
  _fxParticles.push({type:'flash',x:cx,y:cy,vx:0,vy:0,gravity:0,
    r:90,color:C.flash,life:370,maxLife:370});
  _fxParticles.push({type:'flash',x:cx,y:cy,vx:0,vy:0,gravity:0,
    r:55,color:'rgba(255,255,255,0.70)',life:180,maxLife:180});

  // 2 anéis de pulso de impacto iniciais (grandes e rápidos)
  _fxParticles.push({type:'pulse',x:cx,y:cy,vx:0,vy:0,gravity:0,r:5,dr:110,color:C.ring,life:380,maxLife:380});
  _fxParticles.push({type:'pulse',x:cx,y:cy,vx:0,vy:0,gravity:0,r:5,dr:155,color:C.flash,life:280,maxLife:280});

  // 5 anéis de pulso escalonados (duradouros)
  for(let i=0;i<5;i++){
    _fxParticles.push({type:'pulse',x:cx,y:cy,vx:0,vy:0,gravity:0,
      r:5,dr:95,color:C.ring,
      life:2000-i*340,maxLife:2000-i*340});
  }

  // 3 orbs orbitando (anel interno)
  for(let i=0;i<3;i++){
    _fxParticles.push({type:'orbit',ox:cx,oy:cy,x:cx,y:cy,
      angle:i*Math.PI*2/3,
      angSpeed:kind==='fury'?0.0085:0.0052,
      orbitR:32,r:7,color:C.orb,
      vx:0,vy:0,gravity:0,life:2200,maxLife:2200});
  }

  // 4 orbs orbitando (anel externo — sentido inverso)
  for(let i=0;i<4;i++){
    _fxParticles.push({type:'orbit',ox:cx,oy:cy,x:cx,y:cy,
      angle:i*Math.PI*2/4+Math.PI/4,
      angSpeed:kind==='fury'?-0.006:-0.0038,
      orbitR:52,r:5.5,color:C.rise,
      vx:0,vy:0,gravity:0,life:2200,maxLife:2200});
  }

  // partículas subindo (para todos, mas fúria mais rápidas)
  const speedMult=kind==='fury'?2.2:1.0;
  for(let i=0;i<30;i++){
    const a=(kind==='fury')?-(Math.random()*.8+0.1)*Math.PI:Math.random()*Math.PI*2;
    const sp=(1.5+Math.random()*3.5)*speedMult;
    _fxParticles.push({
      type:kind==='fury'?'spark':'dot',
      x:cx+(Math.random()-.5)*22, y:cy+(Math.random()-.5)*22,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(kind==='fury'?1.8:0.9),
      gravity:kind==='fury'?.012:-.004,
      r:2.5+Math.random()*3, color:Math.random()<.5?C.flash:C.rise,
      life:700+Math.random()*1000, maxLife:1700});
  }

  _fxStart();
}

// ── Lança projétil do ataque ──
function lancarAtaque(hab,atacante,alvoUnit,onDone){
  const from=hexCentro(atacante.col,atacante.row);
  const to=hexCentro(alvoUnit.col,alvoUnit.row);

  // centro visual do sprite do atacante (meio do corpo, não chão)
  const charCY = from.y - HR * 1.3;

  if(hab.anim==='melee'){
    spawnImpact(to.x,to.y,'melee');
    setTimeout(onDone,500);
    return;
  }
  if(hab.anim==='shield'){
    spawnAura(from.x,charCY,'shield');
    setTimeout(onDone,2300);
    return;
  }
  if(hab.anim==='fury'){
    spawnAura(from.x,charCY,'fury');
    setTimeout(onDone,2300);
    return;
  }
  if(hab.anim==='cure'){
    spawnAura(from.x,charCY,'cure');
    setTimeout(onDone,2300);
    return;
  }

  // Altura do peito: deslocar para cima em relação ao centro do hex
  const chestOffset = HR * 1.3;
  const fy = from.y - chestOffset;
  const ty = to.y - chestOffset;
  const dist=Math.hypot(to.x-from.x,ty-fy);
  const speeds={ arrow:0.9, fireball:0.45, magic:0.55 };
  const speed=speeds[hab.anim]||0.55;
  const duration=dist/speed;

  _fxProj={
    kind:hab.anim, subkind:hab.id,
    x:from.x, y:fy, x0:from.x, y0:fy, x1:to.x, y1:ty,
    elapsed:0, duration,
    onImpact:(ix,iy)=>{
      spawnImpact(ix,iy,hab.anim);
      setTimeout(onDone,600);
    }
  };
  _fxStart();
}

//  HELPERS DE DESENHO CANVAS
// ══════════════════════════════════════════
function hexPath(ctx,x,y){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i;
    i===0?ctx.moveTo(x+HR*Math.cos(a),y+HR*Math.sin(a)):ctx.lineTo(x+HR*Math.cos(a),y+HR*Math.sin(a));
  }
  ctx.closePath();
}

function drawAttackArrow(ctx,x1,y1,x2,y2){
  const ang=Math.atan2(y2-y1,x2-x1);
  const sx=x1+Math.cos(ang)*HR*.28, sy=y1+Math.sin(ang)*HR*.28;
  const ex=x2-Math.cos(ang)*HR*.30, ey=y2-Math.sin(ang)*HR*.30;
  const HL=20,HW=10;
  const hbx=ex-Math.cos(ang)*HL, hby=ey-Math.sin(ang)*HL;
  const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2);
  const passes=[
    {color:'rgba(255,80,0,0.16)',lw:14,blur:22},
    {color:'rgba(255,140,40,0.75)',lw:4,blur:10},
    {color:'#ffc080',lw:2,blur:3},
  ];
  for(const p of passes){
    ctx.save();
    ctx.shadowColor=p.color; ctx.shadowBlur=p.blur;
    ctx.strokeStyle=p.color; ctx.fillStyle=p.color;
    ctx.lineWidth=p.lw; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(hbx,hby); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex,ey); ctx.lineTo(hbx+px*HW,hby+py*HW); ctx.lineTo(hbx-px*HW,hby-py*HW);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawArrow(ctx,x1,y1,x2,y2){
  const ang=Math.atan2(y2-y1,x2-x1);
  const sx=x1+Math.cos(ang)*HR*.28, sy=y1+Math.sin(ang)*HR*.28;
  const ex=x2-Math.cos(ang)*HR*.30, ey=y2-Math.sin(ang)*HR*.30;
  const HL=20,HW=10;
  const hbx=ex-Math.cos(ang)*HL, hby=ey-Math.sin(ang)*HL;
  const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2);
  const passes=[
    {color:'rgba(0,150,255,0.22)',lw:14,blur:24},
    {color:'rgba(60,200,255,0.65)',lw:4,blur:10},
    {color:'#c0f0ff',lw:2,blur:4},
  ];
  for(const p of passes){
    ctx.save();
    ctx.shadowColor=p.color; ctx.shadowBlur=p.blur;
    ctx.strokeStyle=p.color; ctx.fillStyle=p.color;
    ctx.lineWidth=p.lw; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(hbx,hby); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex,ey); ctx.lineTo(hbx+px*HW,hby+py*HW); ctx.lineTo(hbx-px*HW,hby-py*HW);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ══════════════════════════════════════════
//  RENDER: TERRENO
// ══════════════════════════════════════════
const TERRENO_COR={
  bloqueado:'rgba(200,40,40,0.45)',cobertura_baixa:'rgba(220,185,0,0.40)',
  cobertura_alta:'rgba(220,110,0,0.43)',elevado:'rgba(50,100,230,0.40)',
  dificil:'rgba(130,80,25,0.43)',abismo:'rgba(5,5,10,0.75)',
};
function renderTerrain(){
  ctxTer.clearRect(0,0,MAP_W,MAP_H);
  for(const[k,tipo]of Object.entries(terrenoData)){
    const cor=TERRENO_COR[tipo]; if(!cor) continue;
    const[c,r]=k.split(',').map(Number);
    const{x,y}=hexCentro(c,r);
    hexPath(ctxTer,x,y); ctxTer.fillStyle=cor; ctxTer.fill();
  }
}

// ══════════════════════════════════════════
//  RENDER: SELEÇÃO + RANGE + SETA
// ══════════════════════════════════════════
function renderSel(){
  ctxS.clearRect(0,0,MAP_W,MAP_H);
  renderRemoteIntents();
  if(!selUnit) return;

  if(modoAtaque){
    if(habAtual?.areaRaio>0){
      // AoE: zona de lançamento em roxo suave
      for(const h of atkTargets){
        const{x,y}=hexCentro(h.col,h.row);
        hexPath(ctxS,x,y);
        ctxS.fillStyle='rgba(180,60,255,0.08)'; ctxS.fill();
      }
      // Preview da explosão ao redor do hex selecionado
      if(areaPreview){
        for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
          if(hexDist(areaPreview.col,areaPreview.row,c,r)<=habAtual.areaRaio){
            const{x,y}=hexCentro(c,r);
            hexPath(ctxS,x,y);
            ctxS.fillStyle='rgba(255,110,0,0.32)'; ctxS.fill();
            ctxS.save(); ctxS.shadowColor='#ff6600'; ctxS.shadowBlur=12;
            ctxS.strokeStyle='rgba(255,170,0,0.85)'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
          }
        }
        const fp=posEfetiva(selUnit);
        const from=hexCentro(fp.col,fp.row);
        const{x,y}=hexCentro(areaPreview.col,areaPreview.row);
        drawArrow(ctxS,from.x,from.y,x,y);
      }
    } else {
      // single-target: range em vermelho/laranja
      for(const h of atkTargets){
        const{x,y}=hexCentro(h.col,h.row);
        hexPath(ctxS,x,y);
        ctxS.fillStyle='rgba(255,60,0,0.18)'; ctxS.fill();
        ctxS.strokeStyle='rgba(255,100,0,0.55)'; ctxS.lineWidth=1.5; ctxS.stroke();
      }
    }
  } else {
    // range de movimento em azul
    for(const h of moveHexes){
      const{x,y}=hexCentro(h.col,h.row);
      hexPath(ctxS,x,y); ctxS.fillStyle='rgba(30,140,255,0.18)'; ctxS.fill();
      ctxS.strokeStyle='rgba(70,180,255,0.55)'; ctxS.lineWidth=1.5; ctxS.stroke();
    }
  }

  // hex do selecionado (amarelo)
  {
    const{x,y}=hexCentro(selUnit.col,selUnit.row);
    hexPath(ctxS,x,y); ctxS.fillStyle='rgba(255,210,40,0.25)'; ctxS.fill();
    ctxS.strokeStyle='#ffd028'; ctxS.lineWidth=2.5; ctxS.stroke();
  }

  // preview de hex em mover_ativo (verde — aguardando confirmação)
  if(faseDoTurno==='mover_ativo' && hexPreview){
    const{x,y}=hexCentro(hexPreview.col,hexPreview.row);
    hexPath(ctxS,x,y); ctxS.fillStyle='rgba(40,220,100,0.28)'; ctxS.fill();
    ctxS.save(); ctxS.shadowColor='#40ff80'; ctxS.shadowBlur=16;
    ctxS.strokeStyle='#60ffaa'; ctxS.lineWidth=2.5; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
    const from=hexCentro(selUnit.col,selUnit.row);
    drawArrow(ctxS,from.x,from.y,x,y);
  }

  // alvo de movimento confirmado (azul)
  if(!modoAtaque && targetHex && faseDoTurno!=='mover_ativo'){
    const{x,y}=hexCentro(targetHex.col,targetHex.row);
    hexPath(ctxS,x,y); ctxS.fillStyle='rgba(0,160,255,0.38)'; ctxS.fill();
    ctxS.save(); ctxS.shadowColor='#00d4ff'; ctxS.shadowBlur=14;
    ctxS.strokeStyle='#40e0ff'; ctxS.lineWidth=2.5; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
    const from=hexCentro(selUnit.col,selUnit.row);
    drawArrow(ctxS,from.x,from.y,x,y);
  }

  // AoE confirmado: mostra raio de explosão + seta
  if(planoAtaque?.alvoHex){
    const ctr=planoAtaque.alvoHex;
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
      if(hexDist(ctr.col,ctr.row,c,r)<=planoAtaque.hab.areaRaio){
        const{x,y}=hexCentro(c,r);
        hexPath(ctxS,x,y);
        ctxS.fillStyle='rgba(255,100,0,0.28)'; ctxS.fill();
        ctxS.save(); ctxS.shadowColor='#ff6600'; ctxS.shadowBlur=12;
        ctxS.strokeStyle='rgba(255,150,0,0.75)'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
      }
    }
    const fromPos=(planoMovimento&&planoMovimento.unit===planoAtaque.atacante&&planoMovimento.path.length>0)
      ?planoMovimento.path[planoMovimento.path.length-1]:planoAtaque.atacante;
    const from=hexCentro(fromPos.col,fromPos.row);
    const{x:tx,y:ty}=hexCentro(ctr.col,ctr.row);
    drawAttackArrow(ctxS,from.x,from.y,tx,ty);
  // seta de intenção de ataque single-target (laranja)
  } else if(planoAtaque && planoAtaque.alvo && planoAtaque.alvo!==planoAtaque.atacante){
    const{x:tx,y:ty}=hexCentro(planoAtaque.alvo.col,planoAtaque.alvo.row);
    hexPath(ctxS,tx,ty); ctxS.fillStyle='rgba(255,60,0,0.22)'; ctxS.fill();
    ctxS.save(); ctxS.shadowColor='#ff4400'; ctxS.shadowBlur=16;
    ctxS.strokeStyle='#ff6622'; ctxS.lineWidth=2.5; hexPath(ctxS,tx,ty); ctxS.stroke(); ctxS.restore();
    const fromPos=(planoMovimento&&planoMovimento.unit===planoAtaque.atacante&&planoMovimento.path.length>0)
      ?planoMovimento.path[planoMovimento.path.length-1]
      :planoAtaque.atacante;
    const from=hexCentro(fromPos.col,fromPos.row);
    drawAttackArrow(ctxS,from.x,from.y,tx,ty);
  }
}

// ══════════════════════════════════════════
//  RENDER: GRID
// ══════════════════════════════════════════
function renderGrid(){
  ctxH.clearRect(0,0,MAP_W,MAP_H);

  // Hexes ocupados: posição lógica de cada unidade viva
  const ocupados={};
  for(const u of unidades){
    if(!u||(u.tipo==='inimigo'&&u.hp<=0)) continue;
    ocupados[`${u.col},${u.row}`]=u.tipo;
  }

  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    const{x,y}=hexCentro(c,r);
    const oTipo=ocupados[`${c},${r}`];

    // Fill de ocupação (antes do outline branco)
    if(oTipo){
      hexPath(ctxH,x,y);
      ctxH.fillStyle=oTipo==='heroi'?'rgba(60,140,255,0.10)':'rgba(255,60,60,0.10)';
      ctxH.fill();
    }

    // Grid padrão branco
    hexPath(ctxH,x,y); ctxH.strokeStyle='#ffffff'; ctxH.lineWidth=1.2; ctxH.stroke();

    // Borda colorida sobre o hex ocupado
    if(oTipo){
      hexPath(ctxH,x,y);
      ctxH.strokeStyle=oTipo==='heroi'?'rgba(80,160,255,0.65)':'rgba(255,80,80,0.65)';
      ctxH.lineWidth=2; ctxH.stroke();
    }

    if(showCoords){
      const lbl=hexLabel(c,r);
      ctxH.font='bold 12px Segoe UI,sans-serif';
      ctxH.textAlign='center'; ctxH.textBaseline='middle';
      const tw=ctxH.measureText(lbl).width;
      ctxH.fillStyle='rgba(0,0,0,0.62)';
      ctxH.beginPath(); ctxH.roundRect(x-tw/2-3,y-9,tw+6,18,3); ctxH.fill();
      ctxH.fillStyle='#fff'; ctxH.fillText(lbl,x,y);
    }
  }
}

// ══════════════════════════════════════════
//  RENDER: UNIDADES
// ══════════════════════════════════════════
function renderUnits(){
  ctxU.clearRect(0,0,MAP_W,MAP_H);
  for(const u of unidades){
    if(!u) continue;
    if(u.tipo==='inimigo'&&u.hp<=0) continue; // inimigo morto some imediatamente
    const{x,y}=unitPos(u);
    if(u.img && u.tipo==='inimigo'){
      // Portrait circular (medallion) para inimigos
      const r = HR * 0.52;
      const cx = x, cy = y;
      const srcW = u.img.naturalWidth;
      const srcH = u.img.naturalHeight;
      const cropH = Math.round(srcH * 0.55);
      ctxU.save();
      ctxU.beginPath();
      ctxU.arc(cx, cy - HR * 0.1, r, 0, Math.PI * 2);
      ctxU.clip();
      if(u===selUnit){ ctxU.shadowColor='#ffd028'; ctxU.shadowBlur=12; }
      ctxU.drawImage(u.img, 0, 0, srcW, cropH, cx - r, cy - HR * 0.1 - r, r * 2, r * 2);
      ctxU.restore();
      ctxU.beginPath();
      ctxU.arc(cx, cy - HR * 0.1, r, 0, Math.PI * 2);
      ctxU.strokeStyle = u===selUnit ? '#ffd028' : 'rgba(200,60,30,0.8)';
      ctxU.lineWidth = u===selUnit ? 3 : 2;
      ctxU.stroke();
    } else if(u.img){
      const foot = y + OOFF * .3;
      const clip = u.clipBottom || 0;

      let sw, drawH;
      if(u.classId && u.img.naturalWidth > 0){
        // Standee de classe: altura = storedH do PNG (calibrado no Size tab)
        // sem compressão para SW fixo. Mantém aspecto real.
        const _szH  = (()=>{try{return JSON.parse(localStorage.getItem('oraculo_sz_heights')||'{}')}catch(e){return{}}})();
        const _cH   = _szH['classe:'+u.classId+'_'+u.gender];
        const _defH = {barbaro:{m:400,f:362},guerreiro:{m:338,f:300},arqueiro:{m:290,f:284},mago:{m:290,f:290},ladino:{m:314,f:330},clerigo:{m:306,f:298}}[u.classId]?.[u.gender]||300;
        const targetH = (_cH || _defH) * 0.5 * (1 - clip);
        drawH = targetH;
        sw    = targetH * (u.img.naturalWidth / u.img.naturalHeight);
      } else if(u.frameW){
        // Sprite sheet (costas/frente): usa frameW para altura proporcional
        sw    = HR * 3.2;
        drawH = sw * (u.img.naturalHeight / u.frameW) * (1 - clip);
      } else {
        sw    = HR * 3.2;
        drawH = sw * (1 - clip);
      }

      const srcW = u.frameW ?? u.img.naturalWidth;
      const srcH = u.img.naturalHeight * (1 - clip);
      ctxU.save();
      if(u===selUnit) ctxU.filter='drop-shadow(0 0 8px #ffd028) drop-shadow(0 0 14px #ffd02888)';
      if(u.flipH){ ctxU.translate(2*x,0); ctxU.scale(-1,1); }
      ctxU.drawImage(u.img, 0, 0, srcW, srcH, x - sw/2, foot - drawH, sw, drawH);
      ctxU.restore();
    } else {
      ctxU.beginPath(); ctxU.arc(x,y,HR*.45,0,Math.PI*2);
      ctxU.fillStyle=u.cor; ctxU.fill();
      ctxU.strokeStyle='rgba(255,255,255,.7)'; ctxU.lineWidth=2; ctxU.stroke();
    }
    const ly=y+OOFF-14;
    if(u.tipo==='inimigo'){
      const bw=56,bh=14;
      const bx=Math.round(x-bw/2),by=ly-18;
      const ratio=Math.max(0,Math.min(1,u.hp/u.maxHp));
      ctxU.fillStyle='rgba(0,0,0,.82)'; ctxU.fillRect(bx,by,bw,bh);
      ctxU.fillStyle=ratio>0.6?'#44bb22':ratio>0.3?'#ddaa00':'#cc2200';
      ctxU.fillRect(bx,by,Math.round(bw*ratio),bh);
      ctxU.strokeStyle='rgba(255,255,255,.25)'; ctxU.lineWidth=1;
      ctxU.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    }
    ctxU.font='bold 10px Segoe UI,sans-serif';
    const lw=ctxU.measureText(u.nome).width+10;
    ctxU.fillStyle='rgba(0,0,0,.78)';
    ctxU.beginPath(); ctxU.roundRect(x-lw/2,ly,lw,14,3); ctxU.fill();
    ctxU.fillStyle='#c8e8ff'; ctxU.textAlign='center'; ctxU.textBaseline='middle';
    ctxU.fillText(u.nome,x,ly+7);
  }
}

function render(){ renderTerrain(); renderSel(); renderGrid(); renderUnits(); }

function _updateVerbBtns(){
  const estados = {
    'planejar_mover':  {mover:true,  atacar:false, skill:false, acaolivre:true},
    'mover_ativo':     {mover:true,  atacar:false, skill:false, acaolivre:false},
    'planejar_acao':   {mover:false, atacar:true,  skill:true,  acaolivre:true},
    'acao_ativa':      {mover:false, atacar:false, skill:false, acaolivre:false},
    'acao_pronta':     {mover:false, atacar:false, skill:false, acaolivre:false},
    'resolvendo':      {mover:false, atacar:false, skill:false, acaolivre:false},
    'turno_inimigo':   {mover:false, atacar:false, skill:false, acaolivre:false},
    'aguardando':      {mover:false, atacar:false, skill:false, acaolivre:false},
    'idle':            {mover:false, atacar:false, skill:false, acaolivre:false},
  };
  const e = estados[faseDoTurno] || {mover:false,atacar:false,skill:false,acaolivre:false};
  // mover, atacar, skill usam prefixo direto; ação livre tem id btn-acao-livre
  ['mover','atacar','skill'].forEach(k=>{
    const btn = document.getElementById('btn-'+k);
    if(!btn) return;
    btn.classList.toggle('ativo', e[k]);
    btn.classList.toggle('inativo', !e[k]);
    btn.disabled = !e[k];
  });
  const btnAl = document.getElementById('btn-acao-livre');
  if(btnAl){
    btnAl.classList.toggle('ativo', e.acaolivre);
    btnAl.classList.toggle('inativo', !e.acaolivre);
    btnAl.disabled = !e.acaolivre;
  }
}

function cancelarAcaoPlano(){
  planoAtaque=null; modoAtaque=false; habAtual=null;
  areaPreview=null; atkTargets=[];
  faseDoTurno='planejar_acao';
  _broadcastIntent();
  renderActionRow(); renderBottomPanel();
}
window.cancelarAcaoPlano = cancelarAcaoPlano;

function confirmarAlvoUnico(){
  if(!habAtual||!selUnit) return;
  // Usa primeiro atkTarget ou procura o único inimigo em alcance
  const t = atkTargets[0];
  const alvo = t
    ? unidades.find(u=>u.col===t.col&&u.row===t.row&&u.tipo==='inimigo'&&u.hp>0)
    : unidades.filter(u=>u.tipo==='inimigo'&&u.hp>0)[0];
  if(!alvo){ cancelarAtaqueAtual(); return; }
  planoAtaque={hab:habAtual, atacante:selUnit, alvo};
  modoAtaque=false; habAtual=null; atkTargets=[];
  faseDoTurno='acao_pronta';
  _broadcastIntent();
  renderActionRow(); renderSel(); renderBottomPanel();
}
window.confirmarAlvoUnico = confirmarAlvoUnico;

function renderActionRow(){
  const row = document.getElementById('action-row');
  if(!row) return;
  _updateVerbBtns();

  const configs = {
    'idle':           [],
    'planejar_mover': [
      {id:'btn-nao-mover',icon:'⏭', label:'SEM MOVER', fn:'clicarNaoMover()', ativo:true},
    ],
    'mover_ativo': [
      {id:'btn-cancelar', icon:'✕', label:'CANCELAR',  fn:'cancelarMover()',    ativo:true},
      ...(hexPreview ? [{id:'btn-ok-mov', icon:'✓', label:'OK', fn:'confirmarHexMover()', ativo:true}] : []),
    ],
    'planejar_acao': [
      {id:'btn-finalizar',icon:'⏭', label:'PULAR ATAQUE', fn:'finalizarTurno()', ativo:true},
    ],
    'acao_ativa': [
      {id:'btn-cancelar', icon:'✕', label:'CANCELAR', fn:'cancelarAtaqueAtual()', ativo:true},
      ...(habAtual?.areaRaio>0
        // AoE: confirmação acontece no toque do hex, só CANCELAR aqui
        ? []
        // Alvo único: botão de confirmar direto
        : atkTargets.length===1
          ? [{id:'btn-confirmar', icon:'✓', label:'CONFIRMAR', fn:'confirmarAlvoUnico()', ativo:true}]
          : []
      ),
    ],
    'acao_pronta': [
      {id:'btn-cancelar', icon:'✕', label:'CANCELAR',      fn:'cancelarAcaoPlano()', ativo:true},
      {id:'btn-finalizar',icon:'✓', label:'FINALIZAR TURNO', fn:'finalizarTurno()', ativo:true, extra:'destaque'},
    ],
    'resolvendo':    [],
    'turno_inimigo': [],
    'aguardando':    [],
  };

  const btns = configs[faseDoTurno] || [];
  // Ajusta grid para número de botões
  row.style.gridTemplateColumns = btns.length <= 1 ? '1fr' : btns.length === 2 ? '1fr 2fr' : `repeat(${btns.length},1fr)`;
  row.innerHTML = btns.map(b=>`
    <button class="act-btn${b.ativo?' ativo':''}${b.extra?' '+b.extra:''}" id="${b.id}"
      ${b.ativo?`onclick="${b.fn}"`:'disabled'}
      style="${b.ativo?'':'cursor:not-allowed;'}" >
      <span class="btn-icon">${b.icon}</span>
      <span class="btn-label">${b.label}</span>
    </button>`).join('');
}

function iniciarTurno(unit){
  planoMovimento=null; planoAtaque=null; movBloqueado=false;
  selUnit=unit; moveHexes=[]; targetHex=null; hexPreview=null;
  modoAtaque=false; habAtual=null; atkTargets=[]; areaPreview=null;
  _broadcastIntent();
  faseDoTurno='planejar_mover';
  const ehHeroi = unit.tipo==='heroi';
  const sub = ehHeroi ? 'escolha sua ação' : 'turno do inimigo';
  // Herói: usa o NOME DO JOGADOR (não a classe); inimigo: nome da criatura
  const displayNome = ehHeroi ? (unit.nomeJogador || unit.nome) : unit.nome;

    _updateLogStrip('Turno de '+displayNome);
    render(); renderActionRow(); renderBottomPanel();

function confirmarAoeAlvo(){
  if(!areaPreview||!habAtual||!selUnit) return;
  const areaAlvos=unidades.filter(u=>
    u.tipo==='inimigo'&&u.hp>0&&
    hexDist(areaPreview.col,areaPreview.row,u.col,u.row)<=habAtual.areaRaio
  );
  planoAtaque={
    hab:habAtual, atacante:selUnit,
    alvoHex:{col:areaPreview.col,row:areaPreview.row},
    alvo:{col:areaPreview.col,row:areaPreview.row},
    areaAlvos
  };
  modoAtaque=false; habAtual=null; atkTargets=[]; areaPreview=null;
  faseDoTurno='acao_pronta';
  _broadcastIntent();
  renderActionRow(); renderBottomPanel(); renderSel();

function voltarParaAlvo(){
  if(!planoAtaque) return;
  const hab=planoAtaque.hab;
  if(!hab||hab.alcance===0||hab.tipo==='buff') return;
  planoAtaque=null; areaPreview=null;
  habAtual=hab; modoAtaque=true;
  const _pos=posEfetiva(selUnit);
  if(hab.areaRaio>0){
    const allHexes=[];
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
      if(hexDist(_pos.col,_pos.row,c,r)<=hab.alcance) allHexes.push({col:c,row:r});
    }
    atkTargets=allHexes;
  } else {
    atkTargets=unidades.filter(u=>u.tipo==='inimigo'&&u.hp>0&&
      hexDist(_pos.col,_pos.row,u.col,u.row)<=hab.alcance).map(u=>({col:u.col,row:u.row}));
  }
  faseDoTurno='acao_ativa';
  _broadcastIntent();
  renderActionRow(); renderSel(); renderBottomPanel();
}

function confirmarMovimento(){

  if(!hexPreview) return;
  // Guard against race condition: another unit may have moved here after moveHexes was calculated
  if(unidades.some(u=>u!==selUnit&&u.col===hexPreview.col&&u.row===hexPreview.row)){
    hexPreview=null; cancelarMover(); return;
  }
  const path=bfsPath(selUnit.col,selUnit.row,hexPreview.col,hexPreview.row);
  planoMovimento={unit:selUnit, path};
  targetHex=hexPreview;
  hexPreview=null;
  faseDoTurno='planejar_acao';

  render();

  // Heróis caminham para posições ao redor do centro
  const destHerois = [{col:5,row:6},{col:7,row:6},{col:6,row:5},{col:6,row:7},{col:6,row:6}];
  const herois = unidades.filter(u => u.tipo === 'heroi' && u.hp > 0);

  herois.forEach((h,i) => {
    const dest = destHerois[i % destHerois.length];
    _cinAnimarParaHex(h, dest.col, dest.row, 900 + i*180, null);
  });

  // Gregoras entra ~1,5s após a vitória — caminha em paralelo enquanto heróis se posicionam
  const gregoDelay = herois.length > 0 ? 250 : 150;
  setTimeout(_cinSpawnGregoras, gregoDelay);
}

function _cinAnimarParaHex(unit, dc, dr, dur, onDone) {
  const s = unitPos(unit);
  const e = hexCentro(dc, dr);
  const t0 = performance.now();
  (function tick(now){
    let p = Math.min((now-t0)/dur, 1);
    p = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    unit._ax = s.x+(e.x-s.x)*p;
    unit._ay = s.y+(e.y-s.y)*p;
    renderUnits();
    if (p < 1) requestAnimationFrame(tick);
    else { unit._ax=null; unit._ay=null; unit.col=dc; unit.row=dr; onDone?.(); }
  })(t0);
}

// NPCs com sprite-sheet de caminhada (2 frames: costas/frente separados)
const _NPC_CIN_DATA = {

// NPCs sem sheet usam sprite único escalado (200×300)
function _npcCinData(npcId) {
  if (_NPC_CIN_DATA[npcId]) return _NPC_CIN_DATA[npcId];
  const sprite = `catalogo/mhoried/npcs/${npcId}/sprites/frente/${npcId}_frente.png`;
  const nome = (window._campanhaNPCs?.[npcId]?.nome) ||
    npcId.replace(/^npc_/,'').replace(/_/g,' ')
      .replace(/\b\w/g,c=>c.toUpperCase());
  return { nome, titulo:'', spriteCostas:sprite, spriteFrente:sprite, frameW:200, frameH:300, nFrames:1 };
}

// ── Entrada cinematográfica genérica ─────────────────────────────────────
// npcId: 'npc_gregoras_pellos' etc.
// path:  [{col,row}, ...] do ponto de entrada até o destino
// onChegou: callback após animação + letreiro
function _cinEntradaNPC(npcId, path, onChegou) {
  const unitId = '_cin_' + npcId;
  if (unidades.find(u => u.id === unitId)) return;

  const nd = _npcCinData(npcId);
  const worldEl = document.getElementById('world');

  faseDoTurno = 'resolvendo';
  renderActionRow();

  const dispH  = Math.round(HR * 3.2);
  const sc     = dispH / nd.frameH;
  const dispW  = Math.round(nd.frameW * sc);

  const div = document.createElement('div');
  div.id = '_cin_div_' + npcId;
  div.style.cssText =
    `position:absolute;z-index:50;pointer-events:none;` +
    `width:${dispW}px;height:${dispH}px;` +
    `background-image:url('${nd.spriteCostas}');` +
    `background-repeat:no-repeat;` +
    `background-size:${Math.round(nd.frameW*nd.nFrames*sc)}px ${dispH}px;` +
    `background-position:0 0;`;
  worldEl.appendChild(div);

  function placeAt(col, row){
    const c = hexCentro(col, row);
    div.style.left = Math.round(c.x - dispW/2) + 'px';
    div.style.top  = Math.round(c.y + OOFF*.3 - dispH) + 'px';
  }

  let stepIdx=0, stepStart=null, frIdx=0, lastFrTs=0;
  const stepDur=380, FPS=5;
  placeAt(path[0].col, path[0].row);
  renderUnits();

  function loop(ts){
    if(nd.nFrames>1 && ts-lastFrTs>=1000/FPS){
      lastFrTs=ts; frIdx=(frIdx+1)%nd.nFrames;
      div.style.backgroundPositionX=-(dispW*frIdx)+'px';
    }
    if(stepIdx<path.length-1){
      if(!stepStart) stepStart=ts;
      let t=Math.min((ts-stepStart)/stepDur,1);
      const from=hexCentro(path[stepIdx].col,path[stepIdx].row);
      const to=hexCentro(path[stepIdx+1].col,path[stepIdx+1].row);
      const cx=from.x+(to.x-from.x)*t, cy=from.y+(to.y-from.y)*t;
      // Arco de pulo: salta de hexágono em hexágono como peça de tabuleiro
      const hop=Math.sin(Math.PI*t)*HR*0.55;
      div.style.left=Math.round(cx-dispW/2)+'px';
      div.style.top=Math.round(cy+OOFF*.3-dispH-hop)+'px';
      if(t>=1){stepIdx++;stepStart=null;}
    }
    if(stepIdx<path.length-1){ requestAnimationFrame(loop); return; }

    // Chegou — virar para frente
    placeAt(path[path.length-1].col, path[path.length-1].row);
    setTimeout(()=>{
      div.style.backgroundImage=`url('${nd.spriteFrente}')`;
      div.style.backgroundPosition='0 0';
      placeAt(path[path.length-1].col, path[path.length-1].row);
      setTimeout(()=>{
        mostrarLetreiro(nd.nome.toUpperCase(), nd.titulo, '', 2500, ()=>{
          div.remove();
          // Adiciona unit estático ao canvas com standee (peca_tabuleiro)
          const pecaSrc = `catalogo/mhoried/npcs/${npcId}/peca_tabuleiro/${npcId}_peca.png`;
          const unit={
            nome:nd.nome, tipo:'aliado_cin',
            emoji:'👤', col:path[path.length-1].col, row:path[path.length-1].row,
            hp:1, maxHp:1, sp:0, maxSp:0, mov:0, ac:10, cor:'#8899bb',
            imgSrc:pecaSrc,
            img:null, portrait:null, flipH:false,
            _ax:null, _ay:null, clipBottom:0, itens:[], id:unitId,
          };
          _loadSprite(unit);
          unidades.push(unit);
          render();
          if(onChegou) setTimeout(()=>onChegou(unit), 300);
        });
      }, 500);
    }, 350);
  }
  requestAnimationFrame(loop);
}
window._cinEntradaNPC = _cinEntradaNPC;

function _cinSpawnGregoras() {
  const npcId = 'npc_gregoras_pellos';
  const path = [
    {col:6,row:13},{col:6,row:12},{col:6,row:11},{col:6,row:10},
    {col:6,row:9},{col:6,row:8},{col:6,row:7},{col:6,row:6},
    {col:6,row:5},{col:6,row:4},{col:6,row:3}
  ];
  const pecaSrc = `catalogo/mhoried/npcs/${npcId}/peca_tabuleiro/${npcId}_peca.png`;
  const unit = {
    nome:'Grégoras Pellos', tipo:'aliado_cin',
    emoji:'⚔️', col:path[0].col, row:path[0].row,
    hp:1, maxHp:1, sp:0, maxSp:0, mov:0, ac:10, cor:'#8899bb',
    imgSrc:pecaSrc, img:null, portrait:null, flipH:false,
    _ax:null, _ay:null, clipBottom:0, itens:[], id:'_greg_cin',
  };
  _loadSprite(unit);
  unidades.push(unit);
  render();
  let stepIdx = 0;
  function doStep() {
    if (stepIdx + 1 >= path.length) {
      renderUnits();
      mostrarLetreiro('GRÉGORAS PELLOS', 'Mensageiro da Duquesa', '', 2500, () => {
        setTimeout(_cinIrParaConversaFeira, 300);
      });
      return;
    }
    const next = path[stepIdx + 1];
    stepIdx++;
    _cinAnimarParaHex(unit, next.col, next.row, 700, doStep);
  }
  doStep();
}

  // convHist: formato multi-turn correto para a API Groq
  const convHist = []; // [{role:'user'|'assistant', content:string}]

  function appendNarr(txt) {
    const d = document.createElement('div');
    d.className = 'cin-narr'; d.textContent = txt;
    logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  }

  // Mantém só DOIS cards visíveis: o último do NPC e o último do jogador
  function _trimCards() {
    const msgs = [...logEl.querySelectorAll('.cin-msg')];
    const temJogador = msgs.some(m => m.classList.contains('player'));
    let mantemNpc = false, mantemJog = false;
    for (let i = msgs.length - 1; i >= 0; i--) {
      const isPlayer = msgs[i].classList.contains('player');
      if (isPlayer && !mantemJog) { mantemJog = true; continue; }
      if (!isPlayer && !mantemNpc) { mantemNpc = true; continue; }
      msgs[i].remove();
    }
    // Após a primeira fala do jogador, remove narração introdutória e dicas
    if (temJogador) {
      logEl.querySelectorAll('.cin-narr').forEach(n => n.remove());
      logEl.querySelectorAll('[data-hint]').forEach(n => n.remove());
    }
  }

  function appendMsg(quem, nome, portrait, txt, loading=false) {
    const d = document.createElement('div');
    d.className = 'cin-msg'+(quem==='player'?' player':'')+(loading?' loading':'');
    const portHTML = portrait
      ? `<div class="cin-msg-port"><img src="${portrait}" onerror="this.parentElement.style.display='none'"></div>`
      : `<div class="cin-msg-port" style="display:flex;align-items:center;justify-content:center;font-size:22px">${quem==='player'?'🧑':'📜'}</div>`;
    d.innerHTML = `${portHTML}<div class="cin-msg-body"><div class="cin-msg-nome">${nome}</div><div class="cin-msg-txt">${txt}</div></div>`;
    logEl.appendChild(d); _trimCards(); logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  const _gregSystem = `Você é Gregoras Pellos — braço direito militar da Duquesa Catherine de Mhoried. Você não é burocrata. Você é soldado e emissário.

QUEM VOCÊ É: Homem de ~45 anos, robusto, armadura acolchoada azul-escura, maça à cinta. Veteran de campanha. Poucos sorrisos, menos ainda palavras desnecessárias. A Duquesa confia em você para missões que exigem discernimento — e força, se preciso.

PERSONALIDADE: Direto. Sem rodeios. Intolerante com enrolação. Leal à Duquesa por juramento e convicção — não por protocolo. Não se importa se os aventureiros gostam de você. Importa que façam o trabalho. Quando pressiona, pressiona de verdade. Quando dá informação, é porque escolheu dar — não porque foi convencido por lábia.

FORMA DE FALAR: Frases curtas. Imperativos quando necessário: "Venham.", "Agora.", "Sigam." Nunca explica o que não precisa explicar. Quando irritado, a voz fica mais baixa, não mais alta. Sem "procedimento adequado", sem "conforme o registro" — isso é linguagem de escrivão, não de soldado. Pode usar linguagem militar: flancos, cobrir, missão, ordens.

SITUAÇÃO: Você encontrou os aventureiros logo após a batalha na feira de Mhoried. O Duque Oswald, irmão da Duquesa, desapareceu nas Blackwoods e foi transformado em criatura. A Duquesa precisa desses heróis no castelo — são os únicos em quem ela confia com este segredo. Você tem ordens de trazê-los, com ou sem diplomacia.

O QUE VOCÊ SABE (revele com relutância, aos poucos — nunca tudo de uma vez):
- Oswald foi visto pela última vez nos Blackwoods, perto do território do mago Dendybar.
- A transformação foi resultado de algo que deu muito errado com magia.
- A situação política é delicada — os barões vizinhos não podem saber da fraqueza da casa.
- Você pode identificar Oswald: marca de nascença no ombro, dedo indicador do pé maior que o dedão.

REGRAS: Português brasileiro. Máximo 2-3 frases por resposta — você não discursa. Nunca quebre o personagem. Reaja ao que foi dito. Se pressionado demais, endurece — não cede por pressão de lábia, só por argumento real. Sem óculos, sem ajustar ombros de forma elegante — no máximo um gesto de impaciência.`;

  async function gregorasFala(userMsg) {
    const el = appendMsg('greg', 'Gregoras Pellos', 'catalogo/mhoried/npcs/npc_gregoras_pellos/retrato/npc_gregoras_pellos_retrato.png', '...', true);
    const txtEl = el.querySelector('.cin-msg-txt');

    const apiKey = localStorage.getItem('oraculo.groqKey');
    if (!apiKey) {
      await new Promise(r => setTimeout(r, 700));
      const fallbacks = [
        'Ele para na sua frente, bloqueia o caminho com o ombro. "A Duquesa manda chamar. Não é um convite — é uma ordem." Um aceno seco com a cabeça. "Agora."',
        'Ele cruza os braços, olhar fixo. "Você quer detalhes. Entendo. Mas não aqui, não agora." Pausa. "O castelo. Então explico o que posso."',
        'Ele olha em volta — avaliando, não com medo. "Tem ouvidos em toda a feira." A mão pousa na maça, não ameaçador, apenas reflexo de quem viveu de se precaver. "Sigam."',
        'Ele não repete o pedido. Apenas aponta para a saída da feira com dois dedos, sem palavra. Quem sabe ler linguagem de soldado entende: é hora de ir.',
      ];
      const idx = Math.min(convHist.filter(m => m.role === 'assistant').length, fallbacks.length - 1);
      const fb = fallbacks[idx];
      txtEl.textContent = fb;
      el.classList.remove('loading');
      convHist.push({role:'user', content: userMsg}, {role:'assistant', content: fb});
      logEl.scrollTop = logEl.scrollHeight;
      const hint = document.createElement('div');
      hint.dataset.hint = '1';
      hint.style.cssText = 'font-size:10px;color:rgba(190,160,70,.4);text-align:center;padding:3px 0;font-style:italic;';
      hint.textContent = '(Configure 🔑 para respostas dinâmicas da IA)';
      logEl.appendChild(hint);
      logEl.scrollTop = logEl.scrollHeight;
      return;
    }

    // Mensagens multi-turn: histórico completo + nova mensagem do usuário
    const messages = [
      {role:'system', content: _gregSystem},
      ...convHist,
      {role:'user', content: userMsg},
    ];

    try {
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {'Authorization':`Bearer ${apiKey}`,'content-type':'application/json'},
        body: JSON.stringify({model:'llama-3.3-70b-versatile', max_tokens:220, messages})
      });
      const data = await resp.json();
      const texto = data.choices?.[0]?.message?.content?.trim();
      if (!texto) throw new Error('empty');
      txtEl.textContent = texto;
      convHist.push({role:'user', content: userMsg}, {role:'assistant', content: texto});
    } catch(e) {
      const err = '"A urgência não permite mais demoras. O castelo — agora."';
      txtEl.textContent = err;
      convHist.push({role:'user', content: userMsg}, {role:'assistant', content: err});
    }
    el.classList.remove('loading');
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function enviarFala() {
    const txt = input.value.trim();

  await gregorasFala('Você é Gregoras Pellos, soldado e emissário da Duquesa Catherine de Mhoried. Você acabou de chegar até os aventureiros logo após a batalha. Apresente-se de forma direta e curta — diga que a Duquesa manda chamá-los urgentemente ao castelo. Não explique mais do que o necessário. Menos de 3 frases, tom seco e sério.');
}

function verificarVitoria(){
  const inimigos=unidades.filter(u=>u.tipo==='inimigo'&&u.hp>0);
  const herois=unidades.filter(u=>u.tipo==='heroi'&&u.hp>0);
  if(inimigos.length===0){
    unidades=unidades.filter(u=>u.tipo!=='inimigo'); // remove inimigos mortos do array
    render();
    // Sem key → Feira (mesma regra do spawn). Só a Feira usa a cinemática do Gregoras.
    const _bc = localStorage.getItem('oraculo.battleCena') || 'mhoried_market';
    const _cb = (_bc === 'mhoried_market') ? _cinematicaVitoria : _vitoriaGenerica;
    mostrarLetreiro('VITÓRIA!','os inimigos foram derrotados','',1400, _cb);
    return true;
  }

    mostrarLetreiro('DERROTA','os heróis caíram...','',3000,()=>{_mostrarOverlayFimBatalha(false);});

function resolverMovimento(cb){
  if(!planoMovimento){ cb(true); return; }
  const {unit, path}=planoMovimento;
  const mod=MOV_DES_MOD[unit.nome]||0;
  const d20v=Math.floor(Math.random()*20)+1;
  const total=d20v+mod;
  const cd=8;
  const critico=d20v===20, catastrofe=d20v===1;
  const sucesso=(total>=cd||critico)&&!catastrofe;
  const _mvRolls=[{
    tipo:'testar', label:'Teste de Movimento',
    nomeJog:unit.nome, alvo:null,
    d20:d20v, modStr:mod>=0?`+${mod}`:`${mod}`, total, dc:cd,
    sucesso, critico, catastrofe
  }];
  if(window._fbBroadcastDice) window._fbBroadcastDice(_mvRolls);
  DiceOverlay.mostrar(_mvRolls, results=>{
    const r=results[0];
    if(r.catastrofe){
      movBloqueado=true;
      mostrarLetreiro('TROPEÇOU!','perdeu o ataque','💀 Catástrofe — sem ação neste turno',1800,()=>cb(false));
    } else if(!r.sucesso){
      const metade=path.slice(0,Math.max(1,Math.ceil(path.length/2)));
      animarMovimento(unit,metade,()=>{ _fbSyncUnit(unit); render(); _updateLogStrip(unit.nome+' moveu parcialmente'); cb(true); });
    } else {
      animarMovimento(unit,path,()=>{ _fbSyncUnit(unit); render(); _updateLogStrip(unit.nome+' moveu para '+hexLabel(unit.col,unit.row)); cb(true); });
    }
  });
}

function finalizarTurno(){
  if(faseDoTurno==='resolvendo') return;
  faseDoTurno='resolvendo'; renderActionRow();
  fecharAtkPanel();
  movBloqueado=false;

  resolverMovimento(movOk=>{

        executarAtaquePlano(hab,atacante,alvo);
      },600);
    } else {
      setTimeout(proximoTurno,900);
    }
  });
}

function executarAtaquePlano(hab, atacante, alvo, onDone){
  const cb = onDone || proximoTurno;

  // AoE: 1) teste de conjuração → 2) projétil voa → 3) explosão → 4) dano (modulado pela margem) → HP
  if(hab.areaRaio>0 && planoAtaque?.areaAlvos){
    if((hab.custoSP||0)>0 && atacante.sp>=hab.custoSP){
      atacante.sp=Math.max(0,atacante.sp-hab.custoSP); renderBottomPanel();
    }
    const areaAlvos=planoAtaque.areaAlvos;
    const alvoHex=planoAtaque.alvoHex||alvo;

    // ── Teste de conjuração (a magia pode falhar) ──
    const conjMod = ATTR_MOD[atacante.nome] || 2;
    const conjCD  = hab.cd || 11;
    const d20c    = Math.floor(Math.random()*20)+1;
    const totalC  = d20c + conjMod;
    const critico = d20c===20, catastrofe = d20c===1;
    const sucesso = (totalC>=conjCD || critico) && !catastrofe;
    const margem  = totalC - conjCD;
    const modStrC = conjMod>=0?`+${conjMod}`:`${conjMod}`;

    const castPlaylist=[{
      tipo:'testar', label:`${hab.icone} Conjurar ${hab.nome}`,
      nomeJog:atacante.nome, alvo:`zona ${hexLabel(alvoHex.col,alvoHex.row)}`,
      d20:d20c, modStr:modStrC, total:totalC, dc:conjCD,
      sucesso, critico, catastrofe
    }];
    if(window._fbBroadcastDice) window._fbBroadcastDice(castPlaylist);
    DiceOverlay.mostrar(castPlaylist, castResults=>{
      const c=castResults[0];
      // Falha de conjuração → magia não sai, sem dano
      if(!(c.sucesso||c.critico) || c.catastrofe){
        const msg = c.catastrofe ? 'A magia desfez-se nas mãos!' : 'A conjuração falhou — nada acontece';
        mostrarLetreiro('FALHOU', hab.nome, '✦ '+msg, 1700, ()=>{
          _updateLogStrip(atacante.nome+' falhou ao conjurar '+hab.nome);
          render(); renderBottomPanel(); cb();
        });
        return;
      }

      // Qualidade da conjuração modula o dano (margem de sucesso)
      let mult=1, qLabel='';
      if(c.critico || margem>=7){ mult=1.5; qLabel=' (×1.5 perfeito!)'; }
      else if(margem>=3){ mult=1; qLabel=''; }
      else { mult=0.6; qLabel=' (×0.6 instável)'; }

      // Projétil voa → explosão → só então rola o dano modulado
      lancarAtaque(hab,atacante,alvoHex,()=>{
        const dmgR=rollNotacao(hab.dano);
        const finalDmg=Math.max(1, Math.round(dmgR.total*mult));
        const playlist=[{
          tipo:'rolar', label:`${hab.icone} Dano em Área`,
          nomeJog:atacante.nome,
          alvo:areaAlvos.length?areaAlvos.map(e=>e.nome).join(', '):'(ninguém)',
          resultado:finalDmg, notacao:hab.dano+qLabel,
          dados:parseNotacao(hab.dano)?.sides||6, condicionalDe:0
        }];
        if(window._fbBroadcastDice) window._fbBroadcastDice(playlist);
        DiceOverlay.mostrar(playlist,results=>{
          const dmg=results[0].resultado;
          for(const e of areaAlvos) e.hp=Math.max(0,e.hp-dmg);
          unidades=unidades.filter(u=>u.tipo!=='inimigo'||u.hp>0);
          if(window._fbSetEnemies) window._fbSetEnemies(unidades.filter(u=>u.tipo==='inimigo'));
          _updateLogStrip(atacante.nome+' causou '+dmg+' de dano em área');
          render(); renderBottomPanel(); cb();
        });
      });
    });
    return;
  }

  // Deduct SP cost
  if((hab.custoSP||0)>0 && atacante.sp>=hab.custoSP){
    atacante.sp=Math.max(0,atacante.sp-hab.custoSP);
    renderBottomPanel();
  }
  if(hab.tipo==='buff'||hab.alcance===0){
    lancarAtaque(hab,atacante,atacante,()=>{ cb(); });
    return;
  }

  // Alvo único: 1) rola hit → 2) projétil voa → 3) explosão → 4) rola dano → 5) HP/morte
  const atqMod=ATTR_MOD[atacante.nome]||2;
  const alvoAC=alvo.ac||10;
  const d20v=Math.floor(Math.random()*20)+1;
  const total=d20v+atqMod;
  const critico=d20v===20, catastrofe=d20v===1;
  const sucesso=(total>=alvoAC||critico)&&!catastrofe;
  const modStr=atqMod>=0?`+${atqMod}`:`${atqMod}`;

  const hitPlaylist=[{
    tipo:'testar', label:`${hab.icone} ${hab.nome}`,
    nomeJog:atacante.nome, alvo:alvo.nome,
    d20:d20v, modStr, total, dc:alvoAC,
    sucesso, critico, catastrofe
  }];
  if(window._fbBroadcastDice) window._fbBroadcastDice(hitPlaylist);
  DiceOverlay.mostrar(hitPlaylist, results=>{
    const atk=results[0];
    if((atk.sucesso||atk.critico)&&!atk.catastrofe){
      // Projétil voa → explosão → só então rola dano
      lancarAtaque(hab,atacante,alvo,()=>{
        if(hab.dano){
          const dmgR=rollNotacao(hab.dano);
          const finalDmg=critico?dmgR.total*2:dmgR.total;
          const dmgPlaylist=[{
            tipo:'rolar', label:`Dano ${hab.icone}`,
            nomeJog:atacante.nome, alvo:alvo.nome,
            resultado:finalDmg,
            notacao:critico?`${hab.dano} (CRÍTICO×2)`:hab.dano,
            dados:parseNotacao(hab.dano)?.sides||6, condicionalDe:0
          }];
          if(window._fbBroadcastDice) window._fbBroadcastDice(dmgPlaylist);
          DiceOverlay.mostrar(dmgPlaylist, dmgResults=>{
            const dmg=dmgResults[0].resultado;
            alvo.hp=Math.max(0,alvo.hp-dmg);
            if(alvo.tipo==='inimigo'&&alvo.hp<=0) unidades=unidades.filter(u=>u!==alvo);
            if(window._fbSetEnemies) window._fbSetEnemies(unidades.filter(u=>u.tipo==='inimigo'));
            _updateLogStrip(atacante.nome+' atacou '+alvo.nome+' — '+dmg+' de dano');
            render(); renderBottomPanel(); cb();
          });
        } else {
          render(); renderBottomPanel(); cb();
        }
      });
    } else {
      render(); renderBottomPanel(); cb();
    }
  });
}

function proximoTurno(){
  planoMovimento=null; planoAtaque=null; movBloqueado=false;
  selUnit=null; moveHexes=[]; targetHex=null;
  modoAtaque=false; habAtual=null; atkTargets=[]; areaPreview=null;
  render(); renderBottomPanel();
  if(verificarVitoria()) return;
  _advanceTurn();
}

function turnoInimigo(){
  faseDoTurno='turno_inimigo'; renderActionRow();
  const allEnemies=unidades.filter(u=>u.tipo==='inimigo'&&u.hp>0);

  // Non-host: just show letreiro and wait for host to advance via Firebase
  if(!_fbIsHost){
    const espName=allEnemies.length?allEnemies[0].nome:'Inimigo';
    mostrarLetreiro(espName.toUpperCase(),'turno do inimigo','',1800,()=>renderActionRow());
    return;
  }

  if(!allEnemies.length){ _advanceTurn(); return; }
  _executarProximoInimigo(allEnemies, 0);
}

function _executarProximoInimigo(enemies, idx){
  if(idx>=enemies.length){ proximoTurno(); return; }
  const esp=enemies[idx];
  if(!esp||esp.hp<=0){ _executarProximoInimigo(enemies, idx+1); return; }

  planoMovimento=null; planoAtaque=null; movBloqueado=false;
  const allHeroes=unidades.filter(u=>u.tipo==='heroi'&&u.hp>0);
  if(!allHeroes.length){ proximoTurno(); return; }

  const alvo=allHeroes.sort((a,b)=>hexDist(esp.col,esp.row,a.col,a.row)-hexDist(esp.col,esp.row,b.col,b.row))[0];
  const dist=hexDist(esp.col,esp.row,alvo.col,alvo.row);

  if(dist>1){
    // Pathing to an adjacent FREE hex next to the target (never onto occupied hex)
    const adjFree=hexVizinhos(alvo.col,alvo.row)
      .filter(([c,r])=>!unidades.some(u=>u!==esp&&u.col===c&&u.row===r))
      .sort((a,b)=>hexDist(esp.col,esp.row,a[0],a[1])-hexDist(esp.col,esp.row,b[0],b[1]));
    for(const[tc,tr] of adjFree){
      const p=bfsPath(esp.col,esp.row,tc,tr,esp);
      if(p&&p.length){ planoMovimento={unit:esp,path:p.slice(0,Math.min(esp.mov,p.length))}; break; }
    }
  }
  const destCol=planoMovimento?planoMovimento.path[planoMovimento.path.length-1].col:esp.col;
  const destRow=planoMovimento?planoMovimento.path[planoMovimento.path.length-1].row:esp.row;
  const habEsp=(HABILIDADES[esp.nome]||[]).find(h=>h.categoria==='basico')||
    {icone:'🌾',nome:'Garra',alcance:1,tipo:'melee',anim:'melee',dano:'1d6',desc:'Garra cortante'};

  if(hexDist(destCol,destRow,alvo.col,alvo.row)<=habEsp.alcance){
    planoAtaque={hab:habEsp, atacante:esp, alvo};
    if(!esp.ac) esp.ac=10;
  }

  // Broadcast intent so all clients see movement/attack arrows for THIS specific enemy
  const intent={
    id: esp.id||null,
    moveTarget:planoMovimento?{col:destCol,row:destRow}:null,
    attackTarget:planoAtaque?{col:alvo.col,row:alvo.row}:null,
  };
  enemyIntent=intent;
  if(window._fbSetEnemyIntent) window._fbSetEnemyIntent(intent);
  renderSel();

  mostrarLetreiro(esp.nome.toUpperCase(),'turno do inimigo','',1800,()=>{
    setTimeout(()=>_executarAtaqueInimigo(enemies, idx),800);
  });
}

function _executarAtaqueInimigo(enemies, idx){
  fecharAtkPanel();
  movBloqueado=false;
  resolverMovimento(movOk=>{
    render();
    if(planoAtaque&&!movBloqueado){
      setTimeout(()=>{
        const {hab,atacante,alvo}=planoAtaque;
        executarAtaquePlano(hab, atacante, alvo, ()=>{
          planoMovimento=null; planoAtaque=null; movBloqueado=false;
          render(); renderBottomPanel();
          if(verificarVitoria()) return;
          _executarProximoInimigo(enemies, idx+1);
        });
      },600);
    } else {
      planoMovimento=null; planoAtaque=null; movBloqueado=false;
      render(); renderBottomPanel();
      if(verificarVitoria()) return;
      _executarProximoInimigo(enemies, idx+1);
    }
  });
}
