function abrirSkillPanel(){
  if(!selUnit||animating) return;
  document.getElementById('atk-panel-title').textContent='✦ Skills & Magias';
  _abrirPainelHabilidades(h => h.categoria !== 'basico');
}

function _abrirPainelHabilidades(filtro){
  const panel=document.getElementById('atk-panel');
  while(panel.children.length>1) panel.removeChild(panel.lastChild);
  const habs=(HABILIDADES[selUnit.nome]||[]).filter(filtro);
  if(!habs.length) return;
  for(const h of habs){
    const semSP = (h.custoSP||0) > 0 && selUnit.sp < h.custoSP;
    const btn=document.createElement('button');
    btn.className='hab-btn'+(semSP?' sem-sp':'');

    // build badges
    let badges='';
    const cat=h.categoria||'';
    if(cat==='magia')  badges+=`<span class="hab-tag magia">Magia</span>`;
    else if(cat==='skill') badges+=`<span class="hab-tag skill">Skill</span>`;
    else if(cat==='buff')  badges+=`<span class="hab-tag buff">Buff</span>`;
    if(h.custoSP>0)   badges+=`<span class="hab-sp">⚡${h.custoSP} SP${semSP?' ✕':''}</span>`;
    if(h.dano)        badges+=`<span class="hab-dano">${h.dano}</span>`;

    btn.innerHTML=`<span class="hab-icon">${h.icone}</span>
      <span class="hab-info">
        <span class="hab-nome">${h.nome}</span>
        ${badges?`<span class="hab-badges">${badges}</span>`:''}
      </span>`;
    btn.addEventListener('click',()=>selecionarHabilidade(h));
    panel.appendChild(btn);
  }
  panel.classList.add('visivel');
}

function clicarAtacar(){
  if(!selUnit||animating) return;
  if(faseDoTurno!=='planejar_acao') return;
  fecharAtkPanel();

  const basicos=(HABILIDADES[selUnit.nome]||[]).filter(h=>h.categoria==='basico');
  if(!basicos.length){
    mostrarLetreiro('SEM ATAQUE BÁSICO','Use 🪄 SKILL para magias','',1500);
    return;
  }

  const _pos=posEfetiva(selUnit);
  const inimigosAlvo=unidades.filter(u=>{
    if(u.tipo!=='inimigo'||u.hp<=0) return false;
    return basicos.some(h=>hexDist(_pos.col,_pos.row,u.col,u.row)<=h.alcance);
  });

  if(!inimigosAlvo.length){
    mostrarLetreiro('FORA DE ALCANCE','Mova-se para mais perto do inimigo','',1500);
    return;
  }

  habAtual=basicos[0];
  modoAtaque=true;
  atkTargets=inimigosAlvo.map(u=>({col:u.col,row:u.row}));
  faseDoTurno='acao_ativa';
  renderActionRow(); renderSel(); renderBottomPanel();
}

async function enviarAcaoLivre(){
  const txt = (document.getElementById('acao-textarea')?.value||'').trim();
  if(!txt) return;
  const sb = document.getElementById('acao-send');
  const res = document.getElementById('acao-result');
  if(sb){ sb.disabled=true; sb.textContent='⏳ Analisando...'; }
  if(res){ res.style.display='none'; }

  const u = selUnit || unidades.find(u=>u.tipo==='heroi');
  const apiKey = localStorage.getItem('oraculo.groqKey');

  const ctxChar = u
    ? `Personagem: ${u.nome} | HP: ${u.hp}/${u.maxHp} | SP: ${u.sp}/${u.maxSp} | MOV restante: ${u.mov}`
    : 'Personagem desconhecido';
  const ctxInimigos = unidades.filter(e=>e.tipo==='inimigo'&&e.hp>0)
    .map(e=>`${e.nome} HP:${e.hp}/${e.maxHp}`).join(', ') || 'nenhum';
  const habList = (u?.habs||[]).map(h=>h.nome||h).join(', ') || 'nenhuma';

  const sysPrompt = `Você é o Mestre do RPG Oráculo (sistema GURPS simplificado). Um jogador descreve uma ação livre.
Analise e responda em JSON:
{
  "possivel": true|false,
  "descricao": "Narração curta (1-2 frases) do que o personagem tenta fazer",
  "teste": {"atributo":"DX/IQ/ST/Per/HT","valor":10,"bonus":0} | null,
  "rolagem": "3d6 ≤ X — Resultado: Y (sucesso/falha)" | null,
  "resultado": "sucesso"|"falha"|"automatico",
  "narrativa": "Como a cena se desenrola (2-3 frases vívidas)",
  "efeito": "Efeito mecânico se houver (dano, bônus, penalidade)" | null
}
Se houver teste, role mentalmente 3d6 e compare ao atributo. Declare sucesso ou falha.
Contexto: ${ctxChar} | Habs: ${habList} | Inimigos: ${ctxInimigos}
Responda APENAS JSON válido, sem texto fora.`;

  let dados;
  if(!apiKey){
    dados = {
      possivel:true,
      descricao: txt,
      teste:null, rolagem:null, resultado:'automatico',
      narrativa:'A ação é realizada com esforço. Configure uma chave Groq (🔑) para análise dinâmica da IA.',
      efeito:null
    };
  } else {
    try{
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':`Bearer ${apiKey}`,'content-type':'application/json'},
        body:JSON.stringify({
          model:'llama-3.3-70b-versatile', max_tokens:350,
          response_format:{type:'json_object'},
          messages:[
            {role:'system',content:sysPrompt},
            {role:'user',content:`Ação: "${txt}"`}
          ]
        })
      });
      const d = await resp.json();
      dados = JSON.parse(d.choices?.[0]?.message?.content||'{}');
    } catch(e){
      dados = {
        possivel:true, descricao:txt,
        teste:null, rolagem:null, resultado:'pendente',
        narrativa:'Erro ao contatar IA. Tente novamente.',
        efeito:null
      };
    }
  }

  // Exibe no modal
  if(res){
    const icon = dados.resultado==='sucesso'?'✅':dados.resultado==='falha'?'❌':'🎲';
    res.innerHTML = [
      dados.descricao ? `<div style="opacity:.65;margin-bottom:5px">${dados.descricao}</div>` : '',
      dados.rolagem   ? `<div style="font-size:11px;color:#d4a830;margin-bottom:4px">🎲 ${dados.rolagem}</div>` : '',
      `<div style="font-size:13px;font-weight:800;margin-bottom:4px">${icon} ${dados.narrativa}</div>`,
      dados.efeito    ? `<div style="font-size:11px;color:#a0ffa0">${dados.efeito}</div>` : '',
    ].join('');
    res.style.display='block';
  }
  if(sb){ sb.disabled=false; sb.textContent='🔄 Nova Ação'; }

  // Broadcast para todos os jogadores
  if(window._fbBroadcastAcaoLivre){
    await window._fbBroadcastAcaoLivre({
      jogador: u?.nome||'Jogador',
      acao: txt,
      dados
    });
  }
}

  }

  _updateVerbBtns();
}

function selecionarHabilidade(hab){
  fecharAtkPanel();

  if(hab.alcance===0||hab.tipo==='buff'){
    planoAtaque={hab, atacante:selUnit, alvo:selUnit};
    faseDoTurno='acao_pronta';
    _broadcastIntent();
    renderActionRow(); renderBottomPanel();
    return;
  }

  habAtual=hab; modoAtaque=true; areaPreview=null;
  faseDoTurno='acao_ativa';

  const _pos=posEfetiva(selUnit);

  if(hab.areaRaio>0){
    // AoE: qualquer hex dentro do alcance é alvo válido
    const allHexes=[];
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
      if(hexDist(_pos.col,_pos.row,c,r)<=hab.alcance) allHexes.push({col:c,row:r});
    }
    atkTargets=allHexes;
    // Verifica se há ao menos 1 inimigo acessível (dentro de alcance + raio)
    const temAlvo=unidades.some(u=>u.tipo==='inimigo'&&u.hp>0&&
      hexDist(_pos.col,_pos.row,u.col,u.row)<=hab.alcance+hab.areaRaio);
    if(!temAlvo){ modoAtaque=false; habAtual=null; faseDoTurno='planejar_acao'; renderActionRow(); return; }
    renderActionRow(); renderSel();
    return;
  }

  const inimigosAlvo=unidades.filter(u=>{
    if(u===selUnit) return false;
    if(u.tipo!=='inimigo') return false;
    return hexDist(_pos.col,_pos.row,u.col,u.row)<=hab.alcance;
  });
  atkTargets=inimigosAlvo.map(u=>({col:u.col,row:u.row}));

  if(!inimigosAlvo.length){
    modoAtaque=false; habAtual=null;
    faseDoTurno='planejar_acao';
    renderActionRow(); renderSel();
    return;
  }

  renderActionRow(); renderSel();
}

function cancelarAtaque(){
  modoAtaque=false; habAtual=null; atkTargets=[];
  fecharAtkPanel();
  atualizarHUD(); renderSel();
}

}

function dispararAtaque(alvo){

  // O fluxo de turno usa executarAtaquePlano() diretamente
  if(!selUnit||!habAtual||animating) return;
  const atacante=selUnit, hab=habAtual;
  modoAtaque=false; habAtual=null; atkTargets=[];
  selUnit=null; moveHexes=[]; targetHex=null;
  atualizarHUD(); ctxS.clearRect(0,0,MAP_W,MAP_H);
  animating=true;
  executarAtaquePlano(hab,atacante,alvo);
}

document.getElementById('world').addEventListener('pointerdown',e=>{
  if(animating) return;
  if(e.target.closest('#btn-coords,#btn-zoom,#bottom-panel,#atk-panel')) return;
  if(_zoom===1) e.preventDefault();
  const hex=screenToHex(e.clientX,e.clientY);

  // Fase planejar_acao: toque em inimigo → entra em modo ataque básico
  if(faseDoTurno==='planejar_acao' && hex && selUnit){
    const inimigo=unidades.find(u=>u.col===hex.col&&u.row===hex.row&&u.tipo==='inimigo');
    if(inimigo){ clicarAtacar(); return; }
  }

  // Fase ação_ativa: clique em alvo
  if(faseDoTurno==='acao_ativa' && modoAtaque && habAtual && hex){
    if(habAtual.areaRaio>0){
      // AoE: clique em qualquer hex do alcance seleciona o centro da explosão
      if(atkTargets.some(h=>h.col===hex.col&&h.row===hex.row)){
        areaPreview={col:hex.col,row:hex.row};
        confirmarAoeAlvo();
      } else {
        cancelarAtaqueAtual();
      }
      return;
    }
    const alvo=unidades.find(u=>u.col===hex.col&&u.row===hex.row&&u.tipo==='inimigo');
    if(alvo && atkTargets.some(h=>h.col===hex.col&&h.row===hex.row)){
      planoAtaque={hab:habAtual, atacante:selUnit, alvo};
      modoAtaque=false; habAtual=null; atkTargets=[];
      faseDoTurno='acao_pronta';
      _broadcastIntent();
      renderActionRow(); renderSel(); renderBottomPanel();
      return;
    }
    cancelarAtaqueAtual(); return;
  }

  // Fase mover_ativo: clique em hex → preview (verde), aguarda OK
  if(faseDoTurno==='mover_ativo' && hex){
    if(moveHexes.some(h=>h.col===hex.col&&h.row===hex.row)){
      hexPreview=hex;
      _broadcastIntent();
      render(); renderActionRow(); renderBottomPanel();
      return;
    }
    // clique fora do alcance: limpa preview mas mantém modo ativo
    hexPreview=null;
    _broadcastIntent();

function _broadcastIntent(){
  if(!window._fbSetIntent) return;
  window._fbSetIntent({
    movePreview: hexPreview?{col:hexPreview.col,row:hexPreview.row}:null,
    moveTarget:  targetHex?{col:targetHex.col,row:targetHex.row}:null,

// Carrega sprite com fallback: genero alternativo → sem genero → círculo
function _loadSprite(u){
  if(!u) return;
  const m=u.imgSrc.match(/campaigns\/mhoried\/sprites\/([a-z_]+)_([mf])_costas\.png/);
  if(!m){
    const img=new Image();
    img.onload=()=>{u.img=img;renderUnits();};
    img.onerror=()=>{
      if(u.tipo==='inimigo'&&u.bestiaryId){
        const fb=new Image();
        fb.onload=()=>{u.img=fb;renderUnits();};
        fb.onerror=()=>renderUnits();
        fb.src=`catalogo/mhoried/inimigos/${u.bestiaryId}/peca_tabuleiro/${u.bestiaryId}_peca.png`;
      } else if(u.classId){
        const fb=new Image();
        fb.onload=()=>{u.img=fb;renderUnits();};
        fb.onerror=()=>renderUnits();
        fb.src=`catalogo/mhoried/classes/${u.classId}/peca_tabuleiro/${u.classId}_peca.png`;
      } else { renderUnits(); }
    };
    img.src=u.imgSrc;
    return;
  }
  const[,cid,g]=m; const alt=g==='m'?'f':'m';
  const queue=[
    `catalogo/mhoried/classes/${cid}/sprites/costas/${cid}_${g}_costas.png`,
    `catalogo/mhoried/classes/${cid}/sprites/costas/${cid}_${alt}_costas.png`,
    `catalogo/mhoried/classes/${cid}/sprites/costas/${cid}_costas.png`,
  ];
  const _revStandee={mago_f:'_r',arqueiro_f:'_r',guerreiro_m:'_r',clerigo_m:'_r',clerigo_f:'_r2',ladino_m:'_r3',ladino_f:'_r3'};
  const _standeeRev=_revStandee[cid+'_'+g]||'';
  queue.push(`catalogo/mhoried/classes/${cid}/peca_tabuleiro/${cid}_${g}${_standeeRev}_peca.png`);
  let qi=0;
  (function tryNext(){
    if(qi>=queue.length){renderUnits();return;}
    const img=new Image();
    img.onload=()=>{u.img=img;renderUnits();};
    img.onerror=()=>{qi++;tryNext();};
    img.src=queue[qi++];
  })();
}

function _advanceTurn(){
  _broadcastIntent();
  enemyIntent=null;
  if(window._fbSetEnemyIntent) window._fbSetEnemyIntent(null);
  if(window._fbSetTurn&&_roomTurnOrder.length>0){
    const idx=_roomTurnOrder.indexOf(_currentTurnPlayerId);
    const nextIdx=(idx+1)%_roomTurnOrder.length;
    window._fbSetTurn(_roomTurnOrder[nextIdx]);
  } else {
    // Offline/solo fallback
    turnoIdx=(turnoIdx+1)%2;
    const heroi=unidades.find(u=>u.tipo==='heroi'&&!u._fbId);
    const inimigo=unidades.find(u=>u.tipo==='inimigo');
    const proximo=turnoIdx===0?heroi:inimigo;
    setTimeout(()=>{
      if(!proximo) return;
      if(proximo.tipo==='heroi') iniciarTurno(proximo);
      else turnoInimigo();
    },600);
  }
}

function renderRemoteIntents(){
  for(const[pid,intent] of Object.entries(remoteIntents)){
    if(!intent) continue;
    const ru=unidades.find(u=>u._fbId===pid);
    if(!ru) continue;
    const from=hexCentro(ru.col,ru.row);
    if(intent.movePreview){
      const{x,y}=hexCentro(intent.movePreview.col,intent.movePreview.row);
      hexPath(ctxS,x,y); ctxS.fillStyle='rgba(40,210,200,0.22)'; ctxS.fill();
      ctxS.save(); ctxS.shadowColor='#40d4c8'; ctxS.shadowBlur=14;
      ctxS.strokeStyle='#50e8d8'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
      drawArrow(ctxS,from.x,from.y,x,y);
    }
    if(intent.moveTarget){
      const{x,y}=hexCentro(intent.moveTarget.col,intent.moveTarget.row);
      hexPath(ctxS,x,y); ctxS.fillStyle='rgba(0,200,180,0.30)'; ctxS.fill();
      ctxS.save(); ctxS.shadowColor='#00c8b4'; ctxS.shadowBlur=12;
      ctxS.strokeStyle='#20d8c0'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
      drawArrow(ctxS,from.x,from.y,x,y);
    }
    if(intent.attackTarget){
      const{x,y}=hexCentro(intent.attackTarget.col,intent.attackTarget.row);
      hexPath(ctxS,x,y); ctxS.fillStyle='rgba(255,150,0,0.22)'; ctxS.fill();
      ctxS.save(); ctxS.shadowColor='#ff9600'; ctxS.shadowBlur=16;
      ctxS.strokeStyle='#ffb020'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
      drawAttackArrow(ctxS,from.x,from.y,x,y);
    }
  }
  // ── Intenção do inimigo (broadcast pelo host) ──
  if(enemyIntent && faseDoTurno==='turno_inimigo'){
    const esp=unidades.find(u=>u.tipo==='inimigo'&&u.hp>0&&
      (enemyIntent.id ? u.id===enemyIntent.id : true));
    if(esp){
      const from=hexCentro(esp.col,esp.row);
      if(enemyIntent.moveTarget){
        const{x,y}=hexCentro(enemyIntent.moveTarget.col,enemyIntent.moveTarget.row);
        hexPath(ctxS,x,y); ctxS.fillStyle='rgba(255,80,30,0.20)'; ctxS.fill();
        ctxS.save(); ctxS.shadowColor='#ff5000'; ctxS.shadowBlur=14;
        ctxS.strokeStyle='#ff6030'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
        drawArrow(ctxS,from.x,from.y,x,y);
      }
      if(enemyIntent.attackTarget){
        const{x,y}=hexCentro(enemyIntent.attackTarget.col,enemyIntent.attackTarget.row);
        hexPath(ctxS,x,y); ctxS.fillStyle='rgba(255,20,20,0.28)'; ctxS.fill();
        ctxS.save(); ctxS.shadowColor='#ff2020'; ctxS.shadowBlur=16;
        ctxS.strokeStyle='#ff4040'; ctxS.lineWidth=2; hexPath(ctxS,x,y); ctxS.stroke(); ctxS.restore();
        drawAttackArrow(ctxS,from.x,from.y,x,y);
      }
    }
  }
}

function onRoomUpdate(room){
  if(!room||!room.players) return;

  const myId=localStorage.getItem('oraculo.playerId');
  const wasFirst=_firstRoomUpdate;

  // Navigate to narration when battle is over
  if(room.status==='narration'){
    window.location.href='narration.html?v=8';
    return;
  }
  // Cena de exploração sem continuação → volta ao Mapa do Mundo
  if(room.status==='map'){
    window.location.href='mapa.html?v=8';
    return;
  }

  // Firebase é a fonte de verdade da cena de batalha → corrige localStorage stale
  // (evita roster/vitória errados e o re-disparo da Feira após vencer)
  if(room.status==='battle' && room.narration){
    const bc = room.narration.battleKey || room.narration.cenaId;
    if(bc) localStorage.setItem('oraculo.battleCena', bc);
  }

  // Host: when all players confirmed post-battle, transition everyone to narration
  if(!wasFirst && _fbIsHost && room.status==='battle' && room.postBattleConfirmados){
    const pids=Object.keys(room.players||{});
    const confirmed=Object.keys(room.postBattleConfirmados||{});
    if(pids.length>0 && pids.every(p=>confirmed.includes(p))){
      // Próxima cena: emboscada volta ao destino; batalha de cena avança via proximaCena;
      // cena de exploração sem proximaCena → volta ao Mapa (evita re-disparar a mesma batalha)
      const cenaAtualId = room.narration?.cenaId;
      const ehEmboscada = !!room.narration?.battleKey;
      const cenaAtual = window._CENAS_DATA?.[cenaAtualId];
      // Marca a batalha desta cena como vencida (anti-loop: não re-dispara ao voltar)
      const resolvida = ehEmboscada ? (room.narration?.cenaBatalhaResolvida ?? null) : cenaAtualId;
      if(!ehEmboscada && !cenaAtual?.proximaCena){
        window._fbSetStatus?.('map',{ 'narration.battleKey': null, 'narration.cenaBatalhaResolvida': resolvida, postBattleConfirmados:{}, batalha:{} });
        return;
      }
      const proximaCena = ehEmboscada ? cenaAtualId : cenaAtual.proximaCena;
      const gancho = ehEmboscada ? null : (cenaAtual?.ganchoPosBatalha ?? null);
      if(window._fbSetStatus) window._fbSetStatus('narration',{
        'narration.cenaId': proximaCena,
        'narration.battleKey': null,
        'narration.cenaBatalhaResolvida': resolvida,
        'narration.modoImagem':'exterior',
        'narration.dialogo': gancho ? [{ tipo:'narrador', oradorId:'narrador', oradorNome:'Narrador', texto: gancho.texto, ts: Date.now() }] : [],
        'narration.introConfirmados':{},
        'narration.ganchoPosRenderizado': gancho?.npc ?? null,
        postBattleConfirmados:{},
        batalha:{},
      });
      return;
    }
  }

  // Non-host: acionar cinematica de vitória quando host sinalizar (ignorar na primeira leitura para evitar estado stale)
  if (!_fbIsHost && !wasFirst && room.batalha?.cinematicaVitoria && !_cinematicaRodando) {
    _cinematicaVitoria();
  }

  // ── Sync outros jogadores ──
  const others=Object.values(room.players).filter(p=>p.id!==myId&&p.x!=null&&p.y!=null);
  const otherIds=new Set(others.map(p=>p.id));
  for(let i=unidades.length-1;i>=0;i--){
    if(unidades[i]._fbId&&!otherIds.has(unidades[i]._fbId)) unidades.splice(i,1);
  }
  for(const p of others){
    let u=unidades.find(u=>u._fbId===p.id);
    if(!u){
      const cid=p.classId||'mago';
      const cd=_HERO_CLASS_DATA[cid]||_HERO_CLASS_DATA.mago;
      u={
        nome:p.name||cd.nome, col:p.x, row:p.y,
        emoji:cd.emoji, cor:cd.cor,
        imgSrc:`catalogo/mhoried/classes/${cid}/peca_tabuleiro/${cid}_peca.png`,
        img:null, tipo:'heroi', mov:cd.mov,
        hp:p.hp||cd.hp, maxHp:p.maxHp||cd.hp,
        sp:p.mana||cd.sp, maxSp:p.maxMana||cd.sp,
        portrait:`catalogo/mhoried/classes/${cid}/retrato/${cid}_retrato.png`,
        itens:[], _fbId:p.id, classId:cid,
      };
      _loadSprite(u);
      unidades.push(u);
    } else if(u.col!==p.x||u.row!==p.y){
      u.col=p.x; u.row=p.y; u._ax=null; u._ay=null;
    }
  }

  // ── Sync inimigos ──
  // Host não sincroniza na primeira leitura: o estado canônico é o unidades[] local;
  // _fbSetEnemies() já foi chamado em startFbListener para gravar o estado fresco.
  if(room.enemies && !(_fbIsHost && wasFirst)){
    for(const fbE of room.enemies){
      const u=unidades.find(u=>u.tipo==='inimigo'&&(fbE.id?u.id===fbE.id:u.nome===fbE.nome));
      if(u){
        if(u.col!==fbE.x||u.row!==fbE.y){ u.col=fbE.x; u.row=fbE.y; u._ax=null; u._ay=null; }
        if(fbE.hp!=null) u.hp=fbE.hp;
      }
    }
  }

  // ── Intents de planejamento de outros jogadores ──
  if(room.intents){
    for(const[pid,intent] of Object.entries(room.intents)){
      if(pid!==myId) remoteIntents[pid]=intent;
    }
  }

  // ── Intenção do inimigo (host → todos) ──
  if('enemyIntent' in room) enemyIntent=room.enemyIntent||null;

  // ── Ordem de turnos ──
  if(room.turnOrder) _roomTurnOrder=room.turnOrder;

  // ── Sistema de turnos ──
  const newTurnId=room.currentTurnPlayerId||null;
  const turnChanged=newTurnId&&newTurnId!==_currentTurnPlayerId;
  if(turnChanged||wasFirst){
    _currentTurnPlayerId=newTurnId;
    const myHero=unidades.find(u=>u.tipo==='heroi'&&!u._fbId);
    if(newTurnId===myId){
      _currentTurnPlayerName='';
      if(wasFirst) setTimeout(()=>iniciarTurno(myHero),600);
      else iniciarTurno(myHero);
    } else if(newTurnId==='enemy'){
      _currentTurnPlayerName='Inimigos';
      if(_fbIsHost){
        if(wasFirst) setTimeout(turnoInimigo,600);
        else turnoInimigo();
      } else {
        faseDoTurno='aguardando'; renderActionRow(); renderBottomPanel();
        if(!wasFirst){
          const eName=(unidades.find(u=>u.tipo==='inimigo')||{}).nome||'Inimigo';
          mostrarLetreiro(eName.toUpperCase(),'turno do inimigo','',1800,()=>renderActionRow());
        }
      }
    } else if(newTurnId){
      const op=room.players[newTurnId];
      _currentTurnPlayerName=op?.name||'jogador';
      faseDoTurno='aguardando'; renderActionRow(); renderBottomPanel();
      if(!wasFirst) mostrarLetreiro('TURNO DE '+_currentTurnPlayerName.toUpperCase(),'aguardando...','',2000,()=>renderActionRow());
    }
  }

  // ── Broadcast de dados de outro jogador ──
  if(room.diceRoll!=null){
    if(wasFirst){
      _lastDiceTs=room.diceRoll.ts;
    } else if(room.diceRoll.pid!==myId&&room.diceRoll.ts!==_lastDiceTs){
      _lastDiceTs=room.diceRoll.ts;
      DiceOverlay.mostrar(room.diceRoll.rolls,()=>{});
    }
  }

  // ── Ação Livre: exibir overlay para todos ──
  if(room.acaoLivre && !wasFirst){
    const al=room.acaoLivre;
    if(al.ts!==_lastAcaoLivreTs){
      _lastAcaoLivreTs=al.ts;
      _mostrarAcaoLivreOverlay(al);
    }
  } else if(wasFirst && room.acaoLivre){
    _lastAcaoLivreTs=room.acaoLivre.ts;
  }

  _firstRoomUpdate=false;

  if(selUnit&&faseDoTurno==='mover_ativo'){
    moveHexes=hexesInRange(selUnit.col,selUnit.row,selUnit.mov);
    if(hexPreview&&unidades.some(u=>u!==selUnit&&u.col===hexPreview.col&&u.row===hexPreview.row)){
      hexPreview=null;
    }
  }

  renderUnits();
  renderSel();
  renderBottomPanel();
}

function initScale(){
  if(document.getElementById('cin-conv')) return;
  const minPanelH=200;
  const scaleByW=window.innerWidth/MAP_W;
  const scaleByH=(window.innerHeight-minPanelH)/MAP_H;
  _mapScale=Math.min(scaleByW,scaleByH);

  const s=_mapScale*_zoom;
  const world=document.getElementById('world');
  const bp=document.getElementById('bottom-panel');

  if(_zoom>1){
    // ── Modo scroll: mapa maior que a tela, rola nativamente ──
    const scaledW=Math.ceil(MAP_W*s), scaledH=Math.ceil(MAP_H*s);
    document.documentElement.style.overflow='auto';
    document.documentElement.style.height='auto';
    document.body.style.minWidth=scaledW+'px';
    document.body.style.minHeight=(scaledH+minPanelH)+'px';
    document.body.style.height='auto';
    document.body.style.position='relative';

    world.style.transform=`scale(${s})`;
    world.style.top='0px'; world.style.left='0px';
    world.style.touchAction='pan-x pan-y';

    // sincroniza scroll → posição do world (que é fixed)
    if(!window._arenaScrollSync){
      window._arenaScrollSync=()=>{
        world.style.top=-window.scrollY+'px';
        world.style.left=-window.scrollX+'px';
      };
      window.addEventListener('scroll',window._arenaScrollSync,{passive:true});
    }

    bp.style.top=''; bp.style.height='';
    bp.style.position='fixed'; bp.style.bottom='0';

    const pp=document.getElementById('panel-portrait');
    if(pp){ pp.style.width=''; pp.style.height=''; }
    document.getElementById('atk-panel').style.bottom='80px';

    const zb=document.getElementById('btn-zoom');
    if(zb) zb.textContent='🗺 1×';

  } else {
    // ── Modo fit: tudo cabe na tela (comportamento original) ──
    document.documentElement.style.overflow='';
    document.documentElement.style.height='';
    document.body.style.minWidth='';
    document.body.style.minHeight='';
    document.body.style.height='';
    document.body.style.position='';

    if(window._arenaScrollSync){
      window.removeEventListener('scroll',window._arenaScrollSync);
      window._arenaScrollSync=null;
    }

    const mapScreenW=Math.round(MAP_W*_mapScale);
    const mapScreenH=Math.round(MAP_H*_mapScale);
    _mapOffsetX=Math.max(0,Math.floor((window.innerWidth-mapScreenW)/2));

    world.style.transform=`scale(${_mapScale})`;
    world.style.top='0'; world.style.left=_mapOffsetX+'px';
    world.style.touchAction='none';

    const panelH=window.innerHeight-mapScreenH;
    bp.style.top=mapScreenH+'px'; bp.style.height=panelH+'px';
    bp.style.position='fixed'; bp.style.bottom='';

    const pp=document.getElementById('panel-portrait');
    if(pp){ pp.style.width=''; pp.style.height=''; }
    document.getElementById('atk-panel').style.bottom=(panelH+8)+'px';

    const zb=document.getElementById('btn-zoom');
    if(zb) zb.textContent='🔍 2×';
  }
}

      .then(d=>{ if(d?.hexes) terrenoData=d.hexes; render(); })
      .catch(()=>render());

  function startFbListener(){
    // INIMIGOS_DATA now guaranteed (ES module ran before fbReady event)
    unidades = unidades.filter(Boolean);
    if(!unidades.some(u=>u.tipo==='inimigo')){
      for(const e of _spawnRosterCena()){ if(e){ unidades.push(e); _loadSprite(e); } }

    // Host escreve estado inicial dos inimigos no Firebase
    if(_fbIsHost&&window._fbSetEnemies) window._fbSetEnemies(unidades.filter(u=>u.tipo==='inimigo'));
  }
  if(window._fbReady) startFbListener();
  else window.addEventListener('fbReady',startFbListener,{once:true});
  // Offline fallback: start turn only if Firebase hasn't delivered currentTurnPlayerId
  setTimeout(()=>{
    if(faseDoTurno==='idle'&&!_currentTurnPlayerId){
      const heroi=unidades.find(u=>u.tipo==='heroi'&&!u._fbId);
      if(heroi) iniciarTurno(heroi);
    }
  }, 1200);
}

    {id:'guerreiro',g:'f',col:3 ,row:5},
    {id:'arqueiro', g:'m',col:4 ,row:5},
    {id:'arqueiro', g:'f',col:5 ,row:5},
    {id:'mago',     g:'m',col:6 ,row:5},
    {id:'mago',     g:'f',col:7 ,row:5},
    {id:'ladino',   g:'m',col:8 ,row:5},
    {id:'ladino',   g:'f',col:9 ,row:5},
    {id:'clerigo',  g:'m',col:10,row:5},
    {id:'clerigo',  g:'f',col:11,row:5},
  ];
  const _SD_REV  = {mago_f:'_r',arqueiro_f:'_r',guerreiro_m:'_r',clerigo_m:'_r',clerigo_f:'_r2',ladino_m:'_r3',ladino_f:'_r3'};
  const _SD_NOME = {barbaro:'Bárbaro',guerreiro:'Guerreiro',arqueiro:'Arqueiro',mago:'Mago',ladino:'Ladino',clerigo:'Clérigo'};

  unidades = _SD_DATA.map(u=>{
    const r   = _SD_REV[u.id+'_'+u.g]||'';
    const src = `catalogo/mhoried/classes/${u.id}/peca_tabuleiro/${u.id}_${u.g}${r}_peca.png`;
    return {nome:_SD_NOME[u.id]+' '+(u.g==='m'?'♂':'♀'), col:u.col, row:u.row,
            emoji:'🧍', cor:'#888', imgSrc:src, img:null, tipo:'heroi',
            mov:0, hp:100, maxHp:100, sp:100, maxSp:100,
            portrait:src, itens:[], classId:u.id, gender:u.g};
  });

  // Oculta painel de jogo
  const bp = document.getElementById('bottom-panel');
  if(bp) bp.style.display='none';

  // Renderização própria: usa dimensões NATURAIS do PNG
  // (naturalHeight = storedH calibrado = escala correta no grid HR=55)
  function _drawStandees(){
    ctxU.clearRect(0, 0, MAP_W, MAP_H);

    // Linha de chão fixa para todos (sem offset par/ímpar)
    const GROUND_Y = GY0 + 5 * RS + OOFF * 0.3;

    // Linha de chão dourada
    ctxU.beginPath();
    ctxU.moveTo(0, GROUND_Y);
    ctxU.lineTo(MAP_W, GROUND_Y);
    ctxU.strokeStyle = 'rgba(200,160,64,0.55)';
    ctxU.lineWidth   = 1.5;
    ctxU.stroke();

    unidades.forEach(u=>{
      const img = u.img;
      const {x} = hexCentro(u.col, u.row); // só usa x do hex
      const foot = GROUND_Y;               // todos no mesmo chão
      if(img && img.naturalWidth > 0){
        const dH = img.naturalHeight; // = storedH → proporcional ao hex
        const dW = img.naturalWidth;
        ctxU.save();
        ctxU.filter = 'drop-shadow(0 4px 14px rgba(0,0,0,0.98))';
        ctxU.drawImage(img, x - dW/2, foot - dH, dW, dH);
        ctxU.restore();
      }
      // Label
      ctxU.font      = 'bold 9px Georgia';
      ctxU.textAlign = 'center';
      ctxU.fillStyle = 'rgba(230,205,120,0.92)';
      ctxU.fillText(u.nome, x, foot + 22);
    });
  }

  // Carrega imagens e renderiza
  let _sdLoaded = 0;
  unidades.forEach(u=>{
    const img = new Image();
    img.onload = img.onerror = ()=>{
      u.img = img;
      if(++_sdLoaded >= unidades.length){ renderGrid(); _drawStandees(); }
    };
    img.src = u.imgSrc;
  });
}
</script>
<div style="position:fixed;bottom:2px;left:4px;z-index:99999;font:9px monospace;color:rgba(200,160,80,.4);pointer-events:none">v10</div>
</body>
