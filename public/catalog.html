<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo — Catálogo de Personagens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0c0a;
      --bg2:       #181410;
      --bg3:       #221e18;
      --gold:      #c8a040;
      --gold2:     #e8c060;
      --gold-dim:  rgba(200,160,64,0.18);
      --text:      #e0d0a8;
      --text-dim:  rgba(200,180,128,0.55);
      --border:    rgba(200,160,64,0.18);
      --aliado:    #2a6a3a;
      --aliado-t:  #60cc80;
      --neutro:    #5a5020;
      --neutro-t:  #ccaa40;
      --hostil:    #6a2020;
      --hostil-t:  #ee6060;
      --vilao:     #4a1a6a;
      --vilao-t:   #cc66ff;
      --radius:    10px;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #0a0806 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 0;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
    }
    .header-top h1 {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }
    .header-top span { font-size: 10px; color: var(--text-dim); margin-left: auto; }

    .tabs { display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 14px 10px;
      white-space: nowrap; flex-shrink: 0;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: inherit; font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .tab-btn.active {
      color: var(--gold2);
      border-bottom-color: var(--gold);
    }
    .tab-btn:hover { color: var(--text); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(200,160,64,0.2);
      background: rgba(200,160,64,0.06);
      color: var(--text-dim); font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active { background: var(--gold-dim); color: var(--gold2); border-color: var(--gold); }
    .filter-btn:hover { color: var(--text); }

    /* ── MAIN GRID ── */
    main { padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(200,160,64,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .card-sprite {
      background: rgba(0,0,0,0.3);
      display: flex; align-items: flex-end; justify-content: center;
      height: 160px; padding: 0;
      position: relative;
    }
    .card-sprite img {
      max-height: 100%; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .card-sprite .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px;
    }
    .card-portrait {
      position: relative;
      height: 280px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }
    .card-portrait img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 15%;
      display: block;
      transition: opacity .2s;
    }
    .card-portrait .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    }
    .card-portrait::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      pointer-events: none;
    }
    .cat-badge {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 8px; letter-spacing: .8px; text-transform: uppercase;
      font-weight: 700;
    }
    .cat-aliado    { background: var(--aliado);    color: var(--aliado-t); }
    .cat-neutro    { background: var(--neutro);    color: var(--neutro-t); }
    .cat-neutro_hostil { background: #5a3810; color: #ffaa50; }
    .cat-hostil    { background: var(--hostil);    color: var(--hostil-t); }
    .cat-vilao     { background: var(--vilao);     color: var(--vilao-t); }
    .cat-classe    { background: #1a2a4a;          color: #88aaee; }
    .cat-inimigo   { background: #3a1a0a;          color: #ee7744; }

    .card-body { padding: 8px 10px 10px; }
    .card-name {
      font-size: 12px; font-weight: 700;
      color: var(--gold2); line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 10px; color: var(--text-dim);
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── CLASS STAT CHIPS ── */
    .stat-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
      padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      background: rgba(200,160,64,0.1);
      color: rgba(200,160,64,0.7);
      border: 1px solid rgba(200,160,64,0.15);
    }

    /* ── ENEMY TYPE ── */
    .type-badge {
      font-size: 9px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 3px;
    }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    #modal {
      background: var(--bg2);
      border: 1px solid rgba(200,160,64,0.3);
      border-radius: 14px;
      max-width: 640px; width: 100%;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }

    .modal-header {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      min-height: 160px;
    }
    .modal-sprites {
      display: flex; flex-direction: column; gap: 0;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      min-width: 120px; max-width: 200px;
    }
    .modal-sprite-wrap {
      display: flex; align-items: flex-end; justify-content: center;
      flex: 1; padding: 6px 4px;
    }
    .modal-sprite-wrap img {
      max-height: 140px; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .sprite-label {
      text-align: center; font-size: 8px; color: var(--text-dim);
      padding: 4px; letter-spacing: .8px; text-transform: uppercase;
      border-top: 1px solid var(--border);
    }
    .modal-title-area {
      flex: 1; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .modal-name {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2); font-weight: 400;
      line-height: 1.2;
    }
    .modal-cat { display: flex; gap: 6px; align-items: center; }
    .modal-feat {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
      margin-top: 4px;
    }

    /* stats row */
    .stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 6px;
    }
    .stat-box {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.15);
      border-radius: 6px; padding: 4px 8px;
      text-align: center; min-width: 48px;
    }
    .stat-box .sv { font-size: 16px; font-weight: 700; color: var(--gold2); }
    .stat-box .sk { font-size: 8px; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }
    .attrs-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 4px;
      margin-top: 8px;
    }
    .attr-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 5px; padding: 3px 0; text-align: center;
    }
    .attr-box .av { font-size: 13px; font-weight: 700; color: var(--text); }
    .attr-box .am { font-size: 10px; color: var(--gold); }
    .attr-box .ak { font-size: 8px; color: var(--text-dim); letter-spacing: .5px; }

    /* abilities list */
    .habs-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .hab-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 6px; padding: 6px 10px;
    }
    .hab-icon { font-size: 16px; }
    .hab-info { flex: 1; }
    .hab-nome { font-size: 11px; font-weight: 700; color: var(--text); }
    .hab-desc { font-size: 10px; color: var(--text-dim); }
    .hab-tags { display: flex; gap: 4px; margin-top: 3px; }
    .htag {
      font-size: 8px; padding: 1px 5px; border-radius: 3px;
      font-weight: 700; letter-spacing: .3px;
    }
    .htag.dano  { background: rgba(255,80,30,.2); color: #ff9966; border: 1px solid rgba(255,80,30,.3); }
    .htag.sp    { background: rgba(40,140,255,.15); color: #88ccff; border: 1px solid rgba(40,140,255,.25); }
    .htag.type  { background: rgba(200,160,64,.1); color: var(--gold); border: 1px solid rgba(200,160,64,.2); }

    /* modal body sections */
    .modal-body { padding: 16px 20px 20px; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 6px;
      padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .section-text {
      font-size: 12px; color: var(--text);
      line-height: 1.65;
    }
    .section-text span.em { color: var(--gold); font-style: italic; }

    #modal-close {
      display: block; width: calc(100% - 40px); margin: 0 20px 20px;
      padding: 10px; border-radius: 8px;
      background: rgba(200,160,64,0.1);
      border: 1px solid rgba(200,160,64,0.25);
      color: var(--gold); font-family: inherit; font-size: 12px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: background .15s;
    }
    #modal-close:hover { background: rgba(200,160,64,0.2); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold);
    }
    .count-badge {
      font-size: 10px; color: var(--text-dim);
    }

    /* ── SPRITE PAIRS (class m/f) ── */
    .sprite-pair {
      display: flex; gap: 0;
    }
    .sprite-pair .modal-sprite-wrap {
      border-right: 1px solid var(--border);
    }
    .sprite-pair .modal-sprite-wrap:last-child { border-right: none; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(200,160,64,0.3); border-radius: 2px; }

    /* ── CLASS PORTRAIT (taller) ── */
.portrait-toggle {
      position: absolute; bottom: 6px; right: 6px; z-index: 2;
      display: flex; gap: 3px;
    }
    .pt-btn {
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(200,160,64,0.3);
      color: var(--text-dim); font-size: 9px; letter-spacing: .5px;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .pt-btn.active { background: rgba(200,160,64,0.25); color: var(--gold2); border-color: var(--gold); }
    .pt-btn:hover { color: var(--text); }

    /* ── CENÁRIOS TAB ── */
    .cenario-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
    .cenario-card { background:rgba(20,16,8,.6); border:1px solid rgba(190,140,35,.2); border-radius:10px; overflow:hidden; }
    .cenario-img { width:100%; height:110px; object-fit:cover; display:block; background:#0c0a06; }
    .cenario-body { padding:8px 10px; }
    .cenario-nome { font-size:12px; font-weight:700; color:#d4a84b; margin-bottom:2px; }
    .cenario-sub { font-size:10px; color:rgba(190,165,90,.5); margin-bottom:5px; }
    .cenario-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .cenario-tag { font-size:9px; padding:2px 6px; border-radius:20px; border:1px solid; font-weight:600; }
    .cenario-tag.batalha { color:rgba(220,120,80,.9); border-color:rgba(220,120,80,.3); background:rgba(220,120,80,.1); }
    .cenario-tag.npc { color:rgba(140,200,140,.8); border-color:rgba(140,200,140,.25); background:rgba(140,200,140,.08); }
    .cenario-tag.ato { color:rgba(140,160,220,.8); border-color:rgba(140,160,220,.25); background:rgba(140,160,220,.08); }

    /* ── ROTEIRO TAB ── */
    .rot-ato { margin-bottom:24px; }
    .rot-ato-titulo { font-size:10px; text-transform:uppercase; letter-spacing:2px; color:rgba(190,140,35,.5); padding:6px 0; border-bottom:1px solid rgba(190,140,35,.15); margin-bottom:10px; }
    .rot-cena { background:rgba(20,16,8,.5); border:1px solid rgba(190,140,35,.15); border-radius:8px; padding:10px 12px; margin-bottom:6px; }
    .rot-cena-num { font-size:9px; color:rgba(190,140,35,.4); letter-spacing:.5px; margin-bottom:2px; }
    .rot-cena-titulo { font-size:12px; font-weight:700; color:#d4a84b; margin-bottom:4px; }
    .rot-cena-texto { font-size:11px; color:rgba(190,165,100,.7); line-height:1.5; }
    .rot-cena-badges { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
    .rot-badge { font-size:9px; padding:2px 7px; border-radius:20px; border:1px solid rgba(190,140,35,.25); color:rgba(190,165,90,.65); }
    .rot-badge.batalha { border-color:rgba(220,100,80,.3); color:rgba(220,120,80,.8); }
    .rot-badge.npc { border-color:rgba(100,200,100,.25); color:rgba(140,210,140,.75); }

    /* ── CHECKLIST TAB ── */
    .ck-section { margin-bottom:20px; }
    .ck-section-title { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(190,140,35,.5); padding:6px 0; border-bottom:1px solid rgba(190,140,35,.12); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
    .ck-section-score { font-size:11px; font-weight:700; }
    .ck-score-ok { color:#4caf50; }
    .ck-score-miss { color:#f44336; }
    .ck-item { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .ck-icon { font-size:14px; flex-shrink:0; width:18px; text-align:center; }
    .ck-nome { font-size:11px; color:rgba(220,195,140,.85); flex:1; }
    .ck-path { font-size:9px; color:rgba(190,165,90,.35); margin-top:1px; }
    .ck-missing .ck-nome { color:rgba(220,120,80,.8); }
    .ck-missing .ck-path { color:rgba(220,120,80,.3); }
    .ck-summary { font-size:13px; font-weight:700; padding:14px; background:rgba(20,16,8,.5); border:1px solid rgba(190,140,35,.2); border-radius:10px; margin-bottom:20px; text-align:center; }

    @media(max-width:600px){
      .tab-btn { padding:8px 11px 10px; font-size:10px; }
      .card-grid { grid-template-columns: repeat(2, 1fr) !important; gap:10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>⚔️ Oráculo — Catálogo de Personagens</h1>
    <span id="count-label"></span>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="classes">Classes</button>
    <button class="tab-btn" data-tab="npcs">NPCs</button>
    <button class="tab-btn" data-tab="inimigos">Inimigos</button>
    <button class="tab-btn" data-tab="cenarios">Cenários</button>
    <button class="tab-btn" data-tab="roteiro">Roteiro</button>
    <button class="tab-btn" data-tab="checklist">✓ Check</button>
  </nav>
</header>

<div class="filter-bar" id="filter-bar" style="display:none">
  <button class="filter-btn active" data-filter="todos">Todos</button>
  <button class="filter-btn" data-filter="aliado">Aliados</button>
  <button class="filter-btn" data-filter="neutro">Neutros</button>
  <button class="filter-btn" data-filter="neutro_hostil">Neutros-Hostis</button>
  <button class="filter-btn" data-filter="hostil">Hostis</button>
  <button class="filter-btn" data-filter="vilao">Vilões</button>
</div>

<main>
  <div id="classes-tab"   class="tab-content active"></div>
  <div id="npcs-tab"      class="tab-content"></div>
  <div id="inimigos-tab"  class="tab-content"></div>
  <div id="cenarios-tab"  class="tab-content"></div>
  <div id="roteiro-tab"   class="tab-content"></div>
  <div id="checklist-tab" class="tab-content"></div>
</main>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-inner"></div>
    <button id="modal-close" onclick="closeModal()">✕ Fechar</button>
  </div>
</div>

<script type="module">

// ── HELPERS ──────────────────────────────────────────────────────────

function mod(v){ const m=Math.floor((v-10)/2); return m>=0?`+${m}`:String(m); }

function catLabel(c){
  const map={aliado:'Aliado',neutro:'Neutro',neutro_hostil:'Neutro-Hostil',hostil:'Hostil',vilao:'Vilão',classe:'Classe',inimigo:'Inimigo'};
  return map[c]||c;
}

function spriteUrl(path){
  // path relative to public/, e.g. 'sprites/npc_foo.png'
  return path;
}

function inimRetratoUrl(id){
  return `catalogo/mhoried/inimigos/${id}/retrato/${id}_retrato.png`;
}

function inimSpriteUrl(id, costas){
  if(costas) return `catalogo/mhoried/inimigos/${id}/sprites/costas/${id}_costas.png`;
  return `catalogo/mhoried/inimigos/${id}/sprites/frente/${id}_frente.png`;
}
function inimStandeeUrl(id){ return `catalogo/mhoried/inimigos/${id}/peca_tabuleiro/${id}_peca.png`; }

function classSpriteUrl(id, gender){
  return `catalogo/mhoried/classes/${id}/retrato/${id}_${gender}_retrato.png`;
}
function classFrente(id, g){ return `catalogo/mhoried/classes/${id}/sprites/frente/${id}_${g}_frente.png`; }
function classCostas(id, g){ return `catalogo/mhoried/classes/${id}/sprites/costas/${id}_${g}_costas.png`; }
function classStandee(id, g){ return `catalogo/mhoried/classes/${id}/peca_tabuleiro/${id}_${g}_peca.png`; }

function npcRetratoUrl(id){
  return `catalogo/mhoried/npcs/${id}/retrato/${id}_retrato.png`;
}

function npcSpriteUrl(id, costas){
  if(costas) return `catalogo/mhoried/npcs/${id}/sprites/costas/${id}_costas.png`;
  return `catalogo/mhoried/npcs/${id}/sprites/frente/${id}_frente.png`;
}
function npcStandeeUrl(id){ return `catalogo/mhoried/npcs/${id}/peca_tabuleiro/${id}_peca.png`; }

window.openClassModal = function(id){

  if(!cls) return;

  const attrKeys = Object.keys(cls.attrs);
  const attrsHtml = attrKeys.map(k=>`
    <div class="attr-box">
      <div class="av">${cls.attrs[k]}</div>
      <div class="am">${mod(cls.attrs[k])}</div>
      <div class="ak">${k}</div>
    </div>`).join('');

  const habsHtml = cls.habs.map(h=>`
    <div class="hab-row">
      <span class="hab-icon">${h.icon}</span>
      <div class="hab-info">
        <div class="hab-nome">${h.nome}</div>
        <div class="hab-desc">${h.desc}</div>
        <div class="hab-tags">
          ${h.dano!=='—'?`<span class="htag dano">⚔️ ${h.dano}</span>`:''}
          ${h.sp>0?`<span class="htag sp">💠 ${h.sp} SP</span>`:''}
          <span class="htag type">${h.tipo}</span>
        </div>
      </div>

  const standeePairs = ['m','f'].map(g=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,0.3);${g==='m'?'border-right:1px solid var(--border)':''}">
      <div class="modal-sprite-wrap">
        <img src="${classStandee(id,g)}" alt="${g==='m'?'Masculino':'Feminino'}" onerror="this.style.opacity='.15'">
      </div>
      <div class="sprite-label">${g==='m'?'Masculino':'Feminino'}</div>
    </div>`).join('');

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-header">
      <div class="modal-sprites" style="flex-direction:row;min-width:160px;max-width:200px">
        ${standeePairs}
      </div>
      <div class="modal-title-area">
        <div class="modal-name">${cls.icon} ${cls.nome}</div>
        <div class="modal-cat"><span class="cat-badge cat-classe">Classe Jogável</span></div>
        <div class="modal-feat">${cls.feat}</div>
        <div class="stats-row">
          <div class="stat-box"><div class="sv">❤️ ${cls.maxHp}</div><div class="sk">PV Máx</div></div>
          <div class="stat-box"><div class="sv">💠 ${cls.sp}</div><div class="sk">SP Máx</div></div>
          <div class="stat-box"><div class="sv">👢 ${cls.mov}</div><div class="sk">Mov/Turno</div></div>
          <div class="stat-box"><div class="sv">🎲 d${cls.atk+4}</div><div class="sk">Dado Atk</div></div>
        </div>
        <div class="attrs-grid">${attrsHtml}</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="section">
        <div class="section-title">Habilidades</div>
        <div class="habs-list">${habsHtml}</div>
      </div>
    </div>`;
  openModal();
};

window.openNpcModal = function(id){
  const npc = NPCS[id];
  if(!npc) return;

  const npcStUrl = npcStandeeUrl(npc.id);
  const npcStSlot = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,0.3)">
    <div class="modal-sprite-wrap"><img src="${npcStUrl}" alt="Standee" onerror="this.style.opacity='.15'"></div>
    <div class="sprite-label">Standee</div>
  </div>`;

  const sections = [
    npc.descFisica     && ['Aparência Física',  npc.descFisica],
    npc.personalidade  && ['Personalidade',     npc.personalidade],
    npc.conhecimentos  && ['O que Sabe',        npc.conhecimentos],
    npc.formaDeFalar   && ['Forma de Falar',    npc.formaDeFalar],
  ].filter(Boolean).map(([t,c])=>`
    <div class="section">
      <div class="section-title">${t}</div>
      <div class="section-text">${c}</div>
    </div>`).join('');

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-header">
      <div class="modal-sprites" style="min-width:90px;max-width:120px">${npcStSlot}</div>
      <div class="modal-title-area">
        <div class="modal-name">${npc.nome}</div>

      </div>

    <div class="modal-body">${sections}</div>`;

window.openEnemyModal = function(id){
  const listaInimigos = INIMIGOS_COMPLETO || INIMIGOS_DATA;
  const en = listaInimigos.find(e=>e.id===id);
  if(!en) return;

  const sprStand = inimStandeeUrl(id);
  const enStSlot = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,0.3)">
    <div class="modal-sprite-wrap"><img src="${sprStand}" alt="Standee" onerror="this.style.opacity='.15'"></div>

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-header">
      <div class="modal-sprites" style="min-width:90px;max-width:120px">${enStSlot}</div>
      <div class="modal-title-area">
        <div class="modal-name">💀 ${en.nome}</div>

      </div>
      <div class="section">

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
window.closeModal = function(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
};

// close on overlay click
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeModal();
});

// close on Escape
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

window.togglePortrait = function(id, gender){
  const img = document.getElementById(`cp-${id}`);
  if(img){ img.src = classSpriteUrl(id, gender); img.style.display=''; }
  ['m','f'].forEach(g=>{
    const btn = document.getElementById(`pt-${id}-${g}`);
    if(btn) btn.classList.toggle('active', g===gender);
  });
};

function buildRoteiroTab(){
  const tab = document.getElementById('roteiro-tab');
  const cenas = CENAS_ORDEM.map(id=>CENAS[id]).filter(Boolean);
  const atos = {};
  for(const c of cenas){
    const a = c.ato||1;
    if(!atos[a]) atos[a] = [];
    atos[a].push(c);
  }
  const header = `<div class="section-header"><h2>Roteiro da Campanha</h2><span class="count-badge">${cenas.length} cenas</span></div>`;
  let html = '';
  for(const [ato, lista] of Object.entries(atos)){
    html += `<div class="rot-ato">
      <div class="rot-ato-titulo">Ato ${ato}</div>`;
    lista.forEach((c,i)=>{
      html += `<div class="rot-cena">
        <div class="rot-cena-num">Cena ${i+1}</div>
        <div class="rot-cena-titulo">${c.titulo||c.id}</div>
        <div class="rot-cena-texto">${(c.textoIntro||'').slice(0,200)}</div>
        <div class="rot-cena-badges">
          ${c.temBatalha?'<span class="rot-badge batalha">⚔️ Batalha</span>':''}
          ${(c.npcsPresentes||[]).map(n=>`<span class="rot-badge npc">👤 ${n}</span>`).join('')}
        </div>
      </div>`;
    });
    html += '</div>';
  }
  tab.innerHTML = header + html;
}

function buildChecklistTab(){
  const tab = document.getElementById('checklist-tab');
  const npcList = Object.values(NPCS);

  const classes = Object.keys(CLASSES_DATA);
  const CAT = 'catalogo/mhoried/';

  // Cenários por Ato
  const cenasList = CENAS_ORDEM.map(id=>CENAS[id]).filter(Boolean);
  const atoMap = {};
  for(const c of cenasList){
    const a = c.ato || 1;
    if(!atoMap[a]) atoMap[a] = [];
    atoMap[a].push({
      nome: c.titulo,
      sub: `${c.id}.png`,
      path: `${CAT}cenarios/${c.id}/imagem/${c.id}.png`,
    });
    if(c.temBatalha){
      atoMap[a].push({
        nome: `${c.titulo} — mapa batalha`,
        sub: `${c.id}_mapa.png`,
        path: `${CAT}cenarios/${c.id}/mapa/${c.id}_mapa.png`,
      });
    }
  }
  const cenarioSections = Object.keys(atoMap).sort((a,b)=>+a-+b).map(ato=>({
    titulo: `🗺️ Ato ${ato} — Cenários`,
    dica: `cenarios/{id}/imagem/{id}.png  |  mapa: cenarios/{id}/mapa/{id}_mapa.png`,
    items: atoMap[ato],
  }));

  const sections = [
    ...cenarioSections,
    {
      titulo: '🖼️ Retratos NPC',
      dica: 'npcs/{id}/retrato/{id}_retrato.png',
      items: npcList.map(n=>({
        nome: n.nome||n.id, sub: `${n.id}_retrato.png`,
        path: `${CAT}npcs/${n.id}/retrato/${n.id}_retrato.png`,
      })),
    },
    {
      titulo: '👾 Retratos Inimigos',
      dica: 'inimigos/{id}/retrato/{id}_retrato.png',
      items: inimList.map(e=>({
        nome: e.nome||e.id, sub: `${e.id}_retrato.png`,
        path: `${CAT}inimigos/${e.id}/retrato/${e.id}_retrato.png`,
      })),
    },
    {
      titulo: '🧙 Retratos de Classe — Masculino',
      dica: 'classes/{id}/retrato/{id}_m_retrato.png',
      items: classes.map(id=>({
        nome: CLASSES_DATA[id].nome, sub: `${id}_m_retrato.png`,
        path: `${CAT}classes/${id}/retrato/${id}_m_retrato.png`,
      })),
    },
    {
      titulo: '🧙 Retratos de Classe — Feminino',
      dica: 'classes/{id}/retrato/{id}_f_retrato.png',
      items: classes.map(id=>({
        nome: CLASSES_DATA[id].nome, sub: `${id}_f_retrato.png`,
        path: `${CAT}classes/${id}/retrato/${id}_f_retrato.png`,
      })),
    },
    // ── Standees ──
    {
      titulo: '♟️ Standee — Inimigos',
      dica: 'inimigos/{id}/peca_tabuleiro/{id}_peca.png',
      items: inimList.map(e=>({ nome:e.nome||e.id, sub:`${e.id}_peca.png`, path:`${CAT}inimigos/${e.id}/peca_tabuleiro/${e.id}_peca.png` })),
    },
    {
      titulo: '♟️ Standee — NPCs',
      dica: 'npcs/{id}/peca_tabuleiro/{id}_peca.png',
      items: npcList.map(n=>({ nome:n.nome||n.id, sub:`${n.id}_peca.png`, path:`${CAT}npcs/${n.id}/peca_tabuleiro/${n.id}_peca.png` })),
    },
    {
      titulo: '♟️ Standee — Classes (M)',
      dica: 'classes/{id}/peca_tabuleiro/{id}_m_peca.png',
      items: classes.map(id=>({ nome:CLASSES_DATA[id].nome, sub:`${id}_m_peca.png`, path:`${CAT}classes/${id}/peca_tabuleiro/${id}_m_peca.png` })),
    },
    {
      titulo: '♟️ Standee — Classes (F)',
      dica: 'classes/{id}/peca_tabuleiro/{id}_f_peca.png',
      items: classes.map(id=>({ nome:CLASSES_DATA[id].nome, sub:`${id}_f_peca.png`, path:`${CAT}classes/${id}/peca_tabuleiro/${id}_f_peca.png` })),
    },
  ];

  function probeImg(path){
    return new Promise(resolve=>{
      const img = new Image();
      img.onload  = ()=>resolve(true);
      img.onerror = ()=>resolve(false);
      img.src = path;
    });
  }

  tab.innerHTML = `
    <div class="section-header"><h2>✓ Checklist de Assets</h2><span class="count-badge" id="ck-pct">verificando…</span></div>
    <div id="ck-body"><div style="padding:40px;text-align:center;color:rgba(190,165,90,.4);font-size:13px">⏳ Verificando arquivos…</div></div>`;

  async function build(){
    let totalOk=0, totalMiss=0;
    let html='';
    for(const sec of sections){
      const results = await Promise.all(sec.items.map(it=>probeImg(it.path)));
      const ok = results.filter(Boolean).length;
      const miss = results.length - ok;
      totalOk += ok; totalMiss += miss;
      html += `<div class="ck-section">
        <div class="ck-section-title">
          ${sec.titulo}
          <span class="ck-section-score ${miss===0?'ck-score-ok':'ck-score-miss'}">${ok}/${results.length}</span>
        </div>
        <div style="font-size:9px;color:rgba(190,165,90,.35);margin-bottom:8px;font-style:italic">${sec.dica}</div>`;
      sec.items.forEach((item,i)=>{
        if(!results[i]){
          html += `<div class="ck-item ck-missing">
            <span class="ck-icon">❌</span>
            <div><div class="ck-nome">${item.nome}</div><div class="ck-path">${item.sub}</div></div>
          </div>`;
        } else {
          html += `<div class="ck-item">
            <span class="ck-icon">✅</span>
            <div><div class="ck-nome">${item.nome}</div></div>
          </div>`;
        }
      });
      html += '</div>';
    }
    const pct = totalOk+totalMiss>0 ? Math.round(totalOk/(totalOk+totalMiss)*100) : 100;
    const cor = totalMiss===0 ? '#4caf50' : pct>=70 ? '#c8a040' : '#f44336';
    document.getElementById('ck-pct').textContent = `${pct}% completo`;
    document.getElementById('ck-pct').style.color = cor;
    const summary = totalMiss>0
      ? `<div class="ck-summary" style="color:${cor}">❌ ${totalMiss} arquivo${totalMiss>1?'s':''} faltando — ${totalOk} presentes</div>`
      : `<div class="ck-summary" style="color:#4caf50">✅ Todos os assets presentes!</div>`;
    document.getElementById('ck-body').innerHTML = summary + html;
  }
  build();
}

// ── TABS ──────────────────────────────────────────────────────────────

let checklistBuilt = false;
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`${tab}-tab`).classList.add('active');
    document.getElementById('filter-bar').style.display = tab==='npcs' ? 'flex' : 'none';
    if(tab==='checklist' && !checklistBuilt){ buildChecklistTab(); checklistBuilt=true; }
    updateCount(tab);
  });
});

// ── NPC FILTER ────────────────────────────────────────────────────────

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('#npc-grid .card').forEach(card=>{
      const cat = card.dataset.cat;
      card.style.display = (f==='todos' || cat===f) ? '' : 'none';
    });
  });
});

// ── COUNT LABEL ──────────────────────────────────────────────────────

function updateCount(tab){
  const labels = {
    classes: `${Object.keys(CLASSES_DATA).length} classes`,
    npcs:    `${Object.keys(NPCS).length} personagens`,
    inimigos:`${INIMIGOS_DATA.length} criaturas`,
  };
  document.getElementById('count-label').textContent = labels[tab]||'';
}

// ── INIT ──────────────────────────────────────────────────────────────

buildClassesTab();
buildNpcsTab();
buildInimigosTab();
buildCenariosTab();
buildRoteiroTab();
updateCount('classes');
</script>
</body>
</html>
