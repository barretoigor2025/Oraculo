<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Oráculo — Catálogo de Personagens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* nada estoura a largura da tela */
    html, body { max-width: 100%; overflow-x: hidden; }

    :root {
      --bg:        #0e0c0a;
      --bg2:       #181410;
      --bg3:       #221e18;
      --gold:      #c8a040;
      --gold2:     #e8c060;
      --gold-dim:  rgba(200,160,64,0.18);
      --text:      #e0d0a8;
      --text-dim:  rgba(200,180,128,0.55);
      --border:    rgba(200,160,64,0.18);
      --aliado:    #2a6a3a;
      --aliado-t:  #60cc80;
      --neutro:    #5a5020;
      --neutro-t:  #ccaa40;
      --hostil:    #6a2020;
      --hostil-t:  #ee6060;
      --vilao:     #4a1a6a;
      --vilao-t:   #cc66ff;
      --radius:    10px;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #0a0806 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 0;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
    }
    .header-top h1 {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }
    .header-top span { font-size: 10px; color: var(--text-dim); margin-left: auto; }
    .btn-sim {
      flex-shrink: 0; margin-left: auto;
      background: rgba(200,160,64,0.13);
      border: 1px solid rgba(200,160,64,0.38);
      border-radius: 22px; padding: 6px 16px;
      color: var(--gold2); font-family: inherit;
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      text-decoration: none; white-space: nowrap;
      transition: background .2s, border-color .2s;
    }
    .btn-sim:hover {
      background: rgba(200,160,64,0.24);
      border-color: rgba(200,160,64,0.65);
    }
    .header-top span { margin-left: 10px; }

    .tabs { display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn-dn {
      padding: 8px 14px 10px;
      white-space: nowrap; flex-shrink: 0;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: rgba(200,100,100,0.45);
      font-size: 12px; font-family: inherit; cursor: pointer;
      transition: color .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn-dn.active { color: #e06060; border-bottom-color: #e06060; }
    .tab-btn-dn:hover  { color: rgba(220,130,130,0.8); }
    .tab-btn {
      padding: 8px 14px 10px;
      white-space: nowrap; flex-shrink: 0;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: inherit; font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .tab-btn.active {
      color: var(--gold2);
      border-bottom-color: var(--gold);
    }
    .tab-btn:hover { color: var(--text); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(200,160,64,0.2);
      background: rgba(200,160,64,0.06);
      color: var(--text-dim); font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active { background: var(--gold-dim); color: var(--gold2); border-color: var(--gold); }
    .filter-btn:hover { color: var(--text); }

    /* ── MAIN GRID ── */
    main { padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(200,160,64,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .card-sprite {
      background: rgba(0,0,0,0.3);
      display: flex; align-items: flex-end; justify-content: center;
      height: 160px; padding: 0;
      position: relative;
    }
    .card-sprite img {
      max-height: 100%; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    .card-sprite .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px;
    }
    .card-portrait {
      position: relative;
      height: 280px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }
    .card-portrait img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 15%;
      display: block;
      transition: opacity .2s;
    }
    .card-portrait .no-img {
      font-size: 48px; opacity: 0.3;
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    }
    .card-portrait::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      pointer-events: none;
    }
    .cat-badge {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 8px; letter-spacing: .8px; text-transform: uppercase;
      font-weight: 700;
    }
    .cat-aliado    { background: var(--aliado);    color: var(--aliado-t); }
    .cat-neutro    { background: var(--neutro);    color: var(--neutro-t); }
    .cat-neutro_hostil { background: #5a3810; color: #ffaa50; }
    .cat-hostil    { background: var(--hostil);    color: var(--hostil-t); }
    .cat-vilao     { background: var(--vilao);     color: var(--vilao-t); }
    .cat-classe    { background: #1a2a4a;          color: #88aaee; }
    .cat-inimigo   { background: #3a1a0a;          color: #ee7744; }

    .card-body { padding: 8px 10px 10px; }
    .card-name {
      font-size: 12px; font-weight: 700;
      color: var(--gold2); line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 10px; color: var(--text-dim);
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── CLASS STAT CHIPS ── */
    .stat-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
      padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      background: rgba(200,160,64,0.1);
      color: rgba(200,160,64,0.7);
      border: 1px solid rgba(200,160,64,0.15);
    }

    /* ── ENEMY TYPE ── */
    .type-badge {
      font-size: 9px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 3px;
    }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      padding: 20px;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    #modal {
      background: var(--bg2);
      border: 1px solid rgba(200,160,64,0.3);
      border-radius: 14px;
      max-width: 640px; width: 100%;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      max-height: calc(100dvh - 40px);
    }
    #modal-inner { overflow-y: auto; flex: 1; }

    .modal-header {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    /* modal sprites — NPC / inimigo */
    .modal-sprites {
      display: flex; flex-direction: column; gap: 0;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      min-width: 90px; max-width: 130px;
      align-self: stretch;
      border-right: 1px solid var(--border);
    }
    .modal-sprite-wrap {
      display: flex; align-items: flex-end; justify-content: center;
      flex: 1; padding: 4px; min-height: 60px;
    }
    .modal-sprite-wrap img {
      max-height: 130px; max-width: 100%;
      object-fit: contain; object-position: bottom;
    }
    /* modal sprites — Classes (M + F com grid branco) */
    .modal-sprites-cls {
      display: flex; flex-direction: row;
      flex-shrink: 0; align-self: stretch;
      min-width: 130px; max-width: 175px;
      border-right: 1px solid var(--border);
    }
    .modal-std-col {
      flex: 1; display: flex; flex-direction: column;
    }
    .modal-std-col + .modal-std-col { border-left: 1px solid rgba(200,160,64,0.18); }
    .modal-std-baseline {
      height: 2px; background: rgba(200,160,64,0.5);
      margin: 0; flex-shrink: 0;
    }
    .modal-std-grid {
      flex: 1; display: flex; align-items: flex-end; justify-content: center;
      height: 150px; overflow: hidden; padding: 2px 3px 0;
      background-image: repeating-linear-gradient(
        to top,
        rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 1px,
        transparent 1px, transparent 28px
      );
      background-color: rgba(8,6,3,0.88);
    }
    .modal-std-grid img { width: auto; max-width: 95%; object-fit: contain; object-position: bottom; }
    .sprite-label {
      text-align: center; font-size: 8px; color: var(--text-dim);
      padding: 3px; letter-spacing: .8px; text-transform: uppercase;
      border-top: 1px solid var(--border); background: rgba(0,0,0,0.4);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-title-area {
      flex: 1; min-width: 0; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .modal-name {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gold2); font-weight: 400;
      line-height: 1.2;
    }
    .modal-cat { display: flex; gap: 6px; align-items: center; }
    .modal-feat {
      font-size: 12px; color: var(--text);
      line-height: 1.5; font-style: italic;
      margin-top: 4px;
    }

    /* stats row */
    .stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 6px;
    }
    .stat-box {
      background: rgba(200,160,64,0.07);
      border: 1px solid rgba(200,160,64,0.15);
      border-radius: 6px; padding: 4px 8px;
      text-align: center; min-width: 48px;
    }
    .stat-box .sv { font-size: 16px; font-weight: 700; color: var(--gold2); }
    .stat-box .sk { font-size: 8px; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }
    .attrs-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px;
      margin-top: 8px;
    }
    /* ── Blindagem responsiva do modal (não estourar a largura no celular) ── */
    #modal-inner { overflow-x: hidden; }
    .modal-body, .section { min-width: 0; }
    .section-text, .modal-feat { overflow-wrap: anywhere; }
    .modal-header { max-width: 100%; }
    /* qualquer grade de atributos com colunas fixas encolhe de verdade */
    .attrs-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    @media (max-width: 560px) {
      #modal-overlay { padding: 8px; }
      .attrs-grid { gap: 3px; }
    }
    .attr-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 5px; padding: 3px 0; text-align: center;
    }
    .attr-box .av { font-size: 13px; font-weight: 700; color: var(--text); }
    .attr-box .am { font-size: 10px; color: var(--gold); }
    .attr-box .ak { font-size: 8px; color: var(--text-dim); letter-spacing: .5px; }

    /* abilities list */
    .habs-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .hab-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(200,160,64,0.1);
      border-radius: 6px; padding: 6px 10px;
    }
    .hab-icon { font-size: 16px; }
    .hab-info { flex: 1; }
    .hab-nome { font-size: 11px; font-weight: 700; color: var(--text); }
    .hab-desc { font-size: 10px; color: var(--text-dim); }
    .hab-tags { display: flex; gap: 4px; margin-top: 3px; }
    .htag {
      font-size: 8px; padding: 1px 5px; border-radius: 3px;
      font-weight: 700; letter-spacing: .3px;
    }
    .htag.dano  { background: rgba(255,80,30,.2); color: #ff9966; border: 1px solid rgba(255,80,30,.3); }
    .htag.sp    { background: rgba(40,140,255,.15); color: #88ccff; border: 1px solid rgba(40,140,255,.25); }
    .htag.type  { background: rgba(200,160,64,.1); color: var(--gold); border: 1px solid rgba(200,160,64,.2); }

    /* modal body sections */
    .modal-body { padding: 16px 20px 20px; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 6px;
      padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .section-text {
      font-size: 12px; color: var(--text);
      line-height: 1.65;
    }
    .section-text span.em { color: var(--gold); font-style: italic; }

    #modal-topbar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.45);
      position: sticky; top: 0; z-index: 5;
    }
    .modal-nav-btn {
      flex-shrink: 0; width: 38px; height: 38px;
      border-radius: 8px; border: 1px solid rgba(200,160,64,0.28);
      background: rgba(200,160,64,0.08);
      color: var(--gold); font-family: inherit; font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .modal-nav-btn:hover { background: rgba(200,160,64,0.2); }
    .modal-nav-btn:disabled { opacity: 0.18; cursor: default; }
    #modal-nav-label {
      flex: 1; text-align: center; font-size: 9px;
      color: rgba(190,165,90,0.45); letter-spacing: 1px; text-transform: uppercase;
    }
    #modal-close {
      flex-shrink: 0; padding: 0 16px; height: 38px;
      border-radius: 8px; border: 1px solid rgba(200,160,64,0.25);
      background: rgba(200,160,64,0.1);
      color: var(--gold); font-family: inherit; font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    #modal-close:hover { background: rgba(200,160,64,0.2); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold);
    }
    .count-badge {
      font-size: 10px; color: var(--text-dim);
    }

    /* ── Botões de download de retrato ── */
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(120,180,140,0.5);
      background: rgba(40,90,60,0.28); color: #9fe0b8;
      border-radius: 999px; padding: 7px 14px;
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-dl:hover { background: rgba(50,120,80,0.42); }
    .btn-dl:active { transform: scale(.96); }
    .btn-dl:disabled { opacity: .6; cursor: default; }
    .btn-dl-todos { margin-left: auto; }   /* empurra p/ direita no header da aba */
    .btn-dl-modal { margin-top: 10px; }     /* dentro do detalhe */

    /* ── SPRITE PAIRS (class m/f) ── */
    .sprite-pair {
      display: flex; gap: 0;
    }
    .sprite-pair .modal-sprite-wrap {
      border-right: 1px solid var(--border);
    }
    .sprite-pair .modal-sprite-wrap:last-child { border-right: none; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(200,160,64,0.3); border-radius: 2px; }

    /* ── SIZE TAB ── */
    #size-tab { padding: 0; display: flex; flex-direction: column; height: 100%; }

    #size-picker {
      padding: 10px 12px 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .size-picker-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; flex-wrap: wrap;
    }
    .size-cat-btn {
      font-size: 9px; letter-spacing: .8px; text-transform: uppercase;
      border: 1px solid rgba(200,160,64,0.22); border-radius: 20px;
      padding: 3px 10px; background: transparent;
      color: var(--text-dim); cursor: pointer; transition: all .15s;
    }
    .size-cat-btn.active {
      background: rgba(200,160,64,0.14); color: var(--gold);
      border-color: rgba(200,160,64,0.5);
    }
    #size-clear {
      font-size: 9px; letter-spacing: .8px;
      text-transform: uppercase; border: 1px solid rgba(255,80,80,0.25);
      border-radius: 20px; padding: 3px 10px; background: transparent;
      color: rgba(220,100,80,0.6); cursor: pointer;
    }
    #size-clear:hover { color: #e06040; border-color: rgba(255,80,80,0.5); }
    #size-zoom-ctrl {
      display: flex; align-items: center; gap: 4px; margin-left: auto;
    }
    #sz-export-btn {
      height: 26px; padding: 0 8px; border-radius: 6px;
      border: 1px solid rgba(80,180,120,0.35); background: rgba(60,160,80,0.09);
      color: rgba(100,210,140,0.8); font-size: 9px; letter-spacing: .5px;
      text-transform: uppercase; cursor: pointer; white-space: nowrap;
      transition: background .12s;
    }
    #sz-export-btn:hover { background: rgba(60,160,80,0.22); color: #70e8a0; }
    .sz-zoom-btn {
      width: 26px; height: 26px; border-radius: 6px;
      border: 1px solid rgba(200,160,64,0.3); background: rgba(200,160,64,0.07);
      color: var(--gold); font-size: 16px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .sz-zoom-btn:hover { background: rgba(200,160,64,0.18); }
    .sz-zoom-btn:disabled { opacity: 0.22; cursor: default; }
    #sz-pct {
      font-size: 9px; color: rgba(200,165,80,0.55); letter-spacing: .5px;
      min-width: 30px; text-align: center;
    }

    #size-chips-scroll {
      display: flex; flex-wrap: wrap; gap: 5px;
      max-height: 88px; overflow-y: auto;
    }
    .size-chip {
      font-size: 9px; padding: 3px 9px; border-radius: 20px; cursor: pointer;
      border: 1px solid rgba(200,160,64,0.20); background: rgba(0,0,0,0.3);
      color: rgba(200,175,100,0.65); user-select: none; transition: all .12s;
      white-space: nowrap;
    }
    .size-chip:hover  { border-color: rgba(200,160,64,0.5); color: var(--text); }
    .size-chip.on {
      background: rgba(200,160,64,0.15); border-color: var(--gold);
      color: var(--gold2);
    }
    .size-chip.on::before { content: '✓ '; font-size: 8px; }

    #size-selected-bar {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin-top: 7px; min-height: 0;
    }
    .size-sel-chip {
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; padding: 2px 8px; border-radius: 20px;
      background: rgba(200,160,64,0.12); border: 1px solid rgba(200,160,64,0.35);
      color: var(--gold2); white-space: nowrap;
    }
    .size-sel-chip button {
      background: none; border: none; color: rgba(255,100,80,0.6);
      cursor: pointer; font-size: 11px; line-height: 1; padding: 0;
    }
    .size-sel-chip button:hover { color: #e05030; }

    #size-arena {
      flex: 1; overflow-x: auto; overflow-y: hidden;
      position: relative;
      background: #0e0b08;
    }
    #size-canvas { display: block; }
    #size-units-overlay {
      position: absolute; top: 0; left: 0;
      pointer-events: all;
    }
    .sz-unit {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      transform: translateX(-50%);
      cursor: pointer;
    }
    .sz-unit img {

// ── Download de retratos (individual e em lote, sem zip) ─────────────
async function baixarImagem(url, filename){
  try{
    const resp = await fetch(url, {cache:'no-store'});
    if(!resp.ok) return false;
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  }catch(e){ console.warn('download falhou:', url, e); return false; }
}
// Baixa vários em SEQUÊNCIA (o navegador pede permissão 1x e baixa todos).
async function baixarPack(itens, btn){
  const txt0 = btn ? btn.innerHTML : '';
  let ok = 0;
  if(btn) btn.disabled = true;
  for(let i=0;i<itens.length;i++){
    if(btn) btn.textContent = `⏳ ${i+1}/${itens.length}…`;
    if(await baixarImagem(itens[i].url, itens[i].filename)) ok++;
    await new Promise(r=>setTimeout(r, 450));
  }
  if(btn){ btn.textContent = `✓ ${ok}/${itens.length}`; setTimeout(()=>{ btn.innerHTML = txt0; btn.disabled = false; }, 2600); }
}
window.baixarImagem = baixarImagem;
window.baixarPack = baixarPack;
// Baixa UM retrato, com feedback no botão.
window.baixarUm = async function(url, filename, btn){
  const t0 = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Baixando…'; }
  const ok = await baixarImagem(url, filename);
  if(btn){ btn.textContent = ok ? '✓ Baixado!' : '✕ Não encontrado'; setTimeout(()=>{ btn.innerHTML = t0; btn.disabled = false; }, 2400); }
};

// ── Navegação do modal (<>) ────────────────────────────────────────────
let _nav = { type: null, list: [], idx: 0 };

function _setNav(type, list, idx){
  _nav = { type, list, idx };
  const lbl = document.getElementById('modal-nav-label');
  if(lbl) lbl.textContent = `${idx+1} / ${list.length}`;
  const prev = document.getElementById('modal-prev');
  const next = document.getElementById('modal-next');
  if(prev) prev.disabled = idx === 0;
  if(next) next.disabled = idx === list.length - 1;
}

window.navModal = function(dir){
  const ni = _nav.idx + dir;
  if(ni < 0 || ni >= _nav.list.length) return;
  const id = _nav.list[ni];
  if(_nav.type === 'classe' || _nav.type === 'dn-classe') openClassModal(id, ni);
  if(_nav.type === 'npc')      openNpcModal(id,    ni);
  if(_nav.type === 'inimigo')  openEnemyModal(id,  ni);
  if(_nav.type === 'dn-personagem') openDnPersonagemModal(id, ni);
};

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  const inner = document.getElementById('modal-inner');
  if(inner) inner.scrollTop = 0;
}
window.closeModal = function(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
};

// close on overlay click
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeModal();
});

// close on Escape
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

function buildChecklistTab(){
  const tab = document.getElementById('checklist-tab');
  if(campAtual !== 'mhoried'){
    tab.innerHTML = `<div class="section-header"><h2>Checklist</h2></div>
      <div style="text-align:center;padding:48px;color:rgba(200,160,64,0.22);font-size:11px;letter-spacing:1.5px;text-transform:uppercase">Checklist em construção</div>`;
    return;
  }
  const npcList = Object.values(NPCS);
  const inimList = INIMIGOS_COMPLETO || INIMIGOS_DATA;
  const classes = Object.keys(CLASSES_DATA);
  const CAT = 'catalogo/mhoried/';

  // Cenários por Ato
  const cenasList = CENAS_ORDEM.map(id=>CENAS[id]).filter(Boolean);
  const atoMap = {};
  for(const c of cenasList){
    const a = c.ato || 1;
    if(!atoMap[a]) atoMap[a] = [];
    const bgPath = c.imgExterior || c.imgInterior
      || ((window._MAPAS_BATALHA && window._MAPAS_BATALHA[c.id]?.mapa)
          || `${CAT}cenarios/batalha_hex/${c.id}/imagem/${c.id}.png`);
    atoMap[a].push({
      nome: c.titulo,
      sub: bgPath.split('/').pop(),
      path: bgPath,
    });
    if(c.temBatalha){
      const bm = (window._MAPAS_BATALHA && window._MAPAS_BATALHA[c.id]?.mapa)
        || `${CAT}cenarios/batalha_hex/${c.id}/imagem/${c.id}.png`;
      atoMap[a].push({
        nome: `${c.titulo} — mapa batalha`,
        sub: bm.split('/').pop(),
        path: bm,
      });
    }
  }
  const cenarioSections = Object.keys(atoMap).sort((a,b)=>+a-+b).map(ato=>({
    titulo: `🗺️ Ato ${ato} — Cenários`,
    dica: `cenarios/{id}/imagem/{id}.png  |  mapa: cenarios/{id}/mapa/{id}_mapa.png`,
    items: atoMap[ato],
  }));

  const sections = [
    {
      titulo: '🗺️ Mapa do Mundo (Pilar 5)',
      dica: `mapa/mapa_${campAtual}.png  —  imagem do mundo (~2:1, scroll horizontal)`,
      items: [{
        nome: 'Mapa do Mundo', sub: `mapa_${campAtual}.png`,
        path: `${CAT}mapa/mapa_${campAtual}.png`,
      }],
    },
    ...cenarioSections,
    {
      titulo: '🖼️ Retratos NPC',
      dica: 'npcs/{id}/retrato/{id}_retrato.png',
      items: npcList.map(n=>({
        nome: n.nome||n.id, sub: `${n.id}_retrato.png`,
        path: `${CAT}npcs/${n.id}/retrato/${n.id}_retrato.png`,
      })),
    },
    {
      titulo: '👾 Retratos Inimigos',
      dica: 'inimigos/{id}/retrato/{id}_retrato.png',
      items: inimList.map(e=>({
        nome: e.nome||e.id, sub: `${e.id}_retrato.png`,
        path: `${CAT}inimigos/${e.id}/retrato/${e.id}_retrato.png`,
      })),
    },
    {
      titulo: '🧙 Retratos de Classe — Masculino',
      dica: 'classes/{id}/retrato/{id}_m_retrato.png',
      items: classes.map(id=>({
        nome: CLASSES_DATA[id].nome, sub: `${id}_m_retrato.png`,
        path: `${CAT}classes/${id}/retrato/${id}_m_retrato.png`,
      })),
    },
    {
      titulo: '🧙 Retratos de Classe — Feminino',
      dica: 'classes/{id}/retrato/{id}_f_retrato.png',
      items: classes.map(id=>({
        nome: CLASSES_DATA[id].nome, sub: `${id}_f_retrato.png`,
        path: `${CAT}classes/${id}/retrato/${id}_f_retrato.png`,
      })),
    },
    // ── Standees ──
    {
      titulo: '♟️ Standee — Inimigos',
      dica: 'inimigos/{id}/peca_tabuleiro/{id}_peca.png',
      items: inimList.map(e=>({ nome:e.nome||e.id, sub:`${e.id}_peca.png`, path:`${CAT}inimigos/${e.id}/peca_tabuleiro/${e.id}_peca.png` })),
    },
    {
      titulo: '♟️ Standee — NPCs',
      dica: 'npcs/{id}/peca_tabuleiro/{id}_peca.png',
      items: npcList.map(n=>({ nome:n.nome||n.id, sub:`${n.id}_peca.png`, path:`${CAT}npcs/${n.id}/peca_tabuleiro/${n.id}_peca.png` })),
    },
    {
      titulo: '♟️ Standee — Classes (M)',
      dica: 'classes/{id}/peca_tabuleiro/{id}_m_peca.png',
      items: classes.map(id=>({ nome:CLASSES_DATA[id].nome, sub:`${id}_m_peca.png`, path:`${CAT}classes/${id}/peca_tabuleiro/${id}_m${_REVISED_STANDEE[id+'_m']||''}_peca.png` })),
    },
    {
      titulo: '♟️ Standee — Classes (F)',
      dica: 'classes/{id}/peca_tabuleiro/{id}_f_peca.png',
      items: classes.map(id=>({ nome:CLASSES_DATA[id].nome, sub:`${id}_f_peca.png`, path:`${CAT}classes/${id}/peca_tabuleiro/${id}_f${_REVISED_STANDEE[id+'_f']||''}_peca.png` })),
    },
  ];

  function probeImg(path){
    return new Promise(resolve=>{
      const img = new Image();
      img.onload  = ()=>resolve(true);
      img.onerror = ()=>resolve(false);
      img.src = path;
    });
  }

  tab.innerHTML = `
    <div class="section-header"><h2>✓ Checklist de Assets</h2><span class="count-badge" id="ck-pct">verificando…</span></div>
    <div id="ck-body"><div style="padding:40px;text-align:center;color:rgba(190,165,90,.4);font-size:13px">⏳ Verificando arquivos…</div></div>`;

  async function build(){
    let totalOk=0, totalMiss=0;
    let html='';
    for(const sec of sections){
      const results = await Promise.all(sec.items.map(it=>probeImg(it.path)));
      const ok = results.filter(Boolean).length;
      const miss = results.length - ok;
      totalOk += ok; totalMiss += miss;
      html += `<div class="ck-section">
        <div class="ck-section-title">
          ${sec.titulo}
          <span class="ck-section-score ${miss===0?'ck-score-ok':'ck-score-miss'}">${ok}/${results.length}</span>
        </div>
        <div style="font-size:9px;color:rgba(190,165,90,.35);margin-bottom:8px;font-style:italic">${sec.dica}</div>`;
      sec.items.forEach((item,i)=>{
        if(!results[i]){
          html += `<div class="ck-item ck-missing">
            <span class="ck-icon">❌</span>
            <div><div class="ck-nome">${item.nome}</div><div class="ck-path">${item.sub}</div></div>
          </div>`;
        } else {
          html += `<div class="ck-item">
            <span class="ck-icon">✅</span>
            <div><div class="ck-nome">${item.nome}</div></div>
          </div>`;
        }
      });
      html += '</div>';
    }
    const pct = totalOk+totalMiss>0 ? Math.round(totalOk/(totalOk+totalMiss)*100) : 100;
    const cor = totalMiss===0 ? '#4caf50' : pct>=70 ? '#c8a040' : '#f44336';
    document.getElementById('ck-pct').textContent = `${pct}% completo`;
    document.getElementById('ck-pct').style.color = cor;
    const summary = totalMiss>0
      ? `<div class="ck-summary" style="color:${cor}">❌ ${totalMiss} arquivo${totalMiss>1?'s':''} faltando — ${totalOk} presentes</div>`
      : `<div class="ck-summary" style="color:#4caf50">✅ Todos os assets presentes!</div>`;
    document.getElementById('ck-body').innerHTML = summary + html;
  }
  build();
}

    if(tab==='checklist' && !checklistBuilt){ buildChecklistTab(); checklistBuilt=true; }
    if(tab==='size'      && !sizeBuilt)     { buildSizeTab();      sizeBuilt=true; }
    updateCount(tab);
  });
});

// ── SIZE TAB ──────────────────────────────────────────────────────────

function buildSizeTab(){
  const tab = document.getElementById('size-tab');

  // ── Monta o banco de entidades disponíveis ────────────────────────
  // Escala: 1 hex-height (RS=95px jogo) = 55px no comparador
  const HEX_DISP = 55;
  const GAME_HEX = 95;

  // Alturas armazenadas conhecidas por classe
  const CLASS_H = {
    barbaro:{m:400,f:362}, guerreiro:{m:338,f:300},
    arqueiro:{m:290,f:284}, mago:{m:290,f:290},
    ladino:{m:314,f:330}, clerigo:{m:306,f:298},
  };

  const DB = {}; // key → {nome, path, storedH, color, type, short}

  // Classes
  for(const [id,cls] of Object.entries(CLASSES_DATA)){
    for(const g of ['m','f']){
      const key = `classe:${id}_${g}`;
      DB[key] = {
        nome:  `${cls.nome} ${g==='m'?'♂':'♀'}`,
        short: `${cls.nome.slice(0,4)} ${g==='m'?'♂':'♀'}`,
        path:  `catalogo/mhoried/classes/${id}/peca_tabuleiro/${id}_${g}${(_REVISED_STANDEE[id+'_'+g]||'')}_peca.png`,
        storedH: CLASS_H[id]?.[g] ?? 300,
        color: cls.cor, type:'classe',
      };
    }
  }
  // NPCs
  for(const [id,npc] of Object.entries(NPCS)){
    const key = `npc:${id}`;
    DB[key] = {
      nome: npc.nome||id, short:(npc.nome||id).slice(0,8),
      path: `catalogo/mhoried/npcs/${id}/peca_tabuleiro/${id}_peca.png`,
      storedH: null, // descoberto ao carregar a imagem
      color:'#3a5a7a', type:'npc',
    };
  }
  // Inimigos
  for(const en of (INIMIGOS_COMPLETO||[])){
    const key = `inimigo:${en.id}`;
    DB[key] = {
      nome: en.nome||en.id, short:(en.nome||en.id).slice(0,8),
      path: `catalogo/mhoried/inimigos/${en.id}/peca_tabuleiro/${en.id}_peca.png`,
      storedH: null,
      color:'#7a2a2a', type:'inimigo',
    };
  }

  // ── Estado da seleção ─────────────────────────────────────────────
  let selected = []; // ordered array of keys
  let catFilter = 'classes'; // 'classes' | 'npcs' | 'inimigos'
  let _zoom = 1.0;  // zoom do comparador: 0.4–1.5
  const ZOOM_STEPS = [0.4, 0.5, 0.65, 0.8, 1.0, 1.2, 1.5];
  const imgCache = {}; // key → HTMLImageElement (loaded)

  // ── Alturas customizadas (persistidas em localStorage) ────────────
  const LS_KEY = 'oraculo_sz_heights';
  let customHeights = {};
  try { customHeights = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){}
  function _saveCustomH(){ localStorage.setItem(LS_KEY, JSON.stringify(customHeights)); }

  let _editingKey = null;
  let _pendingH   = null; // valor editado mas ainda não confirmado

  // ── HTML ──────────────────────────────────────────────────────────
  tab.innerHTML = `
    <div id="size-picker">
      <div class="size-picker-row">
        <button class="size-cat-btn active" data-cat="classes">Classes</button>
        <button class="size-cat-btn" data-cat="npcs">NPCs</button>
        <button class="size-cat-btn" data-cat="inimigos">Inimigos</button>
        <button id="size-clear">✕ Limpar</button>
        <div id="size-zoom-ctrl">
          <button class="sz-zoom-btn" id="sz-zm" title="Diminuir">−</button>
          <span id="sz-pct">100%</span>
          <button class="sz-zoom-btn" id="sz-zp" title="Aumentar">+</button>
          <button id="sz-export-btn" title="Exportar alturas salvas como JSON">⬇ Exportar</button>
        </div>
      </div>
      <div id="size-chips-scroll"></div>
      <div id="size-selected-bar"></div>
    </div>
    <div id="size-arena">
      <div id="size-empty">Selecione personagens acima<br>para comparar alturas</div>
      <canvas id="size-canvas" style="display:none"></canvas>
      <div id="size-units-overlay"></div>
    </div>
    <div id="sz-editor">
      <span id="sz-ed-lbl">—</span>
      <button class="sz-ed-btn" id="sz-ed-m10">−10</button>
      <button class="sz-ed-btn" id="sz-ed-m1">−1</button>
      <span id="sz-ed-h">—</span>
      <button class="sz-ed-btn" id="sz-ed-p1">+1</button>
      <button class="sz-ed-btn" id="sz-ed-p10">+10</button>
      <button class="sz-ed-btn confirm" id="sz-ed-ok">✓ Confirmar</button>
      <button class="sz-ed-btn cancel"  id="sz-ed-cancel">✗ Cancelar</button>
      <button class="sz-ed-btn rst"     id="sz-ed-rst">↺ Reset</button>
    </div>`;

  // ── Popula chips de categoria ─────────────────────────────────────
  function renderChips(){
    const wrap = document.getElementById('size-chips-scroll');
    const keysForCat = Object.keys(DB).filter(k=>{
      if(catFilter==='classes')  return DB[k].type==='classe';
      if(catFilter==='npcs')     return DB[k].type==='npc';
      if(catFilter==='inimigos') return DB[k].type==='inimigo';
    });
    wrap.innerHTML = keysForCat.map(k=>`
      <div class="size-chip${selected.includes(k)?' on':''}" data-key="${k}">
        ${DB[k].short}
      </div>`).join('');
    wrap.querySelectorAll('.size-chip').forEach(ch=>{
      ch.addEventListener('click',()=>{
        const k=ch.dataset.key;
        if(selected.includes(k)) selected=selected.filter(x=>x!==k);
        else selected.push(k);
        renderChips(); renderSelectedBar(); renderArena();
      });
    });
  }

  // ── Barra de selecionados ─────────────────────────────────────────
  function renderSelectedBar(){
    const bar = document.getElementById('size-selected-bar');
    if(!selected.length){ bar.innerHTML=''; return; }
    bar.innerHTML = selected.map(k=>`
      <div class="size-sel-chip" data-key="${k}">
        <span>${DB[k].short}</span>
        <button data-key="${k}" title="Remover">×</button>
      </div>`).join('');
    bar.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const k=btn.dataset.key;
        selected=selected.filter(x=>x!==k);
        renderChips(); renderSelectedBar(); renderArena();
      });
    });
  }

  // ── Arena de comparação ───────────────────────────────────────────
  const RULER_W  = 42;
  const UNIT_W   = 72;
  const UNIT_GAP = 8;
  const TOP_PAD  = 14;
  const BASE_PAD = 26; // espaço abaixo da baseline (labels)
  const MAX_HEX_LINES = 6; // régua até 6 hexes de altura
  const ARENA_H = TOP_PAD + MAX_HEX_LINES * HEX_DISP + BASE_PAD;

  function loadImg(key){
    return new Promise(resolve=>{
      if(imgCache[key]){ resolve(imgCache[key]); return; }
      const img=new Image();
      img.onload  = ()=>{ imgCache[key]=img; if(!DB[key].storedH) DB[key].storedH=img.naturalHeight; resolve(img); };
      img.onerror = ()=>{ imgCache[key]=null; resolve(null); };
      img.src = DB[key].path;
    });
  }

  async function renderArena(){
    const empty  = document.getElementById('size-empty');
    const cv     = document.getElementById('size-canvas');
    const overlay= document.getElementById('size-units-overlay');

    if(!selected.length){
      empty.style.display='flex'; cv.style.display='none';
      overlay.innerHTML=''; return;
    }
    empty.style.display='none'; cv.style.display='block';

    // Valores escalados pelo zoom
    const hexDisp = Math.round(HEX_DISP * _zoom);
    const unitW   = Math.round(UNIT_W   * _zoom);
    const arenaH  = TOP_PAD + MAX_HEX_LINES * hexDisp + BASE_PAD;

    // Carrega todas as imagens
    const imgs = await Promise.all(selected.map(k=>loadImg(k)));

    // Calcula dimensões
    const canvasW = RULER_W + selected.length * (unitW + UNIT_GAP) + 10;
    cv.width  = canvasW;
    cv.height = arenaH;
    overlay.style.width  = canvasW+'px';
    overlay.style.height = arenaH+'px';
    document.getElementById('size-arena').style.minHeight = arenaH+'px';

    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,canvasW,arenaH);

    // Fundo
    ctx.fillStyle='#0d0b08'; ctx.fillRect(0,0,canvasW,arenaH);

    const baseY = TOP_PAD + MAX_HEX_LINES * hexDisp;

    // Área de conteúdo
    ctx.fillStyle='rgba(10,8,4,0.88)';
    ctx.fillRect(RULER_W, 0, canvasW-RULER_W, baseY+4);

    // ── Grid métrico: 10cm fino · ênfase 1m e 1.5m ──────────────────
    const pxPerM  = hexDisp / 1.5;          // pixels por metro (1 hex = 1.5 m)
    const totalCm = MAX_HEX_LINES * 150;    // cm totais visíveis
    // Granularidade adaptativa ao zoom
    const incCm = _zoom >= 1.0 ? 10 : (_zoom >= 0.65 ? 50 : 100);
    for(let cm = 0; cm <= totalCm; cm += incCm){
      const lineY = baseY - cm / 100 * pxPerM;
      if(lineY < TOP_PAD - 4) break;
      const isBase = cm === 0;
      const at150  = cm > 0 && cm % 150 === 0;  // 1.5 m, 3 m, 4.5 m…
      const at100  = cm > 0 && cm % 100 === 0 && !at150; // 1 m, 2 m (não 3 m)
      const at50   = cm > 0 && cm % 50  === 0 && !at100 && !at150; // 0.5 m, 2.5 m
      // – linha horizontal –
      ctx.beginPath();
      ctx.moveTo(RULER_W, lineY); ctx.lineTo(canvasW, lineY);
      if(isBase){
        ctx.strokeStyle = 'rgba(255,255,255,0.90)'; ctx.lineWidth = 1.5;
      } else if(at150){
        ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.2;
      } else if(at100){
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.0;
      } else if(at50){
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.7;
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.5;
      }
      ctx.stroke();
      // – rótulo e tick da régua –
      ctx.font = '7px Georgia'; ctx.textAlign = 'right';
      if(isBase){
        ctx.fillStyle = 'rgba(200,165,80,0.50)';
        ctx.fillText('0m', RULER_W-5, lineY-2);
      } else if(at150 || at100){
        const m = cm / 100;
        const lbl = Number.isInteger(m) ? `${m}m` : `${m.toFixed(1)}m`;
        ctx.fillStyle = at150 ? 'rgba(230,210,150,0.82)' : 'rgba(200,165,80,0.62)';
        ctx.fillText(lbl, RULER_W-5, lineY+3);
        ctx.beginPath();
        ctx.moveTo(RULER_W-5, lineY); ctx.lineTo(RULER_W, lineY);
        ctx.strokeStyle = at150 ? 'rgba(230,210,150,0.55)' : 'rgba(200,165,80,0.40)';
        ctx.lineWidth = 1; ctx.stroke();
      } else if(at50 && _zoom >= 0.8){
        ctx.beginPath();
        ctx.moveTo(RULER_W-3, lineY); ctx.lineTo(RULER_W, lineY);
        ctx.strokeStyle = 'rgba(200,165,80,0.22)'; ctx.lineWidth = 0.8; ctx.stroke();
      }
    }

    // Linha divisória de régua
    ctx.beginPath();
    ctx.moveTo(RULER_W,0); ctx.lineTo(RULER_W,arenaH);
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.stroke();

    // Separadores de unidade
    for(let i=0;i<selected.length;i++){
      const cx = RULER_W + i*(unitW+UNIT_GAP) + unitW/2;
      if(i>0){
        ctx.beginPath();
        ctx.moveTo(cx-unitW/2-UNIT_GAP/2, 0);
        ctx.lineTo(cx-unitW/2-UNIT_GAP/2, arenaH);
        ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=0.8; ctx.stroke();
      }
    }

    // Renderiza imagens HTML
    overlay.innerHTML='';
    selected.forEach((key,i)=>{
      const img   = imgs[i];
      const entry = DB[key];
      const storedH = (_editingKey===key && _pendingH!==null ? _pendingH : customHeights[key]) || (img?.naturalHeight) || entry.storedH || 300;
      const dispH   = Math.round(storedH/GAME_HEX*hexDisp);
      const safeDispH = Math.min(dispH, MAX_HEX_LINES*hexDisp-2);
      const cx = RULER_W + i*(unitW+UNIT_GAP) + unitW/2;

      const div=document.createElement('div');
      div.className='sz-unit' + (_editingKey===key ? ' sz-selected' : '');
      div.dataset.key=key;
      div.style.left= cx+'px';
      div.style.top = (baseY-safeDispH-2)+'px';

      if(img){
        const el=document.createElement('img');
        el.src   = entry.path;
        el.alt   = entry.nome;
        el.style.height = safeDispH+'px';
        div.appendChild(el);
      } else {
        const ph=document.createElement('div');
        ph.style.cssText=`height:${safeDispH}px;width:40px;opacity:0.12;
          background:rgba(200,160,64,0.2);border:1px dashed rgba(200,160,64,0.3);
          border-radius:4px;`;
        div.appendChild(ph);
      }

      const lbl=document.createElement('div');
      lbl.className='sz-unit-lbl'; lbl.textContent=entry.short;
      div.appendChild(lbl);
      div.addEventListener('click', ()=>_openEditor(key));
      overlay.appendChild(div);
    });
  }

  function _updateZoomUI(){
    const idx = ZOOM_STEPS.indexOf(_zoom);
    const zmBtn = document.getElementById('sz-zm');
    const zpBtn = document.getElementById('sz-zp');
    const pctEl = document.getElementById('sz-pct');
    if(zmBtn) zmBtn.disabled = idx <= 0;
    if(zpBtn) zpBtn.disabled = idx >= ZOOM_STEPS.length-1;
    if(pctEl) pctEl.textContent = Math.round(_zoom*100)+'%';
  }

  function _openEditor(key){
    // Se havia edição pendente em outro personagem, descarta
    _pendingH = null;
    _editingKey = key;
    document.getElementById('sz-editor').style.display = 'flex';
    _refreshEditorUI();
    renderArena();
  }

  function _currentH(){
    if(!_editingKey) return 300;
    if(_pendingH !== null) return _pendingH;
    return customHeights[_editingKey] || (imgCache[_editingKey]?.naturalHeight) || DB[_editingKey].storedH || 300;
  }

  function _refreshEditorUI(){
    if(!_editingKey) return;
    const h = _currentH();
    const isPending = _pendingH !== null;
    const isSaved   = customHeights[_editingKey] != null;
    document.getElementById('sz-ed-lbl').textContent = DB[_editingKey].nome;
    const hEl = document.getElementById('sz-ed-h');
    hEl.textContent = `${h}px · ${(h/GAME_HEX).toFixed(2)}h${isPending ? ' ●' : ''}`;
    hEl.className = isPending ? 'pending' : (isSaved ? 'saved' : '');
    document.getElementById('sz-ed-ok').disabled = !isPending;
    document.getElementById('sz-ed-cancel').disabled = !isPending;
  }

  function _changeH(delta){
    if(!_editingKey) return;
    const cur = _currentH();
    _pendingH = Math.max(50, Math.min(800, cur + delta));
    _refreshEditorUI();
    renderArena();
  }

  // ── Eventos ───────────────────────────────────────────────────────
  tab.querySelectorAll('.size-cat-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      tab.querySelectorAll('.size-cat-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      catFilter=btn.dataset.cat;
      renderChips();
    });
  });
  document.getElementById('size-clear').addEventListener('click',()=>{
    selected=[]; renderChips(); renderSelectedBar(); renderArena();
  });
  document.getElementById('sz-zm').addEventListener('click',()=>{
    const idx = ZOOM_STEPS.indexOf(_zoom);
    if(idx > 0){ _zoom=ZOOM_STEPS[idx-1]; _updateZoomUI(); renderArena(); }
  });
  document.getElementById('sz-zp').addEventListener('click',()=>{
    const idx = ZOOM_STEPS.indexOf(_zoom);
    if(idx < ZOOM_STEPS.length-1){ _zoom=ZOOM_STEPS[idx+1]; _updateZoomUI(); renderArena(); }
  });
  document.getElementById('sz-export-btn').addEventListener('click',()=>{
    // Build a complete height map: defaults merged with any saved customizations
    const full = {};
    for(const [cls, genders] of Object.entries(_STANDEE_DEF_H)){
      for(const [g, defH] of Object.entries(genders)){
        const key = 'classe:'+cls+'_'+g;
        full[key] = customHeights[key] || defH;
      }
    }
    const json = JSON.stringify(full, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'oraculo_standee_heights.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById('sz-ed-m10').addEventListener('click',()=>_changeH(-10));
  document.getElementById('sz-ed-m1') .addEventListener('click',()=>_changeH(-1));
  document.getElementById('sz-ed-p1') .addEventListener('click',()=>_changeH(+1));
  document.getElementById('sz-ed-p10').addEventListener('click',()=>_changeH(+10));

  // Confirmar: salva o valor pendente em localStorage
  document.getElementById('sz-ed-ok').addEventListener('click',()=>{
    if(!_editingKey || _pendingH===null) return;
    customHeights[_editingKey] = _pendingH;
    _saveCustomH();
    _pendingH = null;
    _refreshEditorUI();
    renderArena();
  });

  // Cancelar: descarta edição pendente, volta ao salvo
  document.getElementById('sz-ed-cancel').addEventListener('click',()=>{
    _pendingH = null;
    _refreshEditorUI();
    renderArena();
  });

  // Reset: remove valor salvo, volta ao original da imagem
  document.getElementById('sz-ed-rst').addEventListener('click',()=>{
    if(!_editingKey) return;
    _pendingH = null;
    delete customHeights[_editingKey];
    _saveCustomH();
    _refreshEditorUI();
    renderArena();
  });

  _updateZoomUI();
  renderChips();
  renderArena();
}

function aplicarCampanha(camp){
  campAtual = camp;
  localStorage.setItem('oraculo.campaign', camp);
  const CAMP_ICONS = {mhoried:'⚔️','death-note':'📓',fantasma:'👻'};
  const CAMP_NAMES = {mhoried:'Mhoried','death-note':'Death Note',fantasma:'C. Fantasma'};
  document.querySelectorAll('.camp-menu-item').forEach(i=>i.classList.toggle('active', i.dataset.camp===camp));
  document.getElementById('camp-sel-icon').textContent = CAMP_ICONS[camp]||'?';
  document.getElementById('camp-sel-nome').textContent = CAMP_NAMES[camp]||camp;
  document.getElementById('cat-titulo').textContent = CAMP_NAMES[camp]||camp;
  // Aplicar paleta de cores da campanha
  document.body.dataset.camp = camp;
  const pal = CAMP_PALETTE[camp] || CAMP_PALETTE.mhoried;
  Object.entries(pal).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
  const sizeBtn = document.getElementById('tab-size-btn');
  if(sizeBtn) sizeBtn.style.display = camp==='mhoried' ? '' : 'none';
  _rebuildAllTabs();
  _switchTab('classes');
  updateCount('classes');
}

// Tabs unificados
document.querySelectorAll('#tabs-main .tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    _switchTab(btn.dataset.tab);
    updateCount(btn.dataset.tab);
  });
});

// Aplicar campanha salva no load
aplicarCampanha(campAtual);

// ── NPC FILTER ────────────────────────────────────────────────────────

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('#npc-grid .card').forEach(card=>{
      const cat = card.dataset.cat;
      card.style.display = (f==='todos' || cat===f) ? '' : 'none';
    });
  });
});

// ── COUNT LABEL ──────────────────────────────────────────────────────

function updateCount(tab){
  const data = campAtual==='mhoried' ? CLASSES_DATA :
               campAtual==='death-note' ? DN_CLASSES_DATA : FANTASMA_CLASSES;
  const nData = campAtual==='mhoried' ? NPCS :
                campAtual==='death-note' ? {length:DN_PERSONAGENS.length} : {length:FANTASMA_NPCS.length};
  const labels = {
    classes: `${Object.keys(data).length} classes`,
    npcs:    `${campAtual==='mhoried'?Object.keys(nData).length:nData.length} personagens`,
    inimigos:`${campAtual==='mhoried'?(INIMIGOS_COMPLETO||INIMIGOS_DATA).length:0} criaturas`,
  };
  document.getElementById('count-label').textContent = labels[tab]||'';
}

// ── INIT ──────────────────────────────────────────────────────────────

_rebuildAllTabs();
updateCount('classes');
</script>
<div style="position:fixed;bottom:2px;left:4px;z-index:99999;font:9px monospace;color:rgba(200,160,80,.4);pointer-events:none">cat-v7</div>
