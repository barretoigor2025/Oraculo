<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Sala de Espera</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#050302;font-family:Georgia,serif;color:#e8d5a8;}
body{
  min-height:100vh;
  background:
    linear-gradient(to bottom, rgba(3,1,0,0.50) 0%, rgba(3,1,0,0.75) 55%, rgba(3,1,0,0.94) 100%),
    url('catalogo/mhoried/cenarios/conversacao/castelo_mhoried/imagem/castelo_ext.png') top center/cover no-repeat fixed;
  display:flex; flex-direction:column; align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  gap:20px;
}

/* ── LOGO ── */
#header{ text-align:center; padding-top:4px; }
#logo{
  font-size:13px; letter-spacing:5px; text-transform:uppercase;
  color:rgba(245,216,120,0.42);
}

/* ── LOBBY CARD ── */
#lobby-card{
  width:100%; max-width:430px;
  background:rgba(7,4,1,0.90);
  border:1px solid rgba(190,140,35,0.28);
  border-radius:22px; padding:22px 20px;
  display:flex; flex-direction:column; gap:18px;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 40px rgba(0,0,0,0.70);
}

#sala-titulo{
  font-size:clamp(17px,5vw,21px); font-weight:700;
  color:#f5d878; text-align:center; letter-spacing:.3px;
}
#sala-desc{
  font-size:11px; color:rgba(200,175,100,0.42);
  text-align:center; font-style:italic; margin-top:-12px;
}

/* ── STATUS GERAL ── */
#status-text{
  text-align:center; font-size:11px; letter-spacing:1.5px;
  text-transform:uppercase; color:rgba(190,140,35,0.45);
}

/* ── LISTA DE JOGADORES ── */
#players-section{ display:flex; flex-direction:column; gap:10px; }

#players-titulo{
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:rgba(190,140,35,0.32);
  display:flex; align-items:center; gap:8px;
}
#players-titulo::before,#players-titulo::after{
  content:''; flex:1; height:1px; background:rgba(190,140,35,0.10);
}

#players-list{ display:flex; flex-direction:column; gap:8px; }

.player-row{
  display:flex; align-items:center; gap:12px;
  background:rgba(20,12,4,0.72);
  border:1px solid rgba(190,140,35,0.10);
  border-radius:12px; padding:10px 14px;
  transition:border-color .3s, background .3s;
}
.player-row.meu{
  border-color:rgba(190,140,35,0.30);
  background:rgba(30,18,5,0.72);
}

.pr-emoji{ font-size:24px; flex-shrink:0; line-height:1; }
.pr-info{ flex:1; min-width:0; }
.pr-nome{
  font-size:14px; font-weight:700; color:#e8d5a8;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pr-nome .pr-eu{
  font-size:9px; font-weight:400; color:rgba(190,140,35,0.45);
  letter-spacing:.5px; text-transform:uppercase; margin-left:6px;
}
.pr-classe{
  font-size:10px; color:rgba(190,140,35,0.40); letter-spacing:.5px;
  margin-top:2px;
}
.pr-status{
  flex-shrink:0; font-size:10px; font-weight:700;
  letter-spacing:.3px; padding:4px 11px; border-radius:20px;
}
.pr-status.pronto{
  color:#5ecb7a;
  background:rgba(60,140,80,0.12);
  border:1px solid rgba(60,140,80,0.28);
}
.pr-status.aguardando{
  color:rgba(190,140,35,0.50);
  background:rgba(190,140,35,0.06);
  border:1px solid rgba(190,140,35,0.14);
}

.players-empty{
  text-align:center; padding:18px 0;
  font-size:12px; color:rgba(190,140,35,0.28); font-style:italic;
}

#contagem{
  text-align:center; font-size:12px;
  color:rgba(200,175,100,0.45); font-style:italic;
}

/* ── BOTÃO PRONTO ── */
#btn-pronto{
  width:100%; height:54px;
  background:rgba(190,140,35,0.16);
  border:1.5px solid rgba(190,140,35,0.45); border-radius:14px;
  color:#f5d878; font-family:Georgia,serif; font-size:16px; font-weight:700;
  cursor:pointer; letter-spacing:.4px;
  transition:background .22s, border-color .22s, box-shadow .22s, color .22s;
  -webkit-tap-highlight-color:transparent;
}
#btn-pronto:hover:not(:disabled){
  background:rgba(190,140,35,0.26); border-color:rgba(190,140,35,0.70);
  box-shadow:0 0 22px rgba(190,140,35,0.18);
}
#btn-pronto.ja-pronto{
  background:rgba(60,140,80,0.16); border-color:rgba(60,140,80,0.42); color:#5ecb7a;
}
#btn-pronto.pulsa{ animation:pronto-pulse 1.1s ease-in-out infinite; }
@keyframes pronto-pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(60,140,80,0.45); }
  50%{ box-shadow:0 0 0 11px rgba(60,140,80,0); }
}
#btn-pronto:disabled{ opacity:0.38; cursor:default; }

/* ── VOLTAR ── */
#btn-voltar{
  text-align:center; font-size:12px;
  color:rgba(190,140,35,0.38); cursor:pointer;
  text-decoration:none; padding:4px;
  transition:color .2s; display:block;
}
#btn-voltar:hover{ color:rgba(190,140,35,0.72); }

/* ── ERRO ── */
#erro-box{
  display:none; background:rgba(100,15,15,0.82);
  border:1px solid rgba(200,50,50,0.38); border-radius:10px;
  padding:10px 14px; font-size:12px; color:rgba(255,155,155,0.92);
  text-align:center; line-height:1.55;
}

/* ── OVERLAY: INICIANDO ── */
#iniciando-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(3,1,0,0.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  opacity:0;pointer-events:none;
  transition:opacity 0.50s ease;
}
#iniciando-overlay.visivel{ opacity:1; pointer-events:all; }
.ini-icon{ font-size:58px; }
.ini-titulo{
  font-size:clamp(20px,6vw,26px); font-weight:700;
  color:#f5d878; letter-spacing:.5px;
}
.ini-sub{
  font-size:11px; letter-spacing:2px; text-transform:uppercase;
  color:rgba(200,175,100,0.50); font-style:italic;
}
.ini-bar{
  width:220px; height:3px;
  background:rgba(190,140,35,0.14); border-radius:4px; overflow:hidden;
}
.ini-bar-fill{
  height:100%; background:rgba(190,140,35,0.65); border-radius:4px;
  width:0; animation:ini-load 2.1s ease-in-out forwards;
}
@keyframes ini-load{ from{width:0} to{width:100%} }
</style>
</head>
<body>

<div id="header">
  <div id="logo">🔮 ORÁCULO</div>
</div>

<div id="lobby-card">
  <div id="sala-titulo">Sala de Simulação — Diálogo</div>
  <div id="sala-desc">Feira de Phanourios · Castelo de Mhoried</div>

  <div id="status-text">Conectando…</div>

  <div id="players-section">
    <div id="players-titulo">Aventureiros</div>
    <div id="players-list">
      <div class="players-empty">Aguardando jogadores…</div>
    </div>
    <div id="contagem"></div>
  </div>

  <button id="btn-pronto" disabled>⚔️ Estou Pronto!</button>

  <div id="erro-box"></div>

  <a id="btn-voltar" href="#">← Voltar ao início</a>
</div>

<div id="iniciando-overlay">
  <div class="ini-icon">⚔️</div>
  <div class="ini-titulo">A cena se inicia…</div>
  <div class="ini-sub">Feira de Phanourios</div>
  <div class="ini-bar"><div class="ini-bar-fill"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyDaMymxJBFo9zaPuflFwhh14fslaaeh324',
  authDomain:        'oraculo-rpg-dadfe.firebaseapp.com',
  projectId:         'oraculo-rpg-dadfe',
  storageBucket:     'oraculo-rpg-dadfe.firebasestorage.app',
  messagingSenderId: '287997672755',
  appId:             '1:287997672755:web:9094e22e975696dcdc9246'
};

const LOBBY_ID   = 'simulacao-dialogo';
const DESTINO    = 'simulacao_dialogo.html';
const PING_MS    = 20000;  // ping a cada 20s
const TIMEOUT_MS = 60000;  // 60s sem ping = desconectado

firebase.initializeApp(FIREBASE_CONFIG);
const db       = firebase.firestore();
const lobbyRef = db.collection('lobbies').doc(LOBBY_ID);
const FV       = firebase.firestore.FieldValue;

// ── Identidade do jogador ──
let myId = localStorage.getItem('oraculo.playerId');
if(!myId){
  myId = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  localStorage.setItem('oraculo.playerId', myId);
}
const myNome    = localStorage.getItem('oraculo.playerName') || 'Aventureiro';
const myClassId = localStorage.getItem('oraculo.classId')    || 'guerreiro';

const CLASS_EMOJI  = {guerreiro:'⚔️',mago:'🔮',clerigo:'✝️',ladino:'🗡️',arqueiro:'🏹',druida:'🌿'};
const CLASS_LABELS = {guerreiro:'Guerreiro',mago:'Mago',clerigo:'Clérigo',ladino:'Ladino',arqueiro:'Arqueiro',druida:'Druida'};

// ── Estado local ──
let myReady   = false;
let unsub     = null;
let pingTimer = null;
let iniciando = false;

// ── Firestore: entrar no lobby ──
async function entrarNoLobby(){
  const data = { nome: myNome, classId: myClassId, ready: false, lastPing: Date.now() };
  try {
    // update preserva os outros jogadores (dot-notation no mapa)
    await lobbyRef.update({ [`players.${myId}`]: data });
  } catch(e){
    if(e.code === 'not-found'){
      // Primeiro jogador: cria o documento
      await lobbyRef.set({ players: { [myId]: data }, startAt: null });
    } else { throw e; }
  }
}

function ping(){
  lobbyRef.update({ [`players.${myId}.lastPing`]: Date.now() }).catch(() => {});
}

async function marcarPronto(){
  const btn = document.getElementById('btn-pronto');
  btn.disabled = true;
  myReady = !myReady;
  try {
    await lobbyRef.update({
      [`players.${myId}.ready`]:    myReady,
      [`players.${myId}.lastPing`]: Date.now()
    });
  } catch(_){
    myReady = !myReady; // revert
  }
  btn.disabled = false;
}

async function sairDoLobby(){
  clearInterval(pingTimer);
  if(unsub) unsub();
  try { await lobbyRef.update({ [`players.${myId}`]: FV.delete() }); } catch(_){}
}

// ── Iniciar cena: escreve startAt para sincronizar todos ──
async function iniciarCena(){
  if(iniciando) return;
  iniciando = true;
  try { await lobbyRef.update({ startAt: Date.now() }); } catch(_){}
  mostrarIniciando();
}

function mostrarIniciando(){
  clearInterval(pingTimer);
  if(unsub){ unsub(); unsub = null; }
  document.getElementById('iniciando-overlay').classList.add('visivel');
  setTimeout(() => { window.location.href = DESTINO; }, 2300);
}

// ── Renderização ──
function isAtivo(p){ return (Date.now() - (p.lastPing || 0)) < TIMEOUT_MS; }

function renderLobby(data){
  const players     = data?.players || {};
  const ativos      = Object.entries(players).filter(([,p]) => isAtivo(p));
  const total       = ativos.length;
  const prontos     = ativos.filter(([,p]) => p.ready).length;
  const todosProntos = total > 0 && prontos === total;

  // ── Lista de jogadores ──
  const listEl = document.getElementById('players-list');
  if(total === 0){
    listEl.innerHTML = '<div class="players-empty">Nenhum aventureiro conectado…</div>';
  } else {
    listEl.innerHTML = '';
    ativos.forEach(([id, p]) => {
      const isMe = id === myId;
      const row  = document.createElement('div');
      row.className = 'player-row' + (isMe ? ' meu' : '');
      row.innerHTML = `
        <span class="pr-emoji">${CLASS_EMOJI[p.classId] || '⚔️'}</span>
        <div class="pr-info">
          <div class="pr-nome">${p.nome}${isMe ? '<span class="pr-eu">você</span>' : ''}</div>
          <div class="pr-classe">${CLASS_LABELS[p.classId] || p.classId}</div>
        </div>
        <span class="pr-status ${p.ready ? 'pronto' : 'aguardando'}">${p.ready ? '✓ Pronto' : '● Aguardando'}</span>
      `;
      listEl.appendChild(row);
    });
  }

  // ── Contagem ──
  const contagemEl = document.getElementById('contagem');
  contagemEl.textContent = total > 0
    ? `${prontos} de ${total} ${total === 1 ? 'aventureiro pronto' : 'aventureiros prontos'}`
    : '';

  // ── Status geral ──
  const statusEl = document.getElementById('status-text');
  if(todosProntos && !iniciando){
    statusEl.textContent = 'Todos prontos! Iniciando a cena…';
  } else if(total <= 1){
    statusEl.textContent = 'Aguardando outros aventureiros…';
  } else {
    statusEl.textContent = `${total} aventureiros na sala`;
  }

  // ── Botão Pronto ──
  const btn = document.getElementById('btn-pronto');
  btn.disabled = false;
  if(myReady){
    btn.textContent = '✓ Pronto! (toque para cancelar)';
    btn.classList.add('ja-pronto');
    btn.classList.toggle('pulsa', todosProntos);
  } else {
    btn.textContent = '⚔️ Estou Pronto!';
    btn.classList.remove('ja-pronto', 'pulsa');
  }

  // ── Verificar startAt (cena iniciada por outro cliente) ──
  if(data?.startAt && !iniciando){
    const delta = Date.now() - data.startAt;
    if(delta >= 0 && delta < 30000){ mostrarIniciando(); return; }
  }

  // ── Quando todos prontos: gravar startAt ──
  if(todosProntos && !iniciando && !data?.startAt){
    iniciarCena();
  }
}

// ── Inicialização ──
async function init(){
  try {
    await entrarNoLobby();
    myReady = false;
    document.getElementById('btn-pronto').disabled = false;

    unsub = lobbyRef.onSnapshot(snap => {
      renderLobby(snap.exists ? snap.data() : {});
    }, () => mostrarErro('Erro de conexão com o servidor. Verifique sua internet.'));

    pingTimer = setInterval(ping, PING_MS);
  } catch(e){
    mostrarErro(
      'Não foi possível entrar na sala.\n' +
      'Verifique as regras do Firestore: a coleção "lobbies" precisa de leitura/escrita livre.'
    );
  }
}

function mostrarErro(msg){
  const el = document.getElementById('erro-box');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('btn-pronto').disabled = true;
  document.getElementById('status-text').textContent = 'Erro de conexão';
}

document.getElementById('btn-pronto').addEventListener('click', marcarPronto);

document.getElementById('btn-voltar').addEventListener('click', async (e) => {
  e.preventDefault();
  const link = e.currentTarget;
  link.textContent = '← Saindo…';
  link.style.pointerEvents = 'none';
  await sairDoLobby();
  window.location.href = 'index.html';
});

init();
</script>
</body>
</html>
