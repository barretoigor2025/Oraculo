<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Sala de Espera</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#050302;font-family:Georgia,serif;color:#e8d5a8;}
body{
  min-height:100vh;
  background:
    linear-gradient(to bottom, rgba(3,1,0,0.52) 0%, rgba(3,1,0,0.78) 55%, rgba(3,1,0,0.95) 100%),
    url('catalogo/mhoried/cenarios/conversacao/castelo_mhoried/imagem/castelo_ext.png') top center/cover no-repeat fixed;
  display:flex; flex-direction:column; align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  gap:20px;
}

/* ── LOGO ── */
#header{ text-align:center; padding-top:6px; }
#logo{ font-size:12px; letter-spacing:6px; text-transform:uppercase; color:rgba(245,216,120,0.38); }

/* ── LOBBY CARD ── */
#lobby-card{
  width:100%; max-width:440px;
  background:rgba(7,4,1,0.92);
  border:1px solid rgba(190,140,35,0.26);
  border-radius:22px; padding:22px 20px;
  display:flex; flex-direction:column; gap:18px;
  backdrop-filter:blur(16px);
  box-shadow:0 8px 48px rgba(0,0,0,0.72);
}

#sala-titulo{
  font-size:clamp(17px,5vw,21px); font-weight:700;
  color:#f5d878; text-align:center; letter-spacing:.3px;
}
#sala-desc{
  font-size:11px; color:rgba(200,175,100,0.40);
  text-align:center; font-style:italic; margin-top:-12px;
}

/* ── STATUS ── */
#status-text{
  text-align:center; font-size:11px; letter-spacing:1.5px;
  text-transform:uppercase; color:rgba(190,140,35,0.42);
}

/* ── LISTA DE JOGADORES ── */
#players-section{ display:flex; flex-direction:column; gap:10px; }

.section-label{
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:rgba(190,140,35,0.30);
  display:flex; align-items:center; gap:8px;
}
.section-label::before,.section-label::after{
  content:''; flex:1; height:1px; background:rgba(190,140,35,0.10);
}

#players-list{ display:flex; flex-direction:column; gap:8px; }

.player-row{
  display:flex; align-items:center; gap:12px;
  background:rgba(18,10,3,0.75);
  border:1px solid rgba(190,140,35,0.10);
  border-radius:12px; padding:11px 14px;
  transition:border-color .3s;
}
.player-row.meu{ border-color:rgba(190,140,35,0.28); }
.player-row.host-row{ border-color:rgba(220,170,50,0.32); }

.pr-emoji{ font-size:24px; flex-shrink:0; line-height:1; }
.pr-info{ flex:1; min-width:0; }
.pr-nome{
  font-size:14px; font-weight:700; color:#e8d5a8;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pr-badge{
  font-size:9px; font-weight:400; letter-spacing:.5px;
  text-transform:uppercase; margin-left:6px; vertical-align:middle;
}
.pr-badge.eu{ color:rgba(190,140,35,0.45); }
.pr-badge.host{ color:rgba(220,170,50,0.80); }
.pr-classe{
  font-size:10px; color:rgba(190,140,35,0.38); letter-spacing:.4px; margin-top:2px;
}
.pr-status{
  flex-shrink:0; font-size:10px; font-weight:700;
  letter-spacing:.3px; padding:4px 11px; border-radius:20px;
}
.pr-status.pronto{
  color:#5ecb7a; background:rgba(60,140,80,0.12); border:1px solid rgba(60,140,80,0.28);
}
.pr-status.aguardando{
  color:rgba(190,140,35,0.48); background:rgba(190,140,35,0.06); border:1px solid rgba(190,140,35,0.13);
}

.players-empty{
  text-align:center; padding:20px 0;
  font-size:12px; color:rgba(190,140,35,0.26); font-style:italic;
}
#contagem{
  text-align:center; font-size:12px;
  color:rgba(200,175,100,0.42); font-style:italic;
}

/* ── ÁREA DE AÇÃO ── */
#acao-wrap{ display:flex; flex-direction:column; gap:10px; }

/* Botão Host: Iniciar */
#btn-iniciar{
  display:none;
  width:100%; height:58px;
  background:rgba(180,130,30,0.22);
  border:1.5px solid rgba(220,170,50,0.60); border-radius:14px;
  color:#f5d878; font-family:Georgia,serif; font-size:17px; font-weight:700;
  cursor:pointer; letter-spacing:.4px;
  transition:background .22s, border-color .22s, box-shadow .22s;
  -webkit-tap-highlight-color:transparent;
}
#btn-iniciar:not(:disabled):hover{
  background:rgba(200,150,35,0.32);
  border-color:rgba(245,216,120,0.80);
  box-shadow:0 0 28px rgba(200,150,35,0.28);
}
#btn-iniciar:disabled{
  opacity:0.32; cursor:default;
}
#btn-iniciar.pulsa{ animation:iniciar-pulse 1.1s ease-in-out infinite; }
@keyframes iniciar-pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(200,150,35,0.50); }
  50%{ box-shadow:0 0 0 12px rgba(200,150,35,0); }
}

/* Botão Player: Pronto */
#btn-pronto{
  display:none;
  width:100%; height:54px;
  background:rgba(190,140,35,0.14);
  border:1.5px solid rgba(190,140,35,0.42); border-radius:14px;
  color:#f5d878; font-family:Georgia,serif; font-size:16px; font-weight:700;
  cursor:pointer; letter-spacing:.4px;
  transition:background .22s, border-color .22s, box-shadow .22s, color .22s;
  -webkit-tap-highlight-color:transparent;
}
#btn-pronto:not(:disabled):hover{
  background:rgba(190,140,35,0.24); border-color:rgba(190,140,35,0.68);
}
#btn-pronto.ja-pronto{
  background:rgba(60,140,80,0.16); border-color:rgba(60,140,80,0.44); color:#5ecb7a;
}
#btn-pronto:disabled{ opacity:0.38; cursor:default; }

/* Nota para host */
#host-info{
  display:none; text-align:center;
  font-size:11px; color:rgba(200,175,100,0.42); font-style:italic; letter-spacing:.3px;
}

/* ── VOLTAR ── */
#btn-voltar{
  display:block; text-align:center; font-size:12px;
  color:rgba(190,140,35,0.36); cursor:pointer;
  text-decoration:none; padding:4px;
  transition:color .2s;
}
#btn-voltar:hover{ color:rgba(190,140,35,0.70); }

/* ── ERRO ── */
#erro-box{
  display:none; background:rgba(100,15,15,0.84);
  border:1px solid rgba(200,50,50,0.36); border-radius:10px;
  padding:10px 14px; font-size:12px; color:rgba(255,155,155,0.90);
  text-align:center; line-height:1.55;
}

/* ── OVERLAY: INICIANDO ── */
#iniciando-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(3,1,0,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  opacity:0;pointer-events:none;
  transition:opacity 0.52s ease;
}
#iniciando-overlay.visivel{ opacity:1; pointer-events:all; }
.ini-icon{ font-size:60px; }
.ini-titulo{
  font-size:clamp(20px,6vw,26px); font-weight:700;
  color:#f5d878; letter-spacing:.5px; text-align:center;
}
.ini-sub{
  font-size:11px; letter-spacing:2px; text-transform:uppercase;
  color:rgba(200,175,100,0.48); font-style:italic;
}
.ini-bar{
  width:220px; height:3px;
  background:rgba(190,140,35,0.14); border-radius:4px; overflow:hidden;
}
.ini-bar-fill{
  height:100%; background:rgba(190,140,35,0.65); border-radius:4px;
  width:0; animation:ini-load 2.2s ease-in-out forwards;
}
@keyframes ini-load{ from{width:0} to{width:100%} }
</style>
</head>
<body>

<div id="header">
  <div id="logo">🔮 ORÁCULO</div>
</div>

<div id="lobby-card">
  <div id="sala-titulo">Sala de Simulação — Diálogo</div>
  <div id="sala-desc">Feira de Phanourios · Castelo de Mhoried</div>

  <div id="status-text">Conectando…</div>

  <div id="players-section">
    <div class="section-label">Aventureiros na sala</div>
    <div id="players-list">
      <div class="players-empty">Aguardando jogadores…</div>
    </div>
    <div id="contagem"></div>
  </div>

  <div id="acao-wrap">
    <button id="btn-iniciar" disabled>▶ Iniciar a Cena!</button>
    <div id="host-info"></div>
    <button id="btn-pronto" disabled>⚔️ Estou Pronto!</button>
  </div>

  <div id="erro-box"></div>

  <a id="btn-voltar" href="#">← Voltar ao início</a>
</div>

<div id="iniciando-overlay">
  <div class="ini-icon">⚔️</div>
  <div class="ini-titulo">A cena se inicia…</div>
  <div class="ini-sub">Feira de Phanourios</div>
  <div class="ini-bar"><div class="ini-bar-fill"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyDaMymxJBFo9zaPuflFwhh14fslaaeh324',
  authDomain:        'oraculo-rpg-dadfe.firebaseapp.com',
  projectId:         'oraculo-rpg-dadfe',
  storageBucket:     'oraculo-rpg-dadfe.firebasestorage.app',
  messagingSenderId: '287997672755',
  appId:             '1:287997672755:web:9094e22e975696dcdc9246'
};

const LOBBY_ID   = 'simulacao-dialogo';
const DESTINO    = 'simulacao_dialogo.html';
const PING_MS    = 20000;
const TIMEOUT_MS = 60000;

firebase.initializeApp(FIREBASE_CONFIG);
const db       = firebase.firestore();
const lobbyRef = db.collection('lobbies').doc(LOBBY_ID);
const FV       = firebase.firestore.FieldValue;

// ── Identidade ──
let myId = localStorage.getItem('oraculo.playerId');
if(!myId){
  myId = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  localStorage.setItem('oraculo.playerId', myId);
}
const myNome    = localStorage.getItem('oraculo.playerName') || 'Aventureiro';
const myClassId = localStorage.getItem('oraculo.classId')    || 'guerreiro';

const CLASS_EMOJI  = {guerreiro:'⚔️',mago:'🔮',clerigo:'✝️',ladino:'🗡️',arqueiro:'🏹',druida:'🌿'};
const CLASS_LABELS = {guerreiro:'Guerreiro',mago:'Mago',clerigo:'Clérigo',ladino:'Ladino',arqueiro:'Arqueiro',druida:'Druida'};

let myReady   = false;
let unsub     = null;
let pingTimer = null;
let iniciando = false;

// ── Firestore ──
async function entrarNoLobby(){
  const now  = Date.now();
  const data = { nome: myNome, classId: myClassId, ready: false, lastPing: now, joinedAt: now };
  try {
    await lobbyRef.update({ [`players.${myId}`]: data });
  } catch(e){
    if(e.code === 'not-found'){
      await lobbyRef.set({ players: { [myId]: data }, startAt: null });
    } else { throw e; }
  }
}

function ping(){
  lobbyRef.update({ [`players.${myId}.lastPing`]: Date.now() }).catch(() => {});
}

async function marcarPronto(){
  const btn = document.getElementById('btn-pronto');
  btn.disabled = true;
  myReady = !myReady;
  try {
    await lobbyRef.update({
      [`players.${myId}.ready`]:    myReady,
      [`players.${myId}.lastPing`]: Date.now()
    });
  } catch(_){ myReady = !myReady; }
  btn.disabled = false;
}

async function iniciarCena(){
  if(iniciando) return;
  iniciando = true;
  const btnI = document.getElementById('btn-iniciar');
  btnI.disabled = true; btnI.textContent = '⟳ Iniciando…';
  try { await lobbyRef.update({ startAt: Date.now() }); } catch(_){}
  mostrarIniciando();
}

function mostrarIniciando(){
  clearInterval(pingTimer);
  if(unsub){ unsub(); unsub = null; }
  document.getElementById('iniciando-overlay').classList.add('visivel');
  sessionStorage.setItem('oraculo.freshSimStart', Date.now().toString());
  setTimeout(() => { window.location.href = DESTINO; }, 2400);
}

async function sairDoLobby(){
  clearInterval(pingTimer);
  if(unsub) unsub();
  try { await lobbyRef.update({ [`players.${myId}`]: FV.delete() }); } catch(_){}
}

// ── Renderização ──
function isAtivo(p){ return (Date.now() - (p.lastPing || 0)) < TIMEOUT_MS; }

function renderLobby(data){
  const players     = data?.players || {};
  const ativos      = Object.entries(players)
    .filter(([,p]) => isAtivo(p))
    .sort(([,a],[,b]) => (a.joinedAt || 0) - (b.joinedAt || 0)); // ordem de entrada

  const total       = ativos.length;
  const prontos     = ativos.filter(([,p]) => p.ready).length;

  // Host = primeiro a entrar ainda ativo
  const hostId      = ativos[0]?.[0] || null;
  const iAmHost     = myId === hostId;

  // ── Lista de jogadores ──
  const listEl = document.getElementById('players-list');
  if(total === 0){
    listEl.innerHTML = '<div class="players-empty">Nenhum aventureiro conectado…</div>';
  } else {
    listEl.innerHTML = '';
    ativos.forEach(([id, p]) => {
      const isMe   = id === myId;
      const isHost = id === hostId;
      const row    = document.createElement('div');
      row.className = 'player-row' + (isMe ? ' meu' : '') + (isHost ? ' host-row' : '');
      row.innerHTML = `
        <span class="pr-emoji">${CLASS_EMOJI[p.classId] || '⚔️'}</span>
        <div class="pr-info">
          <div class="pr-nome">
            ${p.nome}
            ${isHost ? '<span class="pr-badge host">👑 host</span>' : ''}
            ${isMe && !isHost ? '<span class="pr-badge eu">você</span>' : ''}
            ${isMe && isHost ? '<span class="pr-badge eu">você</span>' : ''}
          </div>
          <div class="pr-classe">${CLASS_LABELS[p.classId] || p.classId}</div>
        </div>
        <span class="pr-status ${p.ready ? 'pronto' : 'aguardando'}">${p.ready ? '✓ Pronto' : '● Aguardando'}</span>
      `;
      listEl.appendChild(row);
    });
  }

  // ── Contagem ──
  document.getElementById('contagem').textContent = total > 0
    ? `${prontos} de ${total} ${total === 1 ? 'pronto' : 'prontos'}`
    : '';

  // ── Status ──
  const statusEl = document.getElementById('status-text');
  if(total === 0){
    statusEl.textContent = 'Aguardando aventureiros…';
  } else if(total === 1){
    statusEl.textContent = 'Aguardando outros aventureiros…';
  } else {
    statusEl.textContent = `${total} aventureiros na sala`;
  }

  // ── UI de ação baseada em papel ──
  const btnIniciar = document.getElementById('btn-iniciar');
  const btnPronto  = document.getElementById('btn-pronto');
  const hostInfo   = document.getElementById('host-info');

  if(iAmHost){
    // HOST vê o botão de iniciar
    btnIniciar.style.display = 'block';
    btnPronto.style.display  = 'none';

    const todosOuSo1 = total === 1 || prontos === total;
    btnIniciar.disabled = total === 0 || iniciando;

    if(total === 0){
      hostInfo.textContent  = '';
      hostInfo.style.display = 'none';
    } else if(prontos === total && total > 1){
      btnIniciar.classList.add('pulsa');
      hostInfo.textContent   = 'Todos confirmaram — pode iniciar!';
      hostInfo.style.display = 'block';
    } else if(total > 1){
      btnIniciar.classList.remove('pulsa');
      hostInfo.textContent   = `Você decide quando a cena começa.`;
      hostInfo.style.display = 'block';
    } else {
      btnIniciar.classList.remove('pulsa');
      hostInfo.textContent   = 'Aguardando os outros entrarem…';
      hostInfo.style.display = 'block';
    }
  } else {
    // JOGADOR vê botão de pronto
    btnIniciar.style.display = 'none';
    btnPronto.style.display  = 'block';
    hostInfo.style.display   = 'none';
    btnPronto.disabled       = false;

    if(myReady){
      btnPronto.textContent = '✓ Pronto! (toque para cancelar)';
      btnPronto.classList.add('ja-pronto');
    } else {
      btnPronto.textContent = '⚔️ Estou Pronto!';
      btnPronto.classList.remove('ja-pronto');
    }
  }

  // ── startAt: cena foi iniciada pelo host ──
  if(data?.startAt && !iniciando){
    const delta = Date.now() - data.startAt;
    if(delta >= 0 && delta < 30000){ mostrarIniciando(); }
  }
}

// ── Inicialização ──
async function init(){
  try {
    await entrarNoLobby();
    document.getElementById('btn-pronto').disabled  = false;
    document.getElementById('btn-iniciar').disabled = false;

    unsub = lobbyRef.onSnapshot(
      snap => renderLobby(snap.exists ? snap.data() : {}),
      ()   => mostrarErro('Erro de conexão com o servidor.')
    );
    pingTimer = setInterval(ping, PING_MS);
  } catch(e){
    mostrarErro(
      'Não foi possível entrar na sala.\n' +
      'Certifique-se de que a coleção "lobbies" tem regras de leitura/escrita no Firestore.'
    );
  }
}

function mostrarErro(msg){
  const el = document.getElementById('erro-box');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('status-text').textContent = 'Erro de conexão';
}

document.getElementById('btn-iniciar').addEventListener('click', () => { if(!iniciando) iniciarCena(); });
document.getElementById('btn-pronto').addEventListener('click', marcarPronto);

document.getElementById('btn-voltar').addEventListener('click', async (e) => {
  e.preventDefault();
  const link = e.currentTarget;
  link.textContent = '← Saindo…';
  link.style.pointerEvents = 'none';
  await sairDoLobby();
  window.location.href = 'index.html';
});

init();
</script>
</body>
</html>
