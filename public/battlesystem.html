<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BattleSystem v2</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#050403;color:#ead7a0;font-family:Georgia,serif}body{display:flex;flex-direction:column}.top{height:42px;background:#090705;border-bottom:1px solid #7a5725;display:flex;align-items:center;gap:8px;padding:0 10px}.title{font-weight:900;color:#e4b35c}.pill{font:800 12px system-ui;padding:4px 9px;border-radius:18px;border:1px solid #6b5028;background:#14100a}.pill.b{margin-left:auto;color:#9dccff;background:#102035}.pill.r{color:#ffb196;background:#29120e}.view{flex:1;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:#030201;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.arena{position:relative;width:1780px;min-height:100%;height:720px;background:#15100b;overflow:hidden;background-image:radial-gradient(circle at 12% 22%,#51311899,transparent 22%),radial-gradient(circle at 80% 18%,#76502055,transparent 25%),radial-gradient(circle at 72% 80%,#48241288,transparent 24%),linear-gradient(135deg,#ffffff0a 25%,transparent 25%),linear-gradient(315deg,#00000040 25%,transparent 25%);background-size:1780px 760px,1780px 760px,1780px 760px,50px 50px,50px 50px}.arena:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,transparent 12%,transparent 88%,#000b);pointer-events:none;z-index:2}.stall{position:absolute;z-index:1;border:1px solid #7b5b2a;background:linear-gradient(135deg,#4b2118,#160f09);box-shadow:0 12px 24px #000}.stall:before{content:"";position:absolute;left:0;right:0;top:-16px;height:20px;background:repeating-linear-gradient(90deg,#8b2e22 0 30px,#dfc38a 30px 60px);clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}.s1{left:50px;top:80px;width:260px;height:130px}.s2{left:1210px;top:70px;width:330px;height:145px}.s3{left:1330px;top:500px;width:280px;height:135px}.lamp{position:absolute;z-index:1;width:18px;height:34px;border-radius:12px;background:#ffbb55;box-shadow:0 0 28px #ff9229,0 0 70px #ff6b16}.l1{left:365px;top:180px}.l2{left:1130px;top:160px}.l3{left:1490px;top:605px}.grid{position:absolute;inset:0;z-index:4}.hex{position:absolute;width:78px;height:68px;transform:translate(-50%,-50%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:1px solid #dfc58a55;background:#6a573614;display:grid;place-items:center;font:900 10px system-ui;color:#ffffff66;text-shadow:0 1px 3px #000}.hex.move{background:#2b83ff38;border-color:#83d5ff;box-shadow:inset 0 0 22px #44aaff40}.hex.path{background:#56b6ff55}.hex.aoe{background:#ff6a2542;border-color:#ff9a4c}.hex.enemyMark{background:#ff3a3040;border-color:#ff5a4c}.unit{position:absolute;width:120px;height:150px;transform:translate(-50%,-100%);z-index:10;pointer-events:none;filter:drop-shadow(0 10px 8px #000)}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.base{position:absolute;left:50%;bottom:0;width:80px;height:24px;border-radius:50%;transform:translateX(-50%);border:3px solid #68c5ff;box-shadow:0 0 17px #49aaff;z-index:-1}.enemy .base{border-color:#ff654f;box-shadow:0 0 17px #ff4535}.label{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);font:900 11px system-ui;color:#fff;text-shadow:0 2px 4px #000;white-space:nowrap;text-align:center}.label span{display:block;font:800 10px system-ui}.fallback{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:50px}.run img{animation:run .48s ease-in-out infinite}.cast img{animation:cast .7s ease-out}@keyframes run{0%,100%{transform:translateY(0)}35%{transform:translateY(-4px) rotate(-.6deg)}70%{transform:translateY(0) rotate(.6deg)}}@keyframes cast{0%{filter:drop-shadow(0 0 0 #8d55ff);transform:scale(1)}45%{filter:drop-shadow(0 0 26px #b56cff);transform:scale(1.05)}100%{filter:drop-shadow(0 0 0 #8d55ff);transform:scale(1)}}.fire{position:absolute;width:98px;height:34px;border-radius:99px;z-index:30;background:radial-gradient(circle at 78% 50%,#fff 0 8%,#ffd36a 13%,#ff7a1a 27%,#ff510088 40%,transparent 54%),linear-gradient(90deg,transparent,#ff8b3030,#ffba52cc);box-shadow:0 0 20px #ff8a1d,0 0 40px #ff531d}.trail{position:absolute;width:30px;height:14px;border-radius:99px;background:linear-gradient(90deg,transparent,#ff9a3077);box-shadow:0 0 15px #ff8a1d;z-index:29;animation:fade .55s forwards}.boom{position:absolute;width:210px;height:145px;border-radius:50%;z-index:31;background:radial-gradient(circle,#fff 0 4%,#ffd36a 12%,#ff7a1a 30%,#aa240070 50%,transparent 72%);box-shadow:0 0 36px #ff7a1a;animation:boom .8s forwards}.ring{position:absolute;width:260px;height:180px;border:4px solid #ff741acc;border-radius:50%;z-index:28;box-shadow:0 0 24px #ff741a,inset 0 0 35px #ff741a55;animation:ring .95s forwards}@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}@keyframes boom{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}.panel{height:204px;flex:0 0 204px;background:linear-gradient(#14110d,#090705);border-top:2px solid #7a5725;display:grid;grid-template-columns:94px 1fr;grid-template-rows:54px 56px 42px 38px;gap:6px;padding:8px}.portrait{grid-row:1/5;border:2px solid #9a7135;border-radius:11px;background:#0a0c12;overflow:hidden;position:relative;box-shadow:inset 0 0 28px #335cff55}.portrait img{width:150%;height:108%;object-fit:contain;object-position:center bottom;position:absolute;left:50%;bottom:0;transform:translateX(-50%)}.portrait .sigil{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#19120a;border:1px solid #b0833d;color:#ffd985}.status strong{display:block;font-size:23px;color:#f3d08b;line-height:1}.status small{font:800 11px system-ui;color:#82c8ff}.stats{font:900 11px system-ui;color:#e5d09a}.commands{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}.cmd{height:56px;border-radius:11px;font:900 12px system-ui;display:flex;align-items:center;justify-content:center;flex-direction:column}.cmd span{font-size:11px}.move{background:#102033;border-color:#355d85;color:#9dccff}.attack{background:#2b130f;border-color:#87382b;color:#ffac8d}.action{background:#21112f;border-color:#623a88;color:#d7adff}.end{background:#182743;border-color:#8a672e;color:#ffd985}.active{outline:2px solid #fff4b5;box-shadow:0 0 15px #ffdd7870}.box{background:#0b0906;border:1px solid #4a371d;border-radius:9px;padding:8px 10px;font:12px system-ui;color:#d8c8a2;overflow:hidden}.box b{color:#e8b85f}.log{display:flex;align-items:center;justify-content:space-between;gap:8px}.log span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log b{font:900 15px system-ui;color:#fff}</style></head><body><header class="top"><div class="title">Feira de Outono</div><div class="pill b">Rodada 1</div><div class="pill r">Turno: Mago</div></header><main id="view" class="view"><section id="arena" class="arena"><div class="stall s1"></div><div class="stall s2"></div><div class="stall s3"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div id="grid" class="grid"></div><div id="hero" class="unit hero"><div class="base"></div><img id="heroImg"><div id="heroFb" class="fallback">🧙</div><div class="label">Mago<span>18/18</span></div></div></section></main><section class="panel"><div class="portrait"><img src="./sprites/mago_m.png" onerror="this.style.display='none'"><div class="sigil">✦</div></div><div class="status"><strong>Mago</strong><small>arcano · planejamento</small><div class="stats">❤️18/18 · 💧4/4 · ⚡5</div></div><div class="commands"><button id="m" class="cmd move active">🥾<span>Mover</span></button><button id="a" class="cmd attack">⚔️<span>Atacar</span></button><button id="ac" class="cmd action">✋<span>Ação</span></button><button id="f" class="cmd end">⌛<span>Finalizar</span></button></div><div id="plan" class="box"><b>Plano:</b> escolha um hex azul para mover.</div><div class="box log"><span id="log">Arena horizontal completa com hexes dentro do scroll.</span><b id="dice">🎲 —</b></div></section><script>const S={cols:18,rows:11,start:{c:5,r:7},en:[{name:'Espantalho A',c:12,r:3,hp:14},{name:'Espantalho B',c:15,r:7,hp:14},{name:'Espantalho C',c:9,r:5,hp:14}],al:[{name:'Arqueiro',c:3,r:6,img:'./sprites/arqueiro.png'},{name:'Bárbaro',c:7,r:4,img:'./sprites/barbaro.png'}]},SPR={idle:'./sprites/mago_m.png',NE:'./sprites/attack_ne-1.png',NW:'./sprites/attack_nw.png',SE:'./sprites/attack_se.png',SW:'./sprites/attack_sw.png'},CL='ABCDEFGHIJKLMNOPQR',GX=130,GY=86,DX=82,DY=70,ODD=35,A=document.getElementById('arena'),V=document.getElementById('view'),G=document.getElementById('grid'),H=document.getElementById('hero'),I=document.getElementById('heroImg'),FB=document.getElementById('heroFb'),P=document.getElementById('plan'),L=document.getElementById('log'),D=document.getElementById('dice');let pos={...S.start},sel=null,mode='move',busy=false;function C(h){return{x:GX+h.c*DX,y:GY+h.r*DY+(h.c%2?ODD:0)}}function lb(h){return CL[h.c]+String(h.r+1).padStart(2,'0')}function ds(a,b){let q=a.c-b.c,r=a.r-b.r;return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))}function dr(a,b){let x=b.c-a.c,y=b.r-a.r;if(y<0)return x<0?'NW':'NE';return x<0?'SW':'SE'}function spr(d){I.src=SPR[d]||SPR.idle;I.onload=()=>{FB.style.display='none';I.style.display='block'};I.onerror=()=>{I.style.display='none';FB.style.display='block'}}function grid(){for(let c=0;c<S.cols;c++)for(let r=0;r<S.rows;r++){let h={c,r},p=C(h),e=document.createElement('div');e.className='hex';e.dataset.c=c;e.dataset.r=r;e.style.left=p.x+'px';e.style.top=p.y+'px';e.textContent=lb(h);e.onclick=()=>tap(h);G.appendChild(e)}}function unit(o,cls='ally'){let p=C(o),u=document.createElement('div');u.className='unit '+cls;u.style.left=p.x+'px';u.style.top=p.y+46+'px';u.innerHTML='<div class="base"></div><img src="'+(o.img||'')+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="fallback" style="display:'+(o.img?'none':'block')+'">'+(cls==='enemy'?'🎃':'🧍')+'</div><div class="label">'+o.name+'<span>'+o.hp+'/'+o.hp+'</span></div>';A.appendChild(u)}function spawn(){S.al.forEach(x=>unit(x));S.en.forEach(x=>unit(x,'enemy'))}function place(){let p=C(pos);H.style.left=p.x+'px';H.style.top=p.y+46+'px'}function mark(){document.querySelectorAll('.hex').forEach(e=>{let h={c:+e.dataset.c,r:+e.dataset.r};e.className='hex';if(mode==='move'&&ds(pos,h)<=5)e.classList.add('move');if(sel&&h.c===sel.c&&h.r===sel.r)e.classList.add('path');if(mode==='attack')S.en.forEach(x=>{if(h.c===x.c&&h.r===x.r)e.classList.add('enemyMark');if(ds(x,h)<=1)e.classList.add('aoe')})})}function setMode(x){if(busy)return;mode=x;sel=null;[m,a,ac].forEach(b=>b.classList.remove('active'));(x==='move'?m:x==='attack'?a:ac).classList.add('active');P.innerHTML=x==='move'?'<b>Plano:</b> escolha um hex azul para mover.':x==='attack'?'<b>Plano:</b> escolha um alvo. Área em laranja.':'<b>Ação:</b> defender, item ou preparar ação.';mark()}function tap(h){if(busy)return;if(mode==='move'){if(ds(pos,h)>5)return;sel=h;spr(dr(pos,h));P.innerHTML='<b>Plano:</b> mover para '+lb(h)+'. Toque em Mover.';mark()}else if(mode==='attack'){let en=S.en.find(x=>x.c===h.c&&x.r===h.r)||S.en[0];cast(en)}}function path(a,b){let n=Math.max(1,ds(a,b)),v=[];for(let i=1;i<=n;i++){let t=i/n;v.push({c:Math.round(a.c+(b.c-a.c)*t),r:Math.round(a.r+(b.r-a.r)*t)})}return v.filter((h,i,s)=>i===0||h.c!==s[i-1].c||h.r!==s[i-1].r)}async function run(){if(!sel){setMode('move');return}busy=true;H.classList.add('run');for(let st of path(pos,sel)){spr(dr(pos,st));await anim(pos,st,420);pos=st;place()}H.classList.remove('run');busy=false;L.textContent='Movimento concluído em '+lb(pos)+'.';sel=null;mark()}function anim(a,b,d){return new Promise(ok=>{let A=C(a),B=C(b),s=performance.now();function f(t){let x=Math.min(1,(t-s)/d),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;H.style.left=A.x+(B.x-A.x)*e+'px';H.style.top=A.y+(B.y-A.y)*e+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}async function cast(en){busy=true;spr(dr(pos,en));H.classList.add('cast');let ro=1+Math.floor(Math.random()*20);D.textContent='🎲 '+ro+'+4='+(ro+4);P.innerHTML='<b>Bola de Fogo:</b> '+en.name+' e adjacentes.';let a=C(pos),b=C(en),vx=b.x-a.x,vy=b.y-a.y,len=Math.hypot(vx,vy)||1,l={x:a.x+vx/len*32,y:a.y+vy/len*32};await lung(a,l,160);shoot(l,b);setTimeout(()=>{H.classList.remove('cast');lung(l,a,210).then(()=>{busy=false;L.textContent='Explosão arcana em '+en.name+'.';setMode('move')})},950)}function lung(a,b,d){return new Promise(ok=>{let s=performance.now();function f(t){let x=Math.min(1,(t-s)/d);H.style.left=a.x+(b.x-a.x)*x+'px';H.style.top=a.y+(b.y-a.y)*x+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function shoot(a,b){let f=document.createElement('div'),dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx)*180/Math.PI;f.className='fire';A.appendChild(f);let s=performance.now(),du=850;function step(t){let x=Math.min(1,(t-s)/du),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,px=a.x+(b.x-a.x)*e,py=a.y+(b.y-a.y)*e+8;f.style.left=px+'px';f.style.top=py+'px';f.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';if(Math.random()<.8){let tr=document.createElement('div');tr.className='trail';tr.style.left=(px-dx/Math.hypot(dx,dy)*28)+'px';tr.style.top=(py-dy/Math.hypot(dx,dy)*28)+'px';tr.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';A.appendChild(tr);setTimeout(()=>tr.remove(),570)}x<1?requestAnimationFrame(step):(f.remove(),boom(b))}requestAnimationFrame(step)}function boom(p){let r=document.createElement('div');r.className='ring';r.style.left=p.x+'px';r.style.top=p.y+8+'px';A.appendChild(r);let b=document.createElement('div');b.className='boom';b.style.left=p.x+'px';b.style.top=p.y+8+'px';A.appendChild(b);setTimeout(()=>{r.remove();b.remove()},980)}function end(){D.textContent='🎲 —';L.textContent='Turno finalizado. Pronto para integrar no sistema real.'}m.onclick=run;a.onclick=()=>setMode('attack');ac.onclick=()=>setMode('action');f.onclick=end;grid();spawn();place();spr('SE');mark();setTimeout(()=>V.scrollLeft=300,80);</script></body></html>
