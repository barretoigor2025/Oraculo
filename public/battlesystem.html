<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BattleSystem v31</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#050403;color:#ead7a0;font-family:Georgia,serif}body{height:100dvh;display:grid;grid-template-rows:40px 1fr 158px}.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:#090705;border-bottom:1px solid #7a5725}.title{font-weight:900;color:#e4b35c;font-size:18px}.pill{font:800 12px system-ui;padding:4px 9px;border-radius:18px;border:1px solid #6b5028;background:#14100a}.pill.b{margin-left:auto;color:#9dccff;background:#102035}.pill.r{color:#ffb196;background:#29120e}.view{min-height:0;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:#030201;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.arena{position:relative;width:1580px;height:100%;min-height:0;background:#15100b;overflow:hidden;background-image:radial-gradient(circle at 14% 20%,#5c361999,transparent 23%),radial-gradient(circle at 76% 22%,#76502055,transparent 27%),radial-gradient(circle at 70% 76%,#48241288,transparent 24%),linear-gradient(135deg,#ffffff0a 25%,transparent 25%),linear-gradient(315deg,#00000040 25%,transparent 25%);background-size:1580px 620px,1580px 620px,1580px 620px,48px 48px,48px 48px}.arena:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,transparent 10%,transparent 90%,#000b);pointer-events:none;z-index:2}.stall{position:absolute;z-index:1;border:1px solid #7b5b2a;background:linear-gradient(135deg,#4b2118,#160f09);box-shadow:0 12px 24px #000}.stall:before{content:"";position:absolute;left:0;right:0;top:-13px;height:17px;background:repeating-linear-gradient(90deg,#8b2e22 0 28px,#dfc38a 28px 56px);clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}.s1{left:55px;top:54px;width:210px;height:96px}.s2{left:1120px;top:48px;width:270px;height:105px}.s3{left:1240px;bottom:32px;width:230px;height:88px}.lamp{position:absolute;z-index:1;width:16px;height:30px;border-radius:12px;background:#ffbb55;box-shadow:0 0 28px #ff9229,0 0 70px #ff6b16}.l1{left:335px;top:138px}.l2{left:1030px;top:128px}.l3{left:1380px;bottom:78px}.grid{position:absolute;inset:0;z-index:4}.hex{position:absolute;width:68px;height:59px;transform:translate(-50%,-50%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:1px solid #dfc58a55;background:#6a573614;display:grid;place-items:center;font:900 9px system-ui;color:#ffffff66;text-shadow:0 1px 3px #000}.hex.move{background:#2b83ff38;border-color:#83d5ff;box-shadow:inset 0 0 18px #44aaff40}.hex.path{background:#56b6ff55}.hex.aoe{background:#ff6a2542;border-color:#ff9a4c}.hex.enemyMark{background:#ff3a3040;border-color:#ff5a4c}.unit{position:absolute;width:92px;height:112px;transform:translate(-50%,-100%);z-index:10;pointer-events:none;filter:drop-shadow(0 8px 7px #000)}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.base{position:absolute;left:50%;bottom:0;width:62px;height:18px;border-radius:50%;transform:translateX(-50%);border:2px solid #68c5ff;box-shadow:0 0 14px #49aaff;z-index:-1}.enemy .base{border-color:#ff654f;box-shadow:0 0 14px #ff4535}.label{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font:900 10px system-ui;color:#fff;text-shadow:0 2px 4px #000;white-space:nowrap;text-align:center}.label span{display:block;font:800 9px system-ui}.fallback{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:42px}.panel{min-height:0;background:linear-gradient(#14110d,#090705);border-top:2px solid #7a5725;display:grid;grid-template-columns:76px 1fr;grid-template-rows:38px 50px 30px 26px;gap:5px;padding:6px 8px 8px}.portrait{grid-row:1/5;border:2px solid #9a7135;border-radius:10px;background:#0a0c12;overflow:hidden;position:relative;box-shadow:inset 0 0 28px #335cff55}.portrait img{width:145%;height:105%;object-fit:contain;object-position:center bottom;position:absolute;left:50%;bottom:0;transform:translateX(-50%)}.sigil{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#19120a;border:1px solid #b0833d;color:#ffd985}.status{display:grid;grid-template-columns:1fr auto;align-items:start}.status strong{font-size:24px;color:#f3d08b;line-height:.95}.status small{font:800 11px system-ui;color:#82c8ff}.stats{font:900 11px system-ui;color:#e5d09a;white-space:nowrap}.commands{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:5px}.cmd{height:50px;border-radius:10px;font:900 11px system-ui;display:flex;align-items:center;justify-content:center;flex-direction:column}.cmd span{font-size:10px}.move{background:#102033;border-color:#355d85;color:#9dccff}.attack{background:#2b130f;border-color:#87382b;color:#ffac8d}.action{background:#21112f;border-color:#623a88;color:#d7adff}.end{background:#182743;border-color:#8a672e;color:#ffd985}.active{outline:2px solid #fff4b5;box-shadow:0 0 12px #ffdd7870}.box{background:#0b0906;border:1px solid #4a371d;border-radius:8px;padding:5px 8px;font:11px system-ui;color:#d8c8a2;overflow:hidden}.box b{color:#e8b85f}.log{display:flex;align-items:center;justify-content:space-between;gap:8px}.log span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log b{font:900 13px system-ui;color:#fff}</style></head><body><header class="top"><div class="title">Feira de Outono</div><div class="pill b">Rodada 1</div><div class="pill r">Turno: Mago</div></header><main id="view" class="view"><section id="arena" class="arena"><div class="stall s1"></div><div class="stall s2"></div><div class="stall s3"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div id="grid" class="grid"></div><div id="hero" class="unit hero"><div class="base"></div><img id="heroImg" src="./sprites/mago_m.png"><div id="heroFb" class="fallback" style="display:none">🧙</div><div class="label">Mago<span>18/18</span></div></div></section></main><section class="panel"><div class="portrait"><img src="./sprites/mago_m.png"><div class="sigil">✦</div></div><div class="status"><div><strong>Mago</strong><small>arcano · planejamento</small></div><div class="stats">❤️18/18 · 💧4/4 · ⚡5</div></div><div class="commands"><button id="m" class="cmd move active">🥾<span>Mover</span></button><button id="a" class="cmd attack">⚔️<span>Atacar</span></button><button id="ac" class="cmd action">✋<span>Ação</span></button><button id="f" class="cmd end">⌛<span>Finalizar</span></button></div><div id="plan" class="box"><b>Plano:</b> escolha um hex azul para mover.</div><div class="box log"><span id="log">Arena horizontal. Deslize só para os lados.</span><b id="dice">🎲 —</b></div></section><script>const S={cols:18,rows:7,start:{c:2,r:3},en:[{name:'Espantalho A',c:10,r:3,hp:14},{name:'Espantalho B',c:14,r:4,hp:14}],al:[{name:'Arqueiro',c:1,r:2,img:'./sprites/arqueiro.png'},{name:'Bárbaro',c:5,r:4,img:'./sprites/barbaro.png'}]},SPR={idle:'./sprites/mago_m.png',NE:'./sprites/attack_ne-1.png',NW:'./sprites/attack_nw.png',SE:'./sprites/attack_se.png',SW:'./sprites/attack_sw.png'},CL='ABCDEFGHIJKLMNOPQR',GX=86,GY=52,DX=76,DY=52,ODD=26,A=document.getElementById('arena'),V=document.getElementById('view'),G=document.getElementById('grid'),H=document.getElementById('hero'),I=document.getElementById('heroImg'),FB=document.getElementById('heroFb'),P=document.getElementById('plan'),L=document.getElementById('log'),D=document.getElementById('dice');let pos={...S.start},sel=null,mode='move',busy=false;function C(h){return{x:GX+h.c*DX,y:GY+h.r*DY+(h.c%2?ODD:0)}}function lb(h){return CL[h.c]+String(h.r+1).padStart(2,'0')}function ds(a,b){let q=a.c-b.c,r=a.r-b.r;return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))}function dr(a,b){let x=b.c-a.c,y=b.r-a.r;if(y<0)return x<0?'NW':'NE';return x<0?'SW':'SE'}function spr(d){I.src=SPR[d]||SPR.idle;I.onload=()=>{FB.style.display='none';I.style.display='block'};I.onerror=()=>{I.style.display='none';FB.style.display='block'}}function grid(){for(let c=0;c<S.cols;c++)for(let r=0;r<S.rows;r++){let h={c,r},p=C(h),e=document.createElement('div');e.className='hex';e.dataset.c=c;e.dataset.r=r;e.style.left=p.x+'px';e.style.top=p.y+'px';e.textContent=lb(h);e.onclick=()=>tap(h);G.appendChild(e)}}function unit(o,cls='ally'){let p=C(o),u=document.createElement('div');u.className='unit '+cls;u.style.left=p.x+'px';u.style.top=p.y+36+'px';u.innerHTML='<div class="base"></div><img src="'+(o.img||'')+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="fallback" style="display:'+(o.img?'none':'block')+'">'+(cls==='enemy'?'🎃':'🧍')+'</div><div class="label">'+o.name+'<span>'+o.hp+'/'+o.hp+'</span></div>';A.appendChild(u)}function spawn(){S.al.forEach(x=>unit(x));S.en.forEach(x=>unit(x,'enemy'))}function place(){let p=C(pos);H.style.left=p.x+'px';H.style.top=p.y+36+'px'}function mark(){document.querySelectorAll('.hex').forEach(e=>{let h={c:+e.dataset.c,r:+e.dataset.r};e.className='hex';if(mode==='move'&&ds(pos,h)<=4)e.classList.add('move');if(sel&&h.c===sel.c&&h.r===sel.r)e.classList.add('path');if(mode==='attack')S.en.forEach(x=>{if(h.c===x.c&&h.r===x.r)e.classList.add('enemyMark');if(ds(x,h)<=1)e.classList.add('aoe')})})}function setMode(x){if(busy)return;mode=x;sel=null;[m,a,ac].forEach(b=>b.classList.remove('active'));(x==='move'?m:x==='attack'?a:ac).classList.add('active');P.innerHTML=x==='move'?'<b>Plano:</b> escolha um hex azul para mover.':x==='attack'?'<b>Plano:</b> escolha um alvo. Área em laranja.':'<b>Ação:</b> defender, item ou preparar ação.';mark()}function tap(h){if(busy)return;if(mode==='move'){if(ds(pos,h)>4)return;sel=h;spr(dr(pos,h));P.innerHTML='<b>Plano:</b> mover para '+lb(h)+'. Toque em Mover.';mark()}else if(mode==='attack'){let en=S.en.find(x=>x.c===h.c&&x.r===h.r)||S.en[0];cast(en)}}function path(a,b){let n=Math.max(1,ds(a,b)),v=[];for(let i=1;i<=n;i++){let t=i/n;v.push({c:Math.round(a.c+(b.c-a.c)*t),r:Math.round(a.r+(b.r-a.r)*t)})}return v.filter((h,i,s)=>i===0||h.c!==s[i-1].c||h.r!==s[i-1].r)}async function run(){if(!sel){setMode('move');return}busy=true;H.classList.add('run');for(let st of path(pos,sel)){spr(dr(pos,st));await anim(pos,st,360);pos=st;place()}H.classList.remove('run');busy=false;L.textContent='Movimento concluído em '+lb(pos)+'.';sel=null;mark()}function anim(a,b,d){return new Promise(ok=>{let A0=C(a),B=C(b),s=performance.now();function f(t){let x=Math.min(1,(t-s)/d),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;H.style.left=A0.x+(B.x-A0.x)*e+'px';H.style.top=A0.y+(B.y-A0.y)*e+36+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function cast(en){if(busy)return;busy=true;spr(dr(pos,en));let ro=1+Math.floor(Math.random()*20);D.textContent='🎲 '+ro+'+4='+(ro+4);P.innerHTML='<b>Bola de Fogo:</b> '+en.name+'.';setTimeout(()=>{busy=false;L.textContent='Magia disparada em '+en.name+'.';setMode('move')},520)}function end(){D.textContent='🎲 —';L.textContent='Turno finalizado.'}m.onclick=run;a.onclick=()=>setMode('attack');ac.onclick=()=>setMode('action');f.onclick=end;grid();spawn();place();spr('SE');mark();setTimeout(()=>V.scrollLeft=0,80);</script></body></html>
