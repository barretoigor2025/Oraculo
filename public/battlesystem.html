<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BattleSystem</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#050403;color:#ead7a0;font-family:Georgia,serif}body{display:flex;flex-direction:column}.top{height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#100c08,#070604);border-bottom:1px solid #735629}.title{font-weight:900;color:#e2b967}.pill{font:800 12px system-ui;border:1px solid #59401f;border-radius:20px;padding:4px 9px;background:#130f09}.pill:nth-child(2){margin-left:auto;color:#9dc8ff;background:#101d2d}.pill:nth-child(3){color:#ffad88;background:#28110d}.view{flex:1;overflow-x:auto;overflow-y:hidden;background:#020201;touch-action:pan-x;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.map{position:relative;width:1640px;height:100%;min-height:700px;background:#17120d;overflow:hidden;background-image:radial-gradient(circle at 15% 18%,rgba(226,137,47,.18),transparent 22%),radial-gradient(circle at 72% 22%,rgba(255,202,111,.14),transparent 24%),radial-gradient(circle at 82% 82%,rgba(191,81,35,.14),transparent 25%),linear-gradient(135deg,rgba(255,255,255,.05) 25%,transparent 25%),linear-gradient(315deg,rgba(0,0,0,.25) 25%,transparent 25%);background-size:1640px 760px,1640px 760px,1640px 760px,48px 48px,48px 48px}.map:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 14%,transparent 86%,rgba(0,0,0,.65));z-index:1;pointer-events:none}.stall{position:absolute;z-index:2;border:1px solid #7d5d2c;background:linear-gradient(135deg,#4b2118,#17100b);box-shadow:0 12px 25px #000}.stall:after{content:"";position:absolute;left:0;right:0;top:-14px;height:18px;background:repeating-linear-gradient(90deg,#8d2f24 0 26px,#dfc38a 26px 52px);clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}.s1{left:40px;top:85px;width:220px;height:120px}.s2{left:1160px;top:80px;width:280px;height:135px}.s3{left:1280px;top:520px;width:230px;height:120px}.lamp{position:absolute;z-index:3;width:18px;height:34px;border-radius:12px;background:#ffb14b;box-shadow:0 0 25px #ff8d24,0 0 60px #ff6b16}.l1{left:330px;top:180px}.l2{left:1130px;top:165px}.l3{left:1420px;top:610px}.grid{position:absolute;inset:0;z-index:5}.hex{position:absolute;width:74px;height:64px;transform:translate(-50%,-50%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:1px solid rgba(236,215,165,.28);background:rgba(120,102,75,.06);display:grid;place-items:center;font:900 10px system-ui;color:rgba(255,245,210,.35);text-shadow:0 1px 3px #000}.hex.move{background:rgba(50,135,255,.18);border-color:#6ec5ff}.hex.path{background:rgba(50,135,255,.32);border-color:#b1e0ff}.hex.aoe{background:rgba(255,105,25,.25);border-color:#ff863b}.hex.enemyMark{background:rgba(255,63,48,.2);border-color:#ff5a4c}.unit{position:absolute;width:126px;height:154px;transform:translate(-50%,-100%);z-index:25;pointer-events:none;filter:drop-shadow(0 10px 8px #000)}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.base{position:absolute;left:50%;bottom:0;width:80px;height:24px;border-radius:50%;transform:translateX(-50%);border:3px solid #6ec5ff;box-shadow:0 0 18px #49aaff;z-index:-1}.enemy .base{border-color:#ff5a4c;box-shadow:0 0 18px #ff5a4c}.fallback{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:52px}.name{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font:900 11px system-ui;color:white;text-shadow:0 2px 4px #000;white-space:nowrap;text-align:center}.name span{display:block;font:800 10px system-ui}.run img{animation:run .5s ease-in-out infinite}.cast img{animation:cast .7s ease-out}@keyframes run{0%,100%{transform:translateY(0)}30%{transform:translateY(-4px) rotate(-.4deg)}60%{transform:translateY(0) rotate(.4deg)}}@keyframes cast{0%{filter:drop-shadow(0 0 0 #b56cff);transform:scale(1)}45%{filter:drop-shadow(0 0 24px #b56cff);transform:scale(1.05)}100%{filter:drop-shadow(0 0 0 #b56cff);transform:scale(1)}}.fireball{position:absolute;width:98px;height:35px;border-radius:999px;z-index:60;pointer-events:none;background:radial-gradient(circle at 78% 50%,#fff 0 8%,#ffd36a 13%,#ff7a1a 25%,rgba(255,80,0,.62) 37%,rgba(255,90,0,0) 48%),linear-gradient(90deg,transparent,rgba(255,120,0,.16),rgba(255,150,35,.66),rgba(255,230,120,.95));box-shadow:0 0 20px #ff8a1d,0 0 40px #ff531d}.trail{position:absolute;width:30px;height:14px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,150,30,.45));box-shadow:0 0 15px #ff8a1d;z-index:58;animation:fade .55s ease-out forwards}.impact{position:absolute;width:210px;height:145px;border-radius:50%;z-index:65;background:radial-gradient(circle,#fff 0 4%,#ffd36a 11%,#ff7a1a 29%,rgba(180,40,0,.45) 48%,transparent 70%);box-shadow:0 0 36px #ff7a1a;animation:impact .8s ease-out forwards}.aoeRing{position:absolute;width:260px;height:180px;border:4px solid rgba(255,116,26,.75);border-radius:50%;z-index:59;box-shadow:0 0 24px #ff741a,inset 0 0 35px rgba(255,116,26,.35);animation:aoeFx .95s ease-out forwards}@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}@keyframes impact{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}@keyframes aoeFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}.panel{height:198px;flex:0 0 198px;background:linear-gradient(#12100d,#090806);border-top:2px solid #6e5227;display:grid;grid-template-columns:92px 1fr;grid-template-rows:54px 54px 40px 38px;gap:6px;padding:8px 10px 8px 8px}.portrait{grid-row:1/5;background:linear-gradient(145deg,#0c1827,#1e1328 55%,#080706);border:2px solid #7b5b27;border-radius:10px;position:relative;overflow:hidden;box-shadow:inset 0 0 24px rgba(93,137,255,.25)}.face{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);font-size:62px;filter:drop-shadow(0 0 18px #376dff)}.seal{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1d160e;border:1px solid #9a7536;color:#e4c076;font-size:19px}.status{grid-column:2}.status strong{display:block;font-size:22px;color:#f0d48d}.status small{display:block;font:800 11px system-ui;color:#75b8ff}.stats{font:900 11px system-ui;color:#d9c58d}.commands{grid-column:2;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}.cmd{height:54px;border-radius:10px;font:900 12px system-ui;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}.cmd span{font-size:11px}.move{background:#102033;border-color:#355d85;color:#9dccff}.attack{background:#2b130f;border-color:#87382b;color:#ffac8d}.action{background:#21112f;border-color:#623a88;color:#d7adff}.end{background:#182743;border-color:#8a672e;color:#ffd985}.cmd.active{outline:2px solid #fff4b5;box-shadow:0 0 15px rgba(255,221,120,.45)}.box{grid-column:2;background:#0b0a08;border:1px solid #3f321c;border-radius:8px;padding:7px 9px;font:12px system-ui;color:#d8c8a2;overflow:hidden}.box b{color:#e8b85f}.log{display:flex;align-items:center;justify-content:space-between;gap:8px}.log span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log b{font:900 15px system-ui;color:white}@media(max-height:760px){.panel{height:184px;flex-basis:184px;grid-template-rows:50px 48px 36px 36px}.cmd{height:48px}.status strong{font-size:20px}.face{font-size:56px}}</style></head><body><header class="top"><div class="title">Feira de Outono</div><div class="pill">Rodada 1</div><div class="pill">Turno: Mago</div></header><main id="view" class="view"><section id="map" class="map"><div class="stall s1"></div><div class="stall s2"></div><div class="stall s3"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div id="grid" class="grid"></div><div id="hero" class="unit hero"><div class="base"></div><img id="heroImg"><div id="heroFallback" class="fallback">🧙</div><div class="name">Mago<span>18/18</span></div></div></section></main><section class="panel"><div class="portrait"><div class="face">🧙</div><div class="seal">✦</div></div><div class="status"><strong>Mago</strong><small>arcano · planejamento</small><div class="stats">❤️18/18 · 💧4/4 · ⚡5</div></div><div class="commands"><button id="btnMove" class="cmd move active">🥾<span>Mover</span></button><button id="btnAttack" class="cmd attack">⚔️<span>Atacar</span></button><button id="btnAction" class="cmd action">✋<span>Ação</span></button><button id="btnEnd" class="cmd end">⌛<span>Finalizar</span></button></div><div id="plan" class="box"><b>Plano:</b> escolha um hex azul para mover.</div><div class="box log"><span id="log">Mapa largo com deslize horizontal travado.</span><b id="dice">🎲 —</b></div></section><script>const SC={cols:18,rows:11,start:{c:5,r:7},enemies:[{name:'Espantalho A',c:12,r:3,hp:14},{name:'Espantalho B',c:15,r:7,hp:14},{name:'Espantalho C',c:9,r:5,hp:14}]},SPR={NE:'./sprites/attack_ne-1.png',NW:'./sprites/attack_nw.png',SE:'./sprites/attack_se.png',SW:'./sprites/attack_sw.png'},CL='ABCDEFGHIJKLMNOPQR',GX=150,GY=112,DX=78,DY=69,ODD=34,map=document.getElementById('map'),view=document.getElementById('view'),grid=document.getElementById('grid'),hero=document.getElementById('hero'),heroImg=document.getElementById('heroImg'),fallback=document.getElementById('heroFallback'),plan=document.getElementById('plan'),log=document.getElementById('log'),dice=document.getElementById('dice');let heroPos={...SC.start},selected=null,modeNow='move',busy=false;function cen(h){return{x:GX+h.c*DX,y:GY+h.r*DY+(h.c%2?ODD:0)}}function lbl(h){return CL[h.c]+String(h.r+1).padStart(2,'0')}function dst(a,b){let q=a.c-b.c,r=a.r-b.r;return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))}function dir(a,b){let dx=b.c-a.c,dy=b.r-a.r;if(dy<0)return dx<0?'NW':'NE';return dx<0?'SW':'SE'}function setDir(d){heroImg.src=SPR[d];heroImg.onload=()=>{fallback.style.display='none';heroImg.style.display='block'};heroImg.onerror=()=>{fallback.style.display='block';heroImg.style.display='none'}}function makeGrid(){for(let c=0;c<SC.cols;c++)for(let r=0;r<SC.rows;r++){let h={c,r},p=cen(h),e=document.createElement('div');e.className='hex';e.dataset.c=c;e.dataset.r=r;e.style.left=p.x+'px';e.style.top=p.y+'px';e.textContent=lbl(h);e.onclick=()=>tap(h);grid.appendChild(e)}}function enemies(){SC.enemies.forEach(en=>{let p=cen(en),el=document.createElement('div');el.className='unit enemy';el.style.left=p.x+'px';el.style.top=p.y+46+'px';el.innerHTML='<div class="base"></div><div class="fallback">🎃</div><div class="name">'+en.name+'<span>'+en.hp+'/'+en.hp+'</span></div>';map.appendChild(el)})}function place(){let p=cen(heroPos);hero.style.left=p.x+'px';hero.style.top=p.y+46+'px'}function mark(){document.querySelectorAll('.hex').forEach(e=>{let h={c:+e.dataset.c,r:+e.dataset.r};e.className='hex';if(modeNow==='move'&&dst(heroPos,h)<=5)e.classList.add('move');if(selected&&h.c===selected.c&&h.r===selected.r)e.classList.add('path');if(modeNow==='attack')SC.enemies.forEach(en=>{if(h.c===en.c&&h.r===en.r)e.classList.add('enemyMark');if(dst(en,h)<=1)e.classList.add('aoe')})})}function setMode(m){if(busy)return;modeNow=m;selected=null;document.querySelectorAll('.cmd').forEach(b=>b.classList.remove('active'));document.getElementById(m==='move'?'btnMove':m==='attack'?'btnAttack':'btnAction').classList.add('active');plan.innerHTML=m==='move'?'<b>Plano:</b> escolha um hex azul para mover.':m==='attack'?'<b>Plano:</b> escolha um alvo. Área em laranja.':'<b>Ação:</b> defender, item ou preparar ação.';mark()}function tap(h){if(busy)return;if(modeNow==='move'){if(dst(heroPos,h)>5)return;selected=h;setDir(dir(heroPos,h));plan.innerHTML='<b>Plano:</b> mover para '+lbl(h)+'. Toque em Mover de novo.';mark()}else if(modeNow==='attack'){let en=SC.enemies.find(x=>x.c===h.c&&x.r===h.r)||SC.enemies[0];cast(en)}}function path(a,b){let n=Math.max(1,dst(a,b)),arr=[];for(let i=1;i<=n;i++){let t=i/n;arr.push({c:Math.round(a.c+(b.c-a.c)*t),r:Math.round(a.r+(b.r-a.r)*t)})}return arr.filter((h,i,s)=>i===0||h.c!==s[i-1].c||h.r!==s[i-1].r)}async function run(){if(!selected||busy){setMode('move');return}busy=true;hero.classList.add('run');for(let st of path(heroPos,selected)){setDir(dir(heroPos,st));await anim(heroPos,st,420);heroPos=st;place()}hero.classList.remove('run');busy=false;log.textContent='Movimento concluído em '+lbl(heroPos)+'.';selected=null;mark()}function anim(a,b,d){return new Promise(ok=>{let A=cen(a),B=cen(b),s=performance.now();function f(t){let x=Math.min(1,(t-s)/d),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;hero.style.left=A.x+(B.x-A.x)*e+'px';hero.style.top=A.y+(B.y-A.y)*e+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}async function cast(en){if(busy)return;busy=true;setDir(dir(heroPos,en));hero.classList.add('cast');let roll=1+Math.floor(Math.random()*20);dice.textContent='🎲 '+roll+'+4='+(roll+4);plan.innerHTML='<b>Bola de Fogo:</b> '+en.name+' e adjacentes.';let a=cen(heroPos),b=cen(en),vx=b.x-a.x,vy=b.y-a.y,len=Math.hypot(vx,vy)||1,l={x:a.x+vx/len*32,y:a.y+vy/len*32};await lunge(a,l,160);shoot(l,b);setTimeout(()=>{hero.classList.remove('cast');lunge(l,a,210).then(()=>{busy=false;log.textContent='Explosão arcana em '+en.name+'.';setMode('move')})},950)}function lunge(a,b,d){return new Promise(ok=>{let s=performance.now();function f(t){let x=Math.min(1,(t-s)/d);hero.style.left=a.x+(b.x-a.x)*x+'px';hero.style.top=a.y+(b.y-a.y)*x+46+'px';x<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function shoot(a,b){let f=document.createElement('div'),dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx)*180/Math.PI;f.className='fireball';map.appendChild(f);let s=performance.now(),dur=850;function step(t){let x=Math.min(1,(t-s)/dur),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,px=a.x+(b.x-a.x)*e,py=a.y+(b.y-a.y)*e+8;f.style.left=px+'px';f.style.top=py+'px';f.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';if(Math.random()<.8){let tr=document.createElement('div');tr.className='trail';tr.style.left=(px-dx/Math.hypot(dx,dy)*28)+'px';tr.style.top=(py-dy/Math.hypot(dx,dy)*28)+'px';tr.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';map.appendChild(tr);setTimeout(()=>tr.remove(),570)}x<1?requestAnimationFrame(step):(f.remove(),impact(b))}requestAnimationFrame(step)}function impact(p){let r=document.createElement('div');r.className='aoeRing';r.style.left=p.x+'px';r.style.top=p.y+8+'px';map.appendChild(r);let d=document.createElement('div');d.className='impact';d.style.left=p.x+'px';d.style.top=p.y+8+'px';map.appendChild(d);setTimeout(()=>{r.remove();d.remove()},980)}function endTurn(){dice.textContent='🎲 —';log.textContent='Turno finalizado. Pronto para integrar no sistema real.'}btnMove.onclick=run;btnAttack.onclick=()=>setMode('attack');btnAction.onclick=()=>setMode('action');btnEnd.onclick=endTurn;makeGrid();enemies();place();setDir('NE');mark();setTimeout(()=>view.scrollLeft=360,80);</script></body></html>
