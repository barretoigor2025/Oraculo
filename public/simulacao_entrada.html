<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oráculo — Sala de Simulação</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#050302;font-family:Georgia,serif;color:#e8d5a8;}
body{
  min-height:100vh;
  background:
    linear-gradient(to bottom,rgba(3,1,0,0.45) 0%,rgba(3,1,0,0.80) 60%,rgba(3,1,0,0.97) 100%),
    url('catalogo/mhoried/cenarios/conversacao/castelo_mhoried/imagem/castelo_ext.png') top center/cover no-repeat fixed;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  gap:18px;
}

#logo{
  font-size:11px;letter-spacing:6px;text-transform:uppercase;
  color:rgba(245,216,120,0.35);text-align:center;
}

/* ── Card compartilhado (nome/classe) ── */
#card-perfil{
  width:100%;max-width:400px;
  background:rgba(7,4,1,0.92);
  border:1px solid rgba(190,140,35,0.22);
  border-radius:18px;padding:18px 18px 14px;
  display:flex;flex-direction:column;gap:14px;
  backdrop-filter:blur(14px);
  box-shadow:0 6px 36px rgba(0,0,0,0.65);
}
#perfil-titulo{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(190,140,35,0.45);text-align:center;
}

.lbl{
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(190,140,35,0.38);margin-bottom:4px;
}

#nome-input{
  background:rgba(20,12,4,0.90);
  border:1px solid rgba(190,140,35,0.28);border-radius:10px;
  padding:11px 14px;color:#e8d5a8;font-family:Georgia,serif;
  font-size:15px;outline:none;width:100%;
  transition:border-color .2s;
}
#nome-input::placeholder{color:rgba(190,165,90,0.30);}
#nome-input:focus{border-color:rgba(190,140,35,0.58);}

#classes-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
}
.btn-classe{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 5px;
  background:rgba(20,12,4,0.80);
  border:1px solid rgba(190,140,35,0.16);border-radius:10px;
  color:rgba(200,175,100,0.46);font-family:Georgia,serif;
  font-size:10px;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn-classe .cl-emoji{font-size:18px;}
.btn-classe:hover{background:rgba(50,30,5,0.80);border-color:rgba(190,140,35,0.36);}
.btn-classe.selecionado{
  background:rgba(190,140,35,0.15);
  border-color:rgba(190,140,35,0.60);
  color:#f5d878;
  box-shadow:0 0 10px rgba(190,140,35,0.14);
}

/* ── Grid de campanhas ── */
#campaigns-label{
  font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(190,140,35,0.38);text-align:center;
  width:100%;max-width:400px;
}
#campaigns-grid{
  width:100%;max-width:400px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}

.camp-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 10px 14px;
  border-radius:16px;cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  -webkit-tap-highlight-color:transparent;
  border:1px solid transparent;
  backdrop-filter:blur(10px);
}
.camp-card:active{transform:scale(0.97);}

/* Mhoried — ouro */
#camp-mhoried{
  background:rgba(40,22,3,0.88);
  border-color:rgba(190,140,35,0.30);
}
#camp-mhoried:hover{
  box-shadow:0 0 24px rgba(190,140,35,0.18);
  border-color:rgba(220,170,50,0.55);
}
.camp-icon-mhoried{font-size:32px;}
.camp-name-mhoried{
  font-size:13px;font-weight:700;color:#f5d878;text-align:center;
}
.camp-sub-mhoried{
  font-size:9px;color:rgba(200,175,100,0.50);text-align:center;font-style:italic;
}
.camp-enter-mhoried{
  margin-top:4px;width:100%;
  background:rgba(190,140,35,0.18);
  border:1px solid rgba(220,170,50,0.45);border-radius:8px;
  padding:7px 0;color:#f5d878;font-family:Georgia,serif;
  font-size:11px;font-weight:700;cursor:pointer;
  transition:background .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.camp-enter-mhoried:hover{background:rgba(190,140,35,0.28);border-color:rgba(245,216,120,0.65);}

/* Death Note — vermelho */
#camp-deathnote{
  background:rgba(18,3,3,0.92);
  border-color:rgba(160,20,20,0.35);
}
#camp-deathnote:hover{
  box-shadow:0 0 24px rgba(200,20,20,0.18);
  border-color:rgba(200,40,40,0.60);
}
.camp-icon-dn{font-size:32px;}
.camp-name-dn{
  font-size:13px;font-weight:700;color:#e85555;text-align:center;
}
.camp-sub-dn{
  font-size:9px;color:rgba(210,140,140,0.50);text-align:center;font-style:italic;
}
.camp-enter-dn{
  margin-top:4px;width:100%;
  background:rgba(160,20,20,0.22);
  border:1px solid rgba(200,40,40,0.45);border-radius:8px;
  padding:7px 0;color:#e85555;font-family:Georgia,serif;
  font-size:11px;font-weight:700;cursor:pointer;
  transition:background .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.camp-enter-dn:hover{background:rgba(160,20,20,0.36);border-color:rgba(220,60,60,0.70);}

#btn-voltar{
  font-size:12px;color:rgba(190,140,35,0.34);
  text-decoration:none;text-align:center;
  transition:color .2s;
}
#btn-voltar:hover{color:rgba(190,140,35,0.68);}

/* Overlay de entrada */
#entrando-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(3,1,0,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s ease;
}
#entrando-overlay.visivel{opacity:1;pointer-events:all;}
.ent-icon{font-size:52px;}
.ent-label{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(190,140,35,0.50);
}
#ent-camp{font-size:10px;letter-spacing:2px;color:rgba(190,140,35,0.35);margin-top:-10px;}
.ent-nome{font-size:clamp(20px,6vw,26px);font-weight:700;color:#f5d878;}
.ent-dots{display:flex;gap:8px;margin-top:8px;}
.ent-dot{
  width:7px;height:7px;border-radius:50%;background:rgba(190,140,35,0.35);
  animation:edot 1.2s ease-in-out infinite;
}
.ent-dot:nth-child(2){animation-delay:.22s;}
.ent-dot:nth-child(3){animation-delay:.44s;}
@keyframes edot{
  0%,100%{opacity:0.25;transform:scale(0.72);}
  50%{opacity:1;transform:scale(1.18);}
}
</style>
</head>
<body>

<div id="logo">🔮 ORÁCULO</div>

<div id="card-perfil">
  <div id="perfil-titulo">Seu Perfil</div>

  <div>
    <div class="lbl">Seu nome</div>
    <input id="nome-input" type="text" placeholder="Nome do aventureiro…" autocomplete="off" spellcheck="false">
  </div>

  <div>
    <div class="lbl">Sua classe</div>
    <div id="classes-grid">
      <button class="btn-classe" data-id="guerreiro"><span class="cl-emoji">⚔️</span>Guerreiro</button>
      <button class="btn-classe" data-id="mago"><span class="cl-emoji">🔮</span>Mago</button>
      <button class="btn-classe" data-id="clerigo"><span class="cl-emoji">✝️</span>Clérigo</button>
      <button class="btn-classe" data-id="ladino"><span class="cl-emoji">🗡️</span>Ladino</button>
      <button class="btn-classe" data-id="arqueiro"><span class="cl-emoji">🏹</span>Arqueiro</button>
      <button class="btn-classe" data-id="druida"><span class="cl-emoji">🌿</span>Druida</button>
    </div>
  </div>
</div>

<div id="campaigns-label">Escolha a Campanha</div>

<div id="campaigns-grid">

  <!-- Mhoried -->
  <div class="camp-card" id="camp-mhoried">
    <span class="camp-icon-mhoried">⚔️</span>
    <div class="camp-name-mhoried">Castelo de<br>Mhoried</div>
    <div class="camp-sub-mhoried">Feira de Phanourios · RPG Medieval</div>
    <button class="camp-enter-mhoried" id="btn-mhoried">Entrar →</button>
  </div>

  <!-- Death Note -->
  <div class="camp-card" id="camp-deathnote">
    <span class="camp-icon-dn">📓</span>
    <div class="camp-name-dn">Death Note<br>Tokyo Defender</div>
    <div class="camp-sub-dn">QG Força-Tarefa · Tóquio</div>
    <button class="camp-enter-dn" id="btn-deathnote">Entrar →</button>
  </div>

</div>

<a id="btn-voltar" href="catalog.html">← Voltar ao Catálogo</a>

<div id="entrando-overlay">
  <div class="ent-icon" id="ent-icon">⚔️</div>
  <div class="ent-label">Entrando na sala de simulação</div>
  <div id="ent-camp">—</div>
  <div class="ent-nome" id="ent-nome">—</div>
  <div class="ent-dots">
    <div class="ent-dot"></div>
    <div class="ent-dot"></div>
    <div class="ent-dot"></div>
  </div>
</div>

<script>
(function(){
  const CLASS_EMOJI = {guerreiro:'⚔️',mago:'🔮',clerigo:'✝️',ladino:'🗡️',arqueiro:'🏹',druida:'🌿'};

  const nomeInput = document.getElementById('nome-input');
  const btns = document.querySelectorAll('.btn-classe');
  let classeSelecionada = localStorage.getItem('oraculo.classId') || 'guerreiro';

  const savedNome = localStorage.getItem('oraculo.playerName');
  if(savedNome) nomeInput.value = savedNome;
  btns.forEach(b => b.classList.toggle('selecionado', b.dataset.id === classeSelecionada));

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      classeSelecionada = btn.dataset.id;
      btns.forEach(b => b.classList.toggle('selecionado', b === btn));
    });
  });

  function salvarPerfil(){
    const nome = nomeInput.value.trim() || 'Aventureiro';
    localStorage.setItem('oraculo.playerName', nome);
    localStorage.setItem('oraculo.classId', classeSelecionada);
    return nome;
  }

  function mostrarOverlay(nome, campLabel, destino){
    document.getElementById('ent-icon').textContent = CLASS_EMOJI[classeSelecionada] || '⚔️';
    document.getElementById('ent-nome').textContent = nome;
    document.getElementById('ent-camp').textContent = campLabel;
    requestAnimationFrame(() =>
      document.getElementById('entrando-overlay').classList.add('visivel')
    );
    setTimeout(() => { window.location.href = destino; }, 1600);
  }

  document.getElementById('btn-mhoried').addEventListener('click', (e) => {
    e.stopPropagation();
    const nome = salvarPerfil();
    mostrarOverlay(nome, 'Castelo de Mhoried', 'lobby.html');
  });

  document.getElementById('btn-deathnote').addEventListener('click', (e) => {
    e.stopPropagation();
    const nome = salvarPerfil();
    mostrarOverlay(nome, 'Death Note · Tokyo Defender', 'simulacao_dialogo_dn.html');
  });
})();
</script>
</body>
</html>
