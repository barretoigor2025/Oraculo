<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Oráculo — Battle Shell</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050403;color:#f3d896;font-family:Georgia,'Times New Roman',serif}
body{height:100dvh;display:grid;grid-template-rows:40px minmax(0,1fr) auto;background:#050403;padding-bottom:env(safe-area-inset-bottom)}
.topbar{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#120d08,#070604);border-bottom:1px solid #7d5c2b;box-shadow:0 2px 10px #000;z-index:5}
.scene{font-weight:900;font-size:17px;color:#e9b866;white-space:nowrap}.chip{font:800 11px system-ui;border-radius:18px;padding:4px 8px;border:1px solid #5d4526;background:#16110b;color:#e8d0a0}.chip.blue{margin-left:auto;color:#a9cfff;background:#102033;border-color:#36577b}.chip.red{color:#ffb49a;background:#2a120e;border-color:#71392c}
.stage{min-height:0;position:relative;overflow:hidden;background:#070503}.mapViewport{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain}.mapViewport::-webkit-scrollbar{display:none}.mapTrack{position:relative;height:100%;width:1520px;background:#17120d;overflow:hidden;background-image:radial-gradient(circle at 12% 20%,rgba(150,83,31,.38),transparent 22%),radial-gradient(circle at 70% 28%,rgba(230,160,75,.18),transparent 26%),radial-gradient(circle at 82% 78%,rgba(120,50,25,.34),transparent 24%),linear-gradient(135deg,rgba(255,255,255,.045) 25%,transparent 25%),linear-gradient(315deg,rgba(0,0,0,.28) 25%,transparent 25%);background-size:1520px 620px,1520px 620px,1520px 620px,48px 48px,48px 48px}.mapTrack:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 8%,transparent 92%,rgba(0,0,0,.55));pointer-events:none;z-index:2}.market{position:absolute;z-index:1;border:1px solid rgba(201,146,70,.5);background:linear-gradient(135deg,rgba(81,37,24,.88),rgba(23,15,9,.9));box-shadow:0 10px 24px rgba(0,0,0,.7)}.market:before{content:"";position:absolute;left:0;right:0;top:-13px;height:17px;background:repeating-linear-gradient(90deg,#8f2e22 0 26px,#dbc184 26px 52px);clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}.mk1{left:60px;top:54px;width:220px;height:96px}.mk2{left:1140px;top:50px;width:270px;height:106px}.mk3{left:1185px;bottom:34px;width:235px;height:92px}.lamp{position:absolute;width:16px;height:30px;border-radius:14px;background:#ffbd5a;box-shadow:0 0 24px #ff9631,0 0 60px rgba(255,110,22,.75);z-index:1}.l1{left:330px;top:138px}.l2{left:980px;top:118px}.l3{left:1360px;bottom:82px}
.hexLayer{position:absolute;inset:0;z-index:4}.hex{position:absolute;width:68px;height:59px;transform:translate(-50%,-50%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:1px solid rgba(225,202,145,.42);background:rgba(79,64,43,.12);display:grid;place-items:center;font:900 9px system-ui;color:rgba(240,235,212,.55);text-shadow:0 1px 3px #000}.hex.move{background:rgba(45,138,255,.24);border-color:#8ad7ff}.hex.enemy{background:rgba(255,78,52,.20);border-color:#ff654f}.hex.hot{background:rgba(255,126,38,.22);border-color:#ff9d4a}.unit{position:absolute;width:86px;height:106px;z-index:8;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 8px 7px #000)}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.unit .base{position:absolute;left:50%;bottom:0;width:58px;height:17px;border-radius:50%;transform:translateX(-50%);border:2px solid #69caff;box-shadow:0 0 14px #4bb5ff;z-index:-1}.unit.enemyUnit .base{border-color:#ff604e;box-shadow:0 0 14px #ff4635}.unitName{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font:900 10px system-ui;color:white;text-shadow:0 2px 4px #000;text-align:center;white-space:nowrap}.unitName small{display:block;font:800 9px system-ui}.dock{min-height:0;height:clamp(176px,28dvh,226px);display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#14100c,#090705);border-top:2px solid #7d5c2b;box-shadow:0 -6px 20px #000;z-index:10}.portrait{min-height:0;border:2px solid #a77a35;border-radius:12px;background:radial-gradient(circle at 50% 16%,rgba(62,93,190,.38),transparent 35%),#080b12;position:relative;overflow:hidden}.portrait img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:128%;height:100%;object-fit:contain;object-position:center bottom}.portrait .sigil{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#19120a;border:1px solid #b0833d;color:#ffd985}.dockMain{min-width:0;display:grid;grid-template-rows:auto 54px 34px 28px;gap:6px}.heroLine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}.heroTitle{min-width:0}.heroTitle b{display:block;font-size:27px;line-height:.95;color:#f4d28b;white-space:nowrap}.heroTitle span{display:block;font:800 11px system-ui;color:#82c8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{font:900 12px system-ui;color:#f0dca4;white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1.12fr;gap:6px}.act{height:54px;border-radius:12px;border:2px solid #5a4528;background:#101010;color:#eed28c;font:900 12px system-ui;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}.act i{font-style:normal;font-size:18px}.act small{font:900 11px system-ui}.act.move{background:#102033;border-color:#3d628a;color:#a9d8ff}.act.attack{background:#2a120e;border-color:#893a2b;color:#ffb196}.act.skill{background:#241133;border-color:#70449b;color:#e0bbff}.act.end{background:#16243e;border-color:#9b7638;color:#ffdc88}.act.on{outline:2px solid #fff1ad;box-shadow:0 0 14px rgba(255,220,120,.45)}.plan,.log{min-width:0;border:1px solid #4f3b1e;background:#0b0906;border-radius:9px;padding:6px 8px;font:12px system-ui;color:#dbcba8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan b,.log b{color:#e8b85f}.log{display:flex;align-items:center;justify-content:space-between;gap:8px}.log span{min-width:0;overflow:hidden;text-overflow:ellipsis}.log strong{font:900 14px system-ui;color:white}@media(max-height:700px){body{grid-template-rows:38px minmax(0,1fr) auto}.dock{height:168px;grid-template-columns:82px minmax(0,1fr);gap:6px;padding:6px}.dockMain{grid-template-rows:auto 48px 30px 24px;gap:5px}.actions{gap:5px}.act{height:48px}.heroTitle b{font-size:23px}.stats{font-size:11px}.plan,.log{font-size:11px;padding:5px 7px}.portrait .sigil{width:26px;height:26px}}</style></head><body><header class="topbar"><div class="scene">Feira de Outono</div><div class="chip blue">Rodada 1</div><div class="chip red">Turno: Mago</div></header><main class="stage"><div id="vp" class="mapViewport"><div id="track" class="mapTrack"><div class="market mk1"></div><div class="market mk2"></div><div class="market mk3"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div id="hexes" class="hexLayer"></div><div class="unit" style="left:250px;top:250px"><div class="base"></div><img src="./sprites/arqueiro.png"><div class="unitName">Arqueiro<small>16/16</small></div></div><div class="unit" style="left:410px;top:302px"><div class="base"></div><img src="./sprites/mago_m.png"><div class="unitName">Mago<small>18/18</small></div></div><div class="unit enemyUnit" style="left:760px;top:250px"><div class="base"></div><div style="font-size:48px;text-align:center;margin-top:28px">🎃</div><div class="unitName">Espantalho<small>14/14</small></div></div></div></div></main><section class="dock"><aside class="portrait"><img src="./sprites/mago_m.png"><div class="sigil">✦</div></aside><div class="dockMain"><div class="heroLine"><div class="heroTitle"><b>Mago</b><span>arcano · planejamento</span></div><div class="stats">❤️18/18 · 💧4/4 · ⚡5</div></div><div class="actions"><button class="act move on"><i>🥾</i><small>Mover</small></button><button class="act attack"><i>⚔️</i><small>Atacar</small></button><button class="act skill"><i>✋</i><small>Ação</small></button><button class="act end"><i>⌛</i><small>Finalizar</small></button></div><div class="plan"><b>Plano:</b> selecione movimento, ataque ou ação.</div><div class="log"><span><b>Log:</b> estrutura nova, sem corte do painel.</span><strong>🎲 —</strong></div></div></section><script>const hexes=document.getElementById('hexes');const COLS=16,ROWS=6,GX=92,GY=50,DX=78,DY=54,ODD=27,LET='ABCDEFGHIJKLMNOP';function mark(c,r){return LET[c]+String(r+1).padStart(2,'0')}for(let c=0;c<COLS;c++){for(let r=0;r<ROWS;r++){let h=document.createElement('div');h.className='hex';if(c<5&&r>1)h.classList.add('move');if((c===9&&r===2)||(c===10&&r===2))h.classList.add('enemy');if(c===9&&r>0&&r<4)h.classList.add('hot');h.style.left=(GX+c*DX)+'px';h.style.top=(GY+r*DY+(c%2?ODD:0))+'px';h.textContent=mark(c,r);hexes.appendChild(h)}}setTimeout(()=>document.getElementById('vp').scrollLeft=120,60);document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{document.querySelectorAll('.act').forEach(x=>x.classList.remove('on'));b.classList.add('on')});</script></body></html>
